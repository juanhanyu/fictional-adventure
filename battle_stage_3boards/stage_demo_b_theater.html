<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>转生千金 · 战斗舞台构图竞标 · 方案 B（宽屏剧场透视雁阵 + 左下阶梯棱镜队卡）</title>
<link rel="stylesheet" href="assets/lib/combat-rank-badge.css" />
<style>
/* =========================================================================
   方案 B：P5R / 星穹铁道宽屏剧场透视雁阵 + 左下阶梯棱镜队卡
   设计准则：
   1. 雪瓷冰白 (#F8FBFF) + 皇家蓝 (#1658EB) + 冰青 (#7DD3FC) + 香槟金 (#C4A46C)
   2. 严禁圆框套圆框（全站 border-radius: 0，切角多边形 + 1px 细线 + 无框留白层级）
   3. 地面零方格、零网格框线；仅保留柔和脚影、透视地平微光与一键「透视雁阵辅助线」
   4. 左下阶梯双棱镜队卡（52px 超薄切角）与站位脚底保持宽阔留白，绝不垂直相抵
   ========================================================================= */

:root {
  --alabaster-hi: rgba(255, 255, 255, 0.94);
  --alabaster: rgba(246, 250, 255, 0.90);
  --alabaster-lo: rgba(230, 241, 255, 0.85);
  --ink: #162238;
  --ink-mid: #3A4D6B;
  --ink-muted: #5F7394;
  --sapphire-hi: #2E77F8;
  --sapphire: #1658EB;
  --sapphire-mid: #103FA8;
  --sapphire-deep: #0E2B78;
  --sapphire-abyss: #081A54;
  --cyan: #7DD3FC;
  --cyan-pale: #D9F3FF;
  --gold: #C4A46C;
  --gold-hi: #EFE0BE;
  --gold-deep: #8C6928;
  --amber: #C68B3E;
  --crimson: #D13456;
  --crimson-deep: #961836;
  --emerald: #0E8A64;
  --line-soft: rgba(96, 128, 180, 0.24);
  --line-mid: rgba(22, 88, 235, 0.34);
  --rim-prism: linear-gradient(
    132deg,
    rgba(125, 211, 252, 0.96) 0%,
    rgba(22, 88, 235, 0.65) 28%,
    rgba(255, 255, 255, 0.98) 50%,
    rgba(196, 164, 108, 0.82) 74%,
    rgba(46, 119, 248, 0.90) 100%
  );
  --rim-gold: linear-gradient(
    135deg,
    rgba(244, 229, 194, 0.98) 0%,
    rgba(196, 164, 108, 0.78) 38%,
    rgba(255, 255, 255, 0.98) 56%,
    rgba(125, 211, 252, 0.85) 100%
  );
  --rim-enemy: linear-gradient(
    132deg,
    rgba(255, 146, 168, 0.94) 0%,
    rgba(209, 52, 86, 0.72) 32%,
    rgba(255, 255, 255, 0.96) 54%,
    rgba(196, 164, 108, 0.72) 100%
  );
  --font-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', Georgia, serif;
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  --ease-snap: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0 !important;
  user-select: none;
  -webkit-user-select: none;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0B152A;
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
}

button:focus-visible {
  outline: 1.5px solid var(--sapphire);
  outline-offset: 2px;
}

/* ==================== 0. 全画幅宽屏剧场舞台容器 ==================== */
#theater-stage {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0D182E;
}

.stage-bg-wrap {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}

.stage-bg-img {
  position: absolute;
  inset: -1.5%;
  width: 103%;
  height: 103%;
  object-fit: cover;
  object-position: center 54%;
  transition: opacity 0.36s ease, filter 0.36s ease, transform 0.6s var(--ease-snap);
  pointer-events: none;
}

#theater-stage[data-scene="rowan"] .stage-bg-img {
  object-position: center 52%;
  filter: brightness(0.62) contrast(1.12) saturate(0.74) hue-rotate(188deg);
}
#theater-stage[data-scene="hulan"] .stage-bg-img {
  object-position: center 56%;
  filter: brightness(0.92) contrast(1.04) saturate(1.04);
}
#theater-stage[data-scene="full6v6"] .stage-bg-img {
  object-position: center 55%;
  filter: brightness(0.90) contrast(1.05) saturate(0.98);
}

.stage-atmosphere {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  transition: background 0.4s ease;
}

#theater-stage[data-scene="rowan"] .stage-atmosphere {
  background:
    radial-gradient(ellipse 68% 36% at 50% 48%, rgba(125, 211, 252, 0.14) 0%, rgba(22, 88, 235, 0.06) 44%, transparent 72%),
    linear-gradient(180deg,
      rgba(8, 19, 46, 0.54) 0%,
      rgba(12, 26, 58, 0.16) 28%,
      rgba(20, 38, 78, 0.04) 50%,
      rgba(10, 22, 48, 0.24) 80%,
      rgba(7, 15, 34, 0.54) 100%
    );
}

#theater-stage[data-scene="hulan"] .stage-atmosphere {
  background:
    radial-gradient(ellipse 72% 34% at 48% 50%, rgba(255, 255, 255, 0.18) 0%, rgba(125, 211, 252, 0.08) 46%, transparent 74%),
    linear-gradient(180deg,
      rgba(16, 36, 74, 0.34) 0%,
      rgba(220, 238, 255, 0.04) 24%,
      rgba(255, 255, 255, 0.00) 54%,
      rgba(14, 34, 72, 0.18) 84%,
      rgba(10, 24, 56, 0.42) 100%
    );
}

#theater-stage[data-scene="full6v6"] .stage-atmosphere {
  background:
    radial-gradient(ellipse 74% 38% at 50% 54%, rgba(255, 250, 238, 0.14) 0%, transparent 66%),
    linear-gradient(180deg,
      rgba(12, 32, 74, 0.36) 0%,
      rgba(18, 42, 88, 0.04) 22%,
      rgba(18, 34, 68, 0.02) 56%,
      rgba(12, 26, 56, 0.24) 86%,
      rgba(8, 18, 42, 0.48) 100%
    );
}

#floor-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

#guide-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.26s var(--ease-snap);
}

#theater-stage.show-guides #guide-svg {
  opacity: 1;
}

#actors-layer {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
}

#vfx-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 14;
  pointer-events: none;
}

#float-text-layer {
  position: absolute;
  inset: 0;
  z-index: 16;
  pointer-events: none;
  overflow: hidden;
}

/* ==================== 1. 顶部极简雪瓷剧场横栏 ==================== */
.theater-topbar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 46px;
  z-index: 30;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 14px;
  padding: 0 18px;
  background: linear-gradient(180deg, rgba(252, 254, 255, 0.94) 0%, rgba(238, 246, 255, 0.88) 100%);
  backdrop-filter: blur(16px) saturate(135%);
  -webkit-backdrop-filter: blur(16px) saturate(135%);
  border-bottom: 1px solid rgba(22, 88, 235, 0.22);
  box-shadow: 0 6px 22px rgba(8, 22, 68, 0.14);
}

.theater-topbar::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 1.5px;
  background: linear-gradient(90deg, var(--cyan) 0%, var(--sapphire) 24%, rgba(255,255,255,0.95) 50%, var(--gold) 76%, var(--sapphire-hi) 100%);
  opacity: 0.85;
  pointer-events: none;
}

.tb-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  overflow: hidden;
}

.tb-badge-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 12px 0 10px;
  background: linear-gradient(180deg, #2E77F8 0%, #1658EB 49.5%, #0E2B78 50.5%, #081A54 100%);
  color: #FFFFFF;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 100%, 0 100%);
  flex-shrink: 0;
}

.tb-badge-tag .diamond {
  color: var(--gold-hi);
  font-size: 10px;
}

.tb-title-group {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
}

.tb-chapter {
  font-family: var(--font-serif);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.03em;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 中央三场景一键切换（切角分段条，严禁圆框套圆框） */
.tb-scenes {
  display: flex;
  align-items: stretch;
  height: 30px;
  background: rgba(22, 88, 235, 0.06);
  border-top: 1px solid var(--line-soft);
  border-bottom: 1px solid var(--line-soft);
  justify-self: center;
}

.tb-scene-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 0 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mid);
  letter-spacing: 0.03em;
  transition: color 0.16s ease, background 0.16s ease;
  white-space: nowrap;
}

.tb-scene-btn + .tb-scene-btn::before {
  content: '';
  position: absolute;
  left: 0;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: var(--line-soft);
}

.tb-scene-btn:not(.active):hover {
  color: var(--sapphire);
  background: rgba(22, 88, 235, 0.08);
}

.tb-scene-btn.active,
.tb-scene-btn.active:hover {
  color: #FFFFFF;
  background: linear-gradient(180deg, #2E77F8 0%, #1658EB 49.5%, #0E2B78 50.5%, #081A54 100%);
  box-shadow: inset 0 -2px 0 var(--gold-hi);
}

.tb-scene-btn.active + .tb-scene-btn::before,
.tb-scene-btn.active::before {
  opacity: 0;
}

.tb-scene-code {
  font-family: var(--font-mono);
  font-size: 10.5px;
  opacity: 0.80;
}

/* 右侧战术辅助开关 */
.tb-controls {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  min-width: 0;
}

.tb-toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-mid);
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid var(--line-soft);
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
  transition: all 0.16s ease;
  white-space: nowrap;
}

.tb-toggle:hover {
  border-color: var(--sapphire);
  color: var(--sapphire);
  background: #FFFFFF;
}

.tb-toggle.active {
  color: #FFFFFF;
  border-color: var(--sapphire);
  background: linear-gradient(135deg, #2E77F8 0%, #1658EB 60%, #0E2B78 100%);
}

.tb-toggle .dot {
  width: 6px;
  height: 6px;
  background: var(--ink-muted);
  transform: rotate(45deg);
  transition: background 0.16s ease;
}

.tb-toggle.active .dot {
  background: var(--gold-hi);
}

.tb-amp-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 11px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--sapphire-deep);
  background: rgba(22, 88, 235, 0.08);
  border-left: 2.5px solid var(--sapphire);
  white-space: nowrap;
  transition: all 0.18s ease;
}

.tb-amp-pill.t1 {
  background: rgba(14, 148, 252, 0.14);
  border-left-color: #0E94FC;
  color: #084B8A;
}

.tb-amp-pill.t2 {
  background: rgba(22, 88, 235, 0.16);
  border-left-color: var(--sapphire);
  color: var(--sapphire-abyss);
}

.tb-amp-pill.t3 {
  background: linear-gradient(90deg, rgba(239, 224, 190, 0.65) 0%, rgba(196, 164, 108, 0.25) 100%);
  border-left-color: var(--gold-deep);
  color: #5A3D0E;
}

/* ==================== 2. 左上角 1:1 行动跑条（零遮头） ==================== */
.av-rail {
  position: absolute;
  top: 56px;
  left: 14px;
  width: 178px;
  z-index: 22;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.av-rail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 6px 3px 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: rgba(248, 251, 255, 0.92);
  text-shadow: 0 1px 4px rgba(8, 18, 42, 0.72);
  border-left: 2px solid var(--gold-hi);
}

.av-row {
  position: relative;
  width: 100%;
  padding: 1.5px;
  background: var(--rim-prism);
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  filter: drop-shadow(0 6px 14px rgba(8, 22, 68, 0.24));
  transition: transform 0.2s var(--ease-snap), filter 0.18s ease;
  text-align: left;
}

.av-row.ally-row { background: var(--rim-gold); }
.av-row.enemy-row { background: var(--rim-enemy); }
.av-row:hover:not(.acting) { transform: translateX(4px); }

.av-row.acting {
  transform: translateX(7px);
  filter: drop-shadow(0 8px 20px rgba(22, 88, 235, 0.42));
}

.av-row-in {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 10px 0 9px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.94) 0%, rgba(235, 244, 255, 0.88) 100%);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  overflow: hidden;
}

.av-row-in::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3.5px;
  background: linear-gradient(180deg, #2D75F8 0%, #1658EB 60%, #0E2B78 100%);
}

.av-row.ally-row .av-row-in {
  background: linear-gradient(135deg, rgba(255, 253, 248, 0.94) 0%, rgba(246, 238, 222, 0.88) 100%);
}
.av-row.ally-row .av-row-in::before {
  background: linear-gradient(180deg, #F4DEB0 0%, #C68B3E 58%, #8B5B1E 100%);
}
.av-row.enemy-row .av-row-in::before {
  background: linear-gradient(180deg, #FF7C94 0%, #D13456 58%, #961836 100%);
}
.av-row.acting .av-row-in {
  background: linear-gradient(180deg, #2E77F8 0%, #1658EB 49.5%, #0E2B78 50.5%, #081A54 100%);
  color: #FFFFFF;
}
.av-row.acting .av-row-in::before {
  width: 4.5px;
  background: linear-gradient(180deg, #FFF2C6 0%, #C4A46C 60%, #8C6928 100%);
}

.av-head-slot {
  width: 26px;
  height: 26px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(22, 88, 235, 0.08);
  overflow: hidden;
}
.av-row.acting .av-head-slot { background: rgba(255, 255, 255, 0.16); }
.av-row.enemy-row .av-head-slot { background: rgba(209, 52, 86, 0.09); }

.av-head-canvas {
  width: 26px;
  height: 26px;
  image-rendering: pixelated;
  display: block;
}

.av-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.av-name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.av-role {
  font-size: 9.5px;
  color: var(--ink-muted);
  letter-spacing: 0.04em;
}
.av-row.acting .av-role { color: var(--gold-hi); }

.av-num {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-mid);
  flex-shrink: 0;
  padding-left: 6px;
  border-left: 1px solid rgba(96, 128, 180, 0.24);
}
.av-row.acting .av-num {
  color: #FFFFFF;
  border-left-color: rgba(255, 255, 255, 0.28);
}

/* ==================== 3. 舞台角色实体与超薄极简漂浮敌方意图牌 ==================== */
.stage-actor {
  position: absolute;
  transform: translate(-50%, -100%);
  pointer-events: auto;
  cursor: pointer;
  transition: filter 0.18s ease;
}

.stage-actor:hover .actor-sprite-canvas {
  filter: drop-shadow(0 0 10px rgba(125, 211, 252, 0.55));
}

.stage-actor.is-enemy.is-selected .actor-sprite-canvas {
  filter: drop-shadow(0 0 11px rgba(255, 196, 118, 0.62));
}

.stage-actor.is-acting .actor-sprite-canvas {
  filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.58));
}

.actor-sprite-wrap {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  transform-origin: center bottom;
}

.actor-sprite-canvas {
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  pointer-events: none;
}

.actor-sprite-canvas.flip-x {
  transform: scaleX(-1);
}

.ally-hover-tag {
  position: absolute;
  bottom: -14px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 7px;
  background: rgba(248, 251, 255, 0.90);
  border-bottom: 1.5px solid var(--sapphire);
  font-size: 10px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.16s ease;
}

.stage-actor:hover .ally-hover-tag { opacity: 1; }

/* 敌方极简漂浮牌：单 Boss 展示完整意图 + 血条；多敌时超薄紧凑（仅 34px 高！绝不叠压后排头像！） */
.enemy-plate {
  position: absolute;
  bottom: calc(100% + 2px);
  left: 50%;
  transform: translateX(-50%);
  width: 204px;
  padding: 1.5px;
  background: var(--rim-enemy);
  clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  filter: drop-shadow(0 5px 12px rgba(10, 22, 54, 0.28));
  pointer-events: auto;
  transition: transform 0.16s var(--ease-snap), filter 0.16s ease;
}

/* 四足兽精灵顶部有较多透明留白，把漂浮牌柔和贴近兽背上方避免虚高 */
.stage-actor.is-quadruped .enemy-plate {
  bottom: calc(100% - 22px);
}

.stage-actor.slim-plate .enemy-plate {
  width: 178px;
}

.stage-actor.compact6-plate .enemy-plate {
  width: 152px;
}

.stage-actor.is-selected .enemy-plate {
  background: linear-gradient(132deg, #FFF2C6 0%, #D13456 38%, #FFFFFF 56%, #C4A46C 100%);
  filter: drop-shadow(0 7px 16px rgba(209, 52, 86, 0.44));
  transform: translateX(-50%) translateY(-2px);
  z-index: 4;
}

.enemy-plate-in {
  background: linear-gradient(135deg, rgba(254, 252, 255, 0.94) 0%, rgba(244, 239, 248, 0.90) 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%);
  padding: 4px 10px 4px 10px;
}

.stage-actor.slim-plate .enemy-plate-in,
.stage-actor.compact6-plate .enemy-plate-in {
  padding: 3px 8px 3px 8px;
}

.ep-intent-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding-bottom: 2px;
  margin-bottom: 3px;
  border-bottom: 1px solid rgba(209, 52, 86, 0.18);
  font-size: 10px;
  font-weight: 700;
  color: var(--crimson-deep);
  white-space: nowrap;
}

.ep-intent-txt {
  overflow: hidden;
  text-overflow: ellipsis;
}

.ep-target-mark {
  font-family: var(--font-mono);
  font-size: 9.5px;
  color: var(--gold-deep);
  flex-shrink: 0;
}

.ep-title-row {

/* ==================== 4. 中场开阔空域外露直按棱镜指令翼 ==================== */
#prism-command-rig {
  position: absolute;
  left: 42.6%;
  top: 38.5%;
  z-index: 25;
  width: 0;
  height: 0;
  pointer-events: none;
  transition: left 0.28s var(--ease-snap), top 0.28s var(--ease-snap);
}

#theater-stage[data-scene="hulan"] #prism-command-rig {
  left: 36.0%;
  top: 37.5%;
}

#theater-stage[data-scene="full6v6"] #prism-command-rig {
  left: 41.8%;
  top: 36.5%;
}

#prism-ray-svg {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 12;
  pointer-events: none;
}

.prism-root-wings {
  position: relative;
  width: 214px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

#prism-command-rig.mode-cascade .prism-root-wings {
  display: none;
}

.pwing-slot {
  pointer-events: none;
  transition: transform 0.16s var(--ease-snap), filter 0.16s ease;
  filter: drop-shadow(0 8px 18px rgba(8, 22, 68, 0.30));
}

.pwing-slot[data-i="0"] { transform: translateX(0px) rotate(-2.1deg); }
.pwing-slot[data-i="1"] { transform: translateX(14px) rotate(-0.6deg); }
.pwing-slot[data-i="2"] { transform: translateX(12px) rotate(0.8deg); }
.pwing-slot[data-i="3"] { transform: translateX(-2px) rotate(2.1deg); }

.pwing-slot:hover {
  filter: drop-shadow(0 12px 24px rgba(22, 88, 235, 0.44));
  z-index: 3;
}
.pwing-slot[data-i="0"]:hover { transform: translateX(10px) rotate(-2.1deg) scale(1.025); }
.pwing-slot[data-i="1"]:hover { transform: translateX(24px) rotate(-0.6deg) scale(1.025); }
.pwing-slot[data-i="2"]:hover { transform: translateX(22px) rotate(0.8deg) scale(1.025); }
.pwing-slot[data-i="3"]:hover { transform: translateX(8px) rotate(2.1deg) scale(1.025); }

.pwing-shell {
  padding: 1.5px;
  background: var(--rim-prism);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  pointer-events: auto;
}

.pwing-btn {
  width: 100%;
  height: 44px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px 0 12px;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(233, 243, 255, 0.90) 100%);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  clip-path: polygon(9px 0, 100% 0, calc(100% - 13px) 100%, 0 100%);
  text-align: left;
  transition: background 0.16s ease, color 0.16s ease;
}

.pwing-btn.hero {
  background: linear-gradient(180deg, #2E77F8 0%, #1658EB 49.5%, #0E2B78 50.5%, #081A54 100%);
  color: #FFFFFF;
}

.pwing-btn.amp-t1 {
  background: linear-gradient(135deg, rgba(235, 249, 255, 0.96) 0%, rgba(186, 232, 255, 0.92) 100%);
}
.pwing-btn.amp-t2 {
  background: linear-gradient(180deg, #1E6AF5 0%, #144CC9 49.5%, #0C2A75 50.5%, #07194E 100%);
  color: #FFFFFF;
}
.pwing-btn.amp-t3 {
  background: linear-gradient(180deg, #C79F56 0%, #A97E34 49.5%, #755017 50.5%, #4A300A 100%);
  color: #FFFDF7;
}
.pwing-shell.amp-t3-rim {
  background: linear-gradient(132deg, #FFF7DC 0%, #D9B166 36%, #7DD3FC 68%, #FFF4CE 100%);
}

.pw-key {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  color: var(--sapphire-deep);
  background: rgba(22, 88, 235, 0.11);
  border-left: 2px solid var(--sapphire);
}

.pwing-btn.hero .pw-key,
.pwing-btn.amp-t2 .pw-key {

  color: #FFFFFF;
  border-left-color: var(--gold-hi);
}

.pwing-btn.amp-t3 .pw-key {
  background: rgba(255, 248, 224, 0.22);
  color: #FFF7DC;
  border-left-color: #FFF4CE;
}

.pw-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.pw-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}

.pw-title {

  font-size: 13.5px;
  font-weight: 700;

}

}

.pw-sub {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--ink-muted);
  white-space: nowrap;

  text-overflow: ellipsis;
}

.pwing-btn.hero .pw-sub,
.pwing-btn.amp-t2 .pw-sub { color: rgba(217, 243, 255, 0.90); }
.pwing-btn.amp-t3 .pw-sub { color: #FFF2C6; }

.amp-pips {
  display: inline-flex;
  align-items: center;

  flex-shrink: 0;
}

.amp-pip {

}

.amp-pip.lit-1 { background: #0E94FC; box-shadow: 0 0 5px rgba(14, 148, 252, 0.65); }
.amp-pip.lit-2 { background: #7DD3FC; box-shadow: 0 0 6px rgba(125, 211, 252, 0.85); }

.pw-arrow {

/* 展开态：二级术式棱镜扇叶 */
.prism-cascade {

.blade-btn {

.blade-btn:hover {

}

.blade-btn:hover .blade-sub,

.blade-idx {

.blade-name {

.blade-cost {

/* ==================== 5. 左下角紧凑阶梯棱镜队卡（方案 B 核心招牌！） ==================== */
#party-dock {
  position: absolute;
  left: 16px;
  bottom: 14px;
  z-index: 26;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  pointer-events: none;
}

.party-stepped-stack {
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}

.pcard-wrap {
  pointer-events: auto;
  filter: drop-shadow(0 8px 20px rgba(8, 22, 68, 0.32));
  transition: transform 0.2s var(--ease-snap), filter 0.18s ease;
}

.pcard-wrap.step-upper { transform: translateX(20px); }
.pcard-wrap.step-lower { transform: translateX(0px); }

.pcard-wrap:hover { filter: drop-shadow(0 10px 24px rgba(22, 88, 235, 0.44)); }
.pcard-wrap.step-upper:hover { transform: translateX(26px); }
.pcard-wrap.step-lower:hover { transform: translateX(6px); }

.pcard-rim {
  width: 356px;
  height: 52px;
  padding: 1.5px;
  background: var(--rim-prism);
  clip-path: polygon(11px 0, 100% 0, calc(100% - 13px) 100%, 0 100%);
}

.pcard-rim.is-ally { background: var(--rim-gold); }

.pcard-rim.is-crate {
  width: 318px;
  height: 38px;
  background: linear-gradient(132deg, #7DD3FC 0%, #0E8A64 42%, #FFFFFF 64%, #C4A46C 100%);
}

.pcard-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 0 18px 0 10px;
  background: linear-gradient(135deg, rgba(252, 254, 255, 0.95) 0%, rgba(232, 243, 255, 0.90) 100%);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  clip-path: polygon(10px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  overflow: hidden;
  text-align: left;
}

.pcard-rim.is-ally .pcard-inner {
  background: linear-gradient(135deg, rgba(255, 253, 248, 0.95) 0%, rgba(247, 238, 222, 0.90) 100%);
}

.pcard-inner::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4.5px;
  background: linear-gradient(180deg, #2E77F8 0%, #1658EB 55%, #0E2B78 100%);
}

.pcard-rim.is-ally .pcard-inner::before {
  background: linear-gradient(180deg, #F5DFB0 0%, #C68B3E 55%, #8B5B1E 100%);
}

.pcard-rim.is-crate .pcard-inner::before {
  background: linear-gradient(180deg, #5CE0B8 0%, #0E8A64 60%, #085A40 100%);
}

.pcard-wrap.is-acting .pcard-inner::after {
  content: '';
  position: absolute;
  top: 0;
  left: 10px;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--cyan) 0%, var(--sapphire) 48%, var(--gold-hi) 100%);
}

.pcard-avatar-box {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(22, 88, 235, 0.08);
}

.pcard-rim.is-ally .pcard-avatar-box {
  background: rgba(198, 139, 62, 0.11);
}

.pcard-avatar-canvas {
  width: 32px;
  height: 32px;
  image-rendering: pixelated;
  display: block;
}

.pcard-sep {
  width: 1px;
  height: 30px;
  background: linear-gradient(180deg, transparent 0%, rgba(96, 128, 180, 0.34) 50%, transparent 100%);
  flex-shrink: 0;
}

.pcard-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
}

.pcard-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  line-height: 1;
}

.pcard-id {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

.pcard-id .cb-rank-badge {
  height: 16px;
  margin-right: 0;
}

.pcard-name {
  font-family: var(--font-serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}

.pcard-nums {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
  flex-shrink: 0;
}

.pcard-nums .v-hp { color: #0C6F51; }
.pcard-nums .v-mp { color: var(--sapphire-deep); }
.pcard-nums .v-sh { color: var(--gold-deep); }

.pcard-gauges {

  flex-direction: column;
  gap: 3px;
}

.g-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.g-track {

  height: 4px;
  background: rgba(22, 34, 56, 0.12);
  overflow: hidden;
}

.g-track.sub { height: 3px; }

.g-fill-hp {
  height: 100%;
  background: linear-gradient(90deg, #17A97C 0%, #0E8A64 100%);
  transition: width 0.25s var(--ease-snap);
}

.g-fill-mp {
  height: 100%;
  background: linear-gradient(90deg, #38BDF8 0%, #1658EB 100%);
  transition: width 0.25s var(--ease-snap);
}

.g-fill-sh {
  height: 100%;
  background: linear-gradient(90deg, #EBC478 0%, #C68B3E 100%);

.g-shield-mini {

  font-size: 9.5px;
  font-weight: 700;
  color: var(--gold-deep);
  flex-shrink: 0;

.subwing-head {

.subwing-top .cb-rank-badge {

  margin-right: 0;
}

.subwing-name {
  font-family: var(--font-serif);
  font-size: 10.5px;

/* ==================== 6. 右下角轻量战术提示条 ==================== */
.tactic-ribbon {
  position: absolute;

  bottom: 14px;
  z-index: 22;

  align-items: center;
  gap: 10px;

  background: linear-gradient(135deg, rgba(250, 253, 255, 0.90) 0%, rgba(232, 242, 255, 0.84) 100%);

  -webkit-backdrop-filter: blur(12px);

  filter: drop-shadow(0 6px 14px rgba(8, 22, 68, 0.22));

  color: var(--ink-mid);
  white-space: nowrap;

}

#tactic-msg {

}

.tactic-ribbon strong {

  padding-left: 9px;

  font-size: 10px;
  color: var(--ink-muted);
  flex-shrink: 0;

#theater-stage[data-scene="full6v6"] .tactic-keys {
  display: none;
}

.tactic-keys b { color: var(--sapphire); }

/* 伤害跳字 */
.dmg-pop {
  position: absolute;
  transform: translate(-50%, -50%);
  font-family: var(--font-serif);
  font-weight: 800;
  letter-spacing: 0.04em;
  pointer-events: none;
  white-space: nowrap;
  text-shadow: 0 2px 8px rgba(8, 18, 44, 0.72), 0 0 2px #FFFFFF;
  animation: dmgRise 0.95s var(--ease-snap) forwards;
}

.dmg-pop.ice { color: #E0F5FF; font-size: 24px; }
.dmg-pop.gold { color: #FFF1C2; font-size: 28px; }
.dmg-pop.shield { color: #A7F3D0; font-size: 18px; }

@keyframes dmgRise {
  0% { opacity: 0; transform: translate(-50%, -10%) scale(0.75); }
  18% { opacity: 1; transform: translate(-50%, -55%) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%, -135%) scale(0.96); }
}

/* ==================== 7. 1280×720 桌面紧凑适配 ==================== */
@media (max-width: 1360px), (max-height: 760px) {
  .theater-topbar { height: 42px; padding: 0 14px; gap: 10px; }

  for (let i = 0; i < BANK_CHARS.length; i++) {
    const code = BANK_CHARS.charCodeAt(i);
    if (code < 128) CHAR_LUT[code] = i;
  }

    flame_mage:         { sx: 51, sy: 16, size: 46 },
    eastwing_commander: { sx: 57, sy: 22, size: 39 },
  };

  const frameCache = new Map();
  const offscreenFrameCache = new Map();

  function hexToRgb(hex) {
    if (!hex) return null;
    const clean = hex.replace('#', '');
    if (clean.length !== 6) return null;
    const n = parseInt(clean, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  function decodeFrame(spriteId, frameIdx) {
    const bank = window.PIXEL_SPRITE_BANK || {};
    const entry = bank[spriteId];
    if (!entry) return null;
    const idx = Math.max(0, Math.min(entry.frames.length - 1, frameIdx | 0));
    const key = `${spriteId}:${idx}`;
    if (frameCache.has(key)) return frameCache.get(key);

    const w = entry.w | 0;
    const h = entry.h | 0;
    const rgba = new Uint8ClampedArray(w * h * 4);
    const palRgb = entry._palRgb || (entry._palRgb = entry.palette.map(hexToRgb));
    const rows = entry.frames[idx] || [];

    for (let y = 0; y < h && y < rows.length; y++) {
      const row = rows[y];
      if (!row) continue;
      const rowOff = y * w;
      const rLen = row.length;
      let x = 0;
      for (let i = 0; i < rLen && x < w; i++) {
        const code = row.charCodeAt(i);
        let rep = 1;
        if (i + 1 < rLen && row.charCodeAt(i + 1) === 42) {
          let j = i + 2;
          let n = 0;
          while (j < rLen) {
            const d = row.charCodeAt(j) - 48;
            if (d < 0 || d > 9) break;
            n = n * 10 + d;
            j++;
          }
          rep = n > 0 ? n : 1;
          i = j - 1;
        }
        if (code === 46) {
          x += rep;
          continue;
        }
        const pi = code < 128 ? CHAR_LUT[code] : -1;
        const rgb = pi > 0 ? palRgb[pi] : null;
        if (!rgb) {
          x += rep;
          continue;
        }
        const endX = x + rep < w ? x + rep : w;
        for (; x < endX; x++) {
          const off = (rowOff + x) << 2;
          rgba[off] = rgb[0];
          rgba[off + 1] = rgb[1];
          rgba[off + 2] = rgb[2];
          rgba[off + 3] = 255;
        }
      }
    }

    frameCache.set(key, imgData);
    return imgData;

    c.height = imgData.height;
    c.getContext('2d').putImageData(imgData, 0, 0);

    return c;

  function getBasePixelScale() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const compactScene = state.sceneId === 'full6v6';
    const base = Math.min(w / 1440, h / 900);
    return (compactScene ? 1.38 : 1.72) * Math.max(0.76, Math.min(1.06, base));
  }

  function getSlotCoords(side, slotKey) {
    const cfg = CHEVRON_SLOTS[side][slotKey];
    const w = window.innerWidth;
    const h = window.innerHeight;
    let xp = cfg.x;
    let yp = cfg.y;

    // 2v1 打罗文：舒展站位放大双人斜前对峙的剧场呼吸感
    if (state.sceneId === 'rowan') {
      if (side === 'ally' && slotKey === 'B1') { xp = 21.8; yp = 67.6; }
      if (side === 'ally' && slotKey === 'F1') { xp = 34.8; yp = 66.8; }
      if (side === 'enemy' && slotKey === 'F1') { xp = 68.4; yp = 66.8; }
    }
    // 1v3 赫兰兽潮：展开宽广锐角 "<" 兽群包抄，充分利用冰峡谷右翼纵深
    if (state.sceneId === 'hulan') {
      if (side === 'ally' && slotKey === 'B1') { xp = 22.0; yp = 67.4; }
      if (side === 'enemy' && slotKey === 'F0') { xp = 82.0; yp = 56.2; }
      if (side === 'enemy' && slotKey === 'F1') { xp = 64.5; yp = 67.8; }
      if (side === 'enemy' && slotKey === 'F2') { xp = 81.2; yp = 80.6; }
    }

    return {
      x: (xp / 100) * w,
      y: (yp / 100) * h,
      xp,
      yp,
      depth: cfg.depth,
      code: cfg.code,
      label: cfg.label,
    };
  }

  function renderRankBadge(tier, compact) {
    if (window.CombatRankBadge && typeof window.CombatRankBadge.renderBadgeHTML === 'function') {
      return window.CombatRankBadge.renderBadgeHTML(tier, { compact: !!compact });
    }
    return '';
  }

  /* ==================== 6. 加载场景与渲染全部 HUD ==================== */
  function loadScene(sceneId) {
    const cfg = SCENES[sceneId] || SCENES.rowan;
    state.sceneId = cfg.id;
    state.menuMode = 'root';
    state.turn = 1;
    state.crateHp = cfg.crate ? cfg.crate.hp : 100;
    state.vfxEffects = [];
    state.shakeTime = 0;
    dom.stage.style.transform = '';

    dom.stage.setAttribute('data-scene', cfg.id);
    dom.bgImg.src = cfg.bg;
    dom.tbChapter.textContent = cfg.chapter;
    dom.tacticMsg.innerHTML = cfg.tacticHint;
    dom.avTurnLabel.textContent = 'TURN 01';

    document.querySelectorAll('.tb-scene-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-scene-id') === cfg.id);
    });

    state.actors = [];
    cfg.allies.forEach((a, idx) => {
      state.actors.push({
        ...a,
        side: 'ally',
        phase: idx * 0.95,
        animMode: 'idle',
        animTimer: 0,
        animQueue: [],
        curFrame: 0,
        lungeX: 0,
      });
    });
    cfg.enemies.forEach((e, idx) => {
      state.actors.push({
        ...e,
        side: 'enemy',
        phase: 0.4 + idx * 1.1,
        animMode: 'idle',
        animTimer: 0,
        animQueue: [],
        curFrame: 0,
        lungeX: 0,
      });
    });

    const firstEnemy = state.actors.find(u => u.side === 'enemy' && u.slot === 'F1') || state.actors.find(u => u.side === 'enemy');
    state.selectedEnemyId = firstEnemy ? firstEnemy.id : null;

    initParticles(cfg.particleMode);
    renderActorsDOM();
    renderAvRail();
    renderPartyDock();
    renderBladeList();
    syncMenuMode();
    syncAmpUI();
    renderGuideOverlay();
    renderPrismRays();
  }

  function renderActorsDOM() {
    dom.actorsLayer.innerHTML = '';
    const baseScale = getBasePixelScale();
    const isMulti3 = state.sceneId === 'hulan';
    const isMulti6 = state.sceneId === 'full6v6';

    const sorted = [...state.actors].sort((a, b) => {
      const ca = getSlotCoords(a.side, a.slot);
      const cb = getSlotCoords(b.side, b.slot);
      return ca.y - cb.y;
    });

    sorted.forEach((unit, orderIdx) => {
      const bank = (window.PIXEL_SPRITE_BANK || {})[unit.spriteId];
      if (!bank) return;
      const pos = getSlotCoords(unit.side, unit.slot);
      const isQuadruped = bank.w >= 156;
      const quadFactor = isQuadruped ? (isMulti6 ? 0.78 : 0.88) : 1.0;
      const finalScale = baseScale * pos.depth * quadFactor;
      const dispW = Math.round(bank.w * finalScale);
      const dispH = Math.round(bank.h * finalScale);

      const el = document.createElement('div');
      el.className = `stage-actor ${unit.side === 'enemy' ? 'is-enemy' : 'is-ally'}`;
      if (isQuadruped) el.classList.add('is-quadruped');
      if (unit.acting) el.classList.add('is-acting');
      if (unit.side === 'enemy' && unit.id === state.selectedEnemyId) el.classList.add('is-selected');
      if (isMulti3) el.classList.add('slim-plate');
      if (isMulti6) el.classList.add('compact6-plate');
      el.dataset.uid = unit.id;
      el.style.left = `${pos.x}px`;
      el.style.top = `${pos.y}px`;
      el.style.zIndex = String(10 + orderIdx);

      const needFlip = (unit.side === 'ally' && bank.facing === 'left') ||
                       (unit.side === 'enemy' && bank.facing === 'right');

      const wrap = document.createElement('div');
      wrap.className = 'actor-sprite-wrap';

      const canvas = document.createElement('canvas');
      canvas.className = 'actor-sprite-canvas' + (needFlip ? ' flip-x' : '');
      canvas.width = bank.w;
      canvas.height = bank.h;
      canvas.style.width = `${dispW}px`;
      canvas.style.height = `${dispH}px`;
      const imgData = decodeFrame(unit.spriteId, unit.curFrame || 0);
      if (imgData) {
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.putImageData(imgData, 0, 0);
      }
      wrap.appendChild(canvas);

      if (unit.side === 'enemy') {
        const plate = buildEnemyPlate(unit);
        wrap.appendChild(plate);
      } else {
        const hoverTag = document.createElement('div');
        hoverTag.className = 'ally-hover-tag';
        hoverTag.innerHTML = `${unit.name} · ${pos.label}`;
        wrap.appendChild(hoverTag);
      }

      el.appendChild(wrap);
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        if (unit.side === 'enemy') {
          if (state.selectedEnemyId === unit.id) {
            const cfg = SCENES[state.sceneId];
            triggerSkillCast(cfg.skills[0], unit);
          } else {
            state.selectedEnemyId = unit.id;
            updateEnemySelectionUI();
            setTacticMessage(`已锁定 <strong>${unit.name}</strong>（${unit.intent}）· 再次点击或按 <strong>W</strong> 施法`);
          }
        } else if (unit.id === 'reno') {
          triggerRenoCounter();
        } else if (unit.isPlayer) {
          cycleAmp(1);
        }
      });

      unit._el = el;
      unit._canvas = canvas;
      unit._dispW = dispW;
      unit._dispH = dispH;
      dom.actorsLayer.appendChild(el);
    });
  }

  function buildEnemyPlate(unit) {
    const plate = document.createElement('div');
    plate.className = 'enemy-plate';
    const hpPct = Math.max(0, Math.min(100, Math.round((unit.hp / unit.mhp) * 100)));
    const shPct = unit.maxShield > 0 ? Math.max(0, Math.min(100, Math.round((unit.shield / unit.maxShield) * 100))) : 0;
    const isSingleBoss = state.sceneId === 'rowan';
    const isSelected = unit.id === state.selectedEnemyId;
    // 单 Boss 或 1v3 选中目标展示意图行；6v6 仅对当前锁定靶显示完整意图，其余 5 名保持超薄 34px 极简血条牌！
    const showIntentRow = isSingleBoss || (state.sceneId === 'hulan') || (state.sceneId === 'full6v6' && isSelected);

    let locksHtml = '';
    if (state.sceneId === 'full6v6') {
      locksHtml = `<span style="font-family:var(--font-mono);font-size:10px;font-weight:800;color:var(--sapphire-deep);">◆${unit.locks}</span>`;
    } else {
      for (let i = 0; i < unit.maxLocks; i++) {
        locksHtml += `<span class="ep-lock-gem${i >= unit.locks ? ' broken' : ''}"></span>`;
      }
    }

    plate.innerHTML = `
      <div class="enemy-plate-in">
        ${showIntentRow ? `
          <div class="ep-intent-row">
            <span class="ep-intent-txt">${unit.intent}</span>
            <span class="ep-target-mark">${unit.targetHint || ''}</span>
          </div>
        ` : ''}
        <div class="ep-title-row">
          <span class="ep-name-wrap">
            ${renderRankBadge(unit.tier, true)}
            <span class="ep-name">${unit.name}</span>
          </span>
          <span class="ep-locks" aria-label="破防锁 ${unit.locks}/${unit.maxLocks}">${locksHtml}</span>
        </div>
        <div class="ep-bar-line">
          <div class="ep-bars">
            <div class="ep-hp-track"><div class="ep-hp-fill" style="width:${hpPct}%"></div></div>
            ${unit.maxShield > 0 ? `<div class="ep-sh-track"><div class="ep-sh-fill" style="width:${shPct}%"></div></div>` : ''}
          </div>
          <span class="ep-hp-inline">${unit.hp}${unit.shield > 0 ? `+${unit.shield}` : ''}</span>
        </div>
      </div>
    `;
    unit._plateEl = plate;
    return plate;
  }

  function refreshEnemyPlate(unit) {
    if (!unit._plateEl) return;
    const fresh = buildEnemyPlate(unit);
    unit._plateEl.replaceWith(fresh);
    unit._plateEl = fresh;
  }

  function updateEnemySelectionUI() {
    state.actors.forEach(u => {
      if (u.side === 'enemy' && u._el) {
        u._el.classList.toggle('is-selected', u.id === state.selectedEnemyId);
        if (state.sceneId === 'full6v6') {
          refreshEnemyPlate(u);
        }
      }
    });
  }

  /* ==================== 7. 左上角 1:1 行动跑条 ==================== */
  function renderAvRail() {
    dom.avList.innerHTML = '';
    const ordered = [...state.actors]
      .sort((a, b) => a.av - b.av)
      .slice(0, 5);

    ordered.forEach(u => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'av-row';
      if (u.acting) btn.classList.add('acting');
      if (u.side === 'enemy') btn.classList.add('enemy-row');
      else if (!u.isPlayer) btn.classList.add('ally-row');

      const roleText = u.acting ? 'ACT · 当前回合' : (u.side === 'enemy' ? '敌方意图' : '友军协战');
      btn.innerHTML = `
        <div class="av-row-in">
          <div class="av-head-slot"><canvas class="av-head-canvas" width="32" height="32"></canvas></div>
          <div class="av-meta">
            <span class="av-name">${u.name}</span>
            <span class="av-role">${roleText}</span>
          </div>
          <span class="av-num">${String(u.av).padStart(2, '0')}</span>
        </div>
      `;
      const hc = btn.querySelector('.av-head-canvas');
      const bank = (window.PIXEL_SPRITE_BANK || {})[u.spriteId];
      const flip = u.side === 'ally' && bank && bank.facing === 'left';
      paintHeadSlice(hc, u.spriteId, flip);

      btn.addEventListener('click', () => {
        if (u.side === 'enemy') {
          state.selectedEnemyId = u.id;
          updateEnemySelectionUI();
          setTacticMessage(`从行动跑条锁定 <strong>${u.name}</strong>（AV ${u.av}）`);
        } else if (u.id === 'reno') {
          triggerRenoCounter();
        }
      });

      dom.avList.appendChild(btn);
    });
  }

        ? Math.round((u.mp / u.mmp) * 100)
        : Math.round(((u.shield || 0) / (u.maxShield || 160)) * 100);

            <div class="pcard-avatar-box">
              <canvas class="pcard-avatar-canvas" width="32" height="32"></canvas>

                  <div class="g-track"><div class="g-fill-hp" style="width:${hpPct}%"></div></div>
                  ${isMage && u.shield > 0 ? `<span class="g-shield-mini">盾${u.shield}</span>` : ''}
                </div>
                <div class="g-row">
                  <div class="g-track sub"><div class="${isMage ? 'g-fill-mp' : 'g-fill-sh'}" style="width:${subPct}%"></div></div>
                </div>
              </div>
            </div>
          </button>
        </div>
      `;

      const avCanvas = wrap.querySelector('.pcard-avatar-canvas');
      paintHeadSlice(avCanvas, u.spriteId, false);

      wrap.querySelector('.pcard-inner').addEventListener('click', () => {
        if (u.id === 'reno') triggerRenoCounter();
        else cycleAmp(1);
      });

      stack.appendChild(wrap);
    });

    if (cfg.crate) {
      const crateWrap = document.createElement('div');
      crateWrap.className = 'pcard-wrap step-lower';
      const cpct = Math.max(0, Math.round((state.crateHp / cfg.crate.mhp) * 100));
      crateWrap.innerHTML = `
        <div class="pcard-rim is-crate">
          <div class="pcard-inner">
            <div class="pcard-content">
              <div class="pcard-head">
                <span class="pcard-id">
                  <span class="pcard-name" style="font-size:11.5px;">◈ ${cfg.crate.name}</span>
                </span>
                <span class="pcard-nums"><span class="v-hp">完好 ${cpct}%</span></span>
              </div>
              <div class="pcard-gauges">
                <div class="g-row"><div class="g-track"><div class="g-fill-hp" style="width:${cpct}%"></div></div></div>
              </div>
            </div>
          </div>
        </div>
      `;
      stack.appendChild(crateWrap);
    }

    dom.partyDock.appendChild(stack);

    if (subWings.length > 0) {
      const subRow = document.createElement('div');
      subRow.className = 'party-subwings';
      subWings.forEach(u => {
        const hpPct = Math.round((u.hp / u.mhp) * 100);
        const mpPct = u.mmp > 0 ? Math.round((u.mp / u.mmp) * 100) : 100;
        const card = document.createElement('div');
        card.className = 'subwing-rim';
        card.innerHTML = `
          <div class="subwing-in">
            <div class="subwing-head"><canvas width="32" height="32"></canvas></div>
            <div class="subwing-body">
              <div class="subwing-top">
                ${renderRankBadge(u.tier, true)}
                <span class="subwing-name">${u.name}</span>
              </div>
              <div class="pcard-gauges">
                <div class="g-row"><div class="g-track"><div class="g-fill-hp" style="width:${hpPct}%"></div></div></div>
                <div class="g-row"><div class="g-track sub"><div class="g-fill-mp" style="width:${mpPct}%"></div></div></div>
              </div>
            </div>
          </div>
        `;
        const c = card.querySelector('canvas');
        const bank = (window.PIXEL_SPRITE_BANK || {})[u.spriteId];
        paintHeadSlice(c, u.spriteId, bank && bank.facing === 'left');
        subRow.appendChild(card);
      });
      dom.partyDock.appendChild(subRow);
    }
  }

  /* ==================== 9. 棱镜指令翼 & 增幅三阶同步 ==================== */
  function renderBladeList() {
    const cfg = SCENES[state.sceneId];
    const amp = AMP_TIERS[state.ampIndex];
    dom.bladeList.innerHTML = '';

    cfg.skills.forEach(sk => {
      const effAmp = amp.pct <= sk.cap ? amp : AMP_TIERS.find(t => t.pct === sk.cap) || AMP_TIERS[0];
      const totalMp = sk.mp + effAmp.extraMp;
      const shell = document.createElement('div');
      shell.className = 'blade-shell';
      shell.innerHTML = `
        <button type="button" class="blade-btn" data-sk-key="${sk.key}">
          <span class="blade-idx">${sk.key}</span>
          <span class="blade-info">
            <span class="blade-name">${sk.name}</span>
            <span class="blade-sub">${sk.sub}</span>
          </span>
          <span class="blade-cost">${totalMp} MP</span>
        </button>
      `;
      shell.querySelector('.blade-btn').addEventListener('click', () => {
        const target = state.actors.find(u => u.id === state.selectedEnemyId) || state.actors.find(u => u.side === 'enemy');
        triggerSkillCast(sk, target);
      });
      dom.bladeList.appendChild(shell);
    });
  }

  function syncMenuMode() {
    dom.rig.classList.toggle('mode-root', state.menuMode === 'root');
    dom.rig.classList.toggle('mode-cascade', state.menuMode === 'cascade');
    renderPrismRays();
  }

  function syncAmpUI() {
    const amp = AMP_TIERS[state.ampIndex];
    dom.pwAmp.classList.remove('amp-t1', 'amp-t2', 'amp-t3');
    dom.pwAmpShell.classList.remove('amp-t3-rim');
    dom.tbAmpChip.classList.remove('t1', 't2', 't3');

    if (amp.tier > 0) {
      dom.pwAmp.classList.add(`amp-t${amp.tier}`);
      dom.tbAmpChip.classList.add(`t${amp.tier}`);
    }
    if (amp.tier === 3) {
      dom.pwAmpShell.classList.add('amp-t3-rim');
    }

    dom.pwAmpMult.textContent = `${amp.mult.toFixed(2)}×`;
    // 简明无截断（左侧已有 3 枚菱晶 pips，直接展示档位名 + 破锁数）
    dom.pwAmpVal.textContent = amp.tier === 0
      ? '+0% · 常规'
      : `+${amp.pct}% ${amp.shortName} · +${amp.breakAdd}破锁`;
    dom.pwAmpMiniVal.textContent = `+${amp.pct}% ${amp.tier === 3 ? '★★★' : amp.tier === 2 ? '★★' : amp.tier === 1 ? '★' : ''}`.trim();
    dom.tbAmpChip.textContent = `增幅 +${amp.pct}% · ${amp.name}`;

    const pips = dom.pwAmpPips.querySelectorAll('.amp-pip');
    pips.forEach((pip, i) => {
      pip.className = 'amp-pip';
      if (i < amp.tier) pip.classList.add(`lit-${amp.tier}`);
    });

    renderBladeList();
  }

  function cycleAmp(delta) {
    state.ampIndex = (state.ampIndex + delta + AMP_TIERS.length) % AMP_TIERS.length;
    const amp = AMP_TIERS[state.ampIndex];
    syncAmpUI();
    if (amp.tier === 3) {
      setTacticMessage(`<strong>★★★ 星霜极限 +60%</strong> 激活 · 香槟金三环 + 冰雷电弧（+3 破锁 · 1.30×）`);
    } else if (amp.tier > 0) {
      setTacticMessage(`增幅切换 <strong>${amp.name} (+${amp.pct}%)</strong> · +${amp.breakAdd} 破锁 / ${amp.pen}% 穿抗`);
    } else {
      setTacticMessage(`魔力增幅归零至 <strong>常规 0%</strong>`);
    }
  }

  function setTacticMessage(html) {
    dom.tacticMsg.innerHTML = html;
  }

  /* ==================== 10. 希尔维亚 → 棱镜指令翼星轨引线 ==================== */
  function renderPrismRays() {
    const sylvia = state.actors.find(u => u.isPlayer);
    if (!sylvia) return;
    const pos = getSlotCoords(sylvia.side, sylvia.slot);
    const w = window.innerWidth;
    const h = window.innerHeight;
    dom.raySvg.setAttribute('viewBox', `0 0 ${w} ${h}`);

    const originX = pos.x + 28;
    const originY = pos.y - (sylvia._dispH || 170) * 0.56;
    const targetNodes = state.menuMode === 'root'
      ? Array.from(dom.rig.querySelectorAll('.pwing-slot'))
      : Array.from(dom.rig.querySelectorAll('.blade-shell')).slice(0, 4);

    const amp = AMP_TIERS[state.ampIndex];
    const strokeMain = amp.tier === 3 ? 'rgba(255, 242, 198, 0.90)' : 'rgba(125, 211, 252, 0.72)';
    const strokeAccent = amp.tier === 3 ? 'rgba(125, 211, 252, 0.78)' : 'rgba(239, 224, 190, 0.65)';

    let parts = [];
    parts.push(`<circle cx="${originX.toFixed(1)}" cy="${originY.toFixed(1)}" r="22" fill="none" stroke="${strokeAccent}" stroke-width="1.15" stroke-dasharray="4 5" opacity="0.78"/>`);
    parts.push(`<circle cx="${originX.toFixed(1)}" cy="${originY.toFixed(1)}" r="3.5" fill="#EFE0BE"/>`);

    targetNodes.forEach((node, i) => {
      const r = node.getBoundingClientRect();
      if (!r.width || !r.height) return;
      const tx = r.left + 6;
      const ty = r.top + r.height * 0.5;
      const midX = originX + (tx - originX) * 0.44;
      const lit = state.hoveredWingIdx === i;
      parts.push(
        `<path d="M ${originX.toFixed(1)} ${originY.toFixed(1)} L ${midX.toFixed(1)} ${ty.toFixed(1)} L ${tx.toFixed(1)} ${ty.toFixed(1)}" ` +
        `fill="none" stroke="${lit ? '#FFF4CE' : (i === 0 ? strokeMain : strokeAccent)}" ` +
        `stroke-width="${lit ? 2.0 : 1.15}" opacity="${lit ? 0.98 : 0.68}"/>`
      );
      parts.push(`<rect x="${(tx - 3).toFixed(1)}" y="${(ty - 3).toFixed(1)}" width="6" height="6" transform="rotate(45 ${tx.toFixed(1)} ${ty.toFixed(1)})" fill="${lit ? '#FFFFFF' : '#7DD3FC'}"/>`);
    });

    dom.raySvg.innerHTML = parts.join('');
  }

  /* ==================== 11. 一键开关「透视雁阵辅助线」（6+6 坐标与景深可视化） ==================== */
  function renderGuideOverlay() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    dom.guideSvg.setAttribute('viewBox', `0 0 ${w} ${h}`);

    const vpX = w * 0.502;
    const vpY = h * 0.435;

    const aB = ['B0', 'B1', 'B2'].map(k => getSlotCoords('ally', k));
    const aF = ['F0', 'F1', 'F2'].map(k => getSlotCoords('ally', k));
    const eF = ['F0', 'F1', 'F2'].map(k => getSlotCoords('enemy', k));
    const eB = ['B0', 'B1', 'B2'].map(k => getSlotCoords('enemy', k));

    const polyStr = pts => pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    let svg = [];

    svg.push(`<line x1="0" y1="${vpY.toFixed(1)}" x2="${w}" y2="${vpY.toFixed(1)}" stroke="rgba(125,211,252,0.42)" stroke-width="1" stroke-dasharray="6 6"/>`);
    svg.push(`<circle cx="${vpX.toFixed(1)}" cy="${vpY.toFixed(1)}" r="5" fill="none" stroke="#EFE0BE" stroke-width="1.3"/>`);
    svg.push(`<text x="${(vpX + 10).toFixed(1)}" y="${(vpY - 7).toFixed(1)}" fill="#EFE0BE" font-size="11" font-family="monospace">VP · 剧场透视灭点</text>`);

    const rows = [
      { y: h * 0.554, label: '远翼 0.86×' },
      { y: h * 0.676, label: '中轴 1.00×' },
      { y: h * 0.785, label: '近翼 1.12×' },
    ];
    rows.forEach(r => {
      svg.push(`<line x1="${(w * 0.12).toFixed(1)}" y1="${r.y.toFixed(1)}" x2="${(w * 0.94).toFixed(1)}" y2="${r.y.toFixed(1)}" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="3 6"/>`);
      svg.push(`<text x="${(w * 0.502).toFixed(1)}" y="${(r.y - 5).toFixed(1)}" text-anchor="middle" fill="rgba(235,246,255,0.92)" font-size="10.5" font-weight="700" style="paint-order:stroke;stroke:rgba(8,18,44,0.75);stroke-width:3px;">${r.label}</text>`);
    });

    [aB[2], aF[2], eF[2], eB[2]].forEach(pt => {
      svg.push(`<line x1="${vpX.toFixed(1)}" y1="${vpY.toFixed(1)}" x2="${pt.x.toFixed(1)}" y2="${(pt.y + 34).toFixed(1)}" stroke="rgba(125,211,252,0.18)" stroke-width="1"/>`);
    });

    svg.push(`<polyline points="${polyStr(aF)}" fill="none" stroke="#38BDF8" stroke-width="2.2"/>`);
    svg.push(`<polyline points="${polyStr(aB)}" fill="none" stroke="rgba(125,211,252,0.76)" stroke-width="1.5" stroke-dasharray="5 4"/>`);
    svg.push(`<polyline points="${polyStr(eF)}" fill="none" stroke="#FB7185" stroke-width="2.2"/>`);
    svg.push(`<polyline points="${polyStr(eB)}" fill="none" stroke="rgba(251,113,133,0.72)" stroke-width="1.5" stroke-dasharray="5 4"/>`);

    const allPts = [
      ...aB.map(p => ({ ...p, side: 'ally' })),
      ...aF.map(p => ({ ...p, side: 'ally' })),
      ...eF.map(p => ({ ...p, side: 'enemy' })),
      ...eB.map(p => ({ ...p, side: 'enemy' })),
    ];
    allPts.forEach(p => {
      const col = p.side === 'ally' ? '#7DD3FC' : '#FDA4AF';
      svg.push(`<ellipse cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" rx="${(24 * p.depth).toFixed(1)}" ry="${(7.5 * p.depth).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.2" opacity="0.88"/>`);
      svg.push(`<rect x="${(p.x - 3.5).toFixed(1)}" y="${(p.y - 3.5).toFixed(1)}" width="7" height="7" transform="rotate(45 ${p.x.toFixed(1)} ${p.y.toFixed(1)})" fill="#FFFFFF" stroke="${col}" stroke-width="1"/>`);
      svg.push(`<text x="${p.x.toFixed(1)}" y="${(p.y + 18).toFixed(1)}" text-anchor="middle" fill="#FFFFFF" font-size="10" font-family="monospace" style="paint-order:stroke;stroke:rgba(8,18,44,0.85);stroke-width:3px;">${p.code} (${p.depth.toFixed(2)}×)</text>`);
    });

    const dockLineY = h - 134;
    svg.push(`<line x1="16" y1="${dockLineY}" x2="394" y2="${dockLineY}" stroke="rgba(239,224,190,0.80)" stroke-width="1.2" stroke-dasharray="4 4"/>`);
    svg.push(`<text x="205" y="${dockLineY - 5}" text-anchor="middle" fill="#EFE0BE" font-size="10" font-weight="700" style="paint-order:stroke;stroke:rgba(8,18,44,0.8);stroke-width:3px;">▲ 宽阔留白隔离带 · 绝不抵卡</text>`);

    dom.guideSvg.innerHTML = svg.join('');
  }

  /* ==================== 12. 互动演武出招与特效 ==================== */
  function queueAnim(unit, frames, stepMs, lungeDist) {
    unit.animMode = 'action';
    unit.animQueue = frames.map(f => ({ frame: f, ms: stepMs }));
    unit.animTimer = 0;
    unit._lungePeak = lungeDist || 0;
  }

  function spawnFloatText(x, y, text, cls) {
    const el = document.createElement('div');
    el.className = `dmg-pop ${cls || 'ice'}`;
    el.textContent = text;
    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    dom.floatLayer.appendChild(el);
    setTimeout(() => el.remove(), 980);
  }

  function triggerSkillCast(skill, primaryTarget) {
    const sylvia = state.actors.find(u => u.isPlayer);
    if (!sylvia) return;
    const amp = AMP_TIERS[state.ampIndex];
    const effAmp = amp.pct <= skill.cap ? amp : AMP_TIERS.find(t => t.pct === skill.cap) || AMP_TIERS[0];
    const mpCost = skill.mp + effAmp.extraMp;

    sylvia.mp = Math.max(0, sylvia.mp - mpCost);
    if (sylvia.mp < 20) sylvia.mp = sylvia.mmp;

    queueAnim(sylvia, [3, 4, 5, 4, 0], 95, 22);

    const srcPos = getSlotCoords(sylvia.side, sylvia.slot);
    const sx = srcPos.x + 36;
    const sy = srcPos.y - (sylvia._dispH || 170) * 0.56;

    if (skill.kind === 'shield') {
      const addShield = Math.round(skill.shield * effAmp.shieldMult);
      state.actors.filter(u => u.side === 'ally').forEach(a => {
        a.shield = Math.min((a.maxShield || 160), (a.shield || 0) + addShield);
        const ap = getSlotCoords(a.side, a.slot);
        state.vfxEffects.push({
          type: 'shieldPulse',
          x: ap.x,
          y: ap.y - (a._dispH || 170) * 0.45,
          t: 0,
          dur: 0.65,
          gold: effAmp.tier >= 2,
        });
        spawnFloatText(ap.x, ap.y - (a._dispH || 170) * 0.72, `+${addShield} 冰盾`, 'shield');
      });
      setTacticMessage(`希尔维亚施放 <strong>${skill.name}</strong>（+${effAmp.pct}%）· 构筑 +${addShield} 实体冰盾！`);
    } else {
      const targets = skill.aoe
        ? state.actors.filter(u => u.side === 'enemy')
        : [primaryTarget || state.actors.find(u => u.side === 'enemy')].filter(Boolean);

      targets.forEach((tgt, idx) => {
        const tp = getSlotCoords(tgt.side, tgt.slot);
        const tx = tp.x;
        const ty = tp.y - (tgt._dispH || 160) * 0.48;
        const dmg = Math.round(skill.baseDmg * effAmp.mult * (0.96 + Math.random() * 0.08));
        const brk = skill.breakBase + effAmp.breakAdd;

        state.vfxEffects.push({
          type: effAmp.tier === 3 || skill.kind === 'prism' ? 'goldIceBolt' : 'iceBolt',
          sx, sy, tx, ty,
          t: -idx * 0.06,
          dur: 0.52,
        });

        setTimeout(() => {
          queueAnim(tgt, [6, 6, 0], 115, -14);
          tgt.hp = Math.max(12, tgt.hp - dmg);
          if (tgt.hp <= 15) tgt.hp = tgt.mhp;
          tgt.locks = Math.max(0, tgt.locks - brk);
          if (tgt.locks === 0) {
            spawnFloatText(tx, ty - 44, `-${dmg} 破防!`, 'gold');
            setTimeout(() => { tgt.locks = tgt.maxLocks; refreshEnemyPlate(tgt); }, 1100);
          } else {
            spawnFloatText(tx, ty - 34, `-${dmg}`, effAmp.tier === 3 ? 'gold' : 'ice');
          }
          refreshEnemyPlate(tgt);
          state.shakeTime = effAmp.tier >= 2 ? 0.16 : 0.09;
        }, 170 + idx * 60);
      });

      setTacticMessage(`希尔维亚以 <strong>${effAmp.name} (+${effAmp.pct}%)</strong> 施放 <strong>${skill.name}</strong> · 破锁 +${skill.breakBase + effAmp.breakAdd}！`);
    }

    state.turn++;
    dom.avTurnLabel.textContent = `TURN ${String(state.turn).padStart(2, '0')}`;
    state.menuMode = 'root';
    syncMenuMode();
    renderPartyDock();
  }

  function triggerRenoCounter() {
    const reno = state.actors.find(u => u.id === 'reno');
    const tgt = state.actors.find(u => u.id === state.selectedEnemyId) || state.actors.find(u => u.side === 'enemy');
    if (!reno || !tgt) return;
    const elems = [
      { key: 'earth', name: '地脉掀岩', frames: [3, 4, 5, 0], color: '#E8B86D' },
      { key: 'fire',  name: '烈炎斩击', frames: [7, 8, 7, 0], color: '#FB7185' },
      { key: 'wind',  name: '疾风破空', frames: [9, 10, 9, 0], color: '#5CE0B8' },
    ];
    const pick = elems[state.turn % elems.length];
    queueAnim(reno, pick.frames, 105, 30);

    const rp = getSlotCoords(reno.side, reno.slot);
    const tp = getSlotCoords(tgt.side, tgt.slot);
    state.vfxEffects.push({
      type: 'renoSlash',
      sx: rp.x + 30,
      sy: rp.y - (reno._dispH || 185) * 0.50,
      tx: tp.x,
      ty: tp.y - (tgt._dispH || 175) * 0.48,
      color: pick.color,
      t: 0,
      dur: 0.45,
    });

    setTimeout(() => {
      queueAnim(tgt, [6, 0], 110, -12);
      const dmg = 96 + Math.round(Math.random() * 18);
      tgt.hp = Math.max(18, tgt.hp - dmg);
      if (tgt.hp <= 20) tgt.hp = tgt.mhp;
      refreshEnemyPlate(tgt);
      spawnFloatText(tp.x, tp.y - 120, `-${dmg}`, 'gold');
    }, 150);

    state.turn++;
    dom.avTurnLabel.textContent = `TURN ${String(state.turn).padStart(2, '0')}`;
    setTacticMessage(`前排主力 <strong>雷纳德</strong> 切系施展 <strong>${pick.name}</strong> 压制 <strong>${tgt.name}</strong>！`);
  }

  /* ==================== 13. 地面透视反光 / 脚影 / 60% 香槟金三环 + 冰雷 VFX ==================== */
  function initParticles(mode) {
    state.particles = [];
    const count = mode === 'snow' ? 62 : 36;
    for (let i = 0; i < count; i++) {
      state.particles.push({
        x: Math.random(),
        y: Math.random(),
        r: mode === 'snow' ? (1.2 + Math.random() * 2.4) : (1.0 + Math.random() * 1.8),
        vx: mode === 'snow' ? (-0.015 - Math.random() * 0.025) : (0.004 - Math.random() * 0.008),
        vy: mode === 'snow' ? (0.028 + Math.random() * 0.042) : (-0.008 - Math.random() * 0.014),
        alpha: 0.25 + Math.random() * 0.55,
        mode,
      });
    }
  }

  function resizeCanvases() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth;
    const h = window.innerHeight;
    [dom.floorCanvas, dom.vfxCanvas].forEach(c => {
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      c.style.width = `${w}px`;
      c.style.height = `${h}px`;
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    renderActorsDOM();
    renderGuideOverlay();
    renderPrismRays();
  }

  function drawFloorLayer(nowSec, dt) {
    const ctx = dom.floorCanvas.getContext('2d');
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    // 极微淡剧场透视地平线反光带（零方格！）
    const horizonY = h * 0.495;
    const hGrad = ctx.createLinearGradient(0, horizonY - 22, 0, horizonY + 38);
    if (state.sceneId === 'rowan') {
      hGrad.addColorStop(0, 'rgba(125, 211, 252, 0)');
      hGrad.addColorStop(0.45, 'rgba(125, 211, 252, 0.09)');
      hGrad.addColorStop(1, 'rgba(125, 211, 252, 0)');
    } else if (state.sceneId === 'hulan') {
      hGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
      hGrad.addColorStop(0.45, 'rgba(235, 248, 255, 0.16)');
      hGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
    } else {
      hGrad.addColorStop(0, 'rgba(255, 248, 224, 0)');
      hGrad.addColorStop(0.45, 'rgba(255, 248, 224, 0.11)');
      hGrad.addColorStop(1, 'rgba(255, 248, 224, 0)');
    }
    ctx.fillStyle = hGrad;
    ctx.fillRect(0, horizonY - 22, w, 60);

    const amp = AMP_TIERS[state.ampIndex];

    state.actors.forEach(u => {
      const pos = getSlotCoords(u.side, u.slot);
      const bank = (window.PIXEL_SPRITE_BANK || {})[u.spriteId];
      const isQuad = bank && bank.w >= 156;
      const rx = (isQuad ? 64 : 40) * pos.depth * (state.sceneId === 'full6v6' ? 0.84 : 1);
      const ry = rx * 0.27;
      const fx = pos.x + (u.lungeX || 0);
      const fy = pos.y - 3;

      const shGrad = ctx.createRadialGradient(fx, fy, 2, fx, fy, rx);
      shGrad.addColorStop(0, 'rgba(6, 14, 34, 0.56)');
      shGrad.addColorStop(0.62, 'rgba(6, 14, 34, 0.24)');
      shGrad.addColorStop(1, 'rgba(6, 14, 34, 0)');
      ctx.fillStyle = shGrad;
      ctx.beginPath();
      ctx.ellipse(fx, fy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();

      if (u.side === 'enemy' && u.id === state.selectedEnemyId) {
        const pulse = 1 + Math.sin(nowSec * 3.4) * 0.04;
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(1, 0.30);
        ctx.strokeStyle = 'rgba(251, 113, 133, 0.78)';
        ctx.lineWidth = 2;
        ctx.setLineDash([10, 6]);
        ctx.beginPath();
        ctx.arc(0, 0, rx * 1.18 * pulse, nowSec * 0.6, nowSec * 0.6 + Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      if (u.isPlayer && u.acting) {
        const baseR = rx * 1.32;
        ctx.save();
        ctx.translate(fx, fy);
        ctx.scale(1, 0.31);

        if (amp.tier === 0) {
          ctx.strokeStyle = 'rgba(125, 211, 252, 0.58)';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(0, 0, baseR, 0, Math.PI * 2);
          ctx.stroke();
        } else if (amp.tier === 1) {
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.86)';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.arc(0, 0, baseR * 1.06, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(22, 88, 235, 0.70)';
          ctx.setLineDash([12, 8]);
          ctx.beginPath();
          ctx.arc(0, 0, baseR * 1.24, nowSec, nowSec + Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        } else if (amp.tier === 2) {
          ctx.strokeStyle = 'rgba(125, 211, 252, 0.94)';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.arc(0, 0, baseR * 1.10, 0, Math.PI * 2);
          ctx.stroke();
          ctx.strokeStyle = 'rgba(46, 119, 248, 0.85)';
          ctx.lineWidth = 1.8;
          ctx.setLineDash([14, 6]);
          ctx.beginPath();
          ctx.arc(0, 0, baseR * 1.34, -nowSec * 1.4, -nowSec * 1.4 + Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        } else {
          // 60% ★★★ 星霜极限：香槟金三环
          [1.04, 1.26, 1.48].forEach((m, ringIdx) => {
            ctx.strokeStyle = ringIdx === 1 ? 'rgba(255, 242, 198, 0.96)' : 'rgba(196, 164, 108, 0.90)';
            ctx.lineWidth = ringIdx === 1 ? 2.8 : 1.8;
            if (ringIdx === 2) ctx.setLineDash([16, 7]);
            ctx.beginPath();
            ctx.arc(0, 0, baseR * m, nowSec * (ringIdx % 2 ? -1.8 : 1.3), nowSec * (ringIdx % 2 ? -1.8 : 1.3) + Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
          });
        }
        ctx.restore();
      }
    });

    state.particles.forEach(p => {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.x < -0.02) p.x = 1.02;
      if (p.x > 1.02) p.x = -0.02;
      if (p.y < -0.02) p.y = 1.02;
      if (p.y > 1.02) p.y = -0.02;

      ctx.fillStyle = p.mode === 'snow'
        ? `rgba(245, 251, 255, ${p.alpha})`
        : p.mode === 'moonlight'
          ? `rgba(182, 228, 255, ${p.alpha * 0.72})`
          : `rgba(255, 248, 224, ${p.alpha * 0.65})`;
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawVfxLayer(nowSec, dt) {
    const ctx = dom.vfxCanvas.getContext('2d');
    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    const amp = AMP_TIERS[state.ampIndex];
    if (amp.tier === 3) {
      const sylvia = state.actors.find(u => u.isPlayer);
      if (sylvia) {
        const p = getSlotCoords(sylvia.side, sylvia.slot);
        const cx = p.x;
        const cy = p.y - (sylvia._dispH || 170) * 0.48;
        for (let b = 0; b < 3; b++) {
          const ang = nowSec * 3.1 + b * 2.09;
          const x1 = cx + Math.cos(ang) * 44;
          const y1 = cy + Math.sin(ang) * 58;
          const x2 = cx + Math.cos(ang + 1.15) * 48;
          const y2 = cy + Math.sin(ang + 1.15) * 54;
          const mx = (x1 + x2) * 0.5 + Math.sin(nowSec * 29 + b * 7) * 14;
          const my = (y1 + y2) * 0.5 + Math.cos(nowSec * 23 + b * 5) * 14;

          ctx.strokeStyle = b % 2 === 0 ? 'rgba(125, 211, 252, 0.90)' : 'rgba(255, 240, 192, 0.92)';
          ctx.lineWidth = 1.9;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(mx, my);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
      }
    }

    for (let i = state.vfxEffects.length - 1; i >= 0; i--) {
      const fx = state.vfxEffects[i];
      fx.t += dt;
      if (fx.t < 0) continue;
      const p = fx.t / fx.dur;
      if (p >= 1) {
        state.vfxEffects.splice(i, 1);
        continue;
      }

      if (fx.type === 'iceBolt' || fx.type === 'goldIceBolt') {
        const isGold = fx.type === 'goldIceBolt';
        const headP = Math.min(1, p * 1.9);
        const tailP = Math.max(0, headP - 0.45);
        const hx = fx.sx + (fx.tx - fx.sx) * headP;
        const hy = fx.sy + (fx.ty - fx.sy) * headP;
        const tx = fx.sx + (fx.tx - fx.sx) * tailP;
        const ty = fx.sy + (fx.ty - fx.sy) * tailP;

        const grad = ctx.createLinearGradient(tx, ty, hx, hy);
        grad.addColorStop(0, 'rgba(125, 211, 252, 0)');
        grad.addColorStop(0.55, isGold ? 'rgba(255, 240, 192, 0.90)' : 'rgba(125, 211, 252, 0.88)');
        grad.addColorStop(1, '#FFFFFF');

        ctx.strokeStyle = grad;
        ctx.lineWidth = isGold ? 6 : 4.2;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(hx, hy);
        ctx.stroke();

        if (headP >= 0.92) {
          const bp = (p - 0.46) / 0.54;
          const rad = 18 + bp * (isGold ? 68 : 48);
          ctx.save();
          ctx.translate(fx.tx, fx.ty);
          ctx.rotate(Math.PI / 4 + bp * 0.4);
          ctx.strokeStyle = isGold
            ? `rgba(255, 242, 198, ${(1 - bp) * 0.95})`
            : `rgba(125, 211, 252, ${(1 - bp) * 0.90})`;
          ctx.lineWidth = 2.4;
          ctx.strokeRect(-rad * 0.5, -rad * 0.5, rad, rad);
          ctx.restore();
        }
      } else if (fx.type === 'shieldPulse') {
        const rad = 24 + p * 54;
        ctx.save();
        ctx.translate(fx.x, fx.y);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = fx.gold
          ? `rgba(239, 224, 190, ${(1 - p) * 0.92})`
          : `rgba(125, 211, 252, ${(1 - p) * 0.88})`;
        ctx.lineWidth = 2.5;
        ctx.strokeRect(-rad * 0.65, -rad * 0.65, rad * 1.3, rad * 1.3);
        ctx.restore();
      } else if (fx.type === 'renoSlash') {
        const hp = Math.min(1, p * 2.1);
        const cx = fx.sx + (fx.tx - fx.sx) * hp;
        const cy = fx.sy + (fx.ty - fx.sy) * hp;
        ctx.strokeStyle = fx.color;
        ctx.globalAlpha = 1 - p;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 26, cy - 22);
        ctx.lineTo(cx + 26, cy + 22);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  function updateSpriteAnimations(nowSec, dtMs) {
    const IDLE_SEQ = [0, 0, 1, 1, 0, 1, 2, 0];
    state.actors.forEach(u => {
      if (!u._canvas) return;
      let targetFrame = 0;
      let lunge = 0;

      if (u.animMode === 'action' && u.animQueue.length > 0) {
        u.animTimer += dtMs;
        const cur = u.animQueue[0];
        targetFrame = cur.frame;
        lunge = u._lungePeak * Math.sin((1 - u.animQueue.length / 5) * Math.PI);
        if (u.animTimer >= cur.ms) {
          u.animTimer = 0;
          u.animQueue.shift();
          if (u.animQueue.length === 0) {
            u.animMode = 'idle';
            lunge = 0;
          }
        }
      } else {
        const idx = Math.floor((nowSec * 2.3 + u.phase) % IDLE_SEQ.length);
        targetFrame = IDLE_SEQ[idx];
      }

      u.lungeX = lunge;
      if (u._el) {
        u._el.style.marginLeft = lunge ? `${lunge.toFixed(1)}px` : '';
      }

      if (targetFrame !== u.curFrame) {
        u.curFrame = targetFrame;
        const imgData = decodeFrame(u.spriteId, targetFrame);
        if (imgData) {
          const ctx = u._canvas.getContext('2d');
          ctx.putImageData(imgData, 0, 0);
        }
      }
    });
  }

  let lastTs = performance.now();
  function tick(ts) {
    const dtMs = Math.min(48, Math.max(0, ts - lastTs));
    lastTs = ts;
    const dt = dtMs / 1000;
    const nowSec = ts / 1000;

    updateSpriteAnimations(nowSec, dtMs);
    drawFloorLayer(nowSec, dt);
    drawVfxLayer(nowSec, dt);

    if (state.shakeTime > 0) {
      state.shakeTime = Math.max(0, state.shakeTime - dt);
      const mag = state.shakeTime * 28;
      dom.stage.style.transform = state.shakeTime > 0
        ? `translate(${((Math.random() - 0.5) * mag).toFixed(1)}px, ${((Math.random() - 0.5) * mag).toFixed(1)}px)`
        : '';
    }

    requestAnimationFrame(tick);
  }

  /* ==================== 14. 交互与快捷键绑定 ==================== */
  document.querySelectorAll('.tb-scene-btn').forEach(btn => {
    btn.addEventListener('click', () => loadScene(btn.getAttribute('data-scene-id')));
  });

  dom.btnGuides.addEventListener('click', () => {
    state.showGuides = !state.showGuides;
    dom.stage.classList.toggle('show-guides', state.showGuides);
    dom.btnGuides.classList.toggle('active', state.showGuides);
    dom.btnGuides.setAttribute('aria-pressed', String(state.showGuides));
    if (state.showGuides) {
      renderGuideOverlay();
      setTacticMessage('已开启 <strong>透视雁阵辅助线</strong> · 左翼 <strong>&gt;</strong> vs 右翼 <strong>&lt;</strong> · 0.86×/1.00×/1.12× 景深');
    } else {
      setTacticMessage('已恢复 <strong>纯净无格剧场地面</strong> · 零方格零框线');
    }
  });

  dom.tbAmpChip.addEventListener('click', () => cycleAmp(1));
  dom.pwAmp.addEventListener('click', () => cycleAmp(1));
  dom.pwAmp.addEventListener('contextmenu', ev => { ev.preventDefault(); cycleAmp(-1); });
  document.getElementById('pw-amp-mini').addEventListener('click', () => cycleAmp(1));

  document.getElementById('pw-magic').addEventListener('click', () => {
    state.menuMode = 'cascade';
    syncMenuMode();
  });

  document.getElementById('pw-back').addEventListener('click', () => {
    state.menuMode = 'root';
    syncMenuMode();
  });

  document.getElementById('pw-guard').addEventListener('click', () => {
    const cfg = SCENES[state.sceneId];
    const guardSkill = cfg.skills.find(s => s.kind === 'shield') || cfg.skills[0];
    triggerSkillCast(guardSkill, null);
  });

  document.getElementById('pw-assist').addEventListener('click', () => {
    const cfg = SCENES[state.sceneId];
    const prismSkill = cfg.skills.find(s => s.kind === 'prism') || cfg.skills[0];
    const target = state.actors.find(u => u.id === state.selectedEnemyId) || state.actors.find(u => u.side === 'enemy');
    triggerSkillCast(prismSkill, target);
  });

  document.querySelectorAll('.pwing-slot').forEach(slot => {
    const idx = Number(slot.getAttribute('data-i'));
    slot.addEventListener('mouseenter', () => { state.hoveredWingIdx = idx; renderPrismRays(); });
    slot.addEventListener('mouseleave', () => { state.hoveredWingIdx = null; renderPrismRays(); });
  });

  window.addEventListener('keydown', ev => {
    const k = ev.key.toLowerCase();
    if (k === 'e') {
      ev.preventDefault();
      cycleAmp(ev.shiftKey ? -1 : 1);
    } else if (k === 'w') {
      ev.preventDefault();
      state.menuMode = state.menuMode === 'root' ? 'cascade' : 'root';
      syncMenuMode();
    } else if (k === 'escape') {
      if (state.menuMode === 'cascade') {
        state.menuMode = 'root';
        syncMenuMode();
      }
    } else if (k === 'a') {
      document.getElementById('pw-guard').click();
    } else if (k === 'd') {
      document.getElementById('pw-assist').click();
    } else if (k === 'g') {
      dom.btnGuides.click();
    } else if (k >= '1' && k <= '5' && state.menuMode === 'cascade') {
      const cfg = SCENES[state.sceneId];
      const sk = cfg.skills[Number(k) - 1];
      if (sk) {
        const target = state.actors.find(u => u.id === state.selectedEnemyId) || state.actors.find(u => u.side === 'enemy');
        triggerSkillCast(sk, target);
      }
    }
  });

  window.addEventListener('resize', () => {
    resizeCanvases();
  });

  resizeCanvases();
  loadScene('rowan');
  requestAnimationFrame(tick);
})();
</script>
</body>
