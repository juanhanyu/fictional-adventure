<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案 3 · 冰晶宫殿 · 时停直点破绽反杀 | 转生千金</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    canvas#battle-canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: manipulation;
    }
    @keyframes palacePulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7), 0 0 16px rgba(56, 189, 248, 0.45);
        filter: brightness(1);
      }
      50% {
        box-shadow: 0 0 0 6px rgba(56, 189, 248, 0), 0 0 28px rgba(125, 211, 252, 0.9);
        filter: brightness(1.1);
      }
    }
    .palace-ready {
      animation: palacePulse 1.35s ease-in-out infinite;
      background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 48%, #38bdf8 100%);
      color: #f8fafc;
      border-color: #7dd3fc;
    }
    .palace-active {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      color: #e0f2fe;
      border-color: #bae6fd;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.55);
    }
    .skill-btn {
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .skill-btn:not(:disabled):hover {
      transform: translateY(-1px);
      border-color: var(--primary);
    }
    .skill-btn:not(:disabled):active {
      transform: translateY(1px) scale(0.985);
    }
    .bar-fill {
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .log-scroll::-webkit-scrollbar { width: 5px; }
    .log-scroll::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 999px;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0">
  <div class="max-w-[1040px] mx-auto px-3 py-3 space-y-2.5">

    <!-- Top Control Bar -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex items-center gap-2.5 min-w-0">
        <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-[var(--primary)]/15 border border-[var(--primary)]/35 text-base shrink-0">❄️</span>
        <div class="min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-sm font-bold tracking-tight text-[var(--foreground)] m-0">冰晶宫殿 · 时停直点破绽反杀</h1>
            <span class="text-xs px-2 py-0.5 rounded-full bg-[var(--primary)]/15 text-[var(--primary)] border border-[var(--primary)]/30 font-medium">方案 3 实机演示</span>
          </div>
          <p class="text-xs text-[var(--muted-foreground)] m-0 mt-0.5 truncate">蓄满冰晶洞察 → 展开宫殿冻结战局 → 在画布上直点敌方破绽触发专属反杀</p>
        </div>
      </div>

      <!-- Scenario Switcher & Demo Shortcuts -->
      <div class="flex flex-wrap items-center gap-1.5">
        <div class="inline-flex rounded-lg p-0.5 bg-[var(--content)] border border-[var(--border)]" role="tablist" aria-label="剧本切换">
          <button id="btn-scenario-rowan" type="button"
            class="px-2.5 py-1 rounded-md text-xs font-semibold transition-colors cursor-pointer">
            🌑 乱葬岗 · 罗文
          </button>
          <button id="btn-scenario-beatrice" type="button"
            class="px-2.5 py-1 rounded-md text-xs font-semibold transition-colors cursor-pointer">
            🔥 决斗场 · 贝阿特丽丝
          </button>
        </div>

        <button id="btn-instant-charge" type="button" title="一键蓄满洞察并触发敌方蓄力杀招，立即体验时停看破"
          class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 active:scale-[0.98] transition cursor-pointer">
          ⚡ 满洞察演示
        </button>
        <button id="btn-reset" type="button" title="重置当前剧本"
          class="px-2.5 py-1.5 rounded-lg text-xs font-medium bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)] hover:border-[var(--primary)] transition cursor-pointer">
          ↺ 重开
        </button>
        <button id="btn-sfx" type="button" title="切换 Web Audio 音效"
          class="px-2 py-1.5 rounded-lg text-xs font-medium bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)] hover:border-[var(--primary)] transition cursor-pointer">
          🔊
        </button>
        <button id="btn-motion" type="button" title="减弱震屏与闪光"
          class="px-2 py-1.5 rounded-lg text-xs font-medium bg-[var(--content)] border border-[var(--border)] text-[var(--muted-foreground)] hover:border-[var(--primary)] transition cursor-pointer">
          震屏:开
        </button>
      </div>
    </header>

    <!-- Status Strip: Sylvia vs Enemy -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
      <!-- Sylvia Card -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-[var(--foreground)]">希尔维亚 · 银发冰姬</span>
            <span id="sylvia-shield-pill" class="hidden text-xs px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-400 border border-sky-400/35 font-medium">🛡️ 护壁 0</span>
          </div>
          <span id="turn-badge" class="text-xs font-mono tabular-nums text-[var(--muted-foreground)]">第 1 回合</span>
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="text-[var(--muted-foreground)]">生命 HP</span>
              <span id="sylvia-hp-text" class="font-mono tabular-nums font-semibold text-[var(--foreground)]">180 / 180</span>
            </div>
            <div class="h-2 rounded-full bg-[var(--content)] border border-[var(--border)] overflow-hidden">
              <div id="sylvia-hp-bar" class="bar-fill h-full rounded-full bg-emerald-500" style="width:100%"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-xs mb-1">
              <span class="text-[var(--muted-foreground)]">魔力 MP</span>
              <span id="sylvia-mp-text" class="font-mono tabular-nums font-semibold text-[var(--foreground)]">240 / 240</span>
            </div>
            <div class="h-2 rounded-full bg-[var(--content)] border border-[var(--border)] overflow-hidden">
              <div id="sylvia-mp-bar" class="bar-fill h-full rounded-full bg-indigo-500" style="width:100%"></div>
            </div>
          </div>
        </div>

        <!-- Insight Gauge -->
        <div>
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="font-semibold text-sky-400 flex items-center gap-1">
              <span>❄️ 冰晶洞察槽</span>
              <span id="insight-state-hint" class="font-normal text-[var(--muted-foreground)]">（再施法 1 次即满）</span>
            </span>
            <span id="insight-text" class="font-mono tabular-nums font-bold text-sky-400">65%</span>
          </div>
          <div class="h-2.5 rounded-full bg-[var(--content)] border border-sky-500/35 overflow-hidden relative">
            <div id="insight-bar" class="bar-fill h-full rounded-full bg-gradient-to-r from-sky-600 via-cyan-400 to-sky-200" style="width:65%"></div>
          </div>
        </div>
      </div>

      <!-- Enemy Card -->
      <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-3.5 py-2.5 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span id="enemy-name" class="text-xs font-bold text-[var(--foreground)] truncate">罗文 · 圣级血族侍卫</span>
            <span id="enemy-tag" class="text-xs px-2 py-0.5 rounded-full bg-purple-500/15 text-purple-400 border border-purple-400/35 font-medium shrink-0">晦轮杖</span>
          </div>
          <span id="enemy-status-badge" class="text-xs px-2 py-0.5 rounded-full font-semibold shrink-0 bg-amber-500/15 text-amber-400 border border-amber-400/35">蓄势待发</span>
        </div>

        <div>
          <div class="flex justify-between text-xs mb-1">
            <span class="text-[var(--muted-foreground)]">敌方生命 HP</span>
            <span id="enemy-hp-text" class="font-mono tabular-nums font-semibold text-[var(--foreground)]">460 / 460</span>
          </div>
          <div class="h-2.5 rounded-full bg-[var(--content)] border border-[var(--border)] overflow-hidden">
            <div id="enemy-hp-bar" class="bar-fill h-full rounded-full bg-rose-500" style="width:100%"></div>
          </div>
        </div>

        <div class="flex items-center justify-between gap-2 text-xs">
          <span id="enemy-intent-text" class="text-[var(--muted-foreground)] truncate">意图：暗月蓄力，下回合将施展「虚刺实掷晦轮杖」</span>
          <div id="enemy-extra-pills" class="flex items-center gap-1 shrink-0"></div>
        </div>
      </div>
    </section>

    <!-- Main Interactive Pixel Battlefield Canvas -->
    <section class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-1.5 relative overflow-hidden">
      <div class="relative w-full aspect-[960/440] rounded-lg overflow-hidden bg-[#0c1226]">
        <canvas id="battle-canvas" width="960" height="440" class="w-full h-full block cursor-default select-none"></canvas>

        <!-- Victory / Defeat Overlay Banner (compact floating card) -->
        <div id="result-overlay" class="hidden absolute inset-0 bg-black/55 backdrop-blur-[2px] flex items-center justify-center p-4">
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl px-6 py-5 max-w-sm w-full text-center space-y-3 shadow-2xl">
            <div id="result-icon" class="text-3xl">❄️</div>
            <h2 id="result-title" class="text-base font-bold text-[var(--foreground)] m-0">冰宫破敌 · 完胜！</h2>
            <p id="result-desc" class="text-xs text-[var(--muted-foreground)] m-0 leading-relaxed"></p>
            <div class="flex items-center justify-center gap-2 pt-1">
              <button id="btn-result-retry" type="button"
                class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 cursor-pointer">
                再来一局
              </button>
              <button id="btn-result-switch" type="button"
                class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-[var(--content)] border border-[var(--border)] text-[var(--foreground)] hover:border-[var(--primary)] cursor-pointer">
                切换另一剧本
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Action Deck + Tactical Feed -->
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-2.5">
      <!-- Skills & Ice Palace Hero Trigger -->
      <div class="lg:col-span-8 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 space-y-2.5">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          <button id="skill-ice" type="button"
            class="skill-btn text-left rounded-lg px-3 py-2 bg-[var(--content)] border border-[var(--border)] cursor-pointer disabled:opacity-45 disabled:cursor-not-allowed">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-bold text-[var(--foreground)]">🧊 冰晶投枪</span>
              <span class="text-xs font-mono text-sky-400">+35%洞察</span>
            </div>
            <div class="flex items-center justify-between gap-1 text-xs text-[var(--muted-foreground)] mt-1">
              <span class="truncate">三连冰枪齐射</span>
              <span class="font-mono shrink-0">18MP [1]</span>
            </div>
          </button>

          <button id="skill-water" type="button"
            class="skill-btn text-left rounded-lg px-3 py-2 bg-[var(--content)] border border-[var(--border)] cursor-pointer disabled:opacity-45 disabled:cursor-not-allowed">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-bold text-[var(--foreground)]">💧 覆潮水弹</span>
              <span class="text-xs font-mono text-cyan-400">+35%洞察</span>
            </div>
            <div class="flex items-center justify-between gap-1 text-xs text-[var(--muted-foreground)] mt-1">
              <span id="skill-water-sub" class="truncate">水克火1.5× · 消斗气</span>
              <span class="font-mono shrink-0">20MP [2]</span>
            </div>
          </button>

          <button id="skill-shield" type="button"
            class="skill-btn text-left rounded-lg px-3 py-2 bg-[var(--content)] border border-[var(--border)] cursor-pointer disabled:opacity-45 disabled:cursor-not-allowed">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-bold text-[var(--foreground)]">🪞 寒镜护壁</span>
              <span class="text-xs font-mono text-indigo-400">+35%洞察</span>
            </div>
            <div class="flex items-center justify-between gap-1 text-xs text-[var(--muted-foreground)] mt-1">
              <span class="truncate">+50冰壁 · 回24MP</span>
              <span class="font-mono shrink-0">14MP [3]</span>
            </div>
          </button>
        </div>

        <!-- Signature Time-Stop Hero Button -->
        <button id="btn-ice-palace" type="button"
          class="skill-btn w-full rounded-xl px-4 py-2.5 border text-xs font-bold flex items-center justify-between gap-2 cursor-pointer disabled:opacity-55 disabled:cursor-not-allowed bg-[var(--content)] border-[var(--border)] text-[var(--foreground)]">
          <span class="flex items-center gap-2">
            <span class="text-base">❄️</span>
            <span id="palace-btn-label">展开冰晶宫殿 · 时停看破 (F)</span>
          </span>
          <span id="palace-btn-sub" class="text-xs font-mono opacity-90">需洞察 100% 且敌方蓄力</span>
        </button>
      </div>

      <!-- Compact Battle Log -->
      <div class="lg:col-span-4 bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 flex flex-col">
        <div class="flex items-center justify-between pb-1.5 mb-1.5 border-b border-[var(--card-border)]">
          <span class="text-xs font-bold text-[var(--foreground)]">战局手记</span>
          <span id="phase-pill" class="text-xs px-2 py-0.5 rounded bg-[var(--content)] text-[var(--muted-foreground)] font-mono">我方行动</span>
        </div>
        <div id="battle-log" class="log-scroll flex-1 max-h-[104px] overflow-y-auto space-y-1 text-xs leading-relaxed pr-1"></div>
      </div>
    </section>
  </div>

  <script>
  (function () {

    /* ================================================================
       1. PIXEL SPRITE DECODER (ZERO-PNG, LIVE Canvas putImageData)
       Supports both 6-frame and 7-frame banks:
       idle1=0, idle2=1, blink=2, windup=3, cast_step=4, strike=5, hurt=6
    ================================================================ */
    const BANK_CHARS = '.abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&()_+-=<>?[]{}|~';
    const CHAR_MAP = new Map();
    for (let i = 0; i < BANK_CHARS.length; i++) CHAR_MAP.set(BANK_CHARS[i], i);

    const FRAME_INDEX = {
      idle1: 0,
      idle2: 1,
      blink: 2,
      windup: 3,
      cast_step: 4,
      strike: 5,
      hurt: 6,
    };

    function hexToRgb(hex) {
      if (!hex) return [0, 0, 0, 0];
      const s = hex.charCodeAt(0) === 35 ? hex.slice(1) : hex;
      return [
        parseInt(s.slice(0, 2), 16),
        parseInt(s.slice(2, 4), 16),
        parseInt(s.slice(4, 6), 16),
        255,
      ];
    }

    function decodeSpriteBankEntry(entry) {
      const w = entry.w;
      const h = entry.h;
      const pal = entry.palette.map(hexToRgb);
      const normalFrames = [];
      const flashFrames = [];
      const frozenFrames = [];

      for (let fi = 0; fi < entry.frames.length; fi++) {
        const rows = entry.frames[fi];

        const cNorm = document.createElement('canvas');
        cNorm.width = w;
        cNorm.height = h;
        const ctxNorm = cNorm.getContext('2d');
        const imgNorm = ctxNorm.createImageData(w, h);

        const cFlash = document.createElement('canvas');
        cFlash.width = w;
        cFlash.height = h;
        const ctxFlash = cFlash.getContext('2d');
        const imgFlash = ctxFlash.createImageData(w, h);

        const cFrost = document.createElement('canvas');
        cFrost.width = w;
        cFrost.height = h;
        const ctxFrost = cFrost.getContext('2d');
        const imgFrost = ctxFrost.createImageData(w, h);

        const dN = imgNorm.data;
        const dW = imgFlash.data;
        const dF = imgFrost.data;

        for (let y = 0; y < h; y++) {
          const row = rows[y];
          let x = 0;
          for (let i = 0; i < row.length; i++) {
            const idx = CHAR_MAP.get(row[i]);
            let count = 1;
            if (row[i + 1] === '*') {
              let j = i + 2;
              while (j < row.length && row.charCodeAt(j) >= 48 && row.charCodeAt(j) <= 57) j++;
              count = parseInt(row.slice(i + 2, j), 10);
              i = j - 1;
            }
            const rgba = pal[idx] || [0, 0, 0, 0];
            if (rgba[3] === 0) {
              x += count;
              continue;
            }
            // Glacial desaturated ice-blue transform for Time-Stop frozen enemy
            const lum = (0.299 * rgba[0] + 0.587 * rgba[1] + 0.114 * rgba[2]) / 255;
            const fr = Math.round(36 + lum * 135);
            const fg = Math.round(78 + lum * 155);
            const fb = Math.round(135 + lum * 120);

            for (let k = 0; k < count && x < w; k++, x++) {
              const p = (y * w + x) * 4;
              dN[p] = rgba[0];
              dN[p + 1] = rgba[1];
              dN[p + 2] = rgba[2];
              dN[p + 3] = 255;

              dW[p] = 240;
              dW[p + 1] = 252;
              dW[p + 2] = 255;
              dW[p + 3] = 255;

              dF[p] = fr;
              dF[p + 1] = fg;
              dF[p + 2] = fb;
              dF[p + 3] = 255;
            }
          }
        }

        ctxNorm.putImageData(imgNorm, 0, 0);
        ctxFlash.putImageData(imgFlash, 0, 0);
        ctxFrost.putImageData(imgFrost, 0, 0);

        normalFrames.push(cNorm);
        flashFrames.push(cFlash);
        frozenFrames.push(cFrost);
      }

      return {
        id: entry.id,
        w,
        h,
        facing: entry.facing,
        anchors: entry.anchors,
        frameCount: entry.frames.length,
        normal: normalFrames,
        flash: flashFrames,
        frozen: frozenFrames,
      };
    }

    const SPRITES = {};
    function initSprites() {
      const bank = window.PIXEL_SPRITE_BANK || {};
      for (const id of ['sylvia_silver', 'rowan', 'beatrice']) {
        if (bank[id]) SPRITES[id] = decodeSpriteBankEntry(bank[id]);
      }
    }

    function pickFrame(sprite, poseName) {
      const idx = FRAME_INDEX[poseName] !== undefined ? FRAME_INDEX[poseName] : 0;
      return Math.min(idx, sprite.frameCount - 1);

    /* ================================================================

    ================================================================ */
    const AudioFX = {

        gain.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.012);

        osc.start(t0);
        osc.stop(t0 + dur + 0.02);

    /* ================================================================
       5. AMBIENT PARTICLES & VISUAL HELPERS
    ================================================================ */
    function seedAmbientMotes(arena) {
      state.ambientMotes = [];
      for (let i = 0; i < 44; i++) {
        state.ambientMotes.push({
          x: Math.random() * W,
          y: Math.random() * (H - 40),
          r: 1.5 + Math.random() * 2.6,
          vx: arena === 'graveyard' ? (-10 - Math.random() * 14) : (Math.random() - 0.5) * 14,
          vy: arena === 'graveyard' ? (12 + Math.random() * 18) : (-16 - Math.random() * 22),
          alpha: 0.35 + Math.random() * 0.55,
          kind: arena === 'graveyard'
            ? (i % 3 === 0 ? 'snow' : 'moon')
            : (i % 2 === 0 ? 'ember' : 'mana'),
          phase: Math.random() * Math.PI * 2,
        });
      }
    }

    function addTrauma(amount) {
      const mult = state.reduceMotion ? 0.25 : 1;
      state.trauma = Math.min(1, state.trauma + amount * mult);
    }

    function triggerHitStop(sec) {
      state.hitStopTimer = Math.max(state.hitStopTimer, sec);
    }

    function triggerFlash(color, alpha) {
      if (state.reduceMotion) return;
      state.screenFlashColor = color || '#e0f2fe';
      state.screenFlash = Math.max(state.screenFlash, alpha || 0.45);
    }

    function showBanner(text, sub, dur) {
      state.bannerText = text;
      state.bannerSub = sub || '';
      state.bannerTimer = dur || 1.35;
    }

    function addPopup(x, y, text, color, big) {
      state.popups.push({
        x,
        y,
        vy: big ? -58 : -44,
        text,
        color: color || '#ffffff',
        big: !!big,
        life: big ? 1.55 : 1.1,
        maxLife: big ? 1.55 : 1.1,
      });
    }

    function spawnParticles(x, y, count, opts) {
      const o = opts || {};
      for (let i = 0; i < count; i++) {
        const ang = (o.angleBase || 0) + (Math.random() - 0.5) * (o.spread || Math.PI * 2);
        const spd = (o.speedMin || 60) + Math.random() * ((o.speedMax || 220) - (o.speedMin || 60));
        state.particles.push({
          x: x + (Math.random() - 0.5) * (o.jitter || 16),
          y: y + (Math.random() - 0.5) * (o.jitter || 16),
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd + (o.vyBias || 0),
          gravity: o.gravity !== undefined ? o.gravity : 260,
          size: (o.sizeMin || 3) + Math.random() * ((o.sizeMax || 7) - (o.sizeMin || 3)),
          color: Array.isArray(o.colors) ? o.colors[i % o.colors.length] : (o.color || '#7dd3fc'),
          shape: o.shape || 'diamond',
          life: (o.lifeMin || 0.35) + Math.random() * ((o.lifeMax || 0.78) - (o.lifeMin || 0.35)),
          maxLife: 0.75,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 9,
        });
        state.particles[state.particles.length - 1].maxLife = state.particles[state.particles.length - 1].life;
      }
    }

    function spawnGlassShatter(cx, cy) {
      state.glassShards = [];
      for (let i = 0; i < 42; i++) {
        const ang = (Math.PI * 2 * i) / 42 + (Math.random() - 0.5) * 0.25;
        const spd = 160 + Math.random() * 440;
        const sz = 7 + Math.random() * 16;
        state.glassShards.push({
          x: cx + (Math.random() - 0.5) * 32,
          y: cy + (Math.random() - 0.5) * 32,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd - 60,
          gravity: 340,
          rot: Math.random() * Math.PI * 2,
          vrot: (Math.random() - 0.5) * 14,
          size: sz,
          alpha: 0.95,
          life: 0.75 + Math.random() * 0.45,
          maxLife: 1.1,
          tint: i % 3 === 0 ? '#e0f2fe' : (i % 3 === 1 ? '#7dd3fc' : '#bae6fd'),
        });
      }
    }

    function pushLog(msg, tone) {
      const box = $('battle-log');
      const div = document.createElement('div');
      const toneClass = tone === 'palace'
        ? 'text-sky-400 font-semibold'
        : tone === 'warn'
        ? 'text-amber-400 font-semibold'
        : tone === 'good'
        ? 'text-emerald-400 font-semibold'
        : tone === 'bad'
        ? 'text-rose-400'
        : 'text-[var(--muted-foreground)]';
      div.className = toneClass;
      div.textContent = '• ' + msg;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function loadScenario(id) {
      const sc = SCENARIOS[id] || SCENARIOS.rowan;
      state.scenarioId = sc.id;
      state.turn = 1;
      state.phase = 'player';
      state.trauma = 0;
      state.hitStopTimer = 0;
      state.screenFlash = 0;
      state.bannerTimer = 0;
      state.particles = [];
      state.glassShards = [];
      state.projectiles = [];
      state.popups = [];
      state.afterimages = [];
      state.counterFx = null;

      state.ts.active = false;
      state.ts.expand = 0;
      state.ts.hoveredIdx = -1;
      state.ts.checkedDecoys.clear();

      state.sylvia.hp = state.sylvia.maxHp;
      state.sylvia.mp = state.sylvia.maxMp;
      state.sylvia.shield = 0;
      state.sylvia.insight = 65; // Start at 65% so 1 skill hits 100%!
      state.sylvia.pose = 'idle1';
      state.sylvia.x = state.sylvia.baseX;
      state.sylvia.y = state.sylvia.baseY;
      state.sylvia.scaleX = 1;
      state.sylvia.scaleY = 1;
      state.sylvia.flashTimer = 0;

      state.enemy.hp = sc.maxHp;
      state.enemy.maxHp = sc.maxHp;
      state.enemy.fireStacks = sc.fireStacks;
      state.enemy.charging = false;
      state.enemy.sealedTurns = 0;
      state.enemy.pose = 'idle1';
      state.enemy.x = state.enemy.baseX;
      state.enemy.y = state.enemy.baseY;

        state.enemy.charging &&

      $('skill-shield').disabled = !playerCanAct || s.mp < 14;

      // Ice Palace hero button
      const pBtn = $('btn-ice-palace');
      const ready = canTriggerTimeStop();
      if (state.phase === 'timestop') {
        pBtn.disabled = false;
        pBtn.className = 'skill-btn palace-active w-full rounded-xl px-4 py-2.5 border text-xs font-bold flex items-center justify-between gap-2 cursor-pointer';
        $('palace-btn-label').textContent = '冰晶宫殿已展开 · 请直接点击画布上的敌方破绽（点此可取消）';
        $('palace-btn-sub').textContent = 'ESC 退出';
      } else if (ready) {
        pBtn.disabled = false;
        pBtn.className = 'skill-btn palace-ready w-full rounded-xl px-4 py-2.5 border text-xs font-bold flex items-center justify-between gap-2 cursor-pointer';
        $('palace-btn-label').textContent = '展开冰晶宫殿 · 时停看破 (F)';
        $('palace-btn-sub').textContent = '✦ 洞察满槽 · 立即冻结时间！';
      } else {
        pBtn.disabled = true;
        pBtn.className = 'skill-btn w-full rounded-xl px-4 py-2.5 border text-xs font-bold flex items-center justify-between gap-2 cursor-not-allowed opacity-55 bg-[var(--content)] border-[var(--border)] text-[var(--foreground)]';
        $('palace-btn-label').textContent = '展开冰晶宫殿 · 时停看破 (F)';
        $('palace-btn-sub').textContent = ins < 100
          ? '洞察 ' + ins + '% / 100%'
          : (!e.charging ? '待敌方进入蓄力杀招' : '演出进行中');
      }

      // Phase badge
      const phaseLabels = {
        player: '我方行动',
        animating: '施法演出',
        timestop: '❄️ 时停推演',
        counter_anim: '✦ 破绽反杀',
        enemy: '敌方行动',
        victory: '战斗胜利',
        defeat: '暂且撤退',
      };
      $('phase-pill').textContent = phaseLabels[state.phase] || state.phase;
    }

    /* ================================================================
       7. COMBAT ACTIONS & TURN SEQUENCING
    ================================================================ */
    function delay(ms) {
      return new Promise((res) => setTimeout(res, ms));
    }

    function pushAfterimage(actor, tint) {
      const sp = SPRITES[actor === state.sylvia ? 'sylvia_silver' : SCENARIOS[state.scenarioId].spriteId];
      if (!sp) return;
      state.afterimages.push({
        x: actor.x,
        y: actor.y,
        scale: actor.scale,
        frame: pickFrame(sp, actor.pose),
        sprite: sp,
        alpha: 0.45,
        tint: tint || '#7dd3fc',
      });
    }

    async function castSkill(kind) {
      if (state.phase !== 'player') return;
      const sc = SCENARIOS[state.scenarioId];
      const s = state.sylvia;
      const e = state.enemy;

      state.phase = 'animating';
      syncUI();

      // 5-frame pixel cast choreography: idle1 -> windup -> cast_step -> follow-through -> idle1
      s.pose = 'windup';
      s.scaleX = 0.92;
      s.scaleY = 1.08;
      if (kind === 'ice') {
        s.mp = Math.max(0, s.mp - 18);
        AudioFX.castIce();
        spawnParticles(s.x + 56, s.y - 120, 12, { colors: ['#e0f2fe', '#7dd3fc', '#38bdf8'], speedMin: 35, speedMax: 110, gravity: 0, lifeMin: 0.25, lifeMax: 0.45 });
      } else if (kind === 'water') {
        s.mp = Math.max(0, s.mp - 20);
        AudioFX.castWater();
        spawnParticles(s.x + 56, s.y - 120, 14, { colors: ['#bae6fd', '#22d3ee', '#0284c7'], speedMin: 40, speedMax: 120, gravity: 40, lifeMin: 0.25, lifeMax: 0.5 });
      } else {
        s.mp = Math.max(0, s.mp - 14);
        AudioFX.shield();
      }
      await delay(140);

      // Lunge forward into cast_step
      pushAfterimage(s, '#7dd3fc');
      s.pose = 'cast_step';
      s.x = s.baseX + 34;
      s.scaleX = 1.1;
      s.scaleY = 0.93;

      if (kind === 'shield') {
        s.shield = Math.min(120, s.shield + 50);
        s.mp = Math.min(s.maxMp, s.mp + 24);
        s.insight = Math.min(100, s.insight + 35);
        spawnParticles(s.x + 52, s.y - 110, 22, { colors: ['#e0f2fe', '#7dd3fc', '#38bdf8'], speedMin: 60, speedMax: 180, gravity: -20, shape: 'diamond' });
        addPopup(s.x + 12, s.y - 185, '+50 寒镜护壁', '#7dd3fc', false);
        addPopup(s.x + 12, s.y - 155, '+35% 洞察', '#38bdf8', false);
        pushLog('希尔维亚凝结【寒镜护壁】，护盾 +50、洞察 +35%！', 'palace');
        await delay(300);
      } else {
        // Launch pixel projectiles across canvas
        const count = kind === 'ice' ? 3 : 2;
        for (let i = 0; i < count; i++) {
          state.projectiles.push({
            kind,
            x: s.x + 76 - i * 18,
            y: s.y - 124 + (i - 1) * 16,
            tx: e.x - 12,
            ty: e.y - 120 + (i - 1) * 14,
            t: 0,
            dur: 0.24 + i * 0.05,
          });
        }
        await delay(270);

        // Compute damage
        let baseDmg = kind === 'ice' ? 48 : 44;
        let bonusTag = '';
        if (kind === 'water' && sc.id === 'beatrice') {
          baseDmg = Math.round(baseDmg * 1.5);
          bonusTag = ' 水克火1.5×';
        }
        const auraMult = sc.id === 'beatrice' ? (1 - e.fireStacks * 0.1) : 1;
        const dmg = Math.max(18, Math.round(baseDmg * auraMult + (Math.random() * 6 - 2)));

        e.hp = Math.max(0, e.hp - dmg);
        e.pose = 'hurt';
        e.x = e.baseX + 18;
        e.scaleX = 0.88;
        e.scaleY = 1.12;
        e.flashTimer = 0.14;

        AudioFX.hit(false);
        triggerHitStop(0.05);
        addTrauma(0.38);
        spawnParticles(e.x - 10, e.y - 120, 20, {
          colors: kind === 'ice' ? ['#f0f9ff', '#7dd3fc', '#38bdf8'] : ['#cffafe', '#22d3ee', '#0ea5e9'],
          speedMin: 80,
          speedMax: 250,
          gravity: 220,
        });
        addPopup(e.x, e.y - 195, '-' + dmg + bonusTag, kind === 'ice' ? '#7dd3fc' : '#22d3ee', false);

        // Extra canon effects
        let insightGain = 35;
        if (kind === 'water' && sc.id === 'beatrice' && e.fireStacks > 0) {
          e.fireStacks = Math.max(0, e.fireStacks - 1);
          addPopup(e.x, e.y - 225, '浇熄 1 层烈焰斗气', '#fb923c', false);
          pushLog('希尔维亚施放【覆潮水弹】，造成 ' + dmg + ' 伤害（水克火），浇熄 1 层烈焰斗气！', 'good');
        } else if (kind === 'water' && sc.id === 'rowan') {
          insightGain = 40;
          pushLog('希尔维亚施放【覆潮水弹】，水雾冲散暗月折光，造成 ' + dmg + ' 伤害，洞察 +40%！', 'good');
        } else {
          pushLog('希尔维亚施放【冰晶投枪】三连命中，造成 ' + dmg + ' 伤害，洞察 +35%！', 'good');
        }

        s.insight = Math.min(100, s.insight + insightGain);
        addPopup(s.x + 10, s.y - 180, '+' + insightGain + '% 洞察', '#38bdf8', false);
        await delay(230);
      }

      // Smooth return to idle
      s.pose = 'windup';
      s.x = s.baseX + 10;
      await delay(90);
      s.pose = 'idle1';
      s.x = s.baseX;
      e.pose = 'idle1';
      e.x = e.baseX;

      if (e.hp <= 0) {
        finishBattle(true);
        return;
      }

      await runEnemyTurn();
    }

    async function runEnemyTurn() {
      const sc = SCENARIOS[state.scenarioId];
      const s = state.sylvia;
      const e = state.enemy;

      state.phase = 'enemy';
      syncUI();
      await delay(260);

      // Sealed / stunned skip
      if (e.sealedTurns > 0) {
        e.sealedTurns -= 1;
        addPopup(e.x, e.y - 190, sc.id === 'rowan' ? '🔒 晦轮封印 · 无法行动' : '❄️ 失衡晕眩 · 跳过行动', '#7dd3fc', false);
        pushLog(sc.enemyName + '仍受破绽反杀压制，本回合无法出手！', 'palace');
        await delay(520);
        // Recharge Beatrice slightly on recovery later, advance turn
        state.turn += 1;
        state.phase = 'player';
        syncUI();
        return;
      }

      // If NOT charging yet -> Enter high-threat Telegraphed Charge!
      // (Guarantees that right after Turn 1 cast hits 100% Insight, enemy locks into high-threat charge for Time-Stop!)
      if (!e.charging) {
        e.charging = true;
        if (sc.id === 'beatrice' && e.fireStacks < 3) {
          e.fireStacks = 3;
        }
        e.pose = 'windup';
        e.scaleX = 1.09;
        e.scaleY = 0.92;
        AudioFX.enemyCharge();
        addTrauma(0.22);
        spawnParticles(e.x - 16, e.y - 135, 20, {
          colors: sc.id === 'rowan' ? ['#c084fc', '#e2e8f0', '#7e22ce'] : ['#fb923c', '#facc15', '#ef4444'],
          speedMin: 40,
          speedMax: 160,
          gravity: -40,
        });
        showBanner('⚠️ 敌方蓄力杀招！', sc.chargeMoveName + ' — 展开冰晶宫殿直点破绽！', 1.5);
        pushLog(sc.chargeTelegraph, 'warn');
        await delay(520);

        state.turn += 1;
        state.phase = 'player';
        syncUI();
        return;
      }

      // Enemy was ALREADY charging and player chose NOT to Time-Stop -> Unleash heavy attack!
      pushAfterimage(e, sc.id === 'rowan' ? '#a855f7' : '#f97316');
      e.pose = 'strike';
      e.x = e.baseX - 64;
      e.scaleX = 1.12;
      e.scaleY = 0.9;
      await delay(180);

      let rawDmg = sc.chargeDmg;
      if (sc.id === 'beatrice') rawDmg = Math.round(rawDmg * (0.76 + e.fireStacks * 0.08));
      let absorbed = Math.min(s.shield, rawDmg);
      s.shield -= absorbed;
      const finalDmg = Math.max(0, rawDmg - absorbed);
      s.hp = Math.max(0, s.hp - finalDmg);
      s.pose = 'hurt';
      s.x = s.baseX - 18;
      s.scaleX = 0.88;
      s.scaleY = 1.12;
      s.flashTimer = 0.16;

      AudioFX.hit(true);
      triggerHitStop(0.08);
      addTrauma(0.65);
      triggerFlash(sc.id === 'rowan' ? '#c084fc' : '#fb923c', 0.32);
      spawnParticles(s.x + 12, s.y - 115, 26, {
        colors: sc.id === 'rowan' ? ['#a855f7', '#e9d5ff', '#3b0764'] : ['#f97316', '#facc15', '#ef4444'],
        speedMin: 90,
        speedMax: 280,
      });

      if (absorbed > 0) {
        addPopup(s.x, s.y - 210, '护壁抵挡 ' + absorbed, '#7dd3fc', false);
      }
      addPopup(s.x, s.y - 178, '-' + finalDmg, '#fb7185', true);
      pushLog(sc.enemyName + '悍然释放【' + sc.chargeMoveName + '】，造成 ' + finalDmg + ' 伤害！', 'bad');

      e.charging = false;
      await delay(360);

      e.x = e.baseX;
      e.pose = 'idle1';
      s.x = s.baseX;
      s.pose = 'idle1';

      if (s.hp <= 0) {
        finishBattle(false);
        return;
      }

      // Passive MP recovery each turn
      s.mp = Math.min(s.maxMp, s.mp + 14);
      state.turn += 1;
      state.phase = 'player';
      syncUI();
    }

    function finishBattle(won) {
      const sc = SCENARIOS[state.scenarioId];
      state.phase = won ? 'victory' : 'defeat';
      syncUI();
      if (won) {
        AudioFX.victory();
        $('result-icon').textContent = '❄️';
        $('result-title').textContent = '冰晶宫殿 · 破绽完胜！';
        $('result-desc').textContent = sc.victoryDesc;
      } else {
        $('result-icon').textContent = '🌙';
        $('result-title').textContent = '暂且后撤重整';
        $('result-desc').textContent = '敌方蓄力杀招威力惊人，把握 100% 洞察时机展开冰晶宫殿，直点破绽即可一举逆转！';
      }
      $('result-overlay').classList.remove('hidden');
    }

    /* ================================================================
       8. SIGNATURE MECHANIC: ICE PALACE TIME-STOP & WEAKPOINT COUNTER
    ================================================================ */
    function enterTimeStop() {
      if (!canTriggerTimeStop()) return;
      state.phase = 'timestop';
      state.ts.active = true;
      state.ts.expand = 0.01;
      state.ts.hoveredIdx = -1;
      state.ts.checkedDecoys.clear();
      state.sylvia.pose = 'windup';
      state.enemy.pose = 'windup';

      AudioFX.timeStopEnter();
      triggerFlash('#bae6fd', 0.36);
      pushLog('❄️ 展开【冰晶宫殿】！漫天飞雪与敌方攻势尽数凝滞——请直接在画布上点击敌方破绽！', 'palace');
      syncUI();
    }

    function exitTimeStop(silent) {
      if (state.phase !== 'timestop') return;
      state.ts.active = false;
      state.ts.expand = 0;
      state.ts.hoveredIdx = -1;
      state.sylvia.pose = 'idle1';
      state.phase = 'player';
      if (!silent) pushLog('收起冰晶宫殿，时间恢复流动。', 'normal');
      syncUI();
    }

    function getReticleScreenPositions() {
      const sc = SCENARIOS[state.scenarioId];
      const sp = SPRITES[sc.spriteId];
      if (!sp) return [];
      const r = state.enemy.lastDrawRect;
      return sc.weakpoints.map((wp) => ({
        wp,
        x: r.x + wp.sx * r.scale,
        y: r.y + wp.sy * r.scale,
      }));
    }

    async function handleWeakpointSelect(index) {
      if (state.phase !== 'timestop') return;
      const sc = SCENARIOS[state.scenarioId];
      const wp = sc.weakpoints[index];
      if (!wp) return;

      const pts = getReticleScreenPositions();
      const pt = pts[index] || { x: state.enemy.x, y: state.enemy.y - 120 };

      if (!wp.isTrue) {
        // Decoy clicked — crisp encouraging feedback, Insight returns to 40%
        AudioFX.decoyFail();
        state.ts.checkedDecoys.add(wp.id);
        state.sylvia.insight = 40;
        addTrauma(0.2);
        addPopup(pt.x, pt.y - 24, '非真正破绽 · 重心未破', '#fbbf24', false);
        addPopup(state.sylvia.x + 12, state.sylvia.y - 180, '洞察退回 40%', '#7dd3fc', false);
        showBanner('非真正破绽，重心未破', '洞察仅退回 40%，继续蓄势或点「⚡ 满洞察演示」再试！', 1.65);
        pushLog(wp.failFeedback || '非真正破绽，重心未破，洞察仅退回 40%！', 'warn');

        // Smoothly thaw time-stop so player can retry without frustration
        state.ts.active = false;
        state.ts.expand = 0;
        state.ts.hoveredIdx = -1;
        state.sylvia.pose = 'idle1';
        state.phase = 'player';
        syncUI();
        return;
      }

      // TRUE WEAKPOINT HIT -> SHATTER TIME-STOP & CINEMATIC PIXEL COUNTER!
      state.phase = 'counter_anim';
      state.ts.active = false;
      state.ts.expand = 0;
      state.ts.hoveredIdx = -1;
      state.sylvia.insight = 0;
      syncUI();

      AudioFX.counterShatter();
      spawnGlassShatter(pt.x, pt.y);
      triggerFlash('#e0f2fe', 0.52);
      showBanner('✦ 破绽看破 · 【' + sc.counterName + '】 ✦', '冰晶宫殿瞬时崩解反杀！', 1.75);

      // Sylvia heroic counter lunge
      pushAfterimage(state.sylvia, '#38bdf8');
      state.sylvia.pose = 'cast_step';
      state.sylvia.x = state.sylvia.baseX + 44;
      state.sylvia.scaleX = 1.14;
      state.sylvia.scaleY = 0.9;

      if (sc.id === 'rowan') {
        await playRowanMirrorClampCounter(sc);
      } else {
        await playBeatriceIcePillarCounter(sc);
      }

      // Apply massive counter damage & control
      const e = state.enemy;
      const dmg = sc.counterDmg + Math.floor(Math.random() * 12);
      e.hp = Math.max(0, e.hp - dmg);
      e.charging = false;
      e.sealedTurns = 1;
      if (sc.id === 'beatrice') e.fireStacks = 0;

      e.pose = 'hurt';
      e.x = e.baseX + 34;
      e.scaleX = 0.84;
      e.scaleY = 1.18;
      e.flashTimer = 0.22;

      addPopup(e.x - 10, e.y - 210, '-' + dmg + ' 破绽反杀！', '#fef08a', true);
      addPopup(e.x - 10, e.y - 245, sc.counterEffectLabel, '#7dd3fc', false);
      pushLog(sc.counterLog + '（伤害 ' + dmg + '）', 'palace');

      await delay(560);
      state.counterFx = null;
      state.sylvia.pose = 'idle1';
      state.sylvia.x = state.sylvia.baseX;
      e.pose = 'idle1';
      e.x = e.baseX;

      if (e.hp <= 0) {
        finishBattle(true);
        return;
      }

      // Enemy is sealed/stunned -> show sealed turn skip cleanly
      await runEnemyTurn();
    }

    async function playRowanMirrorClampCounter(sc) {
      // Phase A: Eclipse Staff streaks out from Rowan toward mid-field
      state.counterFx = {
        kind: 'rowan_mirrors',
        t: 0,
        staffX: state.enemy.x - 45,
        staffY: state.enemy.y - 140,
        clampGap: 118,
        clamped: false,
      };
      const startTime = performance.now();
      while (true) {
        const dt = (performance.now() - startTime) / 1000;
        state.counterFx.t = dt;
        const p = Math.min(1, dt / 0.28);
        // Staff shoots toward center-right
        state.counterFx.staffX = (state.enemy.x - 45) + (496 - (state.enemy.x - 45)) * p;
        state.counterFx.staffY = (state.enemy.y - 140) + (236 - (state.enemy.y - 140)) * p;
        // Two giant diamond ice mirrors converge sharply!
        const cp = Math.min(1, Math.max(0, (dt - 0.1) / 0.18));
        state.counterFx.clampGap = 128 * (1 - cp * cp * cp);
        if (dt >= 0.29) break;
        await delay(16);
      }

      // PEAK IMPACT: Mirrors slam shut around the Eclipse Staff -> 110ms HIT-STOP!
      state.counterFx.clamped = true;
      state.counterFx.clampGap = 0;
      triggerHitStop(0.11);
      addTrauma(0.95);
      triggerFlash('#e0f2fe', 0.48);
      AudioFX.hit(true);
      spawnParticles(496, 236, 44, {
        colors: ['#ffffff', '#bae6fd', '#38bdf8', '#c084fc'],
        speedMin: 110,
        speedMax: 380,
        gravity: 160,
        sizeMin: 4,
        sizeMax: 10,
      });
      await delay(160);
    }

    async function playBeatriceIcePillarCounter(sc) {
      // Phase A: Frost rune flares beneath raised right shoulder, giant jagged pixel ice pillar ERUPTS!
      const px = state.enemy.x - 46;
      const py = state.enemy.y + 2;
      state.counterFx = {
        kind: 'beatrice_pillar',
        t: 0,
        x: px,
        groundY: py,
        height: 0,
        maxHeight: 235,
        erupted: false,
      };
      const startTime = performance.now();
      while (true) {
        const dt = (performance.now() - startTime) / 1000;
        state.counterFx.t = dt;
        if (dt > 0.08) {
          const p = Math.min(1, (dt - 0.08) / 0.18);
          // Overshoot ease-out eruption
          state.counterFx.height = state.counterFx.maxHeight * (1 - Math.pow(1 - p, 3));
        }
        if (dt >= 0.27) break;
        await delay(16);
      }

      // PEAK IMPACT: Giant ice pillar hits raised shoulder, tosses all 3 flame stacks skyward -> 110ms HIT-STOP!
      state.counterFx.erupted = true;
      state.counterFx.height = state.counterFx.maxHeight;
      triggerHitStop(0.11);
      addTrauma(0.98);
      triggerFlash('#f0f9ff', 0.48);
      AudioFX.hit(true);
      // Flame embers hurled skyward!
      spawnParticles(px + 28, py - 150, 34, {
        colors: ['#fb923c', '#facc15', '#ef4444', '#fed7aa'],
        angleBase: -Math.PI / 2,
        spread: 1.2,
        speedMin: 160,
        speedMax: 380,
        gravity: 280,
        sizeMin: 4,
        sizeMax: 9,
      });
      // Frost crystal shards bursting out
      spawnParticles(px + 10, py - 110, 32, {
        colors: ['#ffffff', '#e0f2fe', '#7dd3fc', '#38bdf8'],
        speedMin: 90,
        speedMax: 300,
        gravity: 200,
        sizeMin: 4,
        sizeMax: 9,
      });
      await delay(160);
    }

    /* ================================================================
       9. CANVAS RENDERER (WORLDS, SPRITES, TIME-STOP, RETICLES, FX)
    ================================================================ */
    function drawGraveyardArena(wt) {
      // Deep autumn night sky
      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, '#090d1f');
      sky.addColorStop(0.55, '#151e3d');
      sky.addColorStop(1, '#1d1c36');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Autumn Moon with faint cold halo
      const mx = 748;
      const my = 92;
      const halo = ctx.createRadialGradient(mx, my, 18, mx, my, 128);
      halo.addColorStop(0, 'rgba(226, 232, 255, 0.34)');
      halo.addColorStop(0.45, 'rgba(147, 197, 253, 0.12)');
      halo.addColorStop(1, 'rgba(15, 23, 42, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(mx, my, 128, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#e8eefc';
      ctx.beginPath();
      ctx.arc(mx, my, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.beginPath();
      ctx.arc(mx - 10, my - 6, 9, 0, Math.PI * 2);
      ctx.arc(mx + 12, my + 8, 6, 0, Math.PI * 2);
      ctx.fill();

      // Drifting mist clouds (frozen during Time-Stop because driven by wt!)
      ctx.fillStyle = 'rgba(148, 163, 198, 0.08)';
      for (let i = 0; i < 4; i++) {

    function drawClockGearRunesBehindSylvia(cx, cy, expand) {
      if (expand <= 0.02) return;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.globalAlpha = Math.min(0.88, expand * 0.9);

      // Soft frost aura glow
      const g = ctx.createRadialGradient(0, 0, 12, 0, 0, 148 * expand);
      g.addColorStop(0, 'rgba(125, 211, 252, 0.28)');
      g.addColorStop(0.6, 'rgba(56, 189, 248, 0.12)');
      g.addColorStop(1, 'rgba(56, 189, 248, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 148 * expand, 0, Math.PI * 2);
      ctx.fill();

      // Outer clock gear ring (rotates clockwise)
      ctx.save();
      ctx.rotate(state.ts.gearAngle * 0.45);
      const R1 = 104 * expand;
      ctx.strokeStyle = 'rgba(186, 230, 253, 0.62)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, R1, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(125, 211, 252, 0.48)';
      ctx.beginPath();
      ctx.arc(0, 0, R1 - 12, 0, Math.PI * 2);
      ctx.stroke();

      // 12 Clock gear teeth + Roman-style ticks
      for (let i = 0; i < 12; i++) {
        const a = (Math.PI * 2 * i) / 12;
        ctx.save();
        ctx.rotate(a);
        ctx.fillStyle = 'rgba(186, 230, 253, 0.65)';
        ctx.fillRect(R1 - 2, -4, 9, 8);
        ctx.fillStyle = 'rgba(224, 242, 254, 0.8)';
        ctx.fillRect(R1 - 16, -1.5, 6, 3);
        ctx.restore();
      }
      ctx.restore();

      // Inner snowflake hexagram gear (counter-rotates)
      ctx.save();
      ctx.rotate(-state.ts.gearAngle * 0.75);
      const R2 = 66 * expand;
      ctx.strokeStyle = 'rgba(125, 211, 252, 0.72)';
      ctx.lineWidth = 1.8;
      for (let k = 0; k < 2; k++) {
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const a = (Math.PI * 2 * i) / 3 + (k * Math.PI) / 3;
          const px = Math.cos(a) * R2;
          const py = Math.sin(a) * R2;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
      // Subtle crystalline clock hands frozen at 11:58
      ctx.strokeStyle = 'rgba(224, 242, 254, 0.85)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -R2 * 0.72);
      ctx.moveTo(0, 0);
      ctx.lineTo(-R2 * 0.32, -R2 * 0.42);
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    function drawFighter(actor, spriteId, opts) {
      const sp = SPRITES[spriteId];
      if (!sp) return;
      const o = opts || {};

      // Automatic subtle idle breathing when in idle1
      let pose = actor.pose;
      if (pose === 'idle1' && !o.frozen) {
        pose = Math.floor(state.worldTime * 2.4) % 2 === 0 ? 'idle1' : 'idle2';
      }
      const frameIdx = pickFrame(sp, pose);
      const buf = actor.flashTimer > 0
        ? sp.flash[frameIdx]
        : (o.frozen ? sp.frozen[frameIdx] : sp.normal[frameIdx]);

      // Procedural windup posture polish for 6-frame enemy sprites
      let extraX = 0;
      let extraY = 0;
      let extraRot = 0;
      if (o.isEnemy && actor.charging && actor.hp > 0) {
        extraX = -8;
        if (o.scenarioId === 'beatrice') {
          extraY = -3; // Subtle raised shoulder anticipation!
          extraRot = -0.025;
        } else {
          extraRot = -0.02;
        }
      }

      const drawW = sp.w * actor.scale * actor.scaleX;
      const drawH = sp.h * actor.scale * actor.scaleY;
      const footOffsetX = (sp.anchors.feet[0] / sp.w) * drawW;
      const footOffsetY = (sp.anchors.feet[1] / sp.h) * drawH;
      const dx = Math.round(actor.x + extraX - footOffsetX);
      const dy = Math.round(actor.y + extraY - footOffsetY);

      if (o.isEnemy) {
        actor.lastDrawRect = {
          x: dx,
          y: dy,
          w: drawW,
          h: drawH,
          scale: actor.scale * actor.scaleX,
        };
      }

      // Ground shadow
      ctx.save();
      ctx.fillStyle = o.frozen ? 'rgba(14, 58, 108, 0.45)' : 'rgba(5, 8, 22, 0.5)';
      ctx.beginPath();
      ctx.ellipse(actor.x + extraX, actor.y + 4, 54, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.imageSmoothingEnabled = false;
      if (extraRot !== 0) {
        ctx.translate(actor.x + extraX, actor.y + extraY);
        ctx.rotate(extraRot);
        ctx.drawImage(buf, -footOffsetX, -footOffsetY, drawW, drawH);
      } else {
        ctx.drawImage(buf, dx, dy, drawW, drawH);
      }
      ctx.restore();

      // Sylvia's Ice Shield Hex Barrier
      if (!o.isEnemy && actor.shield > 0) {
        ctx.save();
        const bx = actor.x + 76;
        const by = actor.y - 118;
        const pulse = 0.78 + 0.22 * Math.sin(state.realTime * 4);
        ctx.strokeStyle = `rgba(125, 211, 252, ${0.85 * pulse})`;
        ctx.fillStyle = `rgba(56, 189, 248, ${0.14 * pulse})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI * 2 * i) / 6 - Math.PI / 2;
          const rx = bx + Math.cos(a) * 20;
          const ry = by + Math.sin(a) * 56;
          if (i === 0) ctx.moveTo(rx, ry);
          else ctx.lineTo(rx, ry);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawTimeStopPalaceOverlay() {

      // Delicate geometric ice-crystal palace lattice lines in background

      ctx.lineWidth = 3;
      ctx.strokeRect(8, 8, W - 16, H - 16);

      // 4 Faceted Crystal Corner Spires
      const corners = [
        [0, 0, 1, 1],
        [W, 0, -1, 1],

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(94 * ex, 0);
        ctx.lineTo(54 * ex, 24 * ex);
        ctx.lineTo(24 * ex, 54 * ex);
        ctx.lineTo(0, 94 * ex);
        ctx.closePath();
        ctx.fill();

        ctx.moveTo(0, 0);
        ctx.lineTo(24 * ex, 54 * ex);
        ctx.stroke();
        ctx.restore();

    function drawInspectionReticles() {
      if (!state.ts.active || state.ts.expand < 0.6) return;
      const pts = getReticleScreenPositions();
      const t = state.realTime;

      pts.forEach((item, idx) => {
        const hovered = state.ts.hoveredIdx === idx;
        const checked = state.ts.checkedDecoys.has(item.wp.id);
        const pulse = 1 + 0.12 * Math.sin(t * 5.2 + idx * 1.4);
        const R = (hovered ? 24 : 18) * pulse;

        ctx.save();
        ctx.translate(item.x, item.y);

        // Soft glowing aura halo
        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, R * 1.9);
        if (checked) {
          glow.addColorStop(0, 'rgba(148, 163, 184, 0.32)');
          glow.addColorStop(1, 'rgba(148, 163, 184, 0)');
        } else if (hovered) {
          glow.addColorStop(0, 'rgba(254, 240, 138, 0.65)');
          glow.addColorStop(0.55, 'rgba(56, 189, 248, 0.45)');
          glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
        } else {
          glow.addColorStop(0, 'rgba(186, 230, 253, 0.55)');
          glow.addColorStop(0.6, 'rgba(56, 189, 248, 0.25)');
          glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
        }
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, R * 1.9, 0, Math.PI * 2);
        ctx.fill();

        // Outer rotating segmented reticle ring
        ctx.save();
        ctx.rotate(t * (hovered ? 2.4 : 1.1) * (idx % 2 === 0 ? 1 : -1));
        ctx.strokeStyle = checked ? 'rgba(148, 163, 184, 0.7)' : (hovered ? '#fef08a' : '#7dd3fc');
        ctx.lineWidth = hovered ? 2.5 : 1.8;
        for (let s = 0; s < 4; s++) {
          const a0 = (Math.PI / 2) * s + 0.22;
          const a1 = a0 + 0.95;
          ctx.beginPath();
          ctx.arc(0, 0, R, a0, a1);
          ctx.stroke();
        }
        ctx.restore();

        // Inner crisp diamond core
        ctx.save();
        ctx.rotate(Math.PI / 4);
        const d = hovered ? 9 : 7;
        ctx.fillStyle = checked ? 'rgba(100, 116, 139, 0.85)' : (hovered ? '#fef08a' : '#e0f2fe');
        ctx.strokeStyle = '#0369a1';
        ctx.lineWidth = 1.5;
        ctx.fillRect(-d / 2, -d / 2, d, d);
        ctx.strokeRect(-d / 2, -d / 2, d, d);
        ctx.restore();

        // Crisp pill badge with index number + short label when hovered/idle
        const bx = 22;
        const by = -18;
        ctx.fillStyle = hovered ? 'rgba(12, 74, 110, 0.95)' : 'rgba(7, 26, 54, 0.88)';
        ctx.strokeStyle = hovered ? '#fef08a' : 'rgba(125, 211, 252, 0.8)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(bx, by, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = hovered ? '#fef08a' : '#e0f2fe';
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(idx + 1), bx, by + 0.5);

        ctx.restore();
      });

      // Floating Tactical Whisper Card on Canvas (shown for hovered reticle, or subtle prompt if none hovered)
      const activeIdx = state.ts.hoveredIdx;

        // Frosted crystalline whisper card

        // Top accent highlight bar

        ctx.fillStyle = '#fef08a';

        // Bottom tactical action whisper

      } else {

        const px = 342;

        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#bae6fd';

        ctx.fillText('🔍 悬停标靶可窥见细节微光', px + 14, py + 21);

    }

    function drawCounterFx() {
      const fx = state.counterFx;
      if (!fx) return;

      if (fx.kind === 'rowan_mirrors') {
        const sx = fx.staffX;
        const sy = fx.staffY;

        // Spinning Pixel Eclipse Staff mid-air!
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(fx.clamped ? -0.35 : fx.t * 24);
        // Dark wood staff shaft (chunky pixel blocks)
        ctx.fillStyle = '#1e1b4b';
        ctx.fillRect(-44, -4, 88, 8);
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(-42, -2, 84, 3);
        // Eclipse crescent ring at staff head
        ctx.strokeStyle = '#e9d5ff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(-44, 0, 15, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#581c87';
        ctx.beginPath();
        ctx.arc(-40, 0, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // TWO Glowing Diamond Pixel Ice Mirrors slamming shut!
        const gap = fx.clampGap;
        for (const dir of [-1, 1]) {
          ctx.save();
          ctx.translate(sx + dir * (20 + gap * 0.55), sy + dir * (16 + gap * 0.65));
          ctx.rotate(dir * -0.28);

          // Diamond mirror glow
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 18;
          ctx.fillStyle = 'rgba(186, 230, 253, 0.72)';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, -68);
          ctx.lineTo(36, 0);
          ctx.lineTo(0, 68);
          ctx.lineTo(-36, 0);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Inner faceted crystal specular bars
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.fillRect(-6, -42, 6, 84);
          ctx.fillStyle = 'rgba(14, 165, 233, 0.55)';
          ctx.fillRect(4, -32, 8, 64);
          ctx.restore();
        }

        // Clamping shockwave ring
        if (fx.clamped) {
          ctx.save();
          ctx.strokeStyle = 'rgba(224, 242, 254, 0.9)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(sx, sy, 62 + (fx.t - 0.28) * 180, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      } else if (fx.kind === 'beatrice_pillar') {
        const px = fx.x;
        const gy = fx.groundY;
        const h = fx.height;

        // Glowing frost eruption ground sigil
        ctx.save();
        ctx.translate(px, gy);
        ctx.scale(1, 0.28);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.strokeStyle = '#e0f2fe';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 72, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();

        if (h > 4) {
          // Giant Jagged Multi-Faceted Pixel Ice Pillar erupting under right shoulder!
          ctx.save();
          ctx.translate(px, gy);
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 20;

          // Main central glacier spire
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.moveTo(-36, 0);
          ctx.lineTo(-26, -h * 0.72);
          ctx.lineTo(0, -h);
          ctx.lineTo(28, -h * 0.68);
          ctx.lineTo(38, 0);
          ctx.closePath();
          ctx.fill();

          // Bright cyan crystal facet (left lit plane)
          ctx.fillStyle = '#7dd3fc';
          ctx.beginPath();
          ctx.moveTo(-26, 0);
          ctx.lineTo(-18, -h * 0.74);
          ctx.lineTo(0, -h);
          ctx.lineTo(4, 0);
          ctx.closePath();
          ctx.fill();

          // Pure white specular ridge
          ctx.fillStyle = '#f0f9ff';
          ctx.beginPath();
          ctx.moveTo(-6, 0);
          ctx.lineTo(-4, -h * 0.85);
          ctx.lineTo(0, -h);
          ctx.lineTo(6, -h * 0.76);
          ctx.lineTo(3, 0);
          ctx.closePath();
          ctx.fill();

          // Flanking smaller jagged ice spikes
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.moveTo(-54, 2);
          ctx.lineTo(-40, -h * 0.45);
          ctx.lineTo(-22, 2);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#bae6fd';
          ctx.beginPath();
          ctx.moveTo(22, 2);
          ctx.lineTo(44, -h * 0.42);
          ctx.lineTo(56, 2);
          ctx.closePath();
          ctx.fill();

          ctx.restore();
        }
      }
    }

    function drawProjectiles() {
      for (const p of state.projectiles) {
        const u = Math.min(1, p.t / p.dur);
        const x = p.x + (p.tx - p.x) * u;
        const y = p.y + (p.ty - p.y) * u - Math.sin(u * Math.PI) * (p.kind === 'water' ? 28 : 6);
        ctx.save();
        ctx.translate(x, y);
        if (p.kind === 'ice') {
          ctx.fillStyle = '#e0f2fe';
          ctx.strokeStyle = '#0284c7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(22, 0);
          ctx.lineTo(-8, -8);
          ctx.lineTo(-18, 0);
          ctx.lineTo(-8, 8);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        } else {
          const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 16);
          g.addColorStop(0, '#ecfeff');
          g.addColorStop(0.5, '#22d3ee');
          g.addColorStop(1, 'rgba(2, 132, 199, 0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, 16, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    function drawParticlesAndShards() {
      // Standard combat particles
      for (const p of state.particles) {
        const a = Math.max(0, p.life / p.maxLife);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }

      // Time-Stop Shattering Glass Shards
      for (const sh of state.glassShards) {
        const a = Math.max(0, (sh.life / sh.maxLife) * sh.alpha);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(sh.x, sh.y);
        ctx.rotate(sh.rot);
        ctx.fillStyle = sh.tint;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -sh.size);
        ctx.lineTo(sh.size * 0.62, sh.size * 0.3);
        ctx.lineTo(-sh.size * 0.5, sh.size * 0.7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawPopupsAndBanner() {
      // Floating damage & status numbers
      for (const pop of state.popups) {
        const a = Math.min(1, (pop.life / pop.maxLife) * 1.6);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = pop.big
          ? '900 24px system-ui, -apple-system, sans-serif'
          : 'bold 15px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(9, 13, 31, 0.92)';
        ctx.strokeText(pop.text, pop.x, pop.y);
        ctx.fillStyle = pop.color;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.restore();
      }

      // Cinematic top-center callout banner
      if (state.bannerTimer > 0 && !state.ts.active) {
        const a = Math.min(1, state.bannerTimer * 2.2);
        ctx.save();
        ctx.globalAlpha = a;
        const bw = 470;
        const bh = state.bannerSub ? 50 : 34;
        const bx = (W - bw) / 2;
        const by = 22;
        ctx.fillStyle = 'rgba(9, 17, 38, 0.88)';
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.85)';
        ctx.lineWidth = 1.6;
        roundRect(ctx, bx, by, bw, bh, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fef08a';
        ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(state.bannerText, W / 2, by + (state.bannerSub ? 20 : 22));
        if (state.bannerSub) {
          ctx.fillStyle = '#bae6fd';
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillText(state.bannerSub, W / 2, by + 39);
        }
        ctx.restore();
      }

      // Enemy overhead charge intent badge on Canvas (outside Time-Stop & counter animation)
      const sc = SCENARIOS[state.scenarioId];
      if (!state.ts.active && state.phase !== 'counter_anim' && state.enemy.charging && state.enemy.hp > 0) {
        ctx.save();
        const bx = state.enemy.x - 104;
        const by = 78 + Math.sin(state.realTime * 5) * 3;
        ctx.fillStyle = 'rgba(69, 10, 26, 0.88)';
        ctx.strokeStyle = '#fb7185';
        ctx.lineWidth = 1.5;
        roundRect(ctx, bx, by, 208, 28, 999);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fecdd3';
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚠️ 蓄力：' + sc.chargeMoveName, bx + 104, by + 14.5);
        ctx.restore();
      }
    }

    function roundRect(c, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      c.beginPath();
      c.moveTo(x + rr, y);
      c.arcTo(x + w, y, x + w, y + h, rr);
      c.arcTo(x + w, y + h, x, y + h, rr);
      c.arcTo(x, y + h, x, y, rr);
      c.arcTo(x, y, x + w, y, rr);
      c.closePath();
    }

    function drawWrappedText(c, text, x, y, maxW, lineH) {
      let line = '';
      let cy = y;
      for (let i = 0; i < text.length; i++) {
        const test = line + text[i];
        if (c.measureText(test).width > maxW && line.length > 0) {
          c.fillText(line, x, cy);
          line = text[i];
          cy += lineH;
        } else {
          line = test;
        }
      }
      if (line) c.fillText(line, x, cy);
    }

    /* ================================================================
       10. MAIN LOOP (REAL-TIME JUICE + TIME-STOP SIMULATION FREEZE)
    ================================================================ */
    let lastTs = performance.now();

    function update(realDt) {
      state.realTime += realDt;

      // Real-time shake decay (never freezes during hit-stop!)
      if (state.trauma > 0) {
        state.trauma = Math.max(0, state.trauma - 1.55 * realDt);
        state.shakeTime += realDt * 34;
      }
      if (state.screenFlash > 0) {
        state.screenFlash = Math.max(0, state.screenFlash - 2.4 * realDt);
      }
      if (state.bannerTimer > 0) {
        state.bannerTimer = Math.max(0, state.bannerTimer - realDt);
      }

      // Time-Stop clock-gear runes & radial frost border always animate smoothly!
      if (state.ts.active) {
        state.ts.expand = Math.min(1, state.ts.expand + realDt * 3.2);
        state.ts.gearAngle += realDt * 0.9;
      }

      // Popups always drift softly
      for (let i = state.popups.length - 1; i >= 0; i--) {
        const pop = state.popups[i];
        pop.y += pop.vy * realDt;
        pop.vy *= Math.pow(0.18, realDt);
        pop.life -= realDt;
        if (pop.life <= 0) state.popups.splice(i, 1);
      }

      // Glass shards always fly in real-time
      for (let i = state.glassShards.length - 1; i >= 0; i--) {
        const sh = state.glassShards[i];
        sh.x += sh.vx * realDt;
        sh.y += sh.vy * realDt;
        sh.vy += sh.gravity * realDt;
        sh.rot += sh.vrot * realDt;
        sh.life -= realDt;
        if (sh.life <= 0) state.glassShards.splice(i, 1);
      }

      // Real-time Hit-Stop pauses world simulation while preserving peak impact pose!
      if (state.hitStopTimer > 0) {
        state.hitStopTimer = Math.max(0, state.hitStopTimer - realDt);
        return;
      }

      // During Time-Stop, EVERYTHING in worldTime freezes completely motionless!
      if (state.ts.active) {
        return;
      }

      const simDt = realDt;
      state.worldTime += simDt;

      // Spring-back squash & stretch on fighters
      for (const actor of [state.sylvia, state.enemy]) {
        actor.scaleX += (1 - actor.scaleX) * Math.min(1, simDt * 14);
        actor.scaleY += (1 - actor.scaleY) * Math.min(1, simDt * 14);
        if (actor.flashTimer > 0) actor.flashTimer = Math.max(0, actor.flashTimer - simDt);
      }

      // Ambient motes
      for (const m of state.ambientMotes) {
        m.x += m.vx * simDt;
        m.y += m.vy * simDt;
        if (m.x < -8) m.x = W + 6;
        if (m.x > W + 8) m.x = -6;
        if (m.y < -8) m.y = H - 30;
        if (m.y > H - 20) m.y = -6;
      }

      // Projectiles
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const p = state.projectiles[i];
        p.t += simDt;
        if (p.t >= p.dur) state.projectiles.splice(i, 1);
      }

      // Combat particles
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * simDt;
        p.y += p.vy * simDt;
        p.vy += p.gravity * simDt;
        p.rot += p.vrot * simDt;
        p.life -= simDt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      // Afterimages
      for (let i = state.afterimages.length - 1; i >= 0; i--) {
        state.afterimages[i].alpha -= simDt * 1.8;
        if (state.afterimages[i].alpha <= 0) state.afterimages.splice(i, 1);
      }
    }

    function render() {
      const sc = SCENARIOS[state.scenarioId];
      const frozen = state.ts.active && state.ts.expand > 0.25;

      ctx.save();
      // Trauma-squared smooth camera shake
      if (state.trauma > 0.001) {
        const mag = state.trauma * state.trauma;
        const ox = Math.sin(state.shakeTime * 1.7) * 14 * mag;
        const oy = Math.sin(state.shakeTime * 2.3) * 9 * mag;
        ctx.translate(ox, oy);
      }

      // 1. Arena Background
      if (sc.arena === 'graveyard') drawGraveyardArena(state.worldTime);
      else drawColosseumArena(state.worldTime);

      // 2. Ambient Snowflakes / Embers / Moon Motes (locked motionless during Time-Stop!)
      drawAmbientMotes(frozen);

      // 3. Time-Stop Frosted Palace Atmosphere & Borders (below Sylvia so she shines vibrantly!)
      drawTimeStopPalaceOverlay();

      // 4. Clock-Gear & Snowflake Runes Rotating Behind Sylvia During Time-Stop
      drawClockGearRunesBehindSylvia(state.sylvia.x + 12, state.sylvia.y - 122, state.ts.expand);

      // 5. Afterimages
      for (const ai of state.afterimages) {
        ctx.save();
        ctx.globalAlpha = ai.alpha;
        ctx.imageSmoothingEnabled = false;
        const sp = ai.sprite;
        const dw = sp.w * ai.scale;
        const dh = sp.h * ai.scale;
        const fx = (sp.anchors.feet[0] / sp.w) * dw;
        const fy = (sp.anchors.feet[1] / sp.h) * dh;
        ctx.drawImage(sp.flash[ai.frame], ai.x - fx, ai.y - fy, dw, dh);
        ctx.restore();
      }

      // 6. Enemy Aura + Frozen Glacial-Blue Enemy + Luminous Sylvia
      drawEnemyAura(sc, state.worldTime, frozen);
      drawFighter(state.enemy, sc.spriteId, { isEnemy: true, frozen, scenarioId: sc.id });
      drawFighter(state.sylvia, 'sylvia_silver', { isEnemy: false, frozen: false });

      // 7. Projectiles, Bespoke Pixel Counter FX & Shatter Particles
      drawProjectiles();
      drawCounterFx();
      drawParticlesAndShards();

      // 8. Clickable Inspection Reticles & Tactical Whisper Card ON Canvas!
      drawInspectionReticles();
      drawTimeStopTopRibbon();

      // 9. Popups & Callout Banner
      drawPopupsAndBanner();

      // 10. Impact Flash Overlay
      if (state.screenFlash > 0.01) {
        ctx.fillStyle = state.screenFlashColor;
        ctx.globalAlpha = state.screenFlash;
        ctx.fillRect(-20, -20, W + 40, H + 40);
      }

      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(0.05, Math.max(0.001, (now - lastTs) / 1000));
      lastTs = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }

    /* ================================================================
       11. CANVAS POINTER INTERACTION & KEYBOARD SHORTCUTS
    ================================================================ */
    function canvasCoordsFromEvent(ev) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((ev.clientX - rect.left) / rect.width) * W,
        y: ((ev.clientY - rect.top) / rect.height) * H,
      };
    }

    function hitTestReticle(x, y) {
      if (!state.ts.active || state.ts.expand < 0.55) return -1;
      const pts = getReticleScreenPositions();
      let best = -1;
      let bestDist = 38;
      pts.forEach((p, idx) => {
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < bestDist) {
          bestDist = d;
          best = idx;
        }
      });
      return best;
    }

    canvas.addEventListener('mousemove', (ev) => {
      if (!state.ts.active) {
        canvas.style.cursor = 'default';
        return;
      }
      const { x, y } = canvasCoordsFromEvent(ev);
      const hit = hitTestReticle(x, y);
      if (hit !== state.ts.hoveredIdx) {
        state.ts.hoveredIdx = hit;
        if (hit >= 0) AudioFX.reticleHover();
      }
      canvas.style.cursor = hit >= 0 ? 'pointer' : 'crosshair';
    });

    canvas.addEventListener('mouseleave', () => {
      state.ts.hoveredIdx = -1;
      canvas.style.cursor = 'default';
    });

    canvas.addEventListener('click', (ev) => {
      if (!state.ts.active) return;
      const { x, y } = canvasCoordsFromEvent(ev);
      const hit = hitTestReticle(x, y);
      if (hit >= 0) handleWeakpointSelect(hit);
    });

    // DOM Controls
    $('btn-scenario-rowan').addEventListener('click', () => loadScenario('rowan'));
    $('btn-scenario-beatrice').addEventListener('click', () => loadScenario('beatrice'));
    $('btn-reset').addEventListener('click', () => loadScenario(state.scenarioId));
    $('btn-result-retry').addEventListener('click', () => loadScenario(state.scenarioId));
    $('btn-result-switch').addEventListener('click', () => loadScenario(state.scenarioId === 'rowan' ? 'beatrice' : 'rowan'));

    $('btn-instant-charge').addEventListener('click', () => {
      if (state.phase === 'victory' || state.phase === 'defeat') loadScenario(state.scenarioId);
      if (state.phase === 'timestop') return;
      if (state.phase !== 'player') return;
      const sc = SCENARIOS[state.scenarioId];
      state.sylvia.insight = 100;
      state.enemy.charging = true;
      state.enemy.sealedTurns = 0;
      if (sc.id === 'beatrice') state.enemy.fireStacks = 3;
      AudioFX.enemyCharge();
      showBanner('⚡ 洞察已满 · 敌方蓄力中！', '点击「展开冰晶宫殿」或按 F 键冻结战场！', 1.5);
      pushLog('演示直达：洞察已蓄满 100%，敌方进入【' + sc.chargeMoveName + '】蓄力态！', 'palace');
      syncUI();
    });

    $('btn-sfx').addEventListener('click', () => {
      AudioFX.enabled = !AudioFX.enabled;
      $('btn-sfx').textContent = AudioFX.enabled ? '🔊' : '🔇';
    });

    $('btn-motion').addEventListener('click', () => {
      state.reduceMotion = !state.reduceMotion;
      $('btn-motion').textContent = state.reduceMotion ? '震屏:弱' : '震屏:开';
    });

    $('skill-ice').addEventListener('click', () => castSkill('ice'));
    $('skill-water').addEventListener('click', () => castSkill('water'));
    $('skill-shield').addEventListener('click', () => castSkill('shield'));

    $('btn-ice-palace').addEventListener('click', () => {
      if (state.phase === 'timestop') exitTimeStop(false);
      else enterTimeStop();
    });

    window.addEventListener('keydown', (ev) => {
      if (ev.repeat) return;
      const k = ev.key.toLowerCase();
      if (k === 'f') {
        if (state.phase === 'timestop') exitTimeStop(false);
        else if (canTriggerTimeStop()) enterTimeStop();
      } else if (k === 'escape' && state.phase === 'timestop') {
        exitTimeStop(false);
      } else if (state.phase === 'timestop' && (k === '1' || k === '2' || k === '3')) {
        handleWeakpointSelect(Number(k) - 1);
      } else if (state.phase === 'player') {
        if (k === '1') castSkill('ice');
        else if (k === '2') castSkill('water');
        else if (k === '3') castSkill('shield');
      }
    });

    window.addEventListener('themechange', () => {
      state.themeLight = document.documentElement.classList.contains('light');
      render();
    });

    // Expose safe read-only QA hooks for Playwright verification
    window.__DEMO3_QA__ = {
      getState: () => ({
        scenarioId: state.scenarioId,
        phase: state.phase,
        insight: state.sylvia.insight,
        enemyHp: state.enemy.hp,
        enemyCharging: state.enemy.charging,
        enemySealed: state.enemy.sealedTurns,
        fireStacks: state.enemy.fireStacks,
        tsActive: state.ts.active,
        tsExpand: state.ts.expand,
        reticles: getReticleScreenPositions().map((p, i) => ({
          idx: i,
          id: p.wp.id,
          isTrue: p.wp.isTrue,
          x: Math.round(p.x),
          y: Math.round(p.y),
        })),
        spriteIds: Object.keys(SPRITES),
      }),
      hoverReticle: (idx) => {
        state.ts.hoveredIdx = idx;
      },
    };

    // Boot
    initSprites();
    loadScenario('rowan');
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
