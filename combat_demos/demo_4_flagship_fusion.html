        spawnPopup(SYLVIA_HOME_X, GROUND_Y - 190, '⚡ ONE MORE!', '#7dd3fc', 24, true);
        return { brokenNow, triggeredFullBreak: true };
      }

      if (brokenNow > 0) {
        SFX.lockBreak(false);
        spawnPopup(b.x, b.y - 220, `破锁 ×${brokenNow} · 洞察+${brokenNow * 25}%`, '#67e8f9', 18, true);
      }
      return { brokenNow, triggeredFullBreak: false };
    }

    function applyDamageToBoss(amount, opts = {}) {
      const b = state.boss;
      const vulnMult = b.broken ? 1.4 : 1.0;
      const finalDmg = Math.max(1, Math.round(amount * vulnMult));
      b.hp = Math.max(0, b.hp - finalDmg);
      state.stats.totalDmg += finalDmg;

      flashUnit(b, opts.heavy ? 0.12 : 0.085);
      squashUnit(b, 0.84, 1.14, 0.22);
      b.pose = 'hurt';
      setTimeout(() => {
        if (state.boss === b && !b.broken && b.hp > 0 && state.phase !== 'timestop') {
          b.pose = 'idle1';
        }
      }, 280);

      spawnPopup(b.x, b.y - 155, `${finalDmg}${opts.perfect ? '!' : ''}`, opts.color || (opts.perfect ? '#fde047' : '#e0f2fe'), opts.heavy ? 32 : 26);

      // 100% Mana Cycle return
      const manaReturnRatio = opts.manaReturnRatio || 0;
      if (manaReturnRatio > 0) {
        const rawMp = Math.round(finalDmg * manaReturnRatio);
        const beforeMp = state.sylvia.mp;
        state.sylvia.mp = Math.min(state.sylvia.maxMp, beforeMp + rawMp);
        const overflow = Math.max(0, beforeMp + rawMp - state.sylvia.maxMp);
        if (overflow > 0) {
          state.sylvia.shield = Math.min(90, state.sylvia.shield + Math.round(overflow * 0.35));
        }
        if (rawMp > 0) {
          spawnManaOrbs(b.x - 20, b.y - 120, state.sylvia.x + 20, state.sylvia.y - 110, Math.min(10, 4 + Math.floor(rawMp / 16)));
          spawnPopup(state.sylvia.x, state.sylvia.y - 180, `+${rawMp} MP 魔力回流`, '#38bdf8', 18, true);
        }
      }

      syncHUD();
      return finalDmg;
    }

    // =========================================================================
    // 7. PILLAR 1 + 2: SKILL CAST SEQUENCE & TIMED CAST
    // =========================================================================
    function getCastAnchor(unit, sprite) {
      const scale = 2;
      const sx = unit.x - sprite.anchors.feet[0] * scale;
      const sy = unit.y - sprite.anchors.feet[1] * scale;
      return {
        x: sx + sprite.anchors.cast[0] * scale,
        y: sy + sprite.anchors.cast[1] * scale,
      };
    }

    function getHitAnchor(unit, sprite) {
      const scale = 2;
      const sx = unit.x - sprite.anchors.feet[0] * scale;
      const sy = unit.y - sprite.anchors.feet[1] * scale;
      return {
        x: sx + sprite.anchors.hit[0] * scale,
        y: sy + sprite.anchors.hit[1] * scale,
      };
    }

    function adjustBoost(delta) {
      if (state.phase !== 'player') return;
      const s = state.sylvia;
      const next = clamp(s.boost + delta, 0, Math.min(3, s.cp));
      if (next !== s.boost) {
        s.boost = next;
        if (delta > 0) {
          SFX.boostUp(next);
          squashUnit(s, 1.09, 0.92, 0.16);
          spawnPixelBurst(s.x, s.y - 115, 8 + next * 3, ['#e0f2fe', '#38bdf8', '#fde047'], 50, 130, 4, 40);
        } else {
          SFX.boostDown();
        }
        syncHUD();
      }
    }

    function executeSkill(skillId) {
      if (state.phase !== 'player') return;
      const skill = SKILLS[skillId];
      if (!skill) return;
      const s = state.sylvia;
      if (s.mp < skill.mpCost) {
        setTicker('魔力不足，请先施放「[1] 水箭连缀」回复魔力！');
        return;
      }

      const boost = s.boost;
      s.mp -= skill.mpCost;
      s.cp -= boost;
      s.boost = 0;

      if (skill.mpGain > 0) {
        s.mp = Math.min(s.maxMp, s.mp + skill.mpGain);
      }
      if (skill.cpGain > 0) {
        s.cp = Math.min(s.maxCp, s.cp + skill.cpGain);
      }
      if (skill.shield > 0) {
        const gainShield = Math.round(skill.shield * (1 + boost * 0.35));
        s.shield = Math.min(90, s.shield + gainShield);
        spawnPopup(s.x, s.y - 195, `霜盾 +${gainShield}`, '#67e8f9', 18, true);
      }

      state.phase = 'animating';
      syncHUD();

      const boostLabel = boost > 0 ? `【极寒倾注 ×${boost}】` : '';
      setTicker(`希尔维亚施放「${skill.name}」${boostLabel}——闪光瞬间按 SPACE 或点击触发节拍增幅！`);

      // Frame 1: windup
      s.pose = 'windup';
      squashUnit(s, 1.07, 0.93, 0.16);
      SFX.cast(boost);

      const sSprite = SPRITES.sylvia_silver;
      const bSprite = SPRITES[state.boss.cfg.spriteKey];

      // Step into cast_step + open Timed Cast window
      setTimeout(() => {
        s.pose = 'cast_step';
        s.x = SYLVIA_HOME_X + 34;
        squashUnit(s, 0.94, 1.07, 0.14);

        const anchor = getCastAnchor(s, sSprite);
        state.rhythm = {
          kind: 'cast',
          t: 0,
          windowStart: 0.24,
          windowEnd: 0.62,
          dur: 0.68,
          x: anchor.x,
          y: anchor.y,
          resolved: false,
          hit: false,
          autoFired: false,
          onResolve: (isPerfect) => {
            // Frame 3: strike + launch pixel VFX
            s.pose = 'strike';
            s.x = SYLVIA_HOME_X + 54;
            squashUnit(s, 1.13, 0.9, 0.18);

            if (isPerfect) {
              state.stats.perfects += 1;
              s.mp = Math.min(s.maxMp, s.mp + 15);
              addInsight(12);
              SFX.perfect();
              spawnPopup(s.x + 28, s.y - 190, 'PERFECT! +30% · +15MP', '#fde047', 21, true);
              spawnPixelBurst(anchor.x, anchor.y, 16, ['#fef08a', '#38bdf8', '#ffffff'], 90, 220, 4, 80);
            } else {
              addInsight(8);
            }

            const hitPos = getHitAnchor(state.boss, bSprite);
            launchSkillProjectiles(skill, boost, isPerfect, anchor, hitPos, () => {
              const mult = BOOST_MULTS[boost] * (isPerfect ? 1.3 : 1.0);
              const totalDmg = Math.round(skill.baseDmg * mult);
              const manaReturn = boost > 0 ? 1.0 : skill.manaCycleBase;

              // Impact juice
              const isHeavy = boost >= 2 || isPerfect || skill.id === 'mana_cycle';
              SFX.iceHit(isHeavy);
              addTrauma(isHeavy ? 0.56 : 0.34);
              triggerHitStop(isHeavy ? 0.088 : 0.064);

              applyDamageToBoss(totalDmg, {
                heavy: isHeavy,
                perfect: isPerfect,
                manaReturnRatio: manaReturn,
              });

              // Locks to break
              const lockList = [...skill.locks];
              if (skill.id === 'mirror_sever' && boost >= 1) lockList.push('ice');
              const extraBreaks = boost >= 2 ? 1 : 0;
              breakBossLocks(lockList, extraBreaks);

              // Return Sylvia smoothly
              setTimeout(() => {
                s.x = SYLVIA_HOME_X;
                s.pose = 'idle1';
                afterPlayerAction();
              }, 360);
            });
          },
        };
      }, 170);
    }

    function launchSkillProjectiles(skill, boost, isPerfect, from, to, onImpact) {
      const count = (skill.vfx === 'lance' ? 1 + boost : skill.vfx === 'water' ? 2 + boost : 1 + Math.min(2, boost)) + (isPerfect ? 1 : 0);
      let impactFired = false;

      for (let i = 0; i < count; i++) {
        const spreadY = (i - (count - 1) / 2) * 26;
        state.projectiles.push({
          kind: skill.vfx,
          x: from.x,
          y: from.y + spreadY * 0.4,
          startX: from.x,
          startY: from.y + spreadY * 0.4,
          targetX: to.x + (Math.random() - 0.5) * 22,
          targetY: to.y + spreadY * 0.55,
          t: -i * 0.055,
          dur: 0.24,
          boost,
          onHit: () => {
            const palette = skill.vfx === 'water'
              ? ['#60a5fa', '#93c5fd', '#e0f2fe', '#ffffff']
              : skill.vfx === 'mirror'
              ? ['#fde047', '#67e8f9', '#e0f2fe', '#ffffff']
              : ['#38bdf8', '#a5f3fc', '#e0f2fe', '#ffffff'];
            spawnPixelBurst(to.x, to.y + spreadY * 0.3, 10 + boost * 3, palette, 90, 240, 4, 220);
            if (!impactFired) {
              impactFired = true;
              if (skill.vfx === 'mirror') {
                state.slashes.push({ x: to.x, y: to.y, angle: -0.65, t: 0, dur: 0.28, color: '#67e8f9' });
                state.slashes.push({ x: to.x, y: to.y, angle: 0.65, t: 0, dur: 0.28, color: '#fde047' });
              } else if (skill.vfx === 'nova') {
                state.slashes.push({ x: to.x, y: GROUND_Y - 10, angle: 0, t: 0, dur: 0.45, color: '#38bdf8', kind: 'spire' });
              }
              onImpact();
            }
          },
        });
      }
    }

    function afterPlayerAction() {
      if (state.boss.hp <= 0) {
        handleBossDefeated();
        return;
      }

      if (state.oneMoreQueued) {
        state.oneMoreQueued = false;
        state.inOneMore = true;
        state.phase = 'player';
        setTicker('⚡ ONE MORE 再动触发！立刻追击破防中的首领（+40% 易伤）或发动「冰宫时停」！');
        syncHUD();
        return;
      }

      state.inOneMore = false;
      startEnemyTurn();
    }

    // =========================================================================
    // 8. PILLAR 3: ICE PALACE TIME-STOP DIRECT WEAKPOINT CLICK
    // =========================================================================
    function enterTimeStop() {
      if (state.phase !== 'player' || state.sylvia.insight < 100) return;
      state.sylvia.insight = 0;
      state.stats.timestops += 1;
      state.phase = 'timestop';
      state.timeStop.active = true;
      state.timeStop.frostAlpha = 0;
      state.timeStop.hoverWp = null;
      state.timeStop.hint = state.boss.cfg.weakpointHint;

      const b = state.boss;
      state.timeStop.reticles = b.cfg.weakpoints.map((wp) => ({
        ...wp,
        x: b.x + wp.dx,
        y: b.y + wp.dy,
        radius: wp.isReal ? 30 : 24,
      }));

      state.sylvia.pose = 'windup';
      canvas.classList.add('timestop-aim');
      SFX.timeStopEnter();
      addTrauma(0.28);
      setTicker(`❄️ 冰宫时停已展开！${b.cfg.weakpointHint}`);
      syncHUD();
    }

    function resolveTimeStopWeakpoint(wp) {
      if (!state.timeStop.active) return;
      state.timeStop.active = false;
      canvas.classList.remove('timestop-aim');
      state.phase = 'animating';

      const b = state.boss;
      const cfg = b.cfg;

      if (wp.isReal) {
        // Bespoke pixel Counter Cut-In!
        state.sylvia.pose = 'strike';
        SFX.cutInFinisher();
        addTrauma(0.88);
        triggerHitStop(0.115);

        state.cutIn = {
          type: cfg.cutInType,
          title: cfg.cutInTitle,
          targetX: b.x,
          targetY: b.y,
          t: 0,
          dur: 1.08,
        };

        setTicker(`❄️ 冰宫看破！发动专属反制【${cfg.cutInTitle}】——碎冰崩解并立刻获得 ONE MORE 再动！`);
        syncHUD();

        setTimeout(() => {
          spawnPixelBurst(b.x, b.y - 125, 36, ['#ffffff', '#bae6fd', '#38bdf8', '#fde047'], 120, 320, 5, 260);
          applyDamageToBoss(cfg.cutInDmg, {
            heavy: true,
            perfect: true,
            color: '#67e8f9',
            manaReturnRatio: 0.65,
          });

          // Smash 2 locks vs Beatrice, ALL locks vs Rowan!
          const remaining = b.locks.filter((l) => !l.broken);
          const breakTypes = cfg.wave === 2
            ? remaining.map((l) => l.type)
            : remaining.slice(0, 2).map((l) => l.type);
          breakBossLocks(breakTypes, 0);

          // Always grant instant ONE MORE on true weakpoint hit!
          state.oneMoreQueued = true;
          if (state.boss.hp > 0) {
            spawnPopup(SYLVIA_HOME_X, GROUND_Y - 210, '⚡ 时停破绽 · ONE MORE!', '#fde047', 22, true);
          }
        }, 420);

        setTimeout(() => {
          state.cutIn = null;
          state.sylvia.pose = 'idle1';
          afterPlayerAction();
        }, 1150);
      } else {
        // Decoy hit — still rewarding, never punishing
        state.sylvia.pose = 'strike';
        SFX.iceHit(false);
        addTrauma(0.38);
        triggerHitStop(0.07);
        spawnPixelBurst(wp.x, wp.y, 18, ['#bae6fd', '#38bdf8', '#ffffff'], 80, 200, 4, 200);
        spawnPopup(wp.x, wp.y - 24, '擦伤偏移 · 破1锁', '#bae6fd', 18, true);
        applyDamageToBoss(95, { heavy: false, manaReturnRatio: 0.4 });
        const rem = b.locks.find((l) => !l.broken);
        if (rem) breakBossLocks([rem.type], 0);
        setTimeout(() => {
          state.sylvia.pose = 'idle1';
          afterPlayerAction();
        }, 580);
      }
    }

    // =========================================================================
    // 9. ENEMY TURN & ICE-MIRROR PARRY
    // =========================================================================
    function startEnemyTurn() {
      const b = state.boss;
      state.phase = 'animating';
      syncHUD();

      if (b.broken) {
        showBanner('破防硬直', `${b.cfg.name} 的蓄力已被冰晶打断！`, '#67e8f9', 1.1);
        setTicker(`${b.cfg.name} 处于碎冰硬直中，本回合无法行动！`);
        setTimeout(() => {
          b.patternIdx += 1;
          loadBossPattern();
          b.pose = 'idle1';
          beginPlayerTurn();
        }, 980);
        return;
      }

      b.chargeLeft -= 1;
      const isUltimate = b.chargeLeft <= 0;
      const dmgRaw = isUltimate ? b.intentDmg : Math.round(b.intentDmg * 0.62);
      const attackLabel = isUltimate ? `蓄力大招【${b.intentName}】` : `先手突袭`;

      setTicker(`${b.cfg.name} 发动${attackLabel}——落点前按 SPACE 或点击触发「冰镜格挡」！`);
      b.pose = 'windup';
      squashUnit(b, 1.07, 0.93, 0.16);

      const bSprite = SPRITES[b.cfg.spriteKey];
      const sSprite = SPRITES.sylvia_silver;
      const sHit = getHitAnchor(state.sylvia, sSprite);

      setTimeout(() => {
        b.pose = 'strike';
        b.x = BOSS_HOME_X - 42;
        squashUnit(b, 1.12, 0.9, 0.16);

        // Open Ice-Mirror Parry window right in front of Sylvia!
        state.rhythm = {
          kind: 'parry',
          t: 0,
          windowStart: 0.25,
          windowEnd: 0.62,
          dur: 0.68,
          x: sHit.x + 56,
          y: sHit.y - 6,
          resolved: false,
          hit: false,
          autoFired: false,
          onResolve: (parried) => {
            const bCast = getCastAnchor(b, bSprite);
            // Enemy visual projectile
            state.projectiles.push({
              kind: b.cfg.wave === 1 ? 'flame_arc' : 'eclipse_beam',
              x: bCast.x, y: bCast.y,
              startX: bCast.x, startY: bCast.y,
              targetX: sHit.x + (parried ? 48 : 0), targetY: sHit.y,
              t: 0, dur: 0.16,
              onHit: () => {
                resolveEnemyImpact(dmgRaw, parried, isUltimate);
              },
            });
          },
        };
      }, 260);
    }

    function resolveEnemyImpact(dmgRaw, parried, isUltimate) {
      const s = state.sylvia;
      const b = state.boss;
      let incoming = parried ? Math.round(dmgRaw * 0.5) : dmgRaw;

      if (parried) {
        state.stats.parries += 1;
        state.stats.perfects += 1;
        s.cp = Math.min(s.maxCp, s.cp + 1);
        addInsight(12);
        SFX.parry();
        addTrauma(0.32);
        triggerHitStop(0.075);
        state.slashes.push({ x: s.x + 56, y: s.y - 108, angle: 0, t: 0, dur: 0.36, color: '#67e8f9', kind: 'mirror_shield' });
        spawnPixelBurst(s.x + 56, s.y - 108, 18, ['#ffffff', '#67e8f9', '#38bdf8', '#fde047'], 80, 230, 4, 160);
        spawnPopup(s.x + 28, s.y - 195, '冰镜格挡! 减伤50% · +1CP', '#67e8f9', 20, true);

        // Reflect 3 frost shards back to Boss!
        const bHit = getHitAnchor(b, SPRITES[b.cfg.spriteKey]);
        for (let i = 0; i < 3; i++) {
          state.projectiles.push({
            kind: 'reflect_shard',
            x: s.x + 56, y: s.y - 108 + (i - 1) * 18,
            startX: s.x + 56, startY: s.y - 108 + (i - 1) * 18,
            targetX: bHit.x, targetY: bHit.y + (i - 1) * 16,
            t: -i * 0.04, dur: 0.22,
            onHit: () => {
              if (i === 0 && b.hp > 0) {
                applyDamageToBoss(28, { heavy: false, color: '#67e8f9' });
                spawnPixelBurst(bHit.x, bHit.y, 12, ['#67e8f9', '#e0f2fe', '#ffffff'], 80, 200, 4, 180);
              }
            },
          });
        }
      } else {
        SFX.enemyHit();
        addTrauma(isUltimate ? 0.62 : 0.36);
        triggerHitStop(isUltimate ? 0.085 : 0.06);
        spawnPixelBurst(s.x, s.y - 105, 16, b.cfg.wave === 1 ? ['#fb923c', '#fde047', '#ef4444'] : ['#c084fc', '#a855f7', '#e2e8f0'], 80, 220, 4, 220);
      }

      // Apply shield absorption
      if (s.shield > 0) {
        const absorbed = Math.min(s.shield, incoming);
        s.shield -= absorbed;
        incoming -= absorbed;
        if (absorbed > 0) {
          spawnPopup(s.x - 16, s.y - 155, `霜盾吸收 ${absorbed}`, '#a5f3fc', 17, true);
        }
      }

      if (incoming > 0) {
        s.hp = Math.max(0, s.hp - incoming);
        flashUnit(s, 0.09);
        squashUnit(s, 0.86, 1.12, 0.2);
        s.pose = 'hurt';
        spawnPopup(s.x, s.y - 125, `-${incoming}`, parried ? '#bae6fd' : '#fb7185', 26);
      }

      syncHUD();

      setTimeout(() => {
        b.x = BOSS_HOME_X;
        b.pose = 'idle1';
        s.pose = 'idle1';

        if (b.hp <= 0) {
          handleBossDefeated();
          return;
        }
        if (s.hp <= 0) {
          showDefeat();
          return;
        }
        if (isUltimate) {
          b.patternIdx += 1;
          loadBossPattern();
        }
        beginPlayerTurn();
      }, 540);
    }

    function beginPlayerTurn() {
      state.turnNum += 1;
      state.sylvia.cp = Math.min(state.sylvia.maxCp, state.sylvia.cp + 1);
      state.phase = 'player';
      setTicker(`第 ${state.turnNum} 回合 · 晶核 +1！叠加「极寒倾注」并击碎上方蓄力锁。`);
      syncHUD();
    }

    function handleBossDefeated() {
      const cfg = state.boss.cfg;
      state.phase = 'transition';
      SFX.waveClear();
      addTrauma(0.68);
      spawnPixelBurst(state.boss.x, state.boss.y - 110, 38, ['#e0f2fe', '#38bdf8', '#fde047', '#ffffff'], 90, 290, 5, 190);
      showQuote(cfg.name, cfg.defeatQuote, 'right', 2.2);

      if (state.waveIdx === 0) {
        showBanner('WAVE 1 突破！', '贝阿特丽丝认输 · 蚀月钟庭开启 → 罗文登场', '#38bdf8', 1.9);
        setTicker('贝阿特丽丝已败阵！希尔维亚调息回复状态，准备迎战 Wave 2「罗文（晦轮杖）」！');
        syncHUD();
        setTimeout(() => {
          initWave(1);
        }, 2050);
      } else {
        showBanner('二连战完全制霸！', '晦轮杖碎裂 · 冰晶宫殿终局胜利', '#fde047', 1.8);
        syncHUD();
        setTimeout(() => {
          showVictory();
        }, 1250);
      }
    }

    function showVictory() {
      state.phase = 'victory';
      syncHUD();
      const score = state.stats.breaks * 30 + state.stats.perfects * 15 + state.stats.timestops * 40;
      const grade = score >= 110 ? 'S+' : score >= 70 ? 'S' : 'A';
      document.getElementById('result-badge').textContent = '二连战完全制霸 · 贝阿特丽丝 & 罗文';
      document.getElementById('result-title').textContent = `冰晶终局 · 评价 ${grade}`;
      document.getElementById('result-quote').textContent = '「节拍破锁、魔战循环与冰宫洞察全部咬合。两面冰镜，足以封住蚀月之光。」';
      document.getElementById('stat-breaks').textContent = String(state.stats.breaks);
      document.getElementById('stat-perfects').textContent = String(state.stats.perfects);
      document.getElementById('stat-timestops').textContent = String(state.stats.timestops);
      document.getElementById('result-overlay').classList.remove('hidden-el');
    }

    function showDefeat() {
      state.phase = 'defeat';
      syncHUD();
      document.getElementById('result-badge').textContent = '战局中断';
      document.getElementById('result-title').textContent = '冰盾碎裂 · 暂且退却';
      document.getElementById('result-quote').textContent = '「先以水箭与镜冰截断化解蓄力，再借冰宫时停直取破绽。」';
      document.getElementById('stat-breaks').textContent = String(state.stats.breaks);
      document.getElementById('stat-perfects').textContent = String(state.stats.perfects);
      document.getElementById('stat-timestops').textContent = String(state.stats.timestops);
      document.getElementById('result-overlay').classList.remove('hidden-el');
    }

    // =========================================================================
    // 10. RHYTHM INPUT TRIGGER (SPACE / Canvas Click)
    // =========================================================================
    function triggerRhythmAction() {
      const r = state.rhythm;
      if (!r || r.resolved) return false;
      if (r.t >= r.windowStart && r.t <= r.windowEnd) {
        r.resolved = true;
        r.hit = true;
        const cb = r.onResolve;
        state.rhythm = null;
        cb(true);
        return true;
      }
      // Early press closes cleanly as normal non-perfect
      if (r.t > 0.08 && r.t < r.windowStart) {
        r.resolved = true;
        r.hit = false;
        const cb = r.onResolve;
        state.rhythm = null;
        cb(false);
        return true;
      }
      return false;
    }

    // =========================================================================
    // 11. EVENT-DRIVEN HUD SYNCHRONIZATION
    // =========================================================================
    function syncHUD() {
      const s = state.sylvia;
      const b = state.boss;

      document.getElementById('wave-pill').textContent = `WAVE ${b.cfg.wave}/2 · ${b.cfg.name}（${b.cfg.title}）`;

      const phaseEl = document.getElementById('phase-pill');
      if (state.phase === 'timestop') {
        phaseEl.textContent = '❄️ 冰宫时停 · 直点破绽';
        phaseEl.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-sky-500/25 accent-mp border border-sky-400/50';
      } else if (state.inOneMore && state.phase === 'player') {
        phaseEl.textContent = '⚡ ONE MORE 再动!';
        phaseEl.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 accent-gold border border-amber-400/50';
      } else if (state.phase === 'player') {
        phaseEl.textContent = '我方回合';
        phaseEl.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-cyan-500/15 accent-ice border border-cyan-400/35';
      } else if (state.phase === 'victory') {
        phaseEl.textContent = '战斗胜利';
        phaseEl.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 accent-hp border border-emerald-400/35';
      } else {
        phaseEl.textContent = '演出中';
        phaseEl.className = 'px-2 py-0.5 rounded-full text-xs font-bold bg-slate-500/15 text-[var(--muted-foreground)] border border-[var(--card-border)]';
      }

      document.getElementById('sylvia-hp-text').textContent = `${s.hp} / ${s.maxHp}`;
      document.getElementById('sylvia-hp-bar').style.width = `${(s.hp / s.maxHp) * 100}%`;
      document.getElementById('sylvia-mp-text').textContent = `${s.mp} / ${s.maxMp}`;
      document.getElementById('sylvia-mp-bar').style.width = `${(s.mp / s.maxMp) * 100}%`;
      document.getElementById('sylvia-shield-tag').textContent = `霜盾 ${s.shield}`;
      document.getElementById('insight-text').textContent = `${s.insight}%`;
      document.getElementById('insight-bar').style.width = `${s.insight}%`;

      // Time-Stop Button
      const tsBtn = document.getElementById('btn-timestop');
      const tsReady = state.phase === 'player' && s.insight >= 100;
      tsBtn.disabled = !tsReady;
      tsBtn.classList.toggle('timestop-ready', tsReady);
      tsBtn.textContent = tsReady
        ? '❄️ 冰宫时停就绪！按 [F] 展开'
        : `❄️ 冰宫时停 [F] · ${s.insight}% / 100%`;

      // CP Pips & Boost Button
      document.getElementById('cp-readout').textContent = `${s.cp} / ${s.maxCp}`;
      const pipEls = document.querySelectorAll('#cp-pips .boost-pip');
      pipEls.forEach((pip, idx) => {
        pip.classList.toggle('queued', idx < s.boost);
        pip.classList.toggle('filled', idx >= s.boost && idx < s.cp);
      });

      const boostMult = BOOST_MULTS[s.boost];
      const plusBtn = document.getElementById('btn-boost-plus');
      const minusBtn = document.getElementById('btn-boost-minus');
      plusBtn.disabled = state.phase !== 'player' || s.boost >= Math.min(3, s.cp);
      minusBtn.disabled = state.phase !== 'player' || s.boost <= 0;
      plusBtn.textContent = `+ 倾注 ×${s.boost} [E]`;

      const boostLine = document.getElementById('boost-effect-line');
      if (s.boost === 0) {
        boostLine.innerHTML = '当前倍率 <span class="font-bold text-[var(--foreground)]">×1.0</span> · 倾注激活 100% 回蓝循环';
      } else {
        const extraLock = s.boost >= 2 ? ' · +1额外破锁' : '';
        boostLine.innerHTML = `<span class="font-bold accent-gold">×${boostMult.toFixed(2)} 爆发</span> · <span class="font-semibold accent-ice">100% 伤害回蓝${extraLock}</span>`;
      }

      // Skill buttons
      const skillBtns = document.querySelectorAll('#skill-grid .skill-btn');
      skillBtns.forEach((btn) => {
        const sk = SKILLS[btn.dataset.skill];
        const canUse = state.phase === 'player' && s.mp >= sk.mpCost;
        btn.disabled = !canUse;
        const estDmg = Math.round(sk.baseDmg * boostMult * (b.broken ? 1.4 : 1.0));
        const dmgEl = btn.querySelector('.skill-dmg-preview');
        if (dmgEl) {
          dmgEl.textContent = `预计 ${estDmg}`;
          dmgEl.className = s.boost > 0
            ? 'skill-dmg-preview font-bold accent-gold'
            : 'skill-dmg-preview font-semibold text-[var(--foreground)]';
        }
      });
    }

    // =========================================================================
    // 12. CANVAS RENDERING (Sea of Stars Pixel Stage + Crisp Sprites + VFX)
    // =========================================================================
    function drawStageBackground(t) {
      const isEclipse = state.boss.cfg.theme === 'eclipse';
      const ts = state.timeStop.frostAlpha;

      // Sky gradient
      const sky = ctx.createLinearGradient(0, 0, 0, 290);
      if (isEclipse) {
        sky.addColorStop(0, '#090717');
        sky.addColorStop(0.55, '#1d1036');
        sky.addColorStop(1, '#31154a');
      } else {
        sky.addColorStop(0, '#071127');
        sky.addColorStop(0.55, '#112548');
        sky.addColorStop(1, '#1d3962');
      }
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, 300);

      // Pixel stars
      for (const st of state.stars) {
        const tw = 0.45 + 0.55 * Math.sin(t * st.speed + st.phase);
        ctx.fillStyle = isEclipse
          ? `rgba(233, 213, 255, ${tw * 0.75})`
          : `rgba(224, 242, 254, ${tw * 0.85})`;
        ctx.fillRect(st.x, st.y, st.size, st.size);
      }

      // Moon (Crescent in Wave 1, Eclipsed Moon in Wave 2!)
      const moonX = 480, moonY = 74;
      if (isEclipse) {
        // Outer eclipse corona
        ctx.fillStyle = 'rgba(192, 132, 252, 0.16)';
        ctx.beginPath(); ctx.arc(moonX, moonY, 58, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e9d5ff';
        ctx.beginPath(); ctx.arc(moonX, moonY, 34, 0, Math.PI * 2); ctx.fill();
        // Eclipse shadow disc
        ctx.fillStyle = '#110924';
        ctx.beginPath(); ctx.arc(moonX + 3, moonY - 1, 29, 0, Math.PI * 2); ctx.fill();
        // Crimson-silver rim glint
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(moonX, moonY, 34, -0.7, 0.9); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(125, 211, 252, 0.14)';
        ctx.beginPath(); ctx.arc(moonX, moonY, 48, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e0f2fe';
        ctx.beginPath(); ctx.arc(moonX, moonY, 27, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#0d1d3b';
        ctx.beginPath(); ctx.arc(moonX + 11, moonY - 4, 23, 0, Math.PI * 2); ctx.fill();
      }

      // Distant gothic castle silhouette & colonnade arches
      ctx.fillStyle = isEclipse ? '#150d29' : '#0f203d';
      ctx.fillRect(0, 206, W, 94);
      // Battlements & gothic spires
      for (let x = 24; x < W; x += 120) {
        ctx.fillRect(x, 168, 22, 42);
        ctx.fillRect(x + 4, 156, 14, 14);
        ctx.fillRect(x + 8, 144, 6, 14);
      }
      // Arched cutouts
      ctx.fillStyle = isEclipse ? '#241442' : '#183057';
      for (let x = 56; x < W - 40; x += 120) {
        ctx.fillRect(x, 220, 56, 72);
        ctx.fillRect(x + 8, 210, 40, 14);
        ctx.fillRect(x + 16, 204, 24, 10);
      }

      // Courtyard balustrade trim
      ctx.fillStyle = isEclipse ? '#3b2462' : '#264778';
      ctx.fillRect(0, 286, W, 10);
      ctx.fillStyle = isEclipse ? '#58378a' : '#3d69a3';
      ctx.fillRect(0, 286, W, 3);

      // Stone marble floor with crisp pixel perspective tiles
      const floorGrad = ctx.createLinearGradient(0, 296, 0, H);
      if (isEclipse) {
        floorGrad.addColorStop(0, '#1e1633');
        floorGrad.addColorStop(1, '#0e0a1a');
      } else {
        floorGrad.addColorStop(0, '#1c3152');
        floorGrad.addColorStop(1, '#0d192d');
      }
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, 296, W, H - 296);

      // Perspective tile lines
      ctx.strokeStyle = isEclipse ? 'rgba(192, 132, 252, 0.16)' : 'rgba(125, 211, 252, 0.16)';
      ctx.lineWidth = 2;
      for (let y = 314; y < H; y += 26) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
      }
      for (let i = -5; i <= 5; i++) {
        const topX = W / 2 + i * 74;
        const botX = W / 2 + i * 142;
        ctx.beginPath(); ctx.moveTo(topX, 296); ctx.lineTo(botX, H); ctx.stroke();
      }

      // Subtle frosty runes around Sylvia's footing
      ctx.strokeStyle = 'rgba(103, 232, 249, 0.24)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(SYLVIA_HOME_X, GROUND_Y + 4, 86, 15, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Ambient drifting snow (freezes completely during Time-Stop!)
      for (const sn of state.ambientSnow) {
        ctx.fillStyle = `rgba(224, 242, 254, ${sn.alpha})`;
        ctx.fillRect(Math.round(sn.x), Math.round(sn.y), sn.size, sn.size);
      }

      // Ambient warm flame embers (Wave 1) or violet eclipse motes (Wave 2)
      for (const em of state.ambientEmbers) {
        const a = Math.sin(em.life * Math.PI) * 0.65;
        ctx.fillStyle = isEclipse
          ? `rgba(216, 180, 254, ${a})`
          : `rgba(251, 146, 60, ${a})`;
        ctx.fillRect(Math.round(em.x), Math.round(em.y), em.size, em.size);
      }

      // Glacial Time-Stop Monochrome Frost Veil over stage!
      if (ts > 0.01) {
        ctx.save();
        ctx.fillStyle = `rgba(12, 34, 58, ${0.58 * ts})`;
        ctx.fillRect(0, 0, W, H);
        // Frozen crystalline frost rays from edges
        const vig = ctx.createRadialGradient(W / 2, H / 2, 160, W / 2, H / 2, 520);
        vig.addColorStop(0, 'rgba(186, 230, 253, 0)');
        vig.addColorStop(1, `rgba(125, 211, 252, ${0.32 * ts})`);
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      }
    }

    function drawOrbitingBoostCrystals(unit, boostCount, t) {
      if (boostCount <= 0) return;
      const cx = unit.x;
      const cy = unit.y - 118;
      const speed = 2.4 + boostCount * 0.65;
      for (let i = 0; i < boostCount; i++) {
        const ang = t * speed + (Math.PI * 2 * i) / boostCount;
        const ox = Math.round(cx + Math.cos(ang) * 76);
        const oy = Math.round(cy + Math.sin(ang) * 26);
        const depth = Math.sin(ang);
        const u = depth > 0 ? 3 : 2; // crisp integer pixel block unit

        // Micro pixel trail
        const trailX = Math.round(cx + Math.cos(ang - 0.22) * 76);
        const trailY = Math.round(cy + Math.sin(ang - 0.22) * 26);
        ctx.fillStyle = boostCount === 3 ? 'rgba(254, 240, 138, 0.5)' : 'rgba(125, 211, 252, 0.5)';
        ctx.fillRect(trailX - 2, trailY - 2, 4, 4);

        // Stepped crisp pixel crystal gem with dark outline
        const outline = boostCount === 3 ? '#713f12' : '#0c4a6e';
        const body = boostCount === 3 ? '#facc15' : '#38bdf8';
        const facet = boostCount === 3 ? '#fef9c3' : '#bae6fd';
        ctx.fillStyle = outline;
        ctx.fillRect(ox - u, oy - 4 * u, 2 * u, 8 * u);
        ctx.fillRect(ox - 2 * u, oy - 3 * u, 4 * u, 6 * u);
        ctx.fillRect(ox - 3 * u, oy - u, 6 * u, 2 * u);

        ctx.fillStyle = body;
        ctx.fillRect(ox - u, oy - 3 * u, 2 * u, 6 * u);
        ctx.fillRect(ox - 2 * u, oy - u, 4 * u, 2 * u);

        ctx.fillStyle = facet;
        ctx.fillRect(ox - u, oy - 2 * u, u, 2 * u);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ox - u, oy - 2 * u, u, u);
      }
    }

    function drawPixelUnit(unit, sprite, opts = {}) {
      if (!sprite) return;
      const scale = 2;
      const idx = sprite.poseMap[unit.pose] ?? 0;
      const useFrost = opts.frostMode;
      const img = useFrost ? sprite.frostFrames[idx] : sprite.frames[idx];
      const flashImg = sprite.flashFrames[idx];

      // Ground contact shadow
      ctx.fillStyle = 'rgba(2, 6, 18, 0.52)';
      ctx.beginPath();
      ctx.ellipse(unit.x, unit.y + 4, 62, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      // Rowan's lore-authentic half-beat lagging moon-shadow!
      if (opts.lagShadow && unit.lagHistory.length > 6) {
        const past = unit.lagHistory[0];
        const sIdx = sprite.poseMap[past.pose] ?? 0;
        const shImg = sprite.shadowFrames[sIdx];
        ctx.save();
        ctx.translate(Math.round(past.x + 14), Math.round(past.y));
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
          shImg,
          -sprite.anchors.feet[0] * scale,
          -sprite.anchors.feet[1] * scale,
          sprite.w * scale,
          sprite.h * scale
        );
        ctx.restore();
      }

      // Stagger wobble when Boss is Broken
      let wobbleX = 0;
      if (opts.staggered && !state.timeStop.active) {
        wobbleX = Math.sin(state.simTime * 22) * 3;
      }

      ctx.save();
      ctx.translate(Math.round(unit.x + wobbleX), Math.round(unit.y));
      ctx.scale(unit.scaleX, unit.scaleY);
      ctx.imageSmoothingEnabled = false;

      const drawX = -sprite.anchors.feet[0] * scale;
      const drawY = -sprite.anchors.feet[1] * scale;
      ctx.drawImage(img, drawX, drawY, sprite.w * scale, sprite.h * scale);

      if (unit.flashT > 0) {
        ctx.globalAlpha = settings.reduceShake ? 0.38 : 0.85;
        ctx.drawImage(flashImg, drawX, drawY, sprite.w * scale, sprite.h * scale);
      }
      ctx.restore();

      // Frost shield aura on Sylvia
      if (opts.shield > 0) {
        ctx.save();
        ctx.strokeStyle = 'rgba(103, 232, 249, 0.55)';
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.ellipse(unit.x, unit.y - 115, 76, 98, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawBossDiegeticHUD() {
      const b = state.boss;
      if (b.hp <= 0) return;

      const cx = 808;
      const topY = 24;
      const barW = 240;

      // Translucent glacial nameplate
      ctx.save();
      ctx.fillStyle = 'rgba(8, 16, 32, 0.84)';
      ctx.strokeStyle = b.broken ? '#facc15' : (b.cfg.wave === 1 ? 'rgba(251, 146, 60, 0.65)' : 'rgba(192, 132, 252, 0.7)');
      ctx.lineWidth = 1.5;
      roundRect(ctx, cx - barW / 2 - 12, topY - 12, barW + 24, 96, 10);
      ctx.fill();
      ctx.stroke();

      // Boss Name & HP numbers
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'left';
      ctx.fillText(`${b.cfg.name} · ${b.cfg.title}`, cx - barW / 2, topY + 6);

      ctx.textAlign = 'right';
      ctx.fillStyle = b.broken ? '#fde047' : '#fca5a5';
      ctx.fillText(`${b.hp} / ${b.maxHp}`, cx + barW / 2, topY + 6);

      // HP Bar
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      roundRect(ctx, cx - barW / 2, topY + 14, barW, 11, 5);
      ctx.fill();
      const hpRatio = clamp(b.hp / b.maxHp, 0, 1);
      const hpGrad = ctx.createLinearGradient(cx - barW / 2, 0, cx + barW / 2, 0);
      if (b.cfg.wave === 1) {
        hpGrad.addColorStop(0, '#dc2626'); hpGrad.addColorStop(1, '#fb923c');
      } else {
        hpGrad.addColorStop(0, '#7e22ce'); hpGrad.addColorStop(1, '#e879f9');
      }
      ctx.fillStyle = hpGrad;
      roundRect(ctx, cx - barW / 2, topY + 14, Math.max(0, barW * hpRatio), 11, 5);
      ctx.fill();

      // Sea of Stars Lock-Break Row
      if (b.broken) {
        ctx.textAlign = 'center';
        ctx.font = 'bold 14px system-ui, sans-serif';
        ctx.fillStyle = '#fde047';
        ctx.fillText('✦ BREAK 碎冰破防中 · 易伤 +40% ✦', cx, topY + 54);
        ctx.font = '12px system-ui, sans-serif';
        ctx.fillStyle = '#bae6fd';
        ctx.fillText('本回合蓄力中断，无法行动', cx, topY + 73);
      } else {
        ctx.textAlign = 'left';
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.fillStyle = b.chargeLeft <= 1 ? '#fda4af' : '#cbd5e1';
        ctx.fillText(`⏳ ${b.chargeLeft}回合后 · ${b.intentName}`, cx - barW / 2, topY + 43);

        // Lock icons centered below
        const lockGap = 44;
        const startX = cx - ((b.locks.length - 1) * lockGap) / 2;
        const ly = topY + 63;

        b.locks.forEach((lk, idx) => {
          const lx = startX + idx * lockGap;
          const meta = LOCK_META[lk.type];

          ctx.save();
          ctx.translate(lx, ly);
          if (lk.broken) {
            ctx.globalAlpha = 0.28;
            ctx.fillStyle = '#1e293b';
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 1.5;
            roundRect(ctx, -16, -13, 32, 26, 6);
            ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#94a3b8';
            ctx.beginPath(); ctx.moveTo(-10, -8); ctx.lineTo(10, 8); ctx.stroke();
          } else {
            const pulse = 1 + 0.05 * Math.sin(state.realTime * 5 + idx);
            ctx.scale(pulse, pulse);
            ctx.fillStyle = meta.bg;
            ctx.strokeStyle = meta.color;
            ctx.lineWidth = 2;
            roundRect(ctx, -17, -14, 34, 28, 6);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = meta.color;
            ctx.font = 'bold 14px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(meta.label, 0, 1);
          }
          ctx.restore();
        });
      }
      ctx.restore();
    }

    function drawRhythmRing() {
      const r = state.rhythm;
      if (!r || r.resolved) return;

      const prog = clamp(r.t / r.windowEnd, 0, 1.15);
      const inWindow = r.t >= r.windowStart && r.t <= r.windowEnd;
      const targetR = 26;
      const outerR = Math.max(targetR - 4, 86 - prog * 62);

      ctx.save();
      ctx.translate(r.x, r.y);

      // Target sweet-spot ring
      ctx.strokeStyle = inWindow ? '#fde047' : 'rgba(125, 211, 252, 0.7)';
      ctx.lineWidth = inWindow ? 4 : 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, targetR, 0, Math.PI * 2);
      ctx.stroke();

      // Contracting timing ring
      ctx.strokeStyle = r.kind === 'parry'
        ? (inWindow ? '#67e8f9' : '#38bdf8')
        : (inWindow ? '#fef08a' : '#7dd3fc');
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, outerR, 0, Math.PI * 2);
      ctx.stroke();

      // Pixel diamond glint when in window
      if (inWindow) {
        ctx.fillStyle = 'rgba(254, 240, 138, 0.28)';
        ctx.beginPath(); ctx.arc(0, 0, targetR, 0, Math.PI * 2); ctx.fill();
      }

      // Prompt pill
      const label = r.kind === 'parry' ? '[SPACE / 点击] 冰镜格挡!' : '[SPACE / 点击] 节拍增幅!';
      ctx.font = 'bold 13px system-ui, sans-serif';
      const tw = ctx.measureText(label).width + 18;
      ctx.fillStyle = inWindow ? 'rgba(202, 138, 4, 0.92)' : 'rgba(8, 22, 42, 0.88)';
      ctx.strokeStyle = inWindow ? '#fef08a' : '#38bdf8';
      ctx.lineWidth = 1.5;
      roundRect(ctx, -tw / 2, -62, tw, 24, 6);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 0, -50);

      ctx.restore();
    }

    function drawTimeStopOverlay() {
      if (!state.timeStop.active) return;
      const t = state.realTime;

      // Top-left glacial instruction strip (zero overlap with Boss HUD on right)
      ctx.save();
      const text = `❄️ 冰宫时停 · ${state.timeStop.hint}`;
      ctx.font = 'bold 13px system-ui, sans-serif';
      const w = Math.min(636, ctx.measureText(text).width + 28);
      ctx.fillStyle = 'rgba(8, 28, 48, 0.94)';
      ctx.strokeStyle = '#67e8f9';
      ctx.lineWidth = 2;
      roundRect(ctx, 18, 16, w, 34, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e0f2fe';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 32, 33);

      // Direct clickable weakpoint reticles on the Boss!
      for (const wp of state.timeStop.reticles) {
        const isHover = state.timeStop.hoverWp === wp;
        const pulse = 1 + 0.1 * Math.sin(t * (wp.isReal ? 7 : 3.5));
        const rad = wp.radius * (isHover ? 1.18 : pulse);

        ctx.save();
        ctx.translate(wp.x, wp.y);

        // Crosshair glow
        ctx.fillStyle = wp.isReal
          ? (isHover ? 'rgba(250, 204, 21, 0.32)' : 'rgba(103, 232, 249, 0.22)')
          : 'rgba(148, 163, 184, 0.16)';
        ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();

        // Rotating pixel brackets
        ctx.rotate(t * (wp.isReal ? 1.6 : -0.7));
        ctx.strokeStyle = wp.isReal ? '#fde047' : '#94a3b8';
        ctx.lineWidth = wp.isReal ? 3 : 2;
        for (let k = 0; k < 4; k++) {
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.arc(0, 0, rad, -0.35, 0.35);
          ctx.stroke();
        }
        ctx.rotate(-t * (wp.isReal ? 1.6 : -0.7));

        // Center diamond
        ctx.fillStyle = wp.isReal ? '#fef08a' : '#cbd5e1';
        ctx.fillRect(-3, -3, 6, 6);

        // Reticle label
        ctx.font = wp.isReal ? 'bold 12px system-ui, sans-serif' : '12px system-ui, sans-serif';
        const lw = ctx.measureText(wp.label).width + 14;
        ctx.fillStyle = wp.isReal ? 'rgba(12, 36, 60, 0.94)' : 'rgba(15, 23, 42, 0.82)';
        ctx.strokeStyle = wp.isReal ? '#fde047' : 'rgba(148, 163, 184, 0.5)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, -lw / 2, rad + 6, lw, 22, 5);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = wp.isReal ? '#fef08a' : '#cbd5e1';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(wp.label, 0, rad + 17);

        ctx.restore();
      }
      ctx.restore();
    }

    function drawCutIn() {
      const c = state.cutIn;
      if (!c) return;
      const p = clamp(c.t / c.dur, 0, 1);

      ctx.save();
      // Dramatic glacial cut-in letterbox band
      const bandAlpha = p < 0.8 ? 0.55 : (1 - p) * 2.75;
      ctx.fillStyle = `rgba(4, 16, 36, ${bandAlpha})`;
      ctx.fillRect(0, 0, W, H);

      // Diagonal frost speed lines
      ctx.strokeStyle = `rgba(125, 211, 252, ${0.35 * (1 - p)})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 12; i++) {
        const ly = 50 + i * 36;
        const shift = (c.t * 900 + i * 70) % W;
        ctx.beginPath();
        ctx.moveTo(shift - 180, ly);
        ctx.lineTo(shift + 80, ly - 18);
        ctx.stroke();
      }

      if (c.type === 'ice_pillar') {
        // Wave 1 Cut-in: Massive pixel Ice Pillar erupting directly through Beatrice's flame sword!
        const rise = easeOutBack(clamp(p / 0.42, 0, 1));
        const px = c.targetX + 36;
        const py = GROUND_Y + 8;
        const ph = 270 * rise;

        ctx.fillStyle = '#0284c7';
        ctx.fillRect(px - 42, py - ph, 84, ph);
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(px - 32, py - ph - 18, 64, ph + 18);
        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(px - 14, py - ph - 32, 28, ph + 32);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(px - 4, py - ph - 36, 8, ph + 28);
        // Faceted ice spikes
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(px - 56, py - ph * 0.52, 18, ph * 0.52);
        ctx.fillRect(px + 38, py - ph * 0.65, 18, ph * 0.65);
      } else {
        // Wave 2 Cut-in: Twin Ice Mirrors clamping Rowan's 晦轮杖 silver ring!
        const clampProg = easeOutCubic(clamp(p / 0.38, 0, 1));
        const dist = 175 * (1 - clampProg) + 28;
        const mx = c.targetX - 54;
        const my = c.targetY - 148;

        [-1, 1].forEach((dir) => {
          ctx.save();
          ctx.translate(mx + dir * dist, my);
          ctx.fillStyle = 'rgba(14, 165, 233, 0.44)';
          ctx.strokeStyle = '#e0f2fe';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(0, -82);
          ctx.lineTo(dir * 22, -46);
          ctx.lineTo(dir * 22, 46);
          ctx.lineTo(0, 82);
          ctx.lineTo(-dir * 12, 52);
          ctx.lineTo(-dir * 12, -52);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-2, -60, 4, 120);
          ctx.restore();
        });

        // Clamped shockwave ring at moment of snap
        if (p >= 0.35) {
          const ringP = (p - 0.35) / 0.65;
          ctx.strokeStyle = `rgba(254, 240, 138, ${1 - ringP})`;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(mx, my, 24 + ringP * 135, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // Cut-In Title Ribbon
      const titlePop = easeOutBack(clamp(p / 0.25, 0, 1));
      ctx.save();
      ctx.translate(W / 2, 108);
      ctx.scale(titlePop, titlePop);
      ctx.fillStyle = 'rgba(6, 20, 42, 0.92)';
      ctx.strokeStyle = '#67e8f9';
      ctx.lineWidth = 2;
      roundRect(ctx, -180, -24, 360, 48, 8);
      ctx.fill(); ctx.stroke();
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.fillStyle = '#f0f9ff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`❄️ ${c.title}`, 0, 0);
      ctx.restore();

      ctx.restore();
    }

    function drawProjectilesAndVFX() {
      // Slashes / Spires / Mirror shields
      for (const sl of state.slashes) {
        const p = clamp(sl.t / sl.dur, 0, 1);
        ctx.save();
        ctx.globalAlpha = 1 - p;
        if (sl.kind === 'spire') {
          const sh = 210 * easeOutCubic(Math.min(1, p * 2.2));
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(sl.x - 36, sl.y - sh, 72, sh);
          ctx.fillStyle = '#e0f2fe';
          ctx.fillRect(sl.x - 16, sl.y - sh - 22, 32, sh + 22);
        } else if (sl.kind === 'mirror_shield') {
          ctx.translate(sl.x, sl.y);
          ctx.fillStyle = 'rgba(103, 232, 249, 0.35)';
          ctx.strokeStyle = '#e0f2fe';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, -68); ctx.lineTo(24, -36); ctx.lineTo(24, 36);
          ctx.lineTo(0, 68); ctx.lineTo(-14, 36); ctx.lineTo(-14, -36);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        } else {
          ctx.translate(sl.x, sl.y);
          ctx.rotate(sl.angle);
          ctx.fillStyle = sl.color;
          ctx.fillRect(-95, -4, 190, 8 * (1 - p * 0.5));
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-75, -2, 150, 3);
        }
        ctx.restore();
      }

      // Projectiles
      for (const pr of state.projectiles) {
        if (pr.t < 0) continue;
        ctx.save();
        if (pr.kind === 'mana_orb') {
          ctx.fillStyle = pr.color;
          ctx.fillRect(Math.round(pr.x - 5), Math.round(pr.y - 5), 10, 10);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(Math.round(pr.x - 2), Math.round(pr.y - 2), 4, 4);
        } else if (pr.kind === 'lance' || pr.kind === 'nova') {
          const ang = Math.atan2(pr.targetY - pr.startY, pr.targetX - pr.startX);
          ctx.translate(Math.round(pr.x), Math.round(pr.y));
          ctx.rotate(ang);
          ctx.fillStyle = '#0284c7';
          ctx.fillRect(-38, -7, 56, 14);
          ctx.fillStyle = '#7dd3fc';
          ctx.fillRect(-26, -5, 50, 10);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-10, -2, 38, 4);
        } else if (pr.kind === 'water' || pr.kind === 'reflect_shard') {
          ctx.fillStyle = '#38bdf8';
          ctx.fillRect(Math.round(pr.x - 16), Math.round(pr.y - 5), 26, 10);
          ctx.fillStyle = '#e0f2fe';
          ctx.fillRect(Math.round(pr.x - 6), Math.round(pr.y - 2), 18, 4);
        } else if (pr.kind === 'mirror') {
          ctx.translate(Math.round(pr.x), Math.round(pr.y));
          ctx.rotate(pr.t * 16);
          ctx.fillStyle = '#67e8f9';
          ctx.fillRect(-12, -12, 24, 24);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-5, -5, 10, 10);
        } else if (pr.kind === 'flame_arc') {
          ctx.fillStyle = '#ea580c';
          ctx.fillRect(Math.round(pr.x - 24), Math.round(pr.y - 16), 44, 32);
          ctx.fillStyle = '#fde047';
          ctx.fillRect(Math.round(pr.x - 14), Math.round(pr.y - 8), 28, 16);
        } else if (pr.kind === 'eclipse_beam') {
          ctx.strokeStyle = '#c084fc';
          ctx.lineWidth = 10;
          ctx.beginPath(); ctx.moveTo(pr.startX, pr.startY); ctx.lineTo(pr.x, pr.y); ctx.stroke();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(pr.startX, pr.startY); ctx.lineTo(pr.x, pr.y); ctx.stroke();
        }
        ctx.restore();
      }

      // Pixel particles
      for (const pt of state.particles) {
        const alpha = clamp(1 - pt.t / pt.dur, 0, 1);
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = alpha;
        ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawPopupsAndOverlays() {
      // Bounce-eased Damage / PERFECT / +MP Popups
      for (const pop of state.popups) {
        const p = clamp(pop.t / pop.dur, 0, 1);
        const sc = p < 0.22 ? easeOutBack(p / 0.22) : 1;
        const alpha = p > 0.72 ? (1 - p) / 0.28 : 1;

        ctx.save();
        ctx.translate(Math.round(pop.x), Math.round(pop.y));
        ctx.scale(sc, sc);
        ctx.globalAlpha = alpha;
        ctx.font = `900 ${pop.size}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#040915';
        ctx.strokeText(pop.text, 0, 0);
        ctx.fillStyle = pop.color;
        ctx.fillText(pop.text, 0, 0);
        ctx.restore();
      }

      // Character dialogue toast (non-blocking, crisp)
      if (state.quoteToast) {
        const q = state.quoteToast;
        const p = q.t / q.dur;
        const alpha = p < 0.1 ? p / 0.1 : p > 0.85 ? (1 - p) / 0.15 : 1;
        ctx.save();
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.font = 'bold 13px system-ui, sans-serif';
        const txt = `${q.speaker}：${q.text}`;
        const tw = Math.min(540, ctx.measureText(txt).width + 26);
        const qx = q.side === 'right' ? W - tw - 18 : 18;
        const qy = H - 46;
        ctx.fillStyle = 'rgba(8, 16, 32, 0.88)';
        ctx.strokeStyle = 'rgba(125, 211, 252, 0.45)';
        ctx.lineWidth = 1.5;
        roundRect(ctx, qx, qy, tw, 30, 8);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f1f5f9';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(txt, qx + 13, qy + 15);
        ctx.restore();
      }

      // Center Dramatic Banner (Wave intro / BREAK / ONE MORE)
      if (state.banner && !state.timeStop.active) {
        const bn = state.banner;
        const p = bn.t / bn.dur;
        const sc = p < 0.18 ? easeOutBack(p / 0.18) : 1;
        const alpha = p > 0.8 ? (1 - p) / 0.2 : 1;
        ctx.save();
        ctx.translate(W / 2, 156);
        ctx.scale(sc, sc);
        ctx.globalAlpha = clamp(alpha, 0, 1);
        ctx.fillStyle = 'rgba(6, 14, 28, 0.9)';
        ctx.strokeStyle = bn.color;
        ctx.lineWidth = 2;
        roundRect(ctx, -178, -30, 356, 60, 10);
        ctx.fill(); ctx.stroke();
        ctx.textAlign = 'center';
        ctx.font = '900 19px system-ui, sans-serif';
        ctx.fillStyle = bn.color;
        ctx.fillText(bn.text, 0, -4);
        ctx.font = '12px system-ui, sans-serif';
        ctx.fillStyle = '#e2e8f0';
        ctx.fillText(bn.sub, 0, 16);
        ctx.restore();
      }
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    // =========================================================================
    // 13. MAIN SIMULATION LOOP (Unscaled Real-Time Shake & Hit-Stop)
    // =========================================================================
    let lastTs = performance.now();

    function updateUnitTweens(unit, realDt) {
      if (unit.flashT > 0) unit.flashT = Math.max(0, unit.flashT - realDt);
      if (unit.scaleTween) {
        const tw = unit.scaleTween;
        tw.t += realDt;
        const k = clamp(tw.t / tw.dur, 0, 1);
        const e = easeOutBack(k);
        unit.scaleX = tw.fromX + (1 - tw.fromX) * e;
        unit.scaleY = tw.fromY + (1 - tw.fromY) * e;
        if (k >= 1) {
          unit.scaleX = 1;
          unit.scaleY = 1;
          unit.scaleTween = null;
        }
      }
    }

    function tick(now) {
      const realDt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;
      state.realTime += realDt;

      // Hit-stop countdown in REAL TIME (never stalls!)
      let timeScale = 1.0;
      if (state.hitStop.remaining > 0) {
        state.hitStop.remaining = Math.max(0, state.hitStop.remaining - realDt);
        timeScale = 0.04;
      }
      // Time-Stop freezes world simulation cleanly
      if (state.timeStop.active) {
        timeScale = 0.0;
        state.timeStop.frostAlpha = Math.min(1, state.timeStop.frostAlpha + realDt * 4.5);
      } else if (state.timeStop.frostAlpha > 0) {
        state.timeStop.frostAlpha = Math.max(0, state.timeStop.frostAlpha - realDt * 4.5);
      }

      const simDt = realDt * timeScale;
      state.simTime += simDt;

      // Trauma^2 camera shake decays in REAL TIME!
      const cam = state.camera;
      if (cam.trauma > 0) {
        cam.trauma = Math.max(0, cam.trauma - 1.45 * realDt);
        const strength = settings.reduceShake ? 0.15 : 1.0;
        const shake = cam.trauma * cam.trauma * strength;
        cam.t += realDt * 34;
        cam.offsetX = 13 * shake * (0.65 * Math.sin(cam.t * 1.7) + 0.35 * Math.sin(cam.t * 3.1));
        cam.offsetY = 9 * shake * (0.65 * Math.sin(cam.t * 2.3) + 0.35 * Math.sin(cam.t * 2.9));
        cam.roll = 0.016 * shake * Math.sin(cam.t * 1.3);
        if (cam.trauma <= 0) {
          cam.offsetX = 0; cam.offsetY = 0; cam.roll = 0;
        }
      }

      // Unit idle breathing & blink (paused during Time-Stop)
      if (simDt > 0) {
        const breathFrame = Math.floor(state.simTime * 2.4) % 2 === 0 ? 'idle1' : 'idle2';
        state.blinkTimer -= simDt;
        if (state.sylvia.pose === 'idle1' || state.sylvia.pose === 'idle2' || state.sylvia.pose === 'blink') {
          if (state.blinkTimer <= 0) {
            state.sylvia.pose = 'blink';
            if (state.blinkTimer <= -0.14) state.blinkTimer = 2.8 + Math.random() * 2.0;
          } else {
            state.sylvia.pose = breathFrame;
          }
        }

        state.bossBlinkTimer -= simDt;
        if (state.boss.pose === 'idle1' || state.boss.pose === 'idle2' || state.boss.pose === 'blink') {
          if (state.bossBlinkTimer <= 0) {
            state.boss.pose = 'blink';
            if (state.bossBlinkTimer <= -0.14) state.bossBlinkTimer = 3.1 + Math.random() * 2.2;
          } else {
            state.boss.pose = breathFrame;
          }
        }

        // Record Rowan's half-beat lagging moon-shadow history
        if (state.boss.cfg.wave === 2) {
          state.boss.lagHistory.push({ x: state.boss.x, y: state.boss.y, pose: state.boss.pose });
          if (state.boss.lagHistory.length > 10) state.boss.lagHistory.shift();
        }

        // Ambient snow & embers move only when time flows
        for (const sn of state.ambientSnow) {
          sn.x += sn.vx * simDt;
          sn.y += sn.vy * simDt;
          if (sn.y > H) { sn.y = -4; sn.x = Math.random() * W; }
          if (sn.x < -4) sn.x = W + 4;
        }
        for (const em of state.ambientEmbers) {
          em.x += em.vx * simDt;
          em.y += em.vy * simDt;
          em.life += simDt * 0.45;
          if (em.life >= 1) {
            em.life = 0;
            em.x = 560 + Math.random() * 380;
            em.y = 330 + Math.random() * 110;
          }
        }
      }

      // Real-time tweens (flashes, squash/stretch, popups, banners, cut-ins)
      updateUnitTweens(state.sylvia, realDt);
      updateUnitTweens(state.boss, realDt);

      // Timed Cast / Ice-Mirror Parry progression
      if (state.rhythm && !state.rhythm.resolved) {
        const r = state.rhythm;
        r.t += realDt;
        if (settings.autoRhythm && !r.autoFired && r.t >= (r.windowStart + r.windowEnd) * 0.48) {
          r.autoFired = true;
          triggerRhythmAction();
        } else if (r.t >= r.dur) {
          r.resolved = true;
          const cb = r.onResolve;
          state.rhythm = null;
          cb(false);
        }
      }

      // Projectiles update
      for (let i = state.projectiles.length - 1; i >= 0; i--) {
        const pr = state.projectiles[i];
        pr.t += realDt;
        if (pr.t < 0) continue;
        const k = clamp(pr.t / pr.dur, 0, 1);
        if (pr.kind === 'mana_orb') {
          const inv = 1 - k;
          pr.x = inv * inv * pr.startX + 2 * inv * k * pr.ctrlX + k * k * pr.targetX;
          pr.y = inv * inv * pr.startY + 2 * inv * k * pr.ctrlY + k * k * pr.targetY;
        } else {
          pr.x = pr.startX + (pr.targetX - pr.startX) * easeOutCubic(k);
          pr.y = pr.startY + (pr.targetY - pr.startY) * easeOutCubic(k);
        }
        if (k >= 1) {
          if (pr.onHit) pr.onHit();
          state.projectiles.splice(i, 1);
        }
      }

      // Particles update (freeze during Time-Stop for maximum drama!)
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const pt = state.particles[i];
        if (!state.timeStop.active) {
          pt.t += realDt;
          pt.x += pt.vx * realDt;
          pt.y += pt.vy * realDt;
          pt.vy += pt.gravity * realDt;
        }
        if (pt.t >= pt.dur) state.particles.splice(i, 1);
      }

      for (let i = state.slashes.length - 1; i >= 0; i--) {
        state.slashes[i].t += realDt;
        if (state.slashes[i].t >= state.slashes[i].dur) state.slashes.splice(i, 1);
      }

      for (let i = state.popups.length - 1; i >= 0; i--) {
        const pop = state.popups[i];
        pop.t += realDt;
        pop.x += pop.vx * realDt;
        pop.y += pop.vy * realDt;
        pop.vy *= Math.pow(0.18, realDt);
        if (pop.t >= pop.dur) state.popups.splice(i, 1);
      }

      if (state.cutIn) {
        state.cutIn.t += realDt;
      }
      if (state.banner) {
        state.banner.t += realDt;
        if (state.banner.t >= state.banner.dur) state.banner = null;
      }
      if (state.quoteToast) {
        state.quoteToast.t += realDt;
        if (state.quoteToast.t >= state.quoteToast.dur) state.quoteToast = null;
      }

      // Render frame
      renderFrame();
      requestAnimationFrame(tick);
    }

    function renderFrame() {
      ctx.save();
      ctx.clearRect(0, 0, W, H);

      // Apply Trauma^2 camera offset + roll
      if (state.camera.offsetX !== 0 || state.camera.offsetY !== 0 || state.camera.roll !== 0) {
        ctx.translate(W / 2 + state.camera.offsetX, H / 2 + state.camera.offsetY);
        ctx.rotate(state.camera.roll);
        ctx.translate(-W / 2, -H / 2);
      }

      drawStageBackground(state.simTime);

      // Draw fighters
      const frostActive = state.timeStop.frostAlpha > 0.35;
      drawPixelUnit(state.sylvia, SPRITES.sylvia_silver, {
        shield: state.sylvia.shield,
        frostMode: false, // Sylvia stays crisp & sovereign inside her Ice Palace!
      });
      drawOrbitingBoostCrystals(state.sylvia, state.sylvia.boost, state.realTime);

      if (state.boss.hp > 0 || state.cutIn) {
        drawPixelUnit(state.boss, SPRITES[state.boss.cfg.spriteKey], {
          staggered: state.boss.broken,
          frostMode: frostActive,
          lagShadow: state.boss.cfg.wave === 2,
        });
      }

      drawProjectilesAndVFX();
      drawBossDiegeticHUD();
      drawRhythmRing();
      drawCutIn();
      drawTimeStopOverlay();
      drawPopupsAndOverlays();

      ctx.restore();
    }

    // =========================================================================
    // 14. INTERACTION WIRING (Buttons, Keyboard, Direct Canvas Click)
    // =========================================================================
    function getCanvasCoords(ev) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((ev.clientX - rect.left) / rect.width) * W,
        y: ((ev.clientY - rect.top) / rect.height) * H,
      };
    }

    canvas.addEventListener('mousemove', (ev) => {
      if (!state.timeStop.active) return;
      const pt = getCanvasCoords(ev);
      let found = null;
      for (const wp of state.timeStop.reticles) {
        if (Math.hypot(pt.x - wp.x, pt.y - wp.y) <= wp.radius + 12) {
          found = wp;
          break;
        }
      }
      state.timeStop.hoverWp = found;
    });

    canvas.addEventListener('click', (ev) => {
      SFX.ensure();
      if (state.timeStop.active) {
        const pt = getCanvasCoords(ev);
        for (const wp of state.timeStop.reticles) {
          if (Math.hypot(pt.x - wp.x, pt.y - wp.y) <= wp.radius + 18) {
            resolveTimeStopWeakpoint(wp);
            return;
          }
        }
        return;
      }
      if (state.rhythm && !state.rhythm.resolved) {
        triggerRhythmAction();
      }
    });

    document.querySelectorAll('#skill-grid .skill-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        SFX.ensure();
        executeSkill(btn.dataset.skill);
      });
    });

    document.getElementById('btn-boost-plus').addEventListener('click', () => { SFX.ensure(); adjustBoost(1); });
    document.getElementById('btn-boost-minus').addEventListener('click', () => { SFX.ensure(); adjustBoost(-1); });
    document.getElementById('btn-timestop').addEventListener('click', () => { SFX.ensure(); enterTimeStop(); });
    document.getElementById('btn-restart').addEventListener('click', () => { SFX.ensure(); resetBattle(); });
    document.getElementById('btn-play-again').addEventListener('click', () => { SFX.ensure(); resetBattle(); });

    const autoBtn = document.getElementById('btn-auto-rhythm');
    autoBtn.addEventListener('click', () => {
      settings.autoRhythm = !settings.autoRhythm;
      autoBtn.classList.toggle('active', settings.autoRhythm);
      autoBtn.textContent = `自动节拍: ${settings.autoRhythm ? '开' : '关'}`;
      setTicker(settings.autoRhythm ? '已开启「自动节拍」：施法增幅与冰镜格挡将自动完美触发。' : '已关闭「自动节拍」：可手动按 SPACE / 点击挑战精准节拍。');
    });

    const shakeBtn = document.getElementById('btn-reduce-shake');
    shakeBtn.addEventListener('click', () => {
      settings.reduceShake = !settings.reduceShake;
      shakeBtn.classList.toggle('active', settings.reduceShake);
      shakeBtn.textContent = `减弱震屏: ${settings.reduceShake ? '开' : '关'}`;
    });

    const sfxBtn = document.getElementById('btn-sfx');
    sfxBtn.addEventListener('click', () => {
      settings.sfx = !settings.sfx;
      SFX.enabled = settings.sfx;
      sfxBtn.classList.toggle('active', settings.sfx);
      sfxBtn.textContent = `音效: ${settings.sfx ? '开' : '关'}`;
    });

    window.addEventListener('keydown', (ev) => {
      if (ev.repeat) return;
      const k = ev.key.toLowerCase();
      if (ev.code === 'Space') {
        ev.preventDefault();
        SFX.ensure();
        if (state.rhythm && !state.rhythm.resolved) {
          triggerRhythmAction();
        }
        return;
      }
      if (k === 'e') { SFX.ensure(); adjustBoost(1); }
      else if (k === 'q') { SFX.ensure(); adjustBoost(-1); }
      else if (k === 'f') { SFX.ensure(); enterTimeStop(); }
      else if (k === '1') { SFX.ensure(); executeSkill('water_arrows'); }
      else if (k === '2') { SFX.ensure(); executeSkill('frost_lance'); }
      else if (k === '3') { SFX.ensure(); executeSkill('mirror_sever'); }
      else if (k === '4') { SFX.ensure(); executeSkill('mana_cycle'); }
    });

    // Live theme synchronization listener
    function syncTheme() {
      state.isLightTheme = document.documentElement.classList.contains('light');
    }
    window.addEventListener('themechange', syncTheme);
    syncTheme();

    // Clean inspection bridge for automated QA verification
    window.__DEMO4__ = {
      getState: () => ({
        wave: state.boss.cfg.wave,
        bossName: state.boss.cfg.name,
        bossHp: state.boss.hp,
        bossBroken: state.boss.broken,
        locks: state.boss.locks.map((l) => ({ type: l.type, broken: l.broken })),
        phase: state.phase,
        sylviaHp: state.sylvia.hp,
        sylviaMp: state.sylvia.mp,
        cp: state.sylvia.cp,
        boost: state.sylvia.boost,
        insight: state.sylvia.insight,
        timeStopActive: state.timeStop.active,
        reticles: state.timeStop.reticles.map((r) => ({ id: r.id, x: r.x, y: r.y, isReal: r.isReal })),
        rhythmActive: Boolean(state.rhythm && !state.rhythm.resolved),
        spritesLoaded: Object.keys(SPRITES).map((k) => ({ id: k, w: SPRITES[k].w, h: SPRITES[k].h, frames: SPRITES[k].frameCount })),
        cameraTrauma: state.camera.trauma,
        hitStopRemaining: state.hitStop.remaining,
        stats: { ...state.stats },
      }),
    };

    // Boot Wave 1
    initWave(0);
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
