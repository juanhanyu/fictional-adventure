<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>转生千金 · 方案4 旗舰融合终极版</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    body {
      margin: 0;
      padding: 0;
      background: var(--background, #08101e);
      color: var(--foreground, #e8f3ff);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .demo-shell {
      max-width: 1000px;
      margin: 0 auto;
      padding: 6px 12px 10px;
    }

    .glass-surface {
      background: var(--card, #0f1b2e);
      border: 1px solid var(--card-border, rgba(125, 211, 252, 0.22));
    }

    .sub-panel {
      background: var(--content, rgba(8, 16, 32, 0.55));
      border: 1px solid var(--card-border, rgba(125, 211, 252, 0.2));
    }

    .stage-frame {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border, rgba(125, 211, 252, 0.3));
      background: #060b16;
      box-shadow: 0 10px 28px rgba(3, 8, 20, 0.42);
    }

    #battle-canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 960 / 440;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: default;
    }

    #battle-canvas.timestop-aim {
      cursor: crosshair;
    }

    .skill-btn {
      position: relative;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease;
      background: var(--content, rgba(15, 28, 48, 0.92));
      border: 1px solid var(--card-border, rgba(125, 211, 252, 0.22));
      color: var(--foreground, #e8f3ff);
    }

    .skill-btn:not(:disabled):hover {
      transform: translateY(-2px);
      border-color: var(--primary, #38bdf8);
    }

    .skill-btn:not(:disabled):active {
      transform: translateY(1px) scale(0.98);
    }

    .skill-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .boost-pip {
      width: 13px;
      height: 13px;
      transform: rotate(45deg);
      border-radius: 2px;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.18s ease, box-shadow 0.18s ease;
      border: 1.5px solid rgba(148, 197, 255, 0.45);
      background: rgba(15, 28, 48, 0.55);
    }

    .boost-pip.filled {
      background: #38bdf8;
      border-color: #bae6fd;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.75);
    }

    .boost-pip.queued {
      background: #fde047;
      border-color: #fef9c3;
      box-shadow: 0 0 11px rgba(250, 204, 21, 0.95);
      transform: rotate(45deg) scale(1.18);
    }

    .toggle-pill {
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      border: 1px solid var(--card-border, rgba(125, 211, 252, 0.25));
      background: var(--content, rgba(15, 28, 48, 0.75));
      color: var(--muted-foreground, #94a3b8);
    }

    .toggle-pill.active {
      border-color: var(--primary, #38bdf8);
      background: rgba(56, 189, 248, 0.18);
      color: var(--foreground, #e8f3ff);
    }

    @keyframes pulse-frost {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55), inset 0 0 12px rgba(186, 230, 253, 0.25); }
      50% { box-shadow: 0 0 18px 2px rgba(56, 189, 248, 0.9), inset 0 0 18px rgba(224, 242, 254, 0.45); }
    }

    .timestop-ready {
      animation: pulse-frost 1.5s infinite ease-in-out;
      border-color: #7dd3fc !important;
      background: linear-gradient(135deg, rgba(14, 116, 144, 0.92), rgba(37, 99, 235, 0.85)) !important;
      color: #f0f9ff !important;
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid currentColor;
    }

    .lock-water { color: #60a5fa; background: rgba(37, 99, 235, 0.18); }
    .lock-ice { color: #67e8f9; background: rgba(8, 145, 178, 0.2); }
    .lock-break { color: #facc15; background: rgba(202, 138, 4, 0.2); }

    .accent-hp { color: #6ee7b7; }
    .accent-mp { color: #7dd3fc; }
    .accent-ice { color: #67e8f9; }
    .accent-gold { color: #fcd34d; }

    html.light .lock-water { color: #1d4ed8; background: rgba(37, 99, 235, 0.12); }
    html.light .lock-ice { color: #0e7490; background: rgba(8, 145, 178, 0.12); }
    html.light .lock-break { color: #a16207; background: rgba(202, 138, 4, 0.14); }
    html.light .accent-hp { color: #047857; }
    html.light .accent-mp { color: #0369a1; }
    html.light .accent-ice { color: #0e7490; }
    html.light .accent-gold { color: #b45309; }
    html.light .boost-pip { background: rgba(203, 213, 225, 0.65); border-color: rgba(100, 116, 139, 0.55); }
    html.light .bar-track { background: rgba(226, 232, 240, 0.9); border-color: rgba(148, 163, 184, 0.45); }

    .bar-track {
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.2);
      overflow: hidden;
      border-radius: 999px;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(4, 10, 22, 0.72);
      backdrop-filter: blur(4px);
      z-index: 30;
    }

    .hidden-el { display: none !important; }
  </style>
</head>
<body class="antialiased">
  <div class="demo-shell space-y-2">
    <!-- Top Compact Header Bar -->
    <header class="glass-surface rounded-xl px-3 py-1.5 flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="px-2 py-0.5 rounded-md text-xs font-bold tracking-wide bg-sky-500/15 accent-mp border border-sky-400/40">
          方案 4 · 旗舰融合
        </span>
        <span id="wave-pill" class="text-xs font-semibold text-[var(--foreground)]">
          WAVE 1/2 · 贝阿特丽丝（11岁烈焰剑士）
        </span>
        <span id="phase-pill" class="px-2 py-0.5 rounded-full text-xs font-bold bg-cyan-500/15 accent-ice border border-cyan-400/35">
          我方回合
        </span>
      </div>
      <div class="flex items-center gap-1.5 flex-wrap">
        <button id="btn-auto-rhythm" type="button" class="toggle-pill px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer" title="开启后自动触发节拍增幅与冰镜格挡">
          自动节拍: 关
        </button>
        <button id="btn-reduce-shake" type="button" class="toggle-pill px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer" title="减弱镜头震动与强闪光效果">
          减弱震屏: 关
        </button>
        <button id="btn-sfx" type="button" class="toggle-pill active px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer" title="切换 Web Audio 合成音效">
          音效: 开
        </button>
        <button id="btn-restart" type="button" class="toggle-pill px-2.5 py-1 rounded-lg text-xs font-semibold cursor-pointer hover:border-sky-400" title="重新开始二连战">
          重开
        </button>
      </div>
    </header>

    <!-- Main Interactive Pixel Canvas Stage -->
    <div class="stage-frame">
      <canvas id="battle-canvas" width="960" height="440" aria-label="转生千金旗舰融合战斗画布"></canvas>

      <!-- Clean Result Overlay (Victory / Defeat) -->
      <div id="result-overlay" class="modal-backdrop hidden-el">
        <div class="glass-surface rounded-2xl p-5 max-w-md w-[90%] text-center space-y-3 shadow-2xl">
          <div id="result-badge" class="inline-block px-3 py-1 rounded-full text-xs font-bold bg-sky-500/20 accent-mp border border-sky-400/40">
            二连战完全制霸
          </div>
          <h2 id="result-title" class="text-xl font-bold text-[var(--foreground)]">
            冰晶终局 · 评价 S+
          </h2>
          <p id="result-quote" class="text-xs text-[var(--muted-foreground)] leading-relaxed">
            「节拍、魔战循环与冰宫洞察全部咬合。这一局，滴水不漏。」
          </p>
          <div id="result-stats" class="grid grid-cols-3 gap-2 pt-1 text-xs">
            <div class="sub-panel rounded-lg p-2">
              <div class="text-[var(--muted-foreground)]">破锁次数</div>
              <div id="stat-breaks" class="text-base font-bold accent-ice tabular-nums">0</div>
            </div>
            <div class="sub-panel rounded-lg p-2">
              <div class="text-[var(--muted-foreground)]">完美节拍</div>
              <div id="stat-perfects" class="text-base font-bold accent-gold tabular-nums">0</div>
            </div>
            <div class="sub-panel rounded-lg p-2">
              <div class="text-[var(--muted-foreground)]">冰宫时停</div>
              <div id="stat-timestops" class="text-base font-bold accent-mp tabular-nums">0</div>
            </div>
          </div>
          <button id="btn-play-again" type="button" class="w-full py-2.5 rounded-xl text-sm font-bold bg-sky-500 hover:bg-sky-400 text-slate-950 transition cursor-pointer">
            再战一局（贝阿特丽丝 → 罗文）
          </button>
        </div>
      </div>
    </div>

    <!-- Single Sleek Command Deck (Zero Clutter) -->
    <section class="glass-surface rounded-xl p-2.5 space-y-2">
      <!-- Live 1-line Tactical Ticker -->
      <div class="flex items-center justify-between gap-2 pb-1.5 border-b border-[var(--card-border)] text-xs">
        <div id="battle-ticker" class="font-medium text-[var(--foreground)] truncate">
          希尔维亚已就位 · 观察上方蓄力锁，叠加「极寒倾注」并伺机发动「冰宫时停」直点破绽。
        </div>
        <div class="hidden sm:flex items-center gap-2 text-[var(--muted-foreground)] shrink-0">
          <span>[1-4]施法</span>
          <span>[Q/E]倾注</span>
          <span>[SPACE]节拍/格挡</span>
          <span>[F]冰宫时停</span>
        </div>
      </div>

      <!-- 3-Column Harmonized Controls -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-2 items-stretch">
        <!-- Left: Sylvia Core Status + Pillar 3 Ice Palace Time-Stop -->
        <div class="lg:col-span-3 sub-panel rounded-lg p-2 flex flex-col justify-between gap-1.5">
          <div class="space-y-1">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-[var(--foreground)]">希尔维亚</span>
              <span id="sylvia-shield-tag" class="text-xs font-semibold accent-ice tabular-nums">霜盾 0</span>
            </div>
            <!-- HP -->
            <div class="space-y-0.5">
              <div class="flex justify-between text-xs tabular-nums">
                <span class="text-[var(--muted-foreground)]">生命 HP</span>
                <span id="sylvia-hp-text" class="font-semibold accent-hp">320 / 320</span>
              </div>
              <div class="bar-track h-1.5">
                <div id="sylvia-hp-bar" class="bar-fill bg-gradient-to-r from-emerald-500 to-teal-300" style="width:100%"></div>
              </div>
            </div>
            <!-- MP -->
            <div class="space-y-0.5">
              <div class="flex justify-between text-xs tabular-nums">
                <span class="text-[var(--muted-foreground)]">魔力 MP</span>
                <span id="sylvia-mp-text" class="font-semibold accent-mp">120 / 120</span>
              </div>
              <div class="bar-track h-1.5">
                <div id="sylvia-mp-bar" class="bar-fill bg-gradient-to-r from-blue-500 to-cyan-300" style="width:100%"></div>
              </div>
            </div>
            <!-- Insight -->
            <div class="space-y-0.5">
              <div class="flex justify-between text-xs tabular-nums">
                <span class="text-[var(--muted-foreground)]">冰宫洞察</span>
                <span id="insight-text" class="font-semibold accent-ice">50%</span>
              </div>
              <div class="bar-track h-1.5">
                <div id="insight-bar" class="bar-fill bg-gradient-to-r from-indigo-400 via-sky-300 to-cyan-200" style="width:50%"></div>
              </div>
            </div>
          </div>

          <button id="btn-timestop" type="button" disabled class="w-full py-1.5 px-2 rounded-lg text-xs font-bold border border-cyan-500/40 bg-cyan-500/15 accent-ice transition cursor-pointer disabled:opacity-45 disabled:cursor-not-allowed">
            ❄️ 冰宫时停 [F] · 需 100%
          </button>
        </div>

        <!-- Center: 4 Tactical Skills -->
        <div class="lg:col-span-6 grid grid-cols-2 gap-2" id="skill-grid">
          <button data-skill="water_arrows" type="button" class="skill-btn rounded-lg p-2 text-left flex flex-col justify-between gap-1 cursor-pointer">
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-xs text-[var(--foreground)]">[1] 水箭连缀</span>
              <span class="lock-badge lock-water">水</span>
            </div>
            <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] tabular-nums">
              <span class="accent-mp font-semibold">+25 MP · +1 CP</span>
              <span class="skill-dmg-preview font-semibold text-[var(--foreground)]">威力 44</span>
            </div>
          </button>

          <button data-skill="frost_lance" type="button" class="skill-btn rounded-lg p-2 text-left flex flex-col justify-between gap-1 cursor-pointer">
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-xs text-[var(--foreground)]">[2] 极寒冰枪</span>
              <span class="lock-badge lock-ice">冰</span>
            </div>
            <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] tabular-nums">
              <span class="accent-ice font-semibold">耗 28 MP</span>
              <span class="skill-dmg-preview font-semibold text-[var(--foreground)]">威力 72</span>
            </div>
          </button>

          <button data-skill="mirror_sever" type="button" class="skill-btn rounded-lg p-2 text-left flex flex-col justify-between gap-1 cursor-pointer">
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-xs text-[var(--foreground)]">[3] 镜冰截断</span>
              <span class="lock-badge lock-break">断</span>
            </div>
            <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] tabular-nums">
              <span class="accent-gold font-semibold">耗 34 MP · +35盾</span>
              <span class="skill-dmg-preview font-semibold text-[var(--foreground)]">威力 58</span>
            </div>
          </button>

          <button data-skill="mana_cycle" type="button" class="skill-btn rounded-lg p-2 text-left flex flex-col justify-between gap-1 cursor-pointer">
            <div class="flex items-center justify-between gap-1">
              <span class="font-bold text-xs text-[var(--foreground)]">[4] 绝对零度·循环</span>
              <div class="flex gap-1">
                <span class="lock-badge lock-water">水</span>
                <span class="lock-badge lock-ice">冰</span>
              </div>
            </div>
            <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] tabular-nums">
              <span class="accent-ice font-semibold">耗 52 MP · 100%回蓝</span>
              <span class="skill-dmg-preview font-semibold text-[var(--foreground)]">威力 94</span>
            </div>
          </button>
        </div>

        <!-- Right: Pillar 2 3-Tier Glacial Boost + CP Crystal Pips -->
        <div class="lg:col-span-3 sub-panel rounded-lg p-2 flex flex-col justify-between gap-1.5">
          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-[var(--foreground)]">极寒倾注 CP</span>
              <span id="cp-readout" class="font-bold accent-mp tabular-nums">2 / 5</span>
            </div>
            <div id="cp-pips" class="flex items-center justify-between px-2 py-1.5 rounded-lg bg-[var(--card)] border border-[var(--card-border)]">
              <span class="boost-pip"></span>
              <span class="boost-pip"></span>
              <span class="boost-pip"></span>
              <span class="boost-pip"></span>
              <span class="boost-pip"></span>
            </div>
            <div id="boost-effect-line" class="text-xs text-[var(--muted-foreground)] leading-snug">
              当前倍率 <span class="font-bold text-[var(--foreground)]">×1.0</span> · 倾注激活 100% 回蓝循环
            </div>
          </div>

          <div class="flex items-center gap-1.5">
            <button id="btn-boost-minus" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border border-[var(--card-border)] bg-[var(--card)] text-[var(--foreground)] hover:border-sky-400 disabled:opacity-40 cursor-pointer">
              - [Q]
            </button>
            <button id="btn-boost-plus" type="button" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-bold border border-sky-400/50 bg-sky-500/20 accent-mp hover:bg-sky-500/30 disabled:opacity-40 cursor-pointer">
              + 倾注 ×0 [E]
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>

        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const flt = ctx.createBiquadFilter();
        flt.type = 'highpass';
        flt.frequency.value = highpass;
        const g = ctx.createGain();
        const t0 = ctx.currentTime + delay;
        g.gain.setValueAtTime(gainVal, t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        src.connect(flt);
        flt.connect(g);
        g.connect(ctx.destination);
        src.start(t0);
      }

    function breakBossLocks(typesToBreak, extraCount = 0) {
      const b = state.boss;
      if (b.broken) return { brokenNow: 0, triggeredFullBreak: false };

      let brokenNow = 0;
      for (const reqType of typesToBreak) {
        const target = b.locks.find((lk) => !lk.broken && lk.type === reqType);
        if (target) {
          target.broken = true;
          target.shatterT = 0.45;
          brokenNow++;
        }
      }
      // Boost ≥ 2 grants extra lock smash on matching or remaining lock
      for (let e = 0; e < extraCount; e++) {
        const target = b.locks.find((lk) => !lk.broken && typesToBreak.includes(lk.type))
          || b.locks.find((lk) => !lk.broken);
        if (target) {
          target.broken = true;
          target.shatterT = 0.45;
          brokenNow++;
        }
      }

      if (brokenNow > 0) {
        addInsight(brokenNow * 25);
        spawnPixelBurst(b.x, b.y - 256, 12 * brokenNow, ['#e0f2fe', '#38bdf8', '#facc15', '#ffffff'], 90, 220, 4, 240);
      }

      const allBroken = b.locks.length > 0 && b.locks.every((lk) => lk.broken);
      if (allBroken && !b.broken) {
        b.broken = true;
        state.stats.breaks += 1;
        state.oneMoreQueued = true;
        state.sylvia.cp = Math.min(state.sylvia.maxCp, state.sylvia.cp + 1);
        b.pose = 'hurt';
        SFX.lockBreak(true);
        addTrauma(0.72);
        triggerHitStop(0.105);
        showBanner('BREAK · 碎冰崩解！', '⚡ ONE MORE 再动已激活 · 敌方破防 (+40% 易伤)', '#fde047', 1.45);
