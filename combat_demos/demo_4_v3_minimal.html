<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《转生千金》V3 极简雪瓷蓝白战斗系统</title>
<style>
  :root {
    /* V3 Snow-Porcelain Blue-White Design System */
    --porcelain: rgba(248, 252, 255, 0.88);
    --porcelain-hi: rgba(250, 253, 255, 0.94);
    --porcelain-solid: #FFFFFF;
    --ice-tint: #ECF3FC;
    --ice-track: #E2ECF7;

    --ink: #1B2333;
    --ink-soft: #384760;
    --ink-muted: #64748B;
    --ink-silver: #94A3B8;

    --sapphire: #1658EB;
    --sapphire-deep: #0E3FA8;
    --sapphire-soft: rgba(22, 88, 235, 0.10);
    --glacier: #0EA5E9;
    --glacier-soft: rgba(14, 165, 233, 0.14);

    --ice-border: rgba(22, 88, 235, 0.16);
    --ice-border-hi: rgba(14, 165, 233, 0.45);
    --hairline: rgba(27, 35, 51, 0.10);

    --crimson: #E11D48;
    --crimson-soft: rgba(225, 29, 72, 0.12);
    --emerald: #059669;
    --emerald-hi: #10B981;
    --amber: #D97706;

    --shadow-float: 0 8px 26px rgba(12, 28, 56, 0.16), 0 1px 3px rgba(12, 28, 56, 0.08);
    --shadow-dock: 0 14px 40px rgba(10, 24, 52, 0.22), 0 2px 6px rgba(10, 24, 52, 0.10);
    --inset-spec: inset 0 1px 0 rgba(255, 255, 255, 0.88);

    --font-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    --font-serif: "Noto Serif SC", "Songti SC", serif;
    --font-num: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0B1528;
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  /* ==================== FULL-BLEED OPEN BATTLE STAGE ==================== */
  .stage-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #0B1528;
  }

  #battle-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* Whisper-light V3 crystalline edge sheen to unify dark moonlit stage with snow-porcelain HUD */
  .stage-sheen {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, rgba(248, 252, 255, 0.08) 0%, transparent 18%, transparent 78%, rgba(240, 247, 255, 0.12) 100%);
    z-index: 2;
  }

  /* ==================== TOP-LEFT ULTRA-CLEAN HSR AV BAR (~64px) ==================== */
  .av-track {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 62px;
    padding: 9px 0;
    border-radius: 31px;
    background: var(--porcelain);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 1px var(--ice-border), var(--shadow-float), var(--inset-spec);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    z-index: 15;
  }

  .av-node {
    position: relative;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease;
  }

  .av-node.ghost {
    opacity: 0.56;
  }

  .av-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 35%, #FFFFFF, #DCEBFC);
    border: 1.5px solid rgba(22, 88, 235, 0.26);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .av-node.enemy .av-avatar {
    background: radial-gradient(circle at 50% 35%, #FFF5F7, #FBDCE4);
    border-color: rgba(225, 29, 72, 0.32);
  }

  .av-node.acting .av-avatar {
    border: 2px solid var(--sapphire);
    box-shadow: 0 0 0 3px rgba(22, 88, 235, 0.18);
  }

  .av-node.enemy.acting .av-avatar {
    border: 2px solid var(--crimson);
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.18);
  }

  .av-node.ghost .av-avatar {
    border-style: dashed;
    border-color: rgba(22, 88, 235, 0.32);
  }

  .av-avatar canvas {
    width: 36px;
    height: 36px;
    image-rendering: pixelated;
  }

  .av-badge {
    position: absolute;
    right: -5px;
    bottom: -3px;
    min-width: 21px;
    height: 16px;
    padding: 0 4px;
    border-radius: 999px;
    background: #FFFFFF;
    border: 1px solid rgba(22, 88, 235, 0.24);
    color: var(--ink);
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 800;
    line-height: 14px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(15, 35, 70, 0.14);
  }

  .av-node.acting .av-badge {
    background: var(--sapphire);
    border-color: var(--sapphire);
    color: #FFFFFF;
  }

  .av-node.enemy.acting .av-badge {
    background: var(--crimson);
    border-color: var(--crimson);
    color: #FFFFFF;
  }

  .av-node.flash-onemore {
    animation: avPop 0.65s ease;
  }
  .av-node.flash-delay {
    animation: avSlide 0.65s ease;
  }
  @keyframes avPop {
    0% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }
  @keyframes avSlide {
    0% { transform: translateY(-5px); }
    45% { transform: translateY(6px); }
    100% { transform: translateY(0); }
  }

  /* Subtle floating micro-tag shown ONLY on hover or active Break/Delay */
  .av-micro-tag {
    position: absolute;
    left: calc(100% + 10px);
    top: 50%;
    transform: translateY(-50%);
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--porcelain-hi);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--ice-border-hi);
    color: var(--sapphire);
    font-family: var(--font-num);
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(12, 28, 56, 0.16);
    pointer-events: none;
    animation: tagIn 0.16s ease-out;
  }

  .av-micro-tag.gold {
    border-color: rgba(217, 119, 6, 0.45);
    color: #B45309;
    background: rgba(255, 251, 235, 0.94);
  }

  @keyframes tagIn {
    from { opacity: 0; transform: translate(-4px, -50%); }
    to { opacity: 1; transform: translate(0, -50%); }
  }

  /* ==================== TOP-CENTER ULTRA-SLIM CAPSULE ==================== */
  .top-capsule {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    height: 36px;
    padding: 0 6px 0 14px;
    border-radius: 999px;
    background: var(--porcelain);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 1px var(--ice-border), var(--shadow-float), var(--inset-spec);
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 15;
  }

  .cap-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .turn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sapphire);
    box-shadow: 0 0 0 3px rgba(22, 88, 235, 0.18);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .turn-dot.onemore {
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.22);
  }
  .turn-dot.enemy {
    background: var(--crimson);
    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.22);
  }

  .cap-divider {
    width: 1px;
    height: 14px;
    background: var(--hairline);
  }

  .cap-actions {
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .cap-btn {
    height: 24px;
    min-width: 26px;
    padding: 0 7px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--font-num);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .cap-btn svg {
    width: 13px;
    height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
  }

  .cap-btn:hover {
    background: var(--sapphire-soft);
    color: var(--sapphire);
  }

  .cap-btn.mode-pill {
    background: var(--ice-tint);
    border-color: var(--ice-border);
    padding: 0 8px;
    gap: 2px;
    color: var(--ink-silver);
  }
  .cap-btn.mode-pill:hover {
    border-color: var(--sapphire);
  }
  .cap-btn.mode-pill .m-hi {
    color: var(--sapphire);
    font-weight: 900;
  }

  .cap-btn.muted {
    opacity: 0.45;
  }

  /* ==================== TOP-RIGHT MINIMAL ENEMY STRIP ==================== */
  .enemy-strip {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 264px;
    padding: 9px 13px 10px;
    border-radius: 16px;
    background: var(--porcelain);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.72);
    box-shadow: 0 0 0 1px var(--ice-border), var(--shadow-float), var(--inset-spec);
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 15;
    transition: box-shadow 0.2s ease;
  }

  .enemy-strip.broken {
    box-shadow: 0 0 0 1.5px var(--glacier), 0 8px 28px rgba(14, 165, 233, 0.24), var(--inset-spec);
  }

  .enemy-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .enemy-id-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .enemy-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
  }

  .locks-wrap {
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }

  .lock-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 6px;
    font-size: 10.5px;
    font-weight: 800;
    line-height: 1;
    transition: all 0.2s ease;
  }

  .lock-chip.water {
    background: rgba(22, 88, 235, 0.12);
    border: 1px solid rgba(22, 88, 235, 0.36);
    color: var(--sapphire);
  }

  .lock-chip.ice {
    background: rgba(14, 165, 233, 0.13);
    border: 1px solid rgba(14, 165, 233, 0.42);
    color: #0284C7;
  }

  .lock-chip.shattered {
    opacity: 0.24;
    transform: scale(0.84);
    text-decoration: line-through;
    filter: grayscale(0.8);
  }

  .enemy-hp-num {
    font-family: var(--font-num);
    font-size: 11.5px;
    font-weight: 800;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .enemy-state-dot {
    font-size: 10px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 999px;
    background: rgba(14, 165, 233, 0.14);
    color: #0284C7;
    white-space: nowrap;
  }
  .enemy-state-dot.broken {
    background: rgba(217, 119, 6, 0.14);
    color: #B45309;
  }

  .bar-track {
    width: 100%;
    height: 5px;
    border-radius: 999px;
    background: var(--ice-track);
    overflow: hidden;
    position: relative;
  }

  .bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .bar-fill.enemy-hp {
    background: linear-gradient(90deg, #E11D48, #FB7185);
  }
  .enemy-strip.broken .bar-fill.enemy-hp {
    background: linear-gradient(90deg, #0284C7, #38BDF8);
  }

  .bar-fill.enemy-hp-lag {
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: rgba(225, 29, 72, 0.26);
    transition: width 0.65s ease;
  }

  /* ==================== FLOATING STAGE CALLOUTS (TRANSIENT ONLY) ==================== */
  .center-banner {
    position: absolute;
    top: 66px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    padding: 7px 18px;
    border-radius: 999px;
    background: var(--porcelain-hi);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--ice-border-hi);
    box-shadow: var(--shadow-float), var(--inset-spec);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 18;
  }
  .center-banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .center-banner.gold {
    border-color: rgba(217, 119, 6, 0.55);
    background: rgba(255, 252, 240, 0.94);
  }
  .center-banner .cb-main {
    font-size: 13.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    color: var(--sapphire);
  }
  .center-banner.gold .cb-main {
    color: #B45309;
  }

  .parry-prompt {
    position: absolute;
    bottom: 146px;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 20px;
    border-radius: 999px;
    background: var(--porcelain-hi);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1.5px solid var(--sapphire);
    color: var(--sapphire);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.3px;
    box-shadow: 0 8px 28px rgba(22, 88, 235, 0.30), var(--inset-spec);
    display: none;
    z-index: 20;
    cursor: pointer;
  }
  .parry-prompt.show {
    display: block;
    animation: parryPulse 0.42s ease infinite alternate;
  }
  @keyframes parryPulse {
    from { transform: translateX(-50%) scale(0.98); }
    to { transform: translateX(-50%) scale(1.04); }
  }

  /* ==================== V3 SNOW-PORCELAIN BOTTOM DOCK (112px <= 132px) ==================== */
  .bottom-dock {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: min(1140px, calc(100vw - 32px));
    height: 112px;
    padding: 12px 16px;
    border-radius: 16px;
    background: var(--porcelain);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.78);
    border-top: 2px solid var(--sapphire);
    box-shadow: 0 0 0 1px var(--ice-border), var(--shadow-dock), var(--inset-spec);
    display: grid;
    grid-template-columns: 202px 1fr 224px;
    gap: 14px;
    align-items: center;
    z-index: 15;
  }

  /* Left: Compact Hero Vitals */
  .dock-hero {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 7px;
    padding-right: 12px;
    border-right: 1px solid var(--hairline);
    height: 100%;
  }

  .hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .hero-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: 0.2px;
  }

  .hero-pills {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .shield-pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 7px;
    border-radius: 999px;
    background: var(--ice-tint);
    border: 1px solid var(--ice-border);
    font-family: var(--font-num);
    font-size: 10.5px;
    font-weight: 800;
    color: var(--ink-muted);
    transition: all 0.2s ease;
  }
  .shield-pill.active {
    background: rgba(14, 165, 233, 0.14);
    border-color: rgba(14, 165, 233, 0.45);
    color: #0284C7;
  }

  .buff-dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: rgba(14, 165, 233, 0.16);
    border: 1px solid rgba(14, 165, 233, 0.42);
    color: #0284C7;
    font-size: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .vital-row {
    display: grid;
    grid-template-columns: 22px 1fr 30px;
    align-items: center;
    gap: 7px;
  }

  .vital-tag {
    font-family: var(--font-num);
    font-size: 10px;
    font-weight: 800;
    color: var(--ink-muted);
    letter-spacing: 0.3px;
  }

  .vital-num {
    font-family: var(--font-num);
    font-size: 11px;
    font-weight: 800;
    color: var(--ink);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .bar-fill.hp {
    background: linear-gradient(90deg, #059669, #34D399);
  }
  .bar-fill.mp {
    background: linear-gradient(90deg, #1658EB, #38BDF8);
  }
  .bar-fill.mp-preview {
    position: absolute;
    top: 0; right: 0; height: 100%;
    background: rgba(217, 119, 6, 0.48);
  }

  /* Center: 4 Sleek Horizontal Porcelain-White Skill Tiles */
  .dock-skills {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
    height: 100%;
  }

  .skill-tile {
    position: relative;
    height: 100%;
    padding: 10px 12px;
    border-radius: 11px;
    background: var(--porcelain-solid);
    border: 1px solid rgba(27, 35, 51, 0.11);
    box-shadow: 0 2px 6px rgba(15, 35, 70, 0.05);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: left;
    cursor: pointer;
    font-family: var(--font-ui);
    color: var(--ink);
    transition: border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .skill-tile:hover:not(:disabled) {
    border-color: var(--sapphire);
    transform: translateY(-2px);
    box-shadow: 0 7px 18px rgba(22, 88, 235, 0.15);
  }

  .skill-tile:active:not(:disabled) {
    transform: translateY(0);
  }

  .skill-tile.overload-ready {
    border: 1.5px solid var(--sapphire);
    background: linear-gradient(180deg, #F0F7FF 0%, #FFFFFF 100%);
    box-shadow: 0 4px 14px rgba(14, 165, 233, 0.18);
  }

  .skill-tile:disabled {
    opacity: 0.42;
    cursor: not-allowed;
    box-shadow: none;
  }

  .sk-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .sk-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sk-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .elem-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .elem-dot.water { background: var(--sapphire); }
  .elem-dot.ice { background: var(--glacier); }
  .elem-dot.shield { background: #0D9488; }

  .sk-overload-mark {
    font-size: 10px;
    font-weight: 800;
    color: var(--sapphire);
    line-height: 1;
  }

  .sk-bottom {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }

  .sk-cost {
    font-family: var(--font-num);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .sk-cost.gain {
    color: var(--emerald);
  }

  .sk-dmg {
    font-family: var(--font-num);
    font-size: 15.5px;
    font-weight: 900;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
  }
  .sk-dmg.boosted {
    color: var(--sapphire);
  }

  /* Right: Compact 魔力增幅 4-Step Segmented Pill */
  .dock-amp {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
    padding-left: 12px;
    border-left: 1px solid var(--hairline);
    height: 100%;
  }

  .amp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .amp-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: 0.2px;
  }

  .amp-readout {
    font-family: var(--font-num);
    font-size: 11px;
    font-weight: 800;
    color: var(--sapphire);
    font-variant-numeric: tabular-nums;
  }

  .amp-seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    background: var(--ice-tint);
    border: 1px solid var(--ice-border);
  }

  .amp-step {
    height: 30px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--font-num);
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.16s ease;
  }

  .amp-step:hover:not(.active) {
    background: rgba(255, 255, 255, 0.78);
    color: var(--sapphire);
  }

  .amp-step.active {
    background: linear-gradient(135deg, var(--sapphire), var(--glacier));
    color: #FFFFFF;
    box-shadow: 0 2px 8px rgba(22, 88, 235, 0.28);
  }

  /* ==================== V3 SNOW-PORCELAIN VICTORY MODAL ==================== */
  .victory-overlay {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15, 28, 52, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .victory-overlay.open { display: flex; }
  .victory-card {
    width: 360px;
    padding: 26px 28px;
    border-radius: 18px;
    background: var(--porcelain-hi);
    border: 1px solid rgba(255, 255, 255, 0.85);
    border-top: 2.5px solid var(--sapphire);
    box-shadow: 0 24px 60px rgba(10, 24, 52, 0.28);
    text-align: center;
  }
  .victory-card h2 {
    font-family: var(--font-serif);
    font-size: 20px;
    font-weight: 800;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .victory-card p {
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.6;
    margin-bottom: 18px;
  }
  .victory-btn {
    padding: 9px 24px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--sapphire), var(--glacier));
    color: #FFFFFF;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(22, 88, 235, 0.28);
  }
  .victory-btn:hover { filter: brightness(1.06); }
</style>
</head>
<body>
<main class="stage-root" id="stage-root">
  <!-- FULL-BLEED OPEN BATTLE CANVAS -->
  <canvas id="battle-canvas" width="1280" height="800"></canvas>
  <div class="stage-sheen"></div>

  <!-- TOP-LEFT ULTRA-CLEAN HSR AV TRACK (~62px) -->
  <aside class="av-track" id="av-track" aria-label="行动序列"></aside>

  <!-- TOP-CENTER WHISPER-THIN CAPSULE -->
  <header class="top-capsule">
    <div class="cap-status">
      <span class="turn-dot" id="turn-dot"></span>
      <span id="wave-label">W1/2 · 贝阿特丽丝</span>
    </div>
    <span class="cap-divider"></span>
    <div class="cap-actions">
      <button class="cap-btn" id="btn-sfx" title="音效开关" aria-label="音效开关"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg></button>
      <button class="cap-btn mode-pill" id="btn-mode" title="增幅模式 A（双段曲线+质变） / B（线性对照）"><span class="m-hi">A</span>/<span>B</span></button>
      <button class="cap-btn" id="btn-wave" title="无缝疾跑转场至下一波">→W2</button>
      <button class="cap-btn" id="btn-reset" title="重开战斗" aria-label="重开"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"></path><polyline points="21 3 21 9 15 9"></polyline></svg></button>
    </div>
  </header>

  <!-- TOP-RIGHT MINIMAL ENEMY STRIP -->
  <aside class="enemy-strip" id="enemy-strip">
    <div class="enemy-row">
      <div class="enemy-id-wrap">
        <span class="enemy-name" id="enemy-name">贝阿特丽丝</span>
        <div class="locks-wrap" id="enemy-locks"></div>
        <span class="enemy-state-dot" id="enemy-state-dot" style="display:none"></span>
      </div>
      <span class="enemy-hp-num" id="enemy-hp-text">460</span>
    </div>
    <div class="bar-track">
      <div class="bar-fill enemy-hp-lag" id="enemy-hp-lag" style="width:100%"></div>
      <div class="bar-fill enemy-hp" id="enemy-hp-bar" style="width:100%"></div>
    </div>
  </aside>

  <!-- TRANSIENT CENTER CALLOUT -->
  <div class="center-banner" id="center-banner">
    <div class="cb-main" id="cb-main"></div>
  </div>

  <!-- ACTIVE PARRY PROMPT -->
  <button class="parry-prompt" id="parry-prompt">⚡ [SPACE] 冰镜招架</button>

  <!-- SNOW-PORCELAIN BLUE-WHITE BOTTOM DOCK (112px) -->
  <section class="bottom-dock" aria-label="战斗指令栏">
    <!-- LEFT: COMPACT VITALS -->
    <div class="dock-hero">
      <div class="hero-top">
        <span class="hero-name">希尔维亚</span>
        <div class="hero-pills">
          <span class="buff-dot" id="buff-fountain" style="display:none" title="寒泉共鸣：增幅耗蓝减半">💧</span>
          <span class="buff-dot" id="buff-mirror" style="display:none" title="霜刺反镜：受击自动反击">❄</span>
          <span class="shield-pill" id="hero-shield"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span id="hero-shield-val">0</span></span>
        </div>
      </div>

      <div class="vital-row">
        <span class="vital-tag">HP</span>
        <div class="bar-track"><div class="bar-fill hp" id="hero-hp-bar" style="width:100%"></div></div>
        <span class="vital-num" id="hero-hp-text">340</span>
      </div>

      <div class="vital-row">
        <span class="vital-tag">MP</span>
        <div class="bar-track">
          <div class="bar-fill mp" id="hero-mp-bar" style="width:100%"></div>
          <div class="bar-fill mp-preview" id="hero-mp-preview" style="width:0%"></div>
        </div>
        <span class="vital-num" id="hero-mp-text">200</span>
      </div>
    </div>

    <!-- CENTER: 4 HORIZONTAL PORCELAIN SKILL TILES -->
    <div class="dock-skills" id="skills-grid"></div>

    <!-- RIGHT: COMPACT 4-STEP SEGMENTED MANA AMP -->
    <div class="dock-amp">
      <div class="amp-head">
        <span class="amp-title">魔力增幅</span>
        <span class="amp-readout" id="amp-readout">0%</span>
      </div>
      <div class="amp-seg" id="amp-seg" role="group" aria-label="魔力增幅档位">
        <button class="amp-step active" data-amp="0">0%</button>
        <button class="amp-step" data-amp="20">+20%</button>
        <button class="amp-step" data-amp="40">+40%</button>
        <button class="amp-step" data-amp="60">+60%</button>
      </div>
    </div>
  </section>

  <!-- VICTORY MODAL -->
  <section class="victory-overlay" id="victory-overlay">
    <div class="victory-card">
      <h2>❄ 日蚀破除 · 胜利</h2>
      <p>贝阿特丽丝的烈焰试炼与罗文的晦轮月蚀均已瓦解。</p>
      <button class="victory-btn" id="btn-victory-replay">再战一轮</button>
    </div>
  </section>
</main>

  const BANK_CHARS = '.abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&()_+-=<>?[]{}|~';
  const CHAR_TO_IDX = new Map();

    if (!hex || hex.length < 7) return [0, 0, 0];

      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),

    const palRgb = bank.palette.map(hexToRgb);

    const flashFrames = [];
    const frostFrames = [];

    for (let f = 0; f < bank.frames.length; f++) {

      const ctxN = cN.getContext('2d'); const imgN = ctxN.createImageData(w, h);

        convolver.buffer = this._createIceHallIR(0.28);
        this.wetBus = this.ctx.createGain();
        this.wetBus.gain.value = 0.22;
        this.wetBus.connect(convolver);
        convolver.connect(this.master);

        this.whiteBuf = this._createNoiseBuffer(2.0, false);
        this.pinkBuf = this._createNoiseBuffer(2.0, true);
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return true;
    }

    _makeSoftClipCurve(k) {
      const n = 2048;
      const curve = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = (i * 2) / n - 1;
        curve[i] = Math.tanh(k * x) / Math.tanh(k);
      }
      return curve;
    }

    _createIceHallIR(duration) {
      const sr = this.ctx.sampleRate;
      const len = Math.floor(sr * duration);
      const buf = this.ctx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const data = buf.getChannelData(ch);
        let lp = 0;
        for (let i = 0; i < len; i++) {
          const t = i / len;
          const env = Math.pow(1 - t, 2.7);
          const white = Math.random() * 2 - 1;
          lp = lp * 0.42 + white * 0.58;
          const hp = white - lp * 0.35;
          data[i] = hp * env * 0.45;
        }
        const taps = ch === 0 ? [0.012, 0.029, 0.053] : [0.015, 0.034, 0.058];
        taps.forEach((sec, idx) => {
          const p = Math.floor(sec * sr);
          if (p < len) data[p] += (0.52 - idx * 0.14) * (idx % 2 ? -1 : 1);
        });
      }
      return buf;
    }

    _createNoiseBuffer(seconds, isPink) {
      const sr = this.ctx.sampleRate;
      const len = Math.floor(sr * seconds);
      const buf = this.ctx.createBuffer(2, len, sr);
      for (let ch = 0; ch < 2; ch++) {
        const d = buf.getChannelData(ch);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < len; i++) {
          const w = Math.random() * 2 - 1;
          if (!isPink) {
            d[i] = w;
          } else {
            b0 = 0.99886 * b0 + w * 0.0555179;
            b1 = 0.99332 * b1 + w * 0.0750759;
            b2 = 0.96900 * b2 + w * 0.1538520;
            b3 = 0.86650 * b3 + w * 0.3104856;
            b4 = 0.55000 * b4 + w * 0.5329522;
            b5 = -0.7616 * b5 - w * 0.0168980;
            d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.13;
            b6 = w * 0.115926;
          }
        }
      }
      return buf;
    }

    _playWhoosh(t0, dur, fStart, fEnd, gainVal, q = 2.2) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.pinkBuf;
      const flt = this.ctx.createBiquadFilter();
      flt.type = 'bandpass';
      flt.Q.value = q;
      flt.frequency.setValueAtTime(fStart, t0);
      flt.frequency.exponentialRampToValueAtTime(Math.max(40, fEnd), t0 + dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gainVal, t0 + dur * 0.65);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(flt); flt.connect(g);
      g.connect(this.dryBus); g.connect(this.wetBus);
      src.start(t0, Math.random() * 0.8, dur + 0.02);
    }

    _playSubPunch(t0, fStart, fEnd, dur, gainVal) {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(fStart, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(24, fEnd), t0 + dur);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(gainVal, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(this.saturator);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    _playIceCrack(t0, crackGain, popCount = 5, baseFreq = 3200) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.whiteBuf;
      const hp = this.ctx.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1850;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(crackGain, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.016);
      src.connect(hp); hp.connect(g);
      g.connect(this.dryBus); g.connect(this.wetBus);
      src.start(t0, Math.random(), 0.03);

      for (let i = 0; i < popCount; i++) {
        const dt = 0.014 + i * 0.013 + Math.random() * 0.012;
        const pSrc = this.ctx.createBufferSource();
        pSrc.buffer = this.whiteBuf;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = baseFreq + Math.random() * 3400;
        bp.Q.value = 5.5 + Math.random() * 4;
        const pg = this.ctx.createGain();
        const amp = crackGain * (0.58 - i * 0.06);
        pg.gain.setValueAtTime(0.0001, t0 + dt);
        pg.gain.linearRampToValueAtTime(Math.max(0.05, amp), t0 + dt + 0.002);
        pg.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.022);
        pSrc.connect(bp); bp.connect(pg);
        pg.connect(this.dryBus); pg.connect(this.wetBus);
        pSrc.start(t0 + dt, Math.random(), 0.035);
      }
    }

    _playCrystalFM(t0, baseHz, dur, gainVal, ratios = [1.0, 2.756, 5.404]) {
      ratios.forEach((ratio, idx) => {
        const car = this.ctx.createOscillator();
        const mod = this.ctx.createOscillator();
        const modG = this.ctx.createGain();
        const outG = this.ctx.createGain();
        const f = baseHz * ratio;
        car.type = 'sine'; car.frequency.setValueAtTime(f, t0);
        mod.type = 'sine'; mod.frequency.setValueAtTime(f * 1.414, t0);
        modG.gain.setValueAtTime(f * 0.22, t0);
        modG.gain.exponentialRampToValueAtTime(2.0, t0 + dur * 0.45);
        const level = gainVal * (idx === 0 ? 0.55 : idx === 1 ? 0.30 : 0.16);
        const pDur = dur * (1 - idx * 0.2);
        outG.gain.setValueAtTime(0.0001, t0);
        outG.gain.linearRampToValueAtTime(level, t0 + 0.003);
        outG.gain.exponentialRampToValueAtTime(0.0001, t0 + pDur);
        mod.connect(modG); modG.connect(car.frequency);
        car.connect(outG); outG.connect(this.dryBus); outG.connect(this.wetBus);
        car.start(t0); mod.start(t0);
        car.stop(t0 + pDur + 0.03); mod.stop(t0 + pDur + 0.03);
      });
    }

    play(type, opts = {}) {

          drop.connect(dg); dg.connect(this.dryBus); dg.connect(this.wetBus);
          drop.start(now + 0.015); drop.stop(now + 0.095);
          this._playIceCrack(now + 0.02, 0.42 * power, 3, 2600);

          lp.frequency.exponentialRampToValueAtTime(1400, now + 0.07);
          lp.frequency.exponentialRampToValueAtTime(220, now + 0.26);
          const fg = this.ctx.createGain();
          fg.gain.setValueAtTime(0.0001, now);
          fg.gain.linearRampToValueAtTime(0.75, now + 0.04);
          fg.gain.exponentialRampToValueAtTime(0.0001, now + 0.27);
          src.connect(lp); lp.connect(fg); fg.connect(this.saturator); fg.connect(this.wetBus);
          src.start(now, Math.random() * 0.5, 0.3);
          this._playWhoosh(now, 0.09, 520, 2600, 0.45, 2.4);
          this._playSubPunch(now + 0.03, 134, 35, 0.14, 0.8);

        case 'amp_charge': {

          this._playCrystalFM(now, base, 0.24, 0.18 + pct * 0.0022);

          const src = this.ctx.createBufferSource();
          src.buffer = this.whiteBuf;
          const bp = this.ctx.createBiquadFilter();
          bp.type = 'bandpass'; bp.frequency.value = 2600 * alt; bp.Q.value = 2.8;
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.22, now);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 0.022);
          src.connect(bp); bp.connect(g); g.connect(this.dryBus);
          src.start(now, Math.random(), 0.03);
          break;

        case 'ui_tick': {
          this._playCrystalFM(now, opts.high ? 1120 : 820, 0.14, 0.16);
          break;
        }
        case 'prop_trigger': {
          this._playWhoosh(now, 0.16, 360, 2200, 0.45, 2.0);

          this._playCrystalFM(now + 0.03, 880, 0.30, 0.26);
          break;
        }
      }
    }

  // =========================================================================
  // 5. FORMULA & SKILL EVALUATION
  // =========================================================================
  function calcAmpBonusRatio(ampPct, mode) {
    if (mode === 'A') {
      const first = Math.min(30, ampPct);
      const extra = Math.max(0, ampPct - 30);
      return (first * 1.0 + extra * 0.5) / 100;
    }
    return (ampPct * 0.5) / 100;
  }

  function calcAmpMpCost(ampPct) {
    let raw = Math.round(state.sylvia.maxMp * (ampPct / 100));
    if (state.sylvia.fountainTurns > 0) raw = Math.round(raw * 0.5);
    return raw;
  }

  function evaluateSkill(skill, ampPct = state.ampPct, mode = state.formulaMode) {
    const ampMp = calcAmpMpCost(ampPct);
    const totalCost = skill.baseCost + ampMp;
    const overload = (mode === 'A') && (ampPct >= skill.threshold);
    const ampRatio = calcAmpBonusRatio(ampPct, mode);

    let mult = 1 + ampRatio;
    if (overload && skill.id === 'water_arrows') mult *= 1.32;
    if (overload && skill.id === 'ice_lance') mult *= 1.22;
    if (overload && skill.id === 'abs_zero') mult *= 1.24;

    if (state.enemy && state.enemy.wetTurns > 0) mult *= 1.15;
    if (state.enemy && state.enemy.broken) mult *= 1.35;

    const estDmg = Math.round(skill.baseDmg * mult);

    const breakElements = [...skill.breaks];
    if (overload && skill.id === 'water_arrows') breakElements.push('water');

    let predictedBrokenCount = 0;
    let willBreakAll = false;
    if (state.enemy && !state.enemy.broken) {
      const rem = state.enemy.locks.map(l => ({ ...l }));
      for (const el of breakElements) {
        const hit = rem.find(l => !l.broken && l.type === el);
        if (hit) { hit.broken = true; predictedBrokenCount++; }
      }
      willBreakAll = rem.length > 0 && rem.every(l => l.broken);
    }

    const extraDelayPct = (overload && skill.id === 'ice_lance') ? 25 : 0;
    const totalDelayPct = (willBreakAll ? 45 : 0) + extraDelayPct;
    const shieldGain = skill.shield ? (overload && skill.id === 'mirror_cut' ? skill.shield * 2 : skill.shield) : 0;
    const mpRefund = (overload && skill.id === 'abs_zero') ? Math.round(totalCost * 0.6) : 0;

    return {
      totalCost,
      ampMp,
      overload,
      estDmg,
      predictedBrokenCount,
      willBreakAll,
      extraDelayPct,
      totalDelayPct,
      shieldGain,
      mpRefund,
      canAfford: state.sylvia.mp >= totalCost
    };
  }
