        y1: cy - Math.sin(ang) * len * 0.5,
        x2: cx + Math.cos(ang) * len * 0.65,
        y2: cy + Math.sin(ang) * len * 0.65,
        w: 2 + Math.random() * 3,
        life: 0.36,
        maxLife: 0.36
      });
    }
  }

  function spawnShockwave(x, y, maxR, color, lineWidth = 4, dur = 0.34) {
    state.shockwaves.push({ x, y, r: 10, maxR, color, lineWidth, life: dur, maxLife: dur });
  }

  function spawnPopup(x, y, text, color = '#ffffff', size = 26, subText = '') {
    state.popups.push({
      x: x + (Math.random() - 0.5) * 24,
      y,
      vy: -92,
      text,
      subText,
      color,
      size,
      life: 1.0,
      maxLife: 1.0
    });
  }

  function spawnDirectionalShards(x, y, dirX, count, palette, speedMult = 1.0) {
    for (let i = 0; i < count; i++) {
      const spread = (Math.random() - 0.5) * 1.45;
      const baseAngle = dirX >= 0 ? spread : Math.PI + spread;
      const spd = (180 + Math.random() * 380) * speedMult;
      state.particles.push({
        x, y,
        vx: Math.cos(baseAngle) * spd,
        vy: Math.sin(baseAngle) * spd - 65,
        gravity: 540,
        size: 3 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 14,
        color: palette[i % palette.length],
        shape: Math.random() < 0.72 ? 'shard' : 'spark',
        life: 0.36 + Math.random() * 0.36,
        maxLife: 0.72
      });
    }
  }

  function spawnImpactStar(x, y, radius, color) {
    state.particles.push({
      x, y, vx: 0, vy: 0, gravity: 0,
      size: radius,
      color,
      shape: 'starburst',
      life: 0.16,
      maxLife: 0.16
    });
  }

  function applyActorHit(actor, { knockPx = 22, flashSec = 0.068, hurtPoseSec = 0.34, squash = true } = {}) {
    const dir = actor === state.enemy ? 1 : -1;
    actor.knockX = dir * knockPx;
    actor.knockV = dir * knockPx * 4.5;
    actor.flashTimer = flashSec;
    actor.pose = 'hurt';
    actor.poseTimer = hurtPoseSec;
    if (squash) {
      actor.scaleX = 1.2;
      actor.scaleY = 0.84;
    }
  }

  // =========================================================================
  // 8. COMBAT EXECUTION
  // =========================================================================
  function getAnchorWorld(actor, anchorName) {
    const sp = SPRITES[actor.spriteKey];
    if (!sp) return { x: actor.x, y: actor.y - 100 };
    const scale = 2;
    const feet = sp.anchors.feet;
    const anc = sp.anchors[anchorName] || sp.anchors.hit;
    const dx = (anc[0] - feet[0]) * scale;
    const dy = (anc[1] - feet[1]) * scale;
    return { x: actor.x + actor.knockX + dx, y: actor.y + dy };
  }

  function launchProjectile(cfg) {
    return new Promise(resolve => {
      state.projectiles.push({
        ...cfg,
        t: 0,
        done: false,
        onImpact: () => {
          if (cfg.onImpact) cfg.onImpact();
          resolve();
        }
      });
    });
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  async function executeSkill(skillId) {
    if (state.phase !== 'player' || state.busy) return;
    const skill = SKILLS.find(s => s.id === skillId);
    if (!skill) return;

    const evalInfo = evaluateSkill(skill);
    if (!evalInfo.canAfford) {
      showBanner(`MP不足 (${evalInfo.totalCost})`, false, 1100);
      return;
    }

    state.busy = true;
    state.phase = 'animating';
    state.hoveredSkillId = null;
    updateAllUI();

    const s = state.sylvia;
    const e = state.enemy;
    const ampUsed = state.ampPct;

    s.mp = Math.max(0, s.mp - evalInfo.totalCost);
    if (s.fountainTurns > 0) s.fountainTurns--;

    s.pose = 'windup';
    audio.play('amp_charge', { ampPct: Math.max(12, ampUsed) });
    await sleep(110);
    s.pose = 'cast_step';
    await sleep(90);
    s.pose = 'strike';

    const start = getAnchorWorld(s, 'cast');
    const target = getAnchorWorld(e, 'hit');
    const totalDmg = evalInfo.estDmg;
    const isOverload = evalInfo.overload;
    const autoProp = (ampUsed >= 20 && state.prop.cd === 0);

    if (skill.id === 'water_arrows') {
      const count = isOverload ? 5 : 3;
      const perHit = Math.round(totalDmg / count);
      const promises = [];
      for (let i = 0; i < count; i++) {
        await sleep(i === 0 ? 0 : 62);
        const arc = (i - (count - 1) / 2) * 34;
        const isLast = (i === count - 1);
        promises.push(launchProjectile({
          kind: 'water_arrow',
          x0: start.x, y0: start.y + (i - 1) * 8,
          x1: target.x, y1: target.y + (Math.random() - 0.5) * 32,
          arcY: arc - 28,
          dur: 0.24,
          color: isOverload ? '#8ef5ff' : '#4ec2ff',
          scale: isOverload ? 1.25 : 1.0,
          onImpact: () => {
            audio.play('water_arrow', { boosted: isOverload });
            triggerHitStop(isLast ? (isOverload ? 85 : 52) : 34);
            addTrauma(isLast ? 0.36 : 0.22);
            applyActorHit(e, { knockPx: isLast ? 20 : 12, flashSec: 0.062 });
            spawnImpactStar(target.x, target.y, isLast ? 48 : 30, '#a6f3ff');
            spawnShockwave(target.x, target.y, isLast ? 76 : 44, '#5cd6ff', isLast ? 4 : 2.5);
            spawnDirectionalShards(target.x, target.y, 1, isLast ? 16 : 8, ['#ffffff', '#79e4ff', '#3fa9ff'], 1.0);
            dealEnemyDamage(perHit, false, isLast && isOverload ? '激流齐射' : '');
          }
        }));
      }
      await Promise.all(promises);
      s.mp = Math.min(s.maxMp, s.mp + skill.mpGain);
      spawnPopup(s.x, s.y - 210, `+${skill.mpGain} MP`, '#6ee7b7', 17);
    } else if (skill.id === 'ice_lance') {
      await launchProjectile({
        kind: isOverload ? 'giant_lance' : 'ice_lance',
        x0: start.x - 14, y0: start.y - 6,
        x1: target.x, y1: target.y,
        arcY: -8,
        dur: isOverload ? 0.26 : 0.22,
        color: isOverload ? '#d8fbff' : '#7ae8ff',
        scale: isOverload ? 1.55 : 1.15,
        onImpact: () => {
          audio.play('ice_lance', { boosted: isOverload });
          triggerHitStop(isOverload ? 115 : 88);
          addTrauma(isOverload ? 0.68 : 0.48);
          applyActorHit(e, { knockPx: isOverload ? 32 : 24, flashSec: 0.072 });
          spawnImpactStar(target.x, target.y, isOverload ? 82 : 58, '#ffffff');
          spawnShockwave(target.x, target.y, isOverload ? 132 : 94, '#8cf0ff', isOverload ? 6 : 4.5);
          spawnDirectionalShards(target.x, target.y, 1, isOverload ? 32 : 20, ['#ffffff', '#b8f7ff', '#62d4ff', '#2c8eff'], 1.25);
          dealEnemyDamage(totalDmg, false, isOverload ? '贯月巨枪' : '');
        }
      });
    } else if (skill.id === 'mirror_cut') {
      await launchProjectile({
        kind: 'mirror_slash',
        x0: start.x + 20, y0: start.y,
        x1: target.x, y1: target.y,
        arcY: -18,
        dur: 0.21,
        color: '#b4f4ff',
        scale: isOverload ? 1.4 : 1.1,
        onImpact: () => {
          audio.play('parry_clang');
          triggerHitStop(isOverload ? 95 : 64);
          addTrauma(isOverload ? 0.52 : 0.38);
          applyActorHit(e, { knockPx: 22, flashSec: 0.068 });
          spawnImpactStar(target.x, target.y, 64, '#e6fbff');
          spawnShockwave(target.x, target.y, 98, '#a0eeff', 4.5);
          spawnDirectionalShards(target.x, target.y, 1, 22, ['#ffffff', '#c5f7ff', '#68d5ff'], 1.1);
          dealEnemyDamage(totalDmg, false, isOverload ? '双镜反刺' : '');
        }
      });
      s.shield += evalInfo.shieldGain;
      spawnShockwave(s.x, s.y - 110, 105, '#7de6ff', 3.5);
      spawnPopup(s.x, s.y - 216, `+${evalInfo.shieldGain} 盾`, '#8ae8ff', 17);
      if (isOverload) s.counterMirror = true;
    } else if (skill.id === 'abs_zero') {
      const hits = isOverload ? 4 : 2;
      const perHit = Math.round(totalDmg / hits);
      const promises = [];
      for (let i = 0; i < hits; i++) {
        await sleep(i === 0 ? 0 : 72);
        const fromX = target.x - 160 + i * 75;
        const fromY = 64;
        const isLast = i === hits - 1;
        promises.push(launchProjectile({
          kind: 'giant_lance',
          x0: fromX, y0: fromY,
          x1: target.x + (i - 1) * 14, y1: target.y,
          arcY: 0,
          dur: 0.21,
          color: '#d8fbff',
          scale: isLast ? 1.65 : 1.15,
          onImpact: () => {
            audio.play(isLast ? 'lock_break' : 'ice_lance', { boosted: true });
            triggerHitStop(isLast ? 140 : 65);
            addTrauma(isLast ? 0.88 : 0.44);
            applyActorHit(e, { knockPx: isLast ? 36 : 18, flashSec: 0.075 });
            spawnImpactStar(target.x, target.y, isLast ? 105 : 54, '#ffffff');
            spawnShockwave(target.x, target.y, isLast ? 190 : 88, '#9df5ff', isLast ? 7 : 4);
            spawnDirectionalShards(target.x, target.y, 1, isLast ? 40 : 16, ['#ffffff', '#c8f8ff', '#58ccff', '#ffd46a'], 1.45);
            dealEnemyDamage(perHit, false, isLast && isOverload ? '永冻星爆' : '');
          }
        }));
      }
      await Promise.all(promises);
      if (evalInfo.mpRefund > 0) {
        s.mp = Math.min(s.maxMp, s.mp + evalInfo.mpRefund);
        spawnPopup(s.x, s.y - 216, `+${evalInfo.mpRefund} MP`, '#fde68a', 17);
      }
    }

    // Lock breaks & AV delays
    let triggeredBreak = false;
    if (!e.broken) {
      const toBreak = [...skill.breaks];
      if (isOverload && skill.id === 'water_arrows') toBreak.push('water');
      let brokeAny = false;
      for (const el of toBreak) {
        const lk = e.locks.find(l => !l.broken && l.type === el);
        if (lk) { lk.broken = true; brokeAny = true; }
      }
      if (brokeAny && e.locks.every(l => l.broken)) {
        triggeredBreak = true;
        handleEnemyBreak();
      }
    }

    if (evalInfo.extraDelayPct > 0 && e.hp > 0) {
      const addAv = Math.round(e.baseAv * (evalInfo.extraDelayPct / 100));
      e.av += addAv;
      state.avFlash.enemyTag = `↓+25%`;
      state.avFlash.timer = 2.0;
      spawnPopup(e.x, e.y - 240, `↓ +${addAv} AV`, '#7dd3fc', 16);
    }

    if (autoProp && e.hp > 0) {
      await sleep(160);
      triggerStageProp(true);
    }

    await sleep(140);
    s.pose = 'cast_step';
    await sleep(80);
    s.pose = 'idle';
    state.ampPct = 0;

    if (e.hp <= 0) {
      updateAllUI();
      await handleEnemyDefeat();
      return;
    }

    if (state.prop.cd > 0) state.prop.cd--;
    if (e.wetTurns > 0) e.wetTurns--;

    if (triggeredBreak && !s.oneMoreChain) {
      s.oneMoreChain = true;
      s.av = 0;
      state.avFlash.sylviaTag = '⚡再动';
      state.avFlash.timer = 2.2;
      showBanner('⚡ BREAK · ONE MORE', true, 1450);
      state.phase = 'player';
      state.busy = false;
      updateAllUI();
      return;
    }

    s.oneMoreChain = false;
    s.av = s.baseAv;
    await advanceActionValues();
  }

  function dealEnemyDamage(dmg, isCrit, tag = '') {
    const e = state.enemy;
    e.hp = Math.max(0, e.hp - dmg);
    renderEnemyStrip();
    const col = isCrit ? '#fde68a' : '#f0f9ff';
    const label = isCrit ? `${dmg}!` : `${dmg}`;
    spawnPopup(e.x, e.y - 185, label, col, isCrit ? 30 : 25, tag);
  }

  function handleEnemyBreak() {
    const e = state.enemy;
    e.broken = true;
    const delayAv = Math.round(e.baseAv * 0.45);
    e.av += delayAv;

    audio.play('lock_break');
    triggerHitStop(145);
    addTrauma(0.92);
    const hitPos = getAnchorWorld(e, 'hit');
    triggerBreakInvert(hitPos.x, hitPos.y);
    spawnShockwave(hitPos.x, hitPos.y, 175, '#ffd46a', 6, 0.42);
    spawnDirectionalShards(hitPos.x, hitPos.y, 1, 36, ['#ffffff', '#ffd46a', '#7de8ff', '#3fa9ff'], 1.5);

    state.avFlash.enemyTag = `↓+45%`;
    state.avFlash.timer = 2.2;
  }

  // =========================================================================
  // 9. HSR ACTION VALUE (AV) SCHEDULER & ENEMY TURN
  // =========================================================================
  async function advanceActionValues() {
    const s = state.sylvia;
    const e = state.enemy;
    const minAv = Math.min(s.av, e.av);
    if (minAv > 0) {
      const steps = 6;
      const sStart = s.av, eStart = e.av;
      for (let i = 1; i <= steps; i++) {
        const p = i / steps;
        s.av = Math.max(0, Math.round(sStart - minAv * p));
        e.av = Math.max(0, Math.round(eStart - minAv * p));
        renderAvBar();
        await sleep(28);
      }
    }

    if (s.av <= e.av) {
      s.av = 0;
      state.phase = 'player';
      state.busy = false;
      updateAllUI();
    } else {
      e.av = 0;
      state.phase = 'enemy';
      updateAllUI();
      await executeEnemyTurn();
    }
  }

  async function executeEnemyTurn() {
    const s = state.sylvia;
    const e = state.enemy;
    await sleep(320);

    if (e.broken) {
      e.broken = false;
      e.cycleIdx = (e.cycleIdx + 1) % e.lockCycle.length;
      e.locks = e.lockCycle[e.cycleIdx].map(t => ({ type: t, broken: false }));
      spawnShockwave(e.x, e.y - 110, 95, '#fb923c', 3.5);
      await sleep(560);
      e.av = e.baseAv;
      await advanceActionValues();
      return;
    }

    const move = e.moves[e.moveIdx % e.moves.length];
    e.moveIdx++;
    e.pose = 'windup';

    const autoCounter = s.counterMirror;
    state.parry.active = true;
    state.parry.success = false;
    const parryEl = document.getElementById('parry-prompt');
    parryEl.classList.add('show');

    await sleep(320);
    e.pose = 'cast_step';
    await sleep(260);

    if (autoCounter && !state.parry.success) state.parry.success = true;
    parryEl.classList.remove('show');
    state.parry.active = false;
    e.pose = 'strike';

    const from = getAnchorWorld(e, 'cast');
    const to = getAnchorWorld(s, 'hit');
    const isRowan = e.id === 'rowan';

    await launchProjectile({
      kind: isRowan ? 'eclipse_slash' : 'flame_slash',
      x0: from.x, y0: from.y,
      x1: to.x, y1: to.y,
      arcY: -18,
      dur: 0.22,
      color: isRowan ? '#c97dff' : '#ff6f42',
      scale: 1.25,
      onImpact: () => {
        const parried = state.parry.success;
        let dmg = move.dmg;
        if (parried) {
          dmg = Math.round(dmg * 0.32);
          audio.play('parry_clang');
          triggerHitStop(95);
          addTrauma(0.54);
          spawnImpactStar(to.x + 18, to.y, 76, '#c8f8ff');
          spawnShockwave(to.x + 18, to.y, 115, '#ffd46a', 5);
          spawnDirectionalShards(to.x + 18, to.y, 1, 24, ['#ffffff', '#ffd46a', '#7ce8ff'], 1.25);
          s.mp = Math.min(s.maxMp, s.mp + 20);
          spawnPopup(s.x, s.y - 210, '⚡ 招架', '#fde68a', 22, '+20 MP');
        } else {
          audio.play('flame_slash');
          triggerHitStop(78);
          addTrauma(0.55);
          applyActorHit(s, { knockPx: 22, flashSec: 0.07 });
          spawnImpactStar(to.x, to.y, 64, isRowan ? '#e0b3ff' : '#ffb87a');
          spawnShockwave(to.x, to.y, 92, isRowan ? '#c578ff' : '#ff6842', 4.5);
          spawnDirectionalShards(to.x, to.y, -1, 20, isRowan ? ['#ffffff', '#d8a6ff', '#7b3eff'] : ['#ffffff', '#ffd06b', '#ff5b36'], 1.1);
        }

        let remaining = dmg;
        if (s.shield > 0) {
          const absorbed = Math.min(s.shield, remaining);
          s.shield -= absorbed;
          remaining -= absorbed;
        }
        if (remaining > 0) {
          s.hp = Math.max(20, s.hp - remaining);
          spawnPopup(s.x, s.y - 160, `-${remaining}`, parried ? '#a4ebff' : '#fda4af', 22);
        } else {
          spawnPopup(s.x, s.y - 160, '霜盾吸收', '#7dd3fc', 17);
        }
      }
    });

    if (s.counterMirror || state.parry.success) {
      const wasMirror = s.counterMirror;
      s.counterMirror = false;
      await sleep(140);
      s.pose = 'strike';
      const cStart = getAnchorWorld(s, 'cast');
      const cTarget = getAnchorWorld(e, 'hit');
      await launchProjectile({
        kind: 'ice_lance',
        x0: cStart.x, y0: cStart.y,
        x1: cTarget.x, y1: cTarget.y,
        arcY: -10,
        dur: 0.19,
        color: '#b4f8ff',
        scale: 1.05,
        onImpact: () => {
          audio.play('ice_lance', { boosted: false });
          triggerHitStop(72);
          addTrauma(0.42);
          applyActorHit(e, { knockPx: 20, flashSec: 0.065 });
          spawnImpactStar(cTarget.x, cTarget.y, 58, '#c8f8ff');
          spawnDirectionalShards(cTarget.x, cTarget.y, 1, 18, ['#ffffff', '#8eeeff', '#4eb8ff'], 1.15);
          dealEnemyDamage(wasMirror ? 68 : 42, true, wasMirror ? '反刺' : '反击');
        }
      });
      s.pose = 'idle';
    }

    await sleep(160);
    e.pose = 'cast_step';
    await sleep(80);
    e.pose = 'idle';

    if (e.hp <= 0) {
      updateAllUI();
      await handleEnemyDefeat();
      return;
    }

    e.av = e.baseAv;
    await advanceActionValues();
  }

  // =========================================================================
  // 10. INTERACTIVE STAGE PROPS (Click directly on Canvas!)
  // =========================================================================
  function triggerStageProp(fromSkill = false) {
    if (state.prop.cd > 0 || state.phase === 'transition' || state.phase === 'victory') return;
    const w = WAVES[state.waveIdx];
    state.prop.cd = w.prop.cdMax;
    state.prop.burstTimer = 0.65;
    audio.play('prop_trigger');
    addTrauma(0.42);

    if (w.prop.id === 'fountain') {
      state.sylvia.fountainTurns = 1;
      state.enemy.wetTurns = 2;
      spawnShockwave(PROP_POS.x, PROP_POS.y - 36, 155, '#6ee8ff', 4.5, 0.45);
      spawnDirectionalShards(PROP_POS.x, PROP_POS.y - 42, 0, 28, ['#ffffff', '#94f2ff', '#4cbcff'], 0.95);
      spawnPopup(PROP_POS.x, PROP_POS.y - 102, '✦ 寒泉涌动', '#8ef2ff', 18, '增幅半耗 · 潮湿');
    } else {
      state.prop.shattered = true;
      const e = state.enemy;
      triggerHitStop(95);
      applyActorHit(e, { knockPx: 26, flashSec: 0.07 });
      spawnShockwave(PROP_POS.x, PROP_POS.y - 60, 165, '#9af2ff', 5.5, 0.42);
      spawnDirectionalShards(PROP_POS.x, PROP_POS.y - 64, 1, 34, ['#ffffff', '#b8f7ff', '#62c8ff', '#a89eff'], 1.4);
      dealEnemyDamage(65, false, '霜柱崩裂');
      const addAv = Math.round(e.baseAv * 0.20);
      e.av += addAv;
      state.avFlash.enemyTag = `↓+20%`;
      state.avFlash.timer = 2.0;
      if (!e.broken) {
        const lk = e.locks.find(l => !l.broken);
        if (lk) lk.broken = true;
        if (e.locks.every(l => l.broken)) handleEnemyBreak();
      }
      spawnPopup(PROP_POS.x, PROP_POS.y - 122, '✦ 霜柱崩解', '#b8f5ff', 19, `碎1锁 · AV +${addAv}`);
      if (!fromSkill && e.hp <= 0) {
        updateAllUI();
        handleEnemyDefeat();
        return;
      }
    }
    updateAllUI();
  }

  // =========================================================================
  // 11. SEAMLESS WAVE 1 -> WAVE 2 RUN TRANSITION
  // =========================================================================
  async function handleEnemyDefeat() {
    if (state.waveIdx === 0) {
      await runWave1ToWave2Transition();
    } else {
      state.phase = 'victory';
      state.busy = false;
      audio.play('lock_break');
      await sleep(650);
      document.getElementById('victory-overlay').classList.add('open');
      updateAllUI();
    }
  }

  async function runWave1ToWave2Transition() {
    if (state.phase === 'transition') return;
    state.phase = 'transition';
    state.busy = true;
    updateAllUI();

    showBanner('W1 CLEAR → 日蚀遗迹', true, 1600);
    await sleep(360);

    state.transition.active = true;
    state.transition.progress = 0;
    state.transition.stepAccum = 0;

    await new Promise(resolve => {
      const check = () => {
        if (!state.transition.active) resolve();
        else requestAnimationFrame(check);
      };
      requestAnimationFrame(check);
    });

    loadWave(1, true);
  }

  // =========================================================================
  // 12. CANVAS STAGE RENDERER (Open Sky, Parallax, Props, 7-Frame Sprites)
  // =========================================================================
  const canvas = document.getElementById('battle-canvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function lerp(a, b, t) { return a + (b - a) * t; }

  function drawStage(dt) {
    state.time += dt;

    if (state.trauma > 0) {
      state.trauma = Math.max(0, state.trauma - 1.65 * dt);
      state.shakeTime += dt * 34;
    }
    if (state.breakInvertTimer > 0) state.breakInvertTimer = Math.max(0, state.breakInvertTimer - dt);
    if (state.avFlash.timer > 0) {
      state.avFlash.timer = Math.max(0, state.avFlash.timer - dt);
      if (state.avFlash.timer === 0) {
        state.avFlash.sylviaTag = null;
        state.avFlash.enemyTag = null;
        renderAvBar();
      }
    }

    if (state.enemy && state.enemy.hpLag > state.enemy.hp) {
      state.enemy.hpLag = Math.max(state.enemy.hp, state.enemy.hpLag - 260 * dt);
      document.getElementById('enemy-hp-lag').style.width = `${(state.enemy.hpLag / state.enemy.maxHp) * 100}%`;
    }

    let simDt = dt;
    if (state.hitStopRemain > 0) {
      state.hitStopRemain = Math.max(0, state.hitStopRemain - dt);
      simDt = 0;
    }

    if (state.transition.active) {
      state.transition.progress += dt / state.transition.duration;
      state.transition.scrollX += dt * 540;
      state.transition.stepAccum += dt;
      if (state.transition.stepAccum >= 0.22) {
        state.transition.stepAccum = 0;
        audio.play('footstep_run');
        for (let i = 0; i < 4; i++) {
          state.runDust.push({
            x: state.sylvia.x - 18 + Math.random() * 14,
            y: state.sylvia.y - 4,
            vx: -110 - Math.random() * 90,
            vy: -22 - Math.random() * 34,
            size: 4 + Math.random() * 5,
            life: 0.36,
            maxLife: 0.36
          });
        }
      }
      if (state.transition.progress >= 1) {
        state.transition.active = false;
        state.transition.progress = 1;
      }
    }

    state.blinkTimer -= simDt;
    if (state.blinkTimer <= 0) {
      state.blinkActive = 0.13;
      state.blinkTimer = 2.6 + Math.random() * 2.2;
    }
    if (state.blinkActive > 0) state.blinkActive = Math.max(0, state.blinkActive - simDt);

    [state.sylvia, state.enemy].forEach(a => {
      if (!a) return;
      if (a.flashTimer > 0) a.flashTimer = Math.max(0, a.flashTimer - dt);
      if (a.poseTimer > 0) {
        a.poseTimer = Math.max(0, a.poseTimer - simDt);
        if (a.poseTimer === 0 && a.pose === 'hurt') a.pose = 'idle';
      }
      const k = 155, c = 19;
      const acc = -k * a.knockX - c * a.knockV;
      a.knockV += acc * simDt;
      a.knockX += a.knockV * simDt;
      if (Math.abs(a.knockX) < 0.2 && Math.abs(a.knockV) < 1) { a.knockX = 0; a.knockV = 0; }
      a.scaleX += (1 - a.scaleX) * Math.min(1, simDt * 16);
      a.scaleY += (1 - a.scaleY) * Math.min(1, simDt * 16);
    });

    if (state.prop.burstTimer > 0) state.prop.burstTimer = Math.max(0, state.prop.burstTimer - dt);

    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      p.t += simDt / p.dur;
      if (p.t >= 1 && !p.done) {
        p.done = true;
        p.onImpact();
        state.projectiles.splice(i, 1);
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.life -= (pt.shape === 'starburst' ? dt : simDt);
      if (pt.life <= 0) { state.particles.splice(i, 1); continue; }
      pt.vy += pt.gravity * simDt;
      pt.x += pt.vx * simDt;
      pt.y += pt.vy * simDt;
      pt.rot = (pt.rot || 0) + (pt.vrot || 0) * simDt;
    }

    for (let i = state.runDust.length - 1; i >= 0; i--) {
      const d = state.runDust[i];
      d.life -= dt;
      if (d.life <= 0) { state.runDust.splice(i, 1); continue; }
      d.x += d.vx * dt; d.y += d.vy * dt;
    }

    for (let i = state.shockwaves.length - 1; i >= 0; i--) {
      const sw = state.shockwaves[i];
      sw.life -= dt;
      if (sw.life <= 0) { state.shockwaves.splice(i, 1); continue; }
      const prog = 1 - sw.life / sw.maxLife;
      sw.r = 12 + (sw.maxR - 12) * (1 - Math.pow(1 - prog, 3));
    }

    for (let i = state.breakFractureLines.length - 1; i >= 0; i--) {
      const fl = state.breakFractureLines[i];
      fl.life -= dt;
      if (fl.life <= 0) state.breakFractureLines.splice(i, 1);
    }

    for (let i = state.popups.length - 1; i >= 0; i--) {
      const pop = state.popups[i];
      pop.life -= dt;
      if (pop.life <= 0) { state.popups.splice(i, 1); continue; }
      pop.y += pop.vy * dt;
      pop.vy *= Math.pow(0.08, dt);
    }

    ctx.save();
    if (state.trauma > 0) {
      const shake = state.trauma * state.trauma;
      const ox = 15 * shake * Math.sin(state.shakeTime * 1.7);
      const oy = 10 * shake * Math.sin(state.shakeTime * 2.3);
      const rot = (0.9 * Math.PI / 180) * shake * Math.sin(state.shakeTime * 1.15);
      ctx.translate(STAGE_W / 2 + ox, STAGE_H / 2 + oy);
      ctx.rotate(rot);
      ctx.translate(-STAGE_W / 2, -STAGE_H / 2);
    }

    const eclipseMix = state.transition.active
      ? Math.min(1, state.transition.progress)
      : (state.waveIdx === 1 ? 1 : 0);
    const scrollX = state.transition.active ? state.transition.scrollX : 0;

    drawParallaxBackground(eclipseMix, scrollX);
    drawInteractiveProp(eclipseMix, scrollX);
    drawManaAmpAura();
    drawCombatant(state.sylvia, true);

    if (state.enemy) {
      if (state.transition.active) {
        const p = state.transition.progress;
        if (p < 0.45) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, 1 - p / 0.42);
          const origX = state.enemy.x;
          state.enemy.x = origX - p * 460;
          drawCombatant(state.enemy, false);
          state.enemy.x = origX;
          ctx.restore();
        } else if (p > 0.58) {
          const rProg = Math.min(1, (p - 0.58) / 0.42);
          const easeOut = 1 - Math.pow(1 - rProg, 3);
          const rx = lerp(STAGE_W + 120, ENEMY_HOME.x, easeOut);
          drawSpriteStandalone('rowan', rx, ENEMY_HOME.y, 0);
        }
      } else {
        drawCombatant(state.enemy, false);
      }
    }

    drawProjectiles();
    drawParticlesAndShockwaves();
    drawBreakFractures();
    drawPopups();

    if (state.breakInvertTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(205, 246, 255, 0.36)';
      ctx.fillRect(0, 0, STAGE_W, STAGE_H);
      ctx.restore();
    }

    ctx.restore();
  }

  function drawParallaxBackground(eclipseMix, scrollX) {
    // Layer 0: Luminous Sapphire-Midnight Courtyard Sky -> Deep Violet Eclipse Sky
    const sky = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
    const r0 = Math.round(lerp(13, 24, eclipseMix));
    const g0 = Math.round(lerp(28, 14, eclipseMix));
    const b0 = Math.round(lerp(58, 46, eclipseMix));
    const r1 = Math.round(lerp(29, 54, eclipseMix));
    const g1 = Math.round(lerp(58, 24, eclipseMix));
    const b1 = Math.round(lerp(106, 76, eclipseMix));
    sky.addColorStop(0, `rgb(${r0},${g0},${b0})`);
    sky.addColorStop(1, `rgb(${r1},${g1},${b1})`);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, STAGE_W, HORIZON_Y + 8);

    // Stars
    state.stars.forEach(st => {
      const sx = ((st.x - scrollX * 0.12) % STAGE_W + STAGE_W) % STAGE_W;
      const alpha = 0.32 + 0.55 * (0.5 + 0.5 * Math.sin(state.time * st.speed + st.phase));
      ctx.fillStyle = `rgba(226, 244, 255, ${alpha.toFixed(2)})`;
      ctx.fillRect(Math.round(sx), Math.round(st.y), Math.ceil(st.r), Math.ceil(st.r));
    });

    // Moon -> Eclipse Moon (elegantly centered in open sky)
    const mx = STAGE_W * 0.50;
    const my = 162;
    ctx.save();
    const glow = ctx.createRadialGradient(mx, my, 16, mx, my, 118);
    if (eclipseMix < 0.5) {
      glow.addColorStop(0, 'rgba(196, 238, 255, 0.34)');
      glow.addColorStop(1, 'rgba(182, 232, 255, 0)');
    } else {
      glow.addColorStop(0, 'rgba(232, 108, 180, 0.38)');
      glow.addColorStop(1, 'rgba(160, 48, 120, 0)');
    }
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(mx, my, 118, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = eclipseMix > 0.5 ? '#ff9ec0' : '#edf8ff';
    ctx.beginPath(); ctx.arc(mx, my, 42, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgb(${Math.round(lerp(18, 28, eclipseMix))},${Math.round(lerp(36, 16, eclipseMix))},${Math.round(lerp(72, 54, eclipseMix))})`;
    const shadowShift = lerp(16, 4, eclipseMix);
    ctx.beginPath(); ctx.arc(mx + shadowShift, my - 4, 38, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Layer 1: Far Gothic Academy Spires (0.32x)
    const farOff = (scrollX * 0.32) % 240;
    ctx.fillStyle = eclipseMix > 0.5 ? '#1f1336' : '#142648';
    for (let x = -240; x < STAGE_W + 240; x += 120) {
      const bx = x - farOff;
      const h = 128 + ((Math.abs(Math.round(x / 120)) * 37) % 84);
      ctx.fillRect(bx, HORIZON_Y - h, 76, h);
      ctx.beginPath();
      ctx.moveTo(bx + 6, HORIZON_Y - h);
      ctx.lineTo(bx + 38, HORIZON_Y - h - (eclipseMix > 0.5 ? 24 : 52));
      ctx.lineTo(bx + 70, HORIZON_Y - h);
      ctx.fill();
      ctx.fillStyle = eclipseMix > 0.5 ? 'rgba(218, 122, 255, 0.25)' : 'rgba(255, 228, 164, 0.24)';
      ctx.fillRect(bx + 33, HORIZON_Y - h + 26, 9, 18);
      ctx.fillStyle = eclipseMix > 0.5 ? '#1f1336' : '#142648';
    }

    // Layer 2: Mid-ground Courtyard Pillars (0.62x)
    const midOff = (scrollX * 0.62) % 210;
    ctx.fillStyle = eclipseMix > 0.5 ? '#2b1a47' : '#1b3158';
    for (let x = -210; x < STAGE_W + 210; x += 210) {
      const px = x - midOff;
      ctx.fillRect(px, HORIZON_Y - 148, 28, 152);
      ctx.fillRect(px - 6, HORIZON_Y - 152, 40, 10);
      if (eclipseMix < 0.6) {
        ctx.fillStyle = 'rgba(255, 214, 134, 0.24)';
        ctx.beginPath(); ctx.arc(px + 14, HORIZON_Y - 96, 20, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe099';
        ctx.fillRect(px + 11, HORIZON_Y - 100, 6, 9);
        ctx.fillStyle = '#1b3158';
      } else {
        ctx.fillStyle = 'rgba(182, 110, 255, 0.28)';
        ctx.fillRect(px + 10, HORIZON_Y - 110, 8, 38);
        ctx.fillStyle = '#2b1a47';
      }
    }

    // Layer 3: Perspective Ground Plaza (1.0x)
    const groundGrad = ctx.createLinearGradient(0, HORIZON_Y, 0, STAGE_H);
    groundGrad.addColorStop(0, eclipseMix > 0.5 ? '#21173a' : '#192d52');
    groundGrad.addColorStop(1, eclipseMix > 0.5 ? '#100b21' : '#0c1830');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, HORIZON_Y, STAGE_W, STAGE_H - HORIZON_Y);

    ctx.strokeStyle = eclipseMix > 0.5 ? 'rgba(196, 122, 255, 0.36)' : 'rgba(125, 211, 252, 0.38)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, HORIZON_Y); ctx.lineTo(STAGE_W, HORIZON_Y); ctx.stroke();

    ctx.strokeStyle = eclipseMix > 0.5 ? 'rgba(182, 126, 255, 0.14)' : 'rgba(125, 211, 252, 0.15)';
    ctx.lineWidth = 1;
    for (let row = 1; row <= 6; row++) {
      const y = HORIZON_Y + Math.pow(row / 6, 1.35) * (STAGE_H - HORIZON_Y);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(STAGE_W, y); ctx.stroke();
    }
    const tileOff = (scrollX * 1.0) % 96;
    for (let x = -192; x <= STAGE_W + 192; x += 96) {
      const topX = x - tileOff;
      const botX = STAGE_W / 2 + (topX - STAGE_W / 2) * 1.65;
      ctx.beginPath(); ctx.moveTo(topX, HORIZON_Y); ctx.lineTo(botX, STAGE_H); ctx.stroke();
    }
  }

  function drawInteractiveProp(eclipseMix, scrollX) {
    let px = PROP_POS.x;
    const py = PROP_POS.y;
    if (state.transition.active) {
      const p = state.transition.progress;
      if (p < 0.5) {
        px = PROP_POS.x - p * 1020;
        drawFountainProp(px, py, false);
      } else {
        px = lerp(STAGE_W + 140, PROP_POS.x, Math.min(1, (p - 0.5) / 0.5));
        drawFrostPillarProp(px, py, false);
      }
      return;
    }
    if (state.waveIdx === 0) drawFountainProp(px, py, state.prop.hovered);
    else drawFrostPillarProp(px, py, state.prop.hovered);
  }

  function drawFountainProp(x, y, hovered) {
    const ready = state.prop.cd === 0;
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 3.8);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, 52 + pulse * 6, 15, 0, 0, Math.PI * 2);
    ctx.fillStyle = ready ? `rgba(74, 212, 255, ${hovered ? 0.34 : 0.18})` : 'rgba(60, 90, 125, 0.12)';
    ctx.fill();
    if (ready) {
      ctx.strokeStyle = hovered ? '#ffffff' : 'rgba(125, 224, 255, 0.65)';
      ctx.lineWidth = hovered ? 2 : 1.2;
      ctx.stroke();
    }

    ctx.fillStyle = '#253c59'; ctx.fillRect(x - 42, y - 10, 84, 10);
    ctx.fillStyle = '#36557a'; ctx.fillRect(x - 38, y - 20, 76, 12);
    ctx.fillStyle = '#587da6'; ctx.fillRect(x - 44, y - 26, 88, 8);
    ctx.fillStyle = '#7aa4cf'; ctx.fillRect(x - 44, y - 26, 88, 2);
    ctx.fillStyle = ready ? '#54d8ff' : '#2f5878'; ctx.fillRect(x - 36, y - 24, 72, 6);
    if (ready) {
      ctx.fillStyle = '#d4faff';
      ctx.fillRect(x - 24 + Math.round(Math.sin(state.time * 4) * 6), y - 23, 18, 2);
    }
    ctx.fillStyle = '#486b94'; ctx.fillRect(x - 10, y - 50, 20, 26);
    ctx.fillStyle = '#6c95bf'; ctx.fillRect(x - 18, y - 54, 36, 6);
    ctx.fillStyle = '#8cc2eb'; ctx.fillRect(x - 6, y - 66, 12, 12);

    if (ready) {
      ctx.fillStyle = '#c8f8ff';
      const jetH = 14 + Math.sin(state.time * 10) * 4;
      ctx.fillRect(x - 3, y - 66 - jetH, 6, jetH);
      ctx.strokeStyle = 'rgba(134, 236, 255, 0.85)';
      ctx.lineWidth = 2.5;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(x + side * 4, y - 68);
        ctx.quadraticCurveTo(x + side * 24, y - 62, x + side * 28, y - 24);
        ctx.stroke();
      }
      for (let i = 0; i < 6; i++) {
        const mt = (state.time * 0.9 + i * 0.16) % 1;
        const mx = x + Math.sin(state.time * 3.2 + i * 1.9) * 28;
        const my = y - 28 - mt * 58;
        ctx.fillStyle = `rgba(188, 248, 255, ${(1 - mt) * 0.9})`;
        ctx.fillRect(Math.round(mx), Math.round(my), 4, 4);
      }
    }

    if (ready && hovered) {
      ctx.font = '700 11px "Noto Sans SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#e0f7ff';
      ctx.fillText('✦ 寒泉', x, y + 24);
    }
    ctx.restore();
  }

  function drawFrostPillarProp(x, y, hovered) {
    const ready = state.prop.cd === 0;
    const pulse = 0.5 + 0.5 * Math.sin(state.time * 4.5);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, 46 + pulse * 5, 14, 0, 0, Math.PI * 2);
    ctx.fillStyle = ready ? `rgba(116, 224, 255, ${hovered ? 0.34 : 0.20})` : 'rgba(60, 75, 110, 0.14)';
    ctx.fill();
    if (ready) {
      ctx.strokeStyle = hovered ? '#fde68a' : 'rgba(130, 232, 255, 0.72)';
      ctx.lineWidth = hovered ? 2 : 1.2;
      ctx.stroke();
    }

    if (ready) {
      ctx.fillStyle = '#3c85b8';
      ctx.beginPath();
      ctx.moveTo(x - 20, y - 4); ctx.lineTo(x - 14, y - 82); ctx.lineTo(x, y - 102); ctx.lineTo(x + 16, y - 76); ctx.lineTo(x + 22, y - 4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#8ef0ff';
      ctx.beginPath();
      ctx.moveTo(x - 8, y - 6); ctx.lineTo(x - 5, y - 78); ctx.lineTo(x, y - 96); ctx.lineTo(x + 6, y - 72); ctx.lineTo(x + 4, y - 6);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#fff3b8'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(x - 12, y - 38); ctx.lineTo(x + 2, y - 50); ctx.lineTo(x + 11, y - 44);
      ctx.moveTo(x - 6, y - 64); ctx.lineTo(x + 7, y - 74);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#38516e'; ctx.fillRect(x - 24, y - 14, 48, 12);
      ctx.fillStyle = '#5a8eb8'; ctx.fillRect(x - 12, y - 22, 10, 10); ctx.fillRect(x + 4, y - 19, 12, 8);
    }

    if (ready && hovered) {
      ctx.font = '700 11px "Noto Sans SC", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#fde68a';
      ctx.fillText('✦ 引爆霜柱', x, y + 24);
    }
    ctx.restore();
  }

  function drawManaAmpAura() {
    const s = state.sylvia;
    const amp = state.ampPct;
    const x = s.x + s.knockX;
    const y = s.y;

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, 78, 22, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(40, 120, 190, 0.16)';
    ctx.fill();
    ctx.strokeStyle = amp > 0 ? 'rgba(116, 232, 255, 0.72)' : 'rgba(105, 198, 255, 0.32)';
    ctx.lineWidth = amp >= 40 ? 2.4 : 1.4;
    ctx.stroke();

    if (amp <= 0 && !s.fountainTurns) {
      if (s.shield > 0) {
        ctx.strokeStyle = 'rgba(140, 236, 255, 0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y - 110, 108, -Math.PI * 0.85, Math.PI * 0.15);
        ctx.stroke();
      }
      ctx.restore();
      return;
    }

    const intensity = Math.max(amp / 60, 0.25);
    const rings = amp >= 60 ? 3 : amp >= 40 ? 2 : 1;
    for (let r = 0; r < rings; r++) {
      const rx = 68 + r * 24;
      const ry = 18 + r * 7;
      const dir = r % 2 === 0 ? 1 : -1;
      const rot = state.time * (1.4 + r * 0.6) * dir;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(1, ry / rx);
      ctx.rotate(rot);
      ctx.strokeStyle = r === 2 ? 'rgba(255, 224, 128, 0.78)' : `rgba(115, 232, 255, ${0.42 + intensity * 0.45})`;
      ctx.lineWidth = 2.2;
      ctx.setLineDash([12, 8]);
      ctx.beginPath(); ctx.arc(0, 0, rx, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * Math.PI * 2;
        ctx.fillStyle = r === 2 ? '#ffe599' : '#c6f8ff';
        ctx.fillRect(Math.cos(a) * rx - 3, Math.sin(a) * rx - 3, 6, 6);
      }
      ctx.restore();
    }

    const auraGrad = ctx.createRadialGradient(x, y - 110, 12, x, y - 110, 118 + amp * 0.8);
    auraGrad.addColorStop(0, `rgba(130, 236, 255, ${(0.12 + intensity * 0.28).toFixed(2)})`);
    auraGrad.addColorStop(1, 'rgba(60, 160, 255, 0)');
    ctx.fillStyle = auraGrad;
    ctx.beginPath(); ctx.arc(x, y - 110, 118 + amp * 0.8, 0, Math.PI * 2); ctx.fill();

    const moteCount = Math.round(6 + amp * 0.45);
    for (let i = 0; i < moteCount; i++) {
      const prog = (state.time * (0.65 + intensity * 0.7) + i / moteCount) % 1;
      const angle = state.time * (2.6 + intensity * 2.2) + i * 1.3;
      const rad = (54 + (1 - prog) * 32) * (0.75 + intensity * 0.35);
      const mx = x + Math.cos(angle) * rad;
      const my = y - 10 - prog * (175 + amp * 1.1);
      const sz = amp >= 40 && i % 3 === 0 ? 5 : 3;
      ctx.fillStyle = (amp >= 60 && i % 4 === 0)
        ? `rgba(255, 230, 146, ${(1 - prog) * 0.95})`
        : `rgba(180, 246, 255, ${(1 - prog) * 0.9})`;
      ctx.fillRect(Math.round(mx), Math.round(my), sz, sz);
    }

    if (amp >= 60) {
      ctx.strokeStyle = 'rgba(210, 250, 255, 0.72)';
      ctx.lineWidth = 1.6;
      for (let a = 0; a < 2; a++) {
        const ang = state.time * 7 + a * Math.PI;
        const bx = x + Math.cos(ang) * 62;
        const by = y - 115 + Math.sin(ang * 1.5) * 48;
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx + (Math.random() - 0.5) * 28, by - 22);
        ctx.lineTo(bx + (Math.random() - 0.5) * 34, by - 44);
        ctx.stroke();
      }
    }

    if (s.shield > 0) {
      ctx.strokeStyle = 'rgba(140, 236, 255, 0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y - 110, 108, -Math.PI * 0.85, Math.PI * 0.15);
      ctx.stroke();
    }
    ctx.restore();
  }

  function pickFrameIndex(actor, isHero) {
    const sp = SPRITES[actor.spriteKey];
    if (!sp) return 0;
    if (isHero && state.transition.active) {
      return Math.floor(state.time * 9) % 2 === 0 ? sp.pose.cast_step : sp.pose.idle2;
    }
    if (actor.pose === 'hurt') return sp.pose.hurt;
    if (actor.pose === 'windup') return sp.pose.windup;
    if (actor.pose === 'cast_step') return sp.pose.cast_step;
    if (actor.pose === 'strike') return sp.pose.strike;
    if (state.blinkActive > 0 && isHero) return sp.pose.blink;
    return Math.floor(state.time * 1.9 + (isHero ? 0 : 0.7)) % 2 === 0 ? sp.pose.idle1 : sp.pose.idle2;
  }

  function drawCombatant(actor, isHero) {
    const sp = SPRITES[actor.spriteKey];
    if (!sp) return;
    const frameIdx = pickFrameIndex(actor, isHero);
    const useFlash = actor.flashTimer > 0;
    const useFrost = (!isHero && actor.broken && !useFlash);
    const img = useFlash ? sp.flashFrames[frameIdx] : (useFrost ? sp.frostFrames[frameIdx] : sp.frames[frameIdx]);

    const scale = 2;
    const drawW = sp.w * scale;
    const drawH = sp.h * scale;
    const feetX = sp.anchors.feet[0] * scale;
    const feetY = sp.anchors.feet[1] * scale;

    const runBob = (isHero && state.transition.active) ? -Math.abs(Math.sin(state.time * 14)) * 9 : 0;
    const cx = Math.round(actor.x + actor.knockX);
    const cy = Math.round(actor.y + runBob);

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, actor.y + 2, 60, 14, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.40)';
    ctx.fill();

    if (isHero && state.runDust.length > 0) {
      state.runDust.forEach(d => {
        ctx.fillStyle = `rgba(170, 236, 255, ${(d.life / d.maxLife) * 0.75})`;
        ctx.fillRect(Math.round(d.x), Math.round(d.y), Math.round(d.size), Math.round(d.size));
      });
    }

    ctx.translate(cx, cy);
    if (isHero && state.transition.active) ctx.rotate(0.06);
    ctx.scale(actor.scaleX, actor.scaleY);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, Math.round(-feetX), Math.round(-feetY), drawW, drawH);
    ctx.restore();
  }

  function drawSpriteStandalone(spriteKey, x, y, frameIdx) {
    const sp = SPRITES[spriteKey];
    if (!sp) return;
    const scale = 2;
    const feetX = sp.anchors.feet[0] * scale;
    const feetY = sp.anchors.feet[1] * scale;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y + 2, 62, 14, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.40)';
    ctx.fill();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sp.frames[frameIdx], Math.round(x - feetX), Math.round(y - feetY), sp.w * scale, sp.h * scale);
    ctx.restore();
  }

  function drawProjectiles() {
    state.projectiles.forEach(p => {
      const t = Math.min(1, p.t);
      const x = lerp(p.x0, p.x1, t);
      const y = lerp(p.y0, p.y1, t) + Math.sin(t * Math.PI) * (p.arcY || 0);
      const prevT = Math.max(0, t - 0.08);
      const px = lerp(p.x0, p.x1, prevT);
      const py = lerp(p.y0, p.y1, prevT) + Math.sin(prevT * Math.PI) * (p.arcY || 0);
      const ang = Math.atan2(y - py, x - px);

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      const sc = p.scale || 1;

      if (p.kind === 'water_arrow') {
        ctx.strokeStyle = 'rgba(84, 206, 255, 0.55)';
        ctx.lineWidth = 4 * sc;
        ctx.beginPath(); ctx.moveTo(-48 * sc, 0); ctx.lineTo(0, 0); ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(16 * sc, 0); ctx.lineTo(-8 * sc, -6 * sc); ctx.lineTo(-4 * sc, 0); ctx.lineTo(-8 * sc, 6 * sc);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.stroke();
      } else if (p.kind === 'ice_lance' || p.kind === 'giant_lance') {
        const len = (p.kind === 'giant_lance' ? 88 : 58) * sc;
        const wid = (p.kind === 'giant_lance' ? 14 : 9) * sc;
        const grad = ctx.createLinearGradient(-len * 1.4, 0, len * 0.4, 0);
        grad.addColorStop(0, 'rgba(90, 210, 255, 0)');
        grad.addColorStop(1, 'rgba(180, 248, 255, 0.85)');
        ctx.fillStyle = grad;
        ctx.fillRect(-len * 1.4, -wid * 0.45, len * 1.4, wid * 0.9);
        ctx.fillStyle = '#e8fbff';
        ctx.beginPath();
        ctx.moveTo(len * 0.55, 0); ctx.lineTo(-len * 0.25, -wid); ctx.lineTo(-len * 0.5, 0); ctx.lineTo(-len * 0.25, wid);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#4ec4ff'; ctx.lineWidth = 2; ctx.stroke();
      } else if (p.kind === 'mirror_slash') {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5 * sc;
        ctx.beginPath(); ctx.arc(0, 0, 32 * sc, -1.0, 1.0); ctx.stroke();
        ctx.strokeStyle = '#70e2ff'; ctx.lineWidth = 10 * sc; ctx.globalAlpha = 0.4;
        ctx.beginPath(); ctx.arc(-6, 0, 34 * sc, -1.05, 1.05); ctx.stroke();
      } else {
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 5 * sc;
        ctx.beginPath(); ctx.arc(0, 0, 34 * sc, -1.1, 1.1); ctx.stroke();
        ctx.strokeStyle = p.color; ctx.lineWidth = 12 * sc; ctx.globalAlpha = 0.52;
        ctx.beginPath(); ctx.arc(-5, 0, 36 * sc, -1.15, 1.15); ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawParticlesAndShockwaves() {
    state.shockwaves.forEach(sw => {
      const alpha = Math.max(0, sw.life / sw.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.lineWidth * alpha + 1;
      ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    state.particles.forEach(pt => {
      const alpha = Math.max(0, pt.life / pt.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(pt.x, pt.y);
      if (pt.shape === 'starburst') {
        const r = pt.size * (1.2 - alpha * 0.35);
        ctx.fillStyle = pt.color;
        for (let k = 0; k < 8; k++) {
          ctx.rotate(Math.PI / 4);
          ctx.beginPath(); ctx.moveTo(0, -r * 0.14); ctx.lineTo(r, 0); ctx.lineTo(0, r * 0.14); ctx.closePath(); ctx.fill();
        }
      } else if (pt.shape === 'shard') {
        ctx.rotate(pt.rot);
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.moveTo(pt.size * 1.4, 0); ctx.lineTo(-pt.size * 0.6, -pt.size * 0.55); ctx.lineTo(-pt.size, 0); ctx.lineTo(-pt.size * 0.6, pt.size * 0.55);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillStyle = pt.color;
        ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
      }
      ctx.restore();
    });
  }

  function drawBreakFractures() {
    state.breakFractureLines.forEach(fl => {
      const alpha = Math.max(0, fl.life / fl.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = fl.w;
      ctx.beginPath(); ctx.moveTo(fl.x1, fl.y1); ctx.lineTo(fl.x2, fl.y2); ctx.stroke();
      ctx.strokeStyle = '#6fe8ff'; ctx.lineWidth = fl.w + 3; ctx.globalAlpha = alpha * 0.45;
      ctx.beginPath(); ctx.moveTo(fl.x1, fl.y1); ctx.lineTo(fl.x2, fl.y2); ctx.stroke();
      ctx.restore();
    });
  }

  function drawPopups() {
    state.popups.forEach(pop => {
      const prog = 1 - pop.life / pop.maxLife;
      let sc = 1;
      if (prog < 0.16) sc = 0.5 + 0.85 * Math.sin((prog / 0.16) * Math.PI * 0.72);
      else if (prog < 0.28) sc = lerp(1.22, 1.0, (prog - 0.16) / 0.12);
      const alpha = prog > 0.7 ? Math.max(0, 1 - (prog - 0.7) / 0.3) : 1;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(pop.x, pop.y);
      ctx.scale(sc, sc);
      ctx.font = `900 ${pop.size}px "Noto Sans SC", system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(8, 16, 32, 0.88)';
      ctx.strokeText(pop.text, 0, 0);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, 0, 0);

      if (pop.subText) {
        ctx.font = '800 12px "Noto Sans SC", system-ui, sans-serif';
        ctx.strokeText(pop.subText, 0, 19);
        ctx.fillStyle = '#fde68a';
        ctx.fillText(pop.subText, 0, 19);
      }
      ctx.restore();
    });
  }

  // =========================================================================
  // 13. ULTRA-CLEAN V3 UI RENDERING
  // =========================================================================
  function renderAvBar() {
    const trackEl = document.getElementById('av-track');
    const s = state.sylvia;
    const e = state.enemy;
    if (!e) return;

    const entries = [
      { id: 'sylvia', av: s.av, spriteKey: s.spriteKey, isEnemy: false, ghost: false },
      { id: 'enemy', av: e.av, spriteKey: e.spriteKey, isEnemy: true, ghost: false },
      { id: 'sylvia_next', av: s.av + s.baseAv, spriteKey: s.spriteKey, isEnemy: false, ghost: true }
    ];
    entries.sort((a, b) => a.av - b.av || (a.isEnemy ? 1 : -1));

    // Compute subtle micro-tags ONLY when hovering a skill (or active flash)
    let hoverEnemyTag = null;
    let hoverSylviaTag = null;
    if (state.hoveredSkillId && state.phase === 'player') {
      const sk = SKILLS.find(k => k.id === state.hoveredSkillId);
      if (sk) {
        const ev = evaluateSkill(sk);
        if (ev.willBreakAll) {
          hoverSylviaTag = { text: '⚡再动', gold: true };
          hoverEnemyTag = { text: `↓+${ev.totalDelayPct}%`, gold: false };
        } else if (ev.extraDelayPct > 0) {
          hoverEnemyTag = { text: `↓+${ev.extraDelayPct}%`, gold: false };
        }
      }
    }

    trackEl.innerHTML = '';
    entries.forEach((ent, idx) => {
      const node = document.createElement('div');
      const acting = (idx === 0 && !ent.ghost);
      node.className = 'av-node'
        + (ent.isEnemy ? ' enemy' : '')
        + (acting ? ' acting' : '')
        + (ent.ghost ? ' ghost' : '')
        + (!ent.isEnemy && !ent.ghost && state.avFlash.sylviaTag ? ' flash-onemore' : '')
        + (ent.isEnemy && !ent.ghost && state.avFlash.enemyTag ? ' flash-delay' : '');

      const avWrap = document.createElement('div');
      avWrap.className = 'av-avatar';
      const sp = SPRITES[ent.spriteKey];
      if (sp && sp.headCanvas) {
        const clone = document.createElement('canvas');
        clone.width = 36; clone.height = 36;
        const c2 = clone.getContext('2d');
        c2.imageSmoothingEnabled = false;
        c2.drawImage(sp.headCanvas, 0, 0);
        avWrap.appendChild(clone);
      }

      const badge = document.createElement('span');
      badge.className = 'av-badge';
      badge.textContent = String(ent.av);

      node.appendChild(avWrap);
      node.appendChild(badge);

      // Micro-tag strictly ONLY on hover or brief active break/delay event
      if (!ent.ghost) {
        let tagInfo = null;
        if (!ent.isEnemy) {
          if (hoverSylviaTag) tagInfo = hoverSylviaTag;
          else if (state.avFlash.sylviaTag) tagInfo = { text: state.avFlash.sylviaTag, gold: true };
        } else {
          if (hoverEnemyTag) tagInfo = hoverEnemyTag;
          else if (state.avFlash.enemyTag) tagInfo = { text: state.avFlash.enemyTag, gold: false };
        }
        if (tagInfo) {
          const mt = document.createElement('span');
          mt.className = 'av-micro-tag' + (tagInfo.gold ? ' gold' : '');
          mt.textContent = tagInfo.text;
          node.appendChild(mt);
        }
      }

      trackEl.appendChild(node);
    });
  }

  function renderEnemyStrip() {
    const e = state.enemy;
    if (!e) return;
    const strip = document.getElementById('enemy-strip');
    strip.className = 'enemy-strip' + (e.broken ? ' broken' : '');
    document.getElementById('enemy-name').textContent = e.shortName;
    document.getElementById('enemy-hp-text').textContent = `${e.hp} / ${e.maxHp}`;
    document.getElementById('enemy-hp-bar').style.width = `${(e.hp / e.maxHp) * 100}%`;

    const locksEl = document.getElementById('enemy-locks');
    locksEl.innerHTML = '';
    e.locks.forEach(lk => {
      const sp = document.createElement('span');
      sp.className = `lock-chip ${lk.type}` + (lk.broken ? ' shattered' : '');
      sp.textContent = lk.type === 'water' ? '水' : '冰';
      locksEl.appendChild(sp);
    });

    const stDot = document.getElementById('enemy-state-dot');
    if (e.broken) {
      stDot.style.display = 'inline-block';
      stDot.className = 'enemy-state-dot broken';
      stDot.textContent = '破防';
    } else if (e.wetTurns > 0) {
      stDot.style.display = 'inline-block';
      stDot.className = 'enemy-state-dot';
      stDot.textContent = '潮湿';
    } else {
      stDot.style.display = 'none';
    }
  }

  function renderHeroAndSkills() {
    const s = state.sylvia;
    const shieldEl = document.getElementById('hero-shield');
    document.getElementById('hero-shield-val').textContent = String(s.shield);
    shieldEl.classList.toggle('active', s.shield > 0);

    document.getElementById('buff-fountain').style.display = s.fountainTurns > 0 ? 'inline-flex' : 'none';
    document.getElementById('buff-mirror').style.display = s.counterMirror ? 'inline-flex' : 'none';

    document.getElementById('hero-hp-text').textContent = String(s.hp);
    document.getElementById('hero-hp-bar').style.width = `${(s.hp / s.maxHp) * 100}%`;
    document.getElementById('hero-mp-text').textContent = String(s.mp);
    document.getElementById('hero-mp-bar').style.width = `${(s.mp / s.maxMp) * 100}%`;

    const ampMpPreview = calcAmpMpCost(state.ampPct);
    document.getElementById('hero-mp-preview').style.width = `${Math.min(100, (ampMpPreview / s.maxMp) * 100)}%`;

    const grid = document.getElementById('skills-grid');
    grid.innerHTML = '';
    SKILLS.forEach(sk => {
      const ev = evaluateSkill(sk);
      const btn = document.createElement('button');
      btn.className = 'skill-tile' + (ev.overload ? ' overload-ready' : '');
      btn.disabled = state.phase !== 'player' || state.busy || !ev.canAfford;
      btn.title = `[${sk.key}] ${sk.tip}`;

      const dotsHtml = sk.elems.map(el => `<span class="elem-dot ${el}"></span>`).join('')
        + (ev.overload ? '<span class="sk-overload-mark">✦</span>' : '');

      let costText = '';
      if (sk.baseCost === 0 && ev.ampMp === 0) costText = `+${sk.mpGain} MP`;
      else if (sk.baseCost === 0 && ev.ampMp > 0) costText = `-${ev.ampMp}/+${sk.mpGain}`;
      else costText = `${ev.totalCost} MP`;

      btn.innerHTML = `
        <div class="sk-top">
          <span class="sk-name">${sk.name}</span>
          <span class="sk-dots">${dotsHtml}</span>
        </div>
        <div class="sk-bottom">
          <span class="sk-cost ${sk.baseCost === 0 && ev.ampMp === 0 ? 'gain' : ''}">${costText}</span>
          <span class="sk-dmg ${ev.overload || state.ampPct > 0 ? 'boosted' : ''}">${ev.estDmg}</span>
        </div>
      `;

      btn.addEventListener('mouseenter', () => {
        state.hoveredSkillId = sk.id;
        renderAvBar();
      });
      btn.addEventListener('mouseleave', () => {
        state.hoveredSkillId = null;
        renderAvBar();
      });
      btn.addEventListener('click', () => executeSkill(sk.id));
      grid.appendChild(btn);
    });
  }

  function renderAmpAndTop() {
    const w = WAVES[state.waveIdx];
    document.getElementById('wave-label').textContent = w.capLabel;

    const dot = document.getElementById('turn-dot');
    dot.className = 'turn-dot' + (state.phase === 'enemy' ? ' enemy' : state.sylvia.oneMoreChain ? ' onemore' : '');

    const modeBtn = document.getElementById('btn-mode');
    modeBtn.innerHTML = state.formulaMode === 'A'
      ? '<span class="m-hi">A</span>/<span>B</span>'
      : '<span>A</span>/<span class="m-hi">B</span>';

    document.getElementById('btn-wave').textContent = state.waveIdx === 0 ? '→W2' : '→W1';

    const mpCost = calcAmpMpCost(state.ampPct);
    document.getElementById('amp-readout').textContent = state.ampPct > 0
      ? `+${state.ampPct}% · ${mpCost}MP`
      : '0%';

    document.querySelectorAll('.amp-step').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.amp) === state.ampPct);
    });
  }

  function updateAllUI() {
    renderAmpAndTop();
    renderAvBar();
    renderEnemyStrip();
    renderHeroAndSkills();
  }

  let bannerTimer = null;
  function showBanner(text, isGold = false, durMs = 1400) {
    const el = document.getElementById('center-banner');
    document.getElementById('cb-main').textContent = text;
    el.className = 'center-banner show' + (isGold ? ' gold' : '');
    if (bannerTimer) clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => el.classList.remove('show'), durMs);
  }

  // =========================================================================
  // 14. INPUT & CANVAS INTERACTION
  // =========================================================================
  function setAmpPct(val) {
    const steps = [0, 20, 40, 60];
    const target = steps.includes(val) ? val : 0;
    if (target !== state.ampPct) {
      state.ampPct = target;
      audio.play('amp_charge', { ampPct: target });
      updateAllUI();
    }
  }

  document.querySelectorAll('.amp-step').forEach(btn => {
    btn.addEventListener('click', () => setAmpPct(Number(btn.dataset.amp)));
  });

  const SVG_SFX_ON = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>';
  const SVG_SFX_OFF = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>';

  document.getElementById('btn-sfx').addEventListener('click', (ev) => {
    const btn = ev.currentTarget;
    audio.enabled = !audio.enabled;
    btn.innerHTML = audio.enabled ? SVG_SFX_ON : SVG_SFX_OFF;
    btn.classList.toggle('muted', !audio.enabled);
  });

  document.getElementById('btn-mode').addEventListener('click', () => {
    state.formulaMode = state.formulaMode === 'A' ? 'B' : 'A';
    audio.play('ui_tick', { high: state.formulaMode === 'A' });
    showBanner(state.formulaMode === 'A' ? '模式 A · 质变曲线' : '模式 B · 线性对照', false, 1000);
    updateAllUI();
  });

  document.getElementById('btn-wave').addEventListener('click', () => {
    if (state.waveIdx === 0 && !state.transition.active) {
      runWave1ToWave2Transition();
    } else if (state.waveIdx === 1) {
      document.getElementById('victory-overlay').classList.remove('open');
      loadWave(0, false);
    }
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    document.getElementById('victory-overlay').classList.remove('open');
    loadWave(0, false);
  });

  document.getElementById('btn-victory-replay').addEventListener('click', () => {
    document.getElementById('victory-overlay').classList.remove('open');
    loadWave(0, false);
  });

  document.getElementById('parry-prompt').addEventListener('click', () => {
    if (state.parry.active) state.parry.success = true;
  });

  // Exact object-fit: cover coordinate mapping for direct prop click
  function canvasCoords(ev) {
    const rect = canvas.getBoundingClientRect();
    const scale = Math.max(rect.width / STAGE_W, rect.height / STAGE_H);
    const drawnW = STAGE_W * scale;
    const drawnH = STAGE_H * scale;
    const offX = (rect.width - drawnW) / 2;
    const offY = (rect.height - drawnH) / 2;
    return {
      x: (ev.clientX - rect.left - offX) / scale,
      y: (ev.clientY - rect.top - offY) / scale
    };
  }

  function isOverProp(cx, cy) {
    return Math.abs(cx - PROP_POS.x) <= 60 && cy >= PROP_POS.y - 108 && cy <= PROP_POS.y + 24;
  }

  canvas.addEventListener('mousemove', (ev) => {
    const pt = canvasCoords(ev);
    const over = isOverProp(pt.x, pt.y) && state.prop.cd === 0 && state.phase === 'player';
    state.prop.hovered = over;
    canvas.style.cursor = over ? 'pointer' : 'default';
  });

  canvas.addEventListener('click', (ev) => {
    if (state.parry.active) {
      state.parry.success = true;
      return;
    }
    const pt = canvasCoords(ev);
    if (isOverProp(pt.x, pt.y) && state.phase === 'player' && !state.busy) {
      triggerStageProp(false);
    }
  });

  window.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    const k = ev.key.toLowerCase();
    if (state.parry.active && k === ' ') {
      ev.preventDefault();
      state.parry.success = true;
      return;
    }
    if (k === '1') executeSkill('water_arrows');
    else if (k === '2') executeSkill('ice_lance');
    else if (k === '3') executeSkill('mirror_cut');
    else if (k === '4') executeSkill('abs_zero');
    else if (k === 'q') {
      const steps = [0, 20, 40, 60];
      const idx = Math.max(0, steps.indexOf(state.ampPct) - 1);
      setAmpPct(steps[idx]);
    } else if (k === 'e') {
      const steps = [0, 20, 40, 60];
      const idx = Math.min(steps.length - 1, steps.indexOf(state.ampPct) + 1);
      setAmpPct(steps[idx]);
    }
  });

  // =========================================================================
  // 15. MAIN RAF LOOP & BOOT
  // =========================================================================
  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
    lastTs = ts;
    drawStage(dt);
    requestAnimationFrame(loop);
  }

  loadWave(0, false);
  requestAnimationFrame(loop);
})();
</script>
