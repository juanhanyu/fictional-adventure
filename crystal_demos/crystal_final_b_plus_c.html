<style>
  :root {
    --v3-bg-center: #ffffff;
    --v3-bg-base: #fafbfd;
    --v3-bg-edge: #eef3fb;
    --v3-ink: #1b2333;
    --v3-ink-mid: #3a4862;
    --v3-ink-muted: #526078;
    --v3-line: rgba(27, 35, 51, 0.14);
    --v3-line-strong: rgba(27, 35, 51, 0.22);
    --v3-sapphire: #1c4cb8;
    --v3-sapphire-deep: #0e2b78;
    --v3-champagne: #c9b48a;

    --v3-serif-zh: 'Noto Serif SC', 'Noto Serif CJK SC', 'Songti SC', Georgia, serif;
    --v3-sans: 'Noto Sans SC', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--v3-bg-base);
    color: var(--v3-ink);
    font-family: var(--v3-sans);
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  #title-screen {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
    background: radial-gradient(ellipse 66% 62% at 39% 48%, var(--v3-bg-center) 0%, var(--v3-bg-base) 54%, var(--v3-bg-edge) 100%);
    --px: 0;
    --py: 0;
  }

  #v3-dust-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.42;
    pointer-events: none;
    display: block;
  }

  .v3-title-stage {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  /* Left B+C Fusion Centerpiece — Exact V3 Anchor Geometry */
  #v3-crystal-anchor {
    position: absolute;
    left: 34.5%;
    top: 49%;
    width: clamp(390px, 40vw, 520px);
    height: clamp(390px, 40vw, 520px);
    z-index: 2;
    transform: translate3d(calc(-50% + var(--px, 0) * -10px), calc(-50% + var(--py, 0) * -8px), 0);
    pointer-events: none;
  }

  .v3-sculpture-stage {
    position: relative;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .v3-fusion-stage {
    position: absolute;
    inset: 0;
    z-index: 16;
    pointer-events: none;
  }

  .v3-fusion-2d {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 156%;
    height: 156%;
    transform: translate3d(-50%, -50%, 0);
    display: block;
    pointer-events: none;
    background: transparent;
  }

  .v3-fusion-back { z-index: 1; }
  .v3-fusion-gl {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56%;
    height: 56%;
    transform: translate3d(-50%, -50%, 0);
    z-index: 2;
    display: block;
    pointer-events: none;
    background: transparent;
  }
  .v3-fusion-front { z-index: 3; }

  .v3-fusion-hit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 96%;
    height: 96%;
    transform: translate3d(-50%, -50%, 0);
    z-index: 4;
    border: none;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
    outline: none;
  }

  /* Authentic V3 Right Folio — 100% Preserved Original Snow-Porcelain Design */
  .v3-right-folio {
    position: absolute;
    left: 55.5%;
    top: 49%;
    width: min(400px, 38vw);
    transform: translate3d(0, -50%, 0);
    z-index: 3;
    text-align: left;
  }

  .v3-right-folio::before {
    content: '';
    position: absolute;
    inset: -48px -56px;

  .v3-title-lockup {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--v3-line);

  .title-main {
    order: 1;
    font-family: var(--v3-serif-zh);
    font-size: clamp(34px, 3.6vw, 48px);
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: 0.08em;
    color: var(--v3-ink);
  }

  .title-sub {
    order: 2;
    margin-top: 7px;
    font-family: var(--v3-serif-zh);
    font-size: clamp(13.5px, 1.1vw, 15.5px);
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: 0.04em;
    color: var(--v3-ink-mid);
  }

  .v3-kicker {
    order: 3;
    margin-top: 7px;
    font-family: var(--v3-serif-en);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--v3-ink-muted);
  }

  .title-menu {
    display: flex;
    flex-direction: column;
    align-items: flex-start;

    align-items: center;
    gap: 11px;

    padding: 5px 12px 5px 2px;
    background: transparent;
    border: none;
    color: var(--v3-ink);
    font-family: var(--v3-sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.28s var(--v3-ease), color 0.22s ease;
  }

  .tbtn-editorial::before {
    content: '';
    display: inline-block;
    width: 5px;
    height: 5px;
    background: var(--v3-ink-muted);
    transform: rotate(45deg);
    transition: background-color 0.24s ease;
  }

  .tbtn-editorial::after {
    content: '';
    display: inline-block;
    width: 18px;
    height: 1px;
    background: var(--v3-line-strong);
    transition: width 0.3s var(--v3-ease), background-color 0.24s ease;
  }

  .tbtn-editorial.is-focus,
  .tbtn-editorial:hover {
    color: var(--v3-sapphire);
    transform: translateX(4px);
  }

  .tbtn-editorial.is-focus::before,
  .tbtn-editorial:hover::before {
    background: var(--v3-sapphire);
  }

  .tbtn-editorial.is-focus::after,
  .tbtn-editorial:hover::after {
    width: 34px;
    background: var(--v3-sapphire);
  }

  .tbtn-en {
    font-family: var(--v3-serif-en);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: inherit;

    letter-spacing: 0.04em;

    color: var(--v3-sapphire);

  .v3-cta-zone {
    width: min(334px, 100%);
    margin-top: 18px;
  }

  .v3-prism-cta-wrap {
    position: relative;
    padding: 11px 0;
  }

  .v3-prism-wings {
    display: block;
    width: 100%;
    height: 14px;
    color: rgba(27, 35, 51, 0.24);
  }

  .v3-prism-cta {
    position: relative;
    width: 100%;
    min-height: 58px;
    border: none;
    padding: 10px 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: #ffffff;
    cursor: pointer;
    background: linear-gradient(125deg, #2563eb 0%, #1c4cb8 46%, #0e2b78 100%);
    clip-path: polygon(10% 0%, 90% 0%, 100% 50%, 90% 100%, 10% 100%, 0% 50%);
    filter: drop-shadow(0 12px 24px rgba(14, 43, 120, 0.22));
    transition: transform 0.3s var(--v3-ease), filter 0.3s ease;
    overflow: hidden;
  }

  .v3-prism-cta:hover {
    transform: translateY(-2px);
    filter: drop-shadow(0 16px 28px rgba(28, 76, 184, 0.30)) brightness(1.06);
  }

  .v3-prism-facets {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .v3-prism-en {
    position: relative;
    z-index: 1;
    font-family: var(--v3-serif-en);
    font-size: 16.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
  }

  .v3-prism-cn {
    position: relative;
    z-index: 1;
    font-size: 12px;
    letter-spacing: 0.16em;
    opacity: 0.92;
  }

  .v3-archive-meta {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--v3-line);
    font-family: var(--v3-serif-en);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--v3-ink-muted);
  }

  .v3-edge-footer {
    position: absolute;
    left: 28px;
    right: 28px;
    bottom: 18px;
    z-index: 4;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--v3-ink-muted);
  }

  .v3-edge-left, .v3-edge-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .preview-action {
    appearance: none;
    border: none;
    border-bottom: 1px solid rgba(28, 76, 184, 0.34);
    background: transparent;
    color: var(--v3-sapphire);
    font-family: var(--v3-sans);
    font-size: 12px;
    padding: 3px 2px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s ease;
  }
  .preview-action:hover { opacity: 0.72; }

  @media (max-width: 720px), (orientation: portrait) and (max-width: 1120px) {
    #title-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      padding: 18px 20px;
    }
    .v3-title-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: auto;
      flex: 1 0 auto;
    }
    #v3-crystal-anchor {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      width: clamp(192px, 48vw, 390px);
      height: clamp(182px, 23vh, 360px);
      margin: 0 auto 6px;
    }
    .v3-right-folio {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      width: min(580px, 90vw);
      margin: 2px auto 8px;
      text-align: center;
    }
    .v3-title-lockup { align-items: center; }
    .title-menu { width: fit-content; margin: 0 auto; }
    .v3-cta-zone { margin: 12px auto 0; }
    .v3-edge-footer { position: static; width: 100%; margin-top: 8px; }
  }
</style>
</head>

<script>

  var PAL = {

  };

  function rgba(rgb, a) {
    return 'rgba(' + (rgb[0] | 0) + ',' + (rgb[1] | 0) + ',' + (rgb[2] | 0) + ',' + clamp(a, 0, 1).toFixed(4) + ')';
  }
  function rotX(v, a) { var c = Math.cos(a), s = Math.sin(a); return [v[0], v[1] * c - v[2] * s, v[1] * s + v[2] * c]; }
  function rotY(v, a) { var c = Math.cos(a), s = Math.sin(a); return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c]; }
  function rotZ(v, a) { var c = Math.cos(a), s = Math.sin(a); return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]]; }
  function rotEuler(v, rx, ry, rz) { return rotZ(rotY(rotX(v, rx), ry), rz); }
  function normalize(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }

  var ARMILLARY_RINGS = [

    { radius: 0.87, expandMult: 1.17, bandHalf: 0.028, tiltX: -0.96, tiltY: 0.78, tiltZ: -0.45, spinSpeed: -0.27, precessAmp: 0.22, precessFreq: 0.48, style: 'sapphire_arcane', ticks: 48, majorEvery: 4, nodes: 8, comets: 2 },

  ];

  function buildBipyramidMesh(rx, ry, rz, sides) {
    var verts = [[0, -ry, 0], [0, ry, 0]];
    for (var i = 0; i < sides; i++) {
      var a = (i / sides) * Math.PI * 2;
      verts.push([Math.cos(a) * rx, 0, Math.sin(a) * rz]);
    }
    var faces = [];
    for (var j = 0; j < sides; j++) {
      var curr = 2 + j, next = 2 + ((j + 1) % sides);
      faces.push([0, next, curr], [1, curr, next]);

    return { verts: verts, faces: faces };
  }
  var SHARD_MESH = buildBipyramidMesh(0.032, 0.088, 0.028, 4);

  var SHARDS = [];
  for (var si = 0; si < 18; si++) {
    var tier = Math.floor(si / 6), idx = si % 6;

    SHARDS.push({
      id: si, tier: tier, idx: idx, baseAngle: baseAngle,
      mandalaR: tier === 0 ? 0.445 : (tier === 1 ? 0.59 : 0.745),
      mandalaZ: tier === 0 ? 0.05 : (tier === 1 ? -0.05 : 0.03),

  var VERT_SRC = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos,0.0,1.0); }';

    }
  }, { passive: true });
  window.addEventListener('pointerup', function () {
    if (!S.dragging) return;
    S.dragging = false;
    if (S.dragMoved < 9) toggleMorph();
  });
  document.getElementById('btn-morph-toggle').addEventListener('click', toggleMorph);
  document.getElementById('btn-cta-preview').addEventListener('click', toggleMorph);
  document.querySelectorAll('.tbtn-editorial').forEach(function (b) {
    b.addEventListener('mouseenter', function () { S.burstPulse = Math.max(S.burstPulse, 0.34); S.pulseAt = S.time; S.pulseStrength = 0.42; });
  });

  var lastTs = performance.now();
  function frame(ts) {
    var dt = clamp((ts - lastTs) / 1000, 0.004, 0.05);
    lastTs = ts; S.time += dt;
    syncSizes();
    var force = (S.shatterTarget - S.shatterBlend) * 26 - S.shatterVel * 8.4;
    S.shatterVel += force * dt; S.shatterBlend = clamp(S.shatterBlend + S.shatterVel * dt, -0.08, 1.08);

    S.dragRotY = lerp(S.dragRotY, S.dragTargetY, 1 - Math.exp(-dt * 8));
    S.burstPulse *= Math.pow(0.92, dt * 60);

    var cCss = S.canvasCss, cx = cCss * 0.5, cy = cCss * 0.5, unit = S.stagePx * 0.40, dpr = S.dpr;
    var scaleLW = clamp(S.stagePx / 520, 0.58, 1.08);
    var hoverTarget = S.mouseActive && Math.hypot(S.localMx - cx, S.localMy - cy) < unit * 1.05 ? 1 : 0;
    S.hoverCore = lerp(S.hoverCore, hoverTarget, 1 - Math.exp(-dt * 6));

    /* Compute 4 Armillary Rings + 18 Shards */
    var geoms = ARMILLARY_RINGS.map(function (ring) {
      var sh = S.shatterBlend, rad = ring.radius * lerp(1, ring.expandMult, sh), spin = S.time * ring.spinSpeed * (1 + sh * 0.45);
      var rx = ring.tiltX + Math.sin(S.time * ring.precessFreq + ring.radius * 4) * ring.precessAmp + sh * 0.24 * (ring.spinSpeed > 0 ? 1 : -1);

      for (i = 0; i <= segs; i++) {

        outerPts.push(project(toW([Math.cos(a) * rOut, Math.sin(a) * rOut, 0]), cx, cy, unit));

        midPts.push(project(toW([Math.cos(a) * rad, Math.sin(a) * rad, 0]), cx, cy, unit));
      }
      var ticks = [];
      for (i = 0; i < ring.ticks; i++) {
        a = (i / ring.ticks) * Math.PI * 2 + spin;

        var p0 = project(toW([Math.cos(a) * ti, Math.sin(a) * ti, 0]), cx, cy, unit), p1 = project(toW([Math.cos(a) * to, Math.sin(a) * to, 0]), cx, cy, unit);
        ticks.push({ p0: p0, p1: p1, z: (p0.z + p1.z) * 0.5, isMajor: mj });
      }
      var nodes = [];
      for (i = 0; i < ring.nodes; i++) { a = (i / ring.nodes) * Math.PI * 2 + spin + 0.25; var np = project(toW([Math.cos(a) * rad, Math.sin(a) * rad, 0]), cx, cy, unit); nodes.push({ p: np, z: np.z, idx: i }); }
      var comets = [];
      for (var c = 0; c < ring.comets; c++) {
        var hA = S.time * (ring.spinSpeed * 2.6 + (c % 2 === 0 ? 0.5 : -0.4)) + c * Math.PI, tr = [];
        for (var k = 0; k < 14; k++) { a = hA - k * 0.045 * (ring.spinSpeed >= 0 ? 1 : -1); tr.push(project(toW([Math.cos(a) * rad, Math.sin(a) * rad, 0]), cx, cy, unit)); }

    });

    var shSmooth = smoothstep(clamp(S.shatterBlend, 0, 1));
    var shardItems = SHARDS.map(function (s) {
      var ang = s.baseAngle + S.time * (s.tier === 1 ? -0.14 : 0.11);
      var br = 1 + Math.sin(S.time * 1.9 + s.tier * 1.15 + s.idx * 0.4) * 0.035 + S.hoverCore * 0.05;
      var lt = S.time * s.speed, arc = Math.sin(shSmooth * Math.PI) * 0.22;
      var raw = [lerp(Math.cos(ang) * s.mandalaR * br, Math.sin(lt * s.lissA + s.phaseX) * s.ampX, shSmooth) * (1 + arc), lerp(Math.sin(ang) * s.mandalaR * br, Math.cos(lt * s.lissB + s.phaseY) * s.ampY, shSmooth) * (1 + arc), lerp(s.mandalaZ + Math.sin(S.time * 1.6 + s.idx) * 0.035, Math.sin(lt * s.lissC + s.phaseZ) * s.ampZ, shSmooth)];
      var wp = applyGlobalTilt(raw);
      return { shard: s, rawPos: raw, projCenter: project(wp, cx, cy, unit), rx: lerp(0.18 * Math.sin(S.time * 1.4 + s.idx), S.time * s.spinX + s.phaseX, shSmooth), ry: lerp(0.32 * Math.cos(S.time * 1.1 + s.idx), S.time * s.spinY + s.phaseY, shSmooth), rz: lerp(ang + Math.PI / 2, S.time * s.spinX * 0.5 + s.phaseZ, shSmooth), z: wp[2] };
    }).sort(function (a, b) { return a.z - b.z; });

    function drawRingPass(ctx, g, isFront) {
      var ring = g.ring, isG = ring.style === 'gold_ecliptic', isS = ring.style === 'sapphire_arcane', isH = ring.style === 'hyper_echo';
      var pCol = isG ? PAL.goldMain : (isS ? PAL.sapphireMid : (isH ? PAL.violetAccent : PAL.sapphireBright));
      var hCol = isG ? PAL.goldBright : PAL.iceBright;
      var i, zM, df;
      for (i = 0; i < g.segs; i++) {
        zM = (g.midPts[i].z + g.midPts[i + 1].z) * 0.5;
        if (isFront ? zM < 0 : zM >= 0) continue;
        df = clamp((zM + 1.3) / 2.6, 0.22, 1);
        var sp = 0.5 + 0.5 * Math.sin((i / g.segs) * Math.PI * 4 + S.time * 0.9);
        ctx.fillStyle = rgba(pCol, (isG ? 0.16 : isS ? 0.18 : 0.12) * df * 0.9 * (0.7 + 0.45 * sp));
        ctx.beginPath(); ctx.moveTo(g.outerPts[i].x, g.outerPts[i].y); ctx.lineTo(g.outerPts[i + 1].x, g.outerPts[i + 1].y); ctx.lineTo(g.innerPts[i + 1].x, g.innerPts[i + 1].y); ctx.lineTo(g.innerPts[i].x, g.innerPts[i].y); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = rgba(sp > 0.72 ? hCol : pCol, (isFront ? 0.80 : 0.35) * df * (0.68 + 0.32 * sp));
        ctx.lineWidth = (isG ? 1.55 : isS ? 1.45 : 1.15) * g.midPts[i].persp * scaleLW;
        ctx.beginPath(); ctx.moveTo(g.outerPts[i].x, g.outerPts[i].y); ctx.lineTo(g.outerPts[i + 1].x, g.outerPts[i + 1].y); ctx.stroke();
      }
      for (i = 0; i < g.ticks.length; i++) {
        var tk = g.ticks[i]; if (isFront ? tk.z < 0 : tk.z >= 0) continue;

        ctx.lineWidth = (tk.isMajor ? 1.35 : 0.75) * scaleLW;
        ctx.beginPath(); ctx.moveTo(tk.p0.x, tk.p0.y); ctx.lineTo(tk.p1.x, tk.p1.y); ctx.stroke();
      }
      for (i = 0; i < g.nodes.length; i++) {
        var nd = g.nodes[i]; if (isFront ? nd.z < 0 : nd.z >= 0) continue;

        ctx.save(); ctx.translate(nd.p.x, nd.p.y); ctx.rotate(Math.PI / 4);
        ctx.fillStyle = rgba(PAL.iceWhite, na * 0.92); ctx.strokeStyle = rgba(isG ? PAL.goldMain : PAL.sapphireBright, na); ctx.lineWidth = 1.2 * scaleLW;
        ctx.fillRect(-nr * 0.65, -nr * 0.65, nr * 1.3, nr * 1.3); ctx.strokeRect(-nr * 0.65, -nr * 0.65, nr * 1.3, nr * 1.3); ctx.restore();

      }
      for (var c = 0; c < g.comets.length; c++) {
        var tr = g.comets[c], hd = tr[0]; if (isFront ? hd.z < 0 : hd.z >= 0) continue;
        for (var k = 0; k < tr.length - 1; k++) {
          var fr = 1 - k / tr.length;
          ctx.strokeStyle = rgba(hCol, fr * fr * (isFront ? 0.85 : 0.35)); ctx.lineWidth = (2.2 * fr + 0.4) * tr[k].persp * scaleLW;
          ctx.beginPath(); ctx.moveTo(tr[k].x, tr[k].y); ctx.lineTo(tr[k + 1].x, tr[k + 1].y); ctx.stroke();
        }
        if (isFront) drawStarGlint(ctx, hd.x, hd.y, 8.2 * hd.persp * scaleLW, 0.95, hCol, S.time * 1.2);
      }
    }

    /* PASS 1: BACK 2D */
    backCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    backCtx.clearRect(0, 0, cCss, cCss);
    backCtx.save(); backCtx.translate(cx, cy);
    backCtx.strokeStyle = rgba(PAL.gridLine, 0.068); backCtx.lineWidth = 1;
    backCtx.beginPath(); backCtx.arc(0, 0, unit * 1.32, 0, Math.PI * 2); backCtx.stroke();
    backCtx.setLineDash([3, 7]); backCtx.beginPath(); backCtx.arc(0, 0, unit * 1.22, 0, Math.PI * 2); backCtx.stroke(); backCtx.setLineDash([]);
    var bgGlow = backCtx.createRadialGradient(0, 0, unit * 0.04, 0, 0, unit * 1.28);
    bgGlow.addColorStop(0, rgba(PAL.iceBright, 0.30)); bgGlow.addColorStop(0.36, rgba(PAL.causticA, 0.105)); bgGlow.addColorStop(0.68, rgba(PAL.causticB, 0.052)); bgGlow.addColorStop(1, rgba(PAL.causticA, 0));
    backCtx.fillStyle = bgGlow; backCtx.beginPath(); backCtx.arc(0, 0, unit * 1.28, 0, Math.PI * 2); backCtx.fill();
    backCtx.restore();
    geoms.forEach(function (g) { drawRingPass(backCtx, g, false); });
    shardItems.forEach(function (it) {
      if (it.z < 0) renderMesh(backCtx, SHARD_MESH, function (v) { var o = rotEuler([v[0] * it.shard.scale, v[1] * it.shard.scale, v[2] * it.shard.scale], it.rx, it.ry, it.rz); return applyGlobalTilt([o[0] + it.rawPos[0], o[1] + it.rawPos[1], o[2] + it.rawPos[2]]); }, cx, cy, unit, it.shard.goldTint);
    });

    /* PASS 2: TRANSPARENT WEBGL KIFS FOLDED CRYSTAL CORE */
    if (useWebGL && gl) {
      var pAge = Math.max(0, S.time - S.pulseAt), pAmp = pAge < 4.2 ? S.pulseStrength * Math.exp(-pAge * 1.15) : 0;
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(glProg);
      gl.uniform2f(glU.uRes, glCanvas.width, glCanvas.height);
      gl.uniform1f(glU.uTime, S.time);
      gl.uniform2f(glU.uOrbit, S.tiltX + S.dragRotX, S.tiltY + S.dragRotY);
      gl.uniform1f(glU.uPulseAge, pAge); gl.uniform1f(glU.uPulseAmp, pAmp);
      gl.uniform1f(glU.uShatter, clamp(S.shatterBlend, 0, 1)); gl.uniform1f(glU.uHover, S.hoverCore);

    frontCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    frontCtx.clearRect(0, 0, cCss, cCss);
    shardItems.forEach(function (it) {
      if (it.z >= 0) renderMesh(frontCtx, SHARD_MESH, function (v) { var o = rotEuler([v[0] * it.shard.scale, v[1] * it.shard.scale, v[2] * it.shard.scale], it.rx, it.ry, it.rz); return applyGlobalTilt([o[0] + it.rawPos[0], o[1] + it.rawPos[1], o[2] + it.rawPos[2]]); }, cx, cy, unit, it.shard.goldTint);
    });

    var aTop = project(applyGlobalTilt([0, -0.43, 0.04]), cx, cy, unit), aBot = project(applyGlobalTilt([0, 0.43, 0.04]), cx, cy, unit);
    drawStarGlint(frontCtx, aTop.x, aTop.y, 12.5 * aTop.persp * scaleLW, 0.85, PAL.iceBright, -S.time * 0.45);
    drawStarGlint(frontCtx, aBot.x, aBot.y, 9.2 * aBot.persp * scaleLW, 0.72, PAL.goldBright, S.time * 0.38);

    for (var ti = TRAIL.length - 1; ti >= 0; ti--) {
      var p = TRAIL[ti]; p.life += dt; if (p.life >= p.maxLife) { TRAIL.splice(ti, 1); continue; }
      if (p.attracted) { var dx = cx - p.x, dy = cy - p.y, d = Math.hypot(dx, dy) || 1, g = clamp(90 / (d * 0.014 + 1), 12, 84); p.vx += ((dx / d) * g - (dy / d) * g * 0.38) * dt; p.vy += ((dy / d) * g + (dx / d) * g * 0.38) * dt; }
      p.vx *= Math.pow(0.96, dt * 60); p.vy *= Math.pow(0.96, dt * 60); p.x += p.vx * dt; p.y += p.vy * dt;
      var fr = 1 - p.life / p.maxLife, al = Math.sin(fr * Math.PI) * 0.88, col = p.gold ? PAL.goldMain : PAL.sapphireBright;
      if (p.star) drawStarGlint(frontCtx, p.x, p.y, p.size * 2.3 * fr, al, col, p.life * 2.4);
      else { frontCtx.fillStyle = rgba(col, al); frontCtx.fillRect(p.x - p.size * fr * 0.5, p.y - p.size * fr * 0.5, p.size * fr, p.size * fr); }
    }
    for (var wi = WAVES.length - 1; wi >= 0; wi--) {
      var sw = WAVES[wi]; sw.life += dt; if (sw.life >= sw.dur) { WAVES.splice(wi, 1); continue; }
      var pr = sw.life / sw.dur, r = lerp(sw.r, sw.maxR, 1 - Math.pow(1 - pr, 3)), alw = (1 - pr) * (1 - pr) * 0.58;
      frontCtx.strokeStyle = rgba(sw.gold ? PAL.goldMain : PAL.sapphireBright, alw); frontCtx.lineWidth = ((1 - pr) * 2.6 + 0.5) * scaleLW;
      frontCtx.beginPath(); frontCtx.arc(sw.x, sw.y, r, 0, Math.PI * 2); frontCtx.stroke();
    }

    if (isSoftwareGL) setTimeout(function () { requestAnimationFrame(frame); }, 45);
    else requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
