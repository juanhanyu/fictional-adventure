<script>
(() => {
  'use strict';

  const glCanvas = document.getElementById('gl-canvas');
  const fbCanvas = document.getElementById('fallback-canvas');
  const stageWrap = document.getElementById('stage-wrap');
  const badgeEl = document.getElementById('renderer-badge');
  const fpsEl = document.getElementById('fps-readout');
  const headingEl = document.getElementById('mode-heading');
  const titleOverlay = document.getElementById('title-overlay');

  const MODE_META = [
    '高维折叠圣晶 · KIFS 虹彩棱镜',
    '液态棱镜奇点 · 引力折射视界',
    '无限冰宫万花筒 · 非欧递归晶殿'
  ];

  const state = {
    mode: 0,
    themeTarget: 0.0, // 0 = Deep Sapphire Night, 1 = Light Porcelain
    themeCurrent: 0.0,
    showTitle: true,
    centerShiftTarget: -0.24,
    centerShiftCurrent: -0.24,
    mouseX: 0.0,
    mouseY: 0.0,
    mouseTargetX: 0.0,
    mouseTargetY: 0.0,
    orbitYaw: 0.25,
    orbitPitch: 0.08,
    velYaw: 0.0,
    velPitch: 0.0,
    dragging: false,
    dragMoved: false,
    lastPointerX: 0,
    lastPointerY: 0,
    zoom: 1.0,
    zoomTarget: 1.0,
    pulseTime: -10.0,
    pulseStrength: 0.0,
    pulseOriginX: 0.0,
    pulseOriginY: 0.0,
    startTime: performance.now()
  };

  // =========================================================================
  // SPECIALIZED GLSL ES 1.00 SHADERS (3 High-Contrast Optical Mode Programs)
  // =========================================================================
  const VERT_SRC = `
    attribute vec2 aPos;
    void main() {
      gl_Position = vec4(aPos, 0.0, 1.0);
    }
  `;

  function buildFragmentSource(modeIdx) {
    return `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    #define CRYSTAL_MODE ${modeIdx}

    uniform vec2 uRes;
    uniform float uTime;
    uniform float uTheme;
    uniform float uCenterX;
    uniform vec2 uMouse;
    uniform vec2 uOrbit;
    uniform float uZoom;
    uniform float uPulseAge;
    uniform float uPulseAmp;
    uniform vec2 uPulsePos;

    const float PI = 3.14159265359;

    mat2 rot2(float a) {
      float c = cos(a), s = sin(a);
      return mat2(c, -s, s, c);
    }

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }

    float smin(float a, float b, float k) {
      float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
      return mix(b, a, h) - k * h * (1.0 - h);
    }

    float smax(float a, float b, float k) {
      return -smin(-a, -b, k);
    }

    float sdOctahedron(vec3 p, float s) {
      p = abs(p);
      float m = p.x + p.y + p.z - s;
      vec3 q;
      if (3.0 * p.x < m) q = p.xyz;
      else if (3.0 * p.y < m) q = p.yzx;
      else if (3.0 * p.z < m) q = p.zxy;
      else return m * 0.57735027;
      float k = clamp(0.5 * (q.z - q.y + s), 0.0, s);
      return length(vec3(q.x, q.y - s + k, q.z - k));
    }

    float sdHexPrism(vec3 p, vec2 h) {
      const vec3 k = vec3(-0.8660254, 0.5, 0.57735);
      p = abs(p);
      p.xy -= 2.0 * min(dot(k.xy, p.xy), 0.0) * k.xy;
      vec2 d = vec2(
        length(p.xy - vec2(clamp(p.x, -k.z * h.x, k.z * h.x), h.x)) * sign(p.y - h.x),
        p.z - h.y
      );
      return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
    }

    // Spectral thin-film iridescence (sapphire -> ice cyan -> pearl violet -> champagne gold)
    vec3 iridescence(float cosTheta, float shift) {
      vec3 phase = vec3(0.02, 0.34, 0.68);
      vec3 col = 0.54 + 0.46 * cos(6.28318 * (cosTheta * 1.65 + shift + phase));
      return mix(col, vec3(0.32, 0.80, 1.0), 0.18);
    }

    // Per-frame precomputed matrices (zero trig inside raymarch loop!)
    mat2 mSpinY;
    mat2 mTiltXY;
    mat2 mFold1;
    mat2 mFold2;
    mat2 mSub1;
    mat2 mSub2;

    float mapCrystal(vec3 p, float t, float ripple) {
    #if CRYSTAL_MODE == 0
      // === MODE 0: KIFS Octahedral-Icosahedral High-Dimensional Folded Crystal ===
      vec3 q = p;
      q.xz *= mSpinY;
      q.xy *= mTiltXY;

      vec3 eq = q;
      eq.y *= 0.72;
      float outerGem = sdOctahedron(eq, 1.18);

      // 6-fold orbiting 4D satellite prism shards (kept cleanly inside frame)
      float shards = 10.0;
      float rLen = length(p);
      if (rLen > 0.82 && rLen < 1.92) {
        vec3 sp = p;
        sp.xz *= mSub1;
        sp.yz *= mSub2;
        float ang = atan(sp.z, sp.x);
        float seg = PI / 3.0;
        float id = floor((ang + seg * 0.5) / seg);
        float a = mod(ang + seg * 0.5, seg) - seg * 0.5;
        float rad = length(sp.xz);
        vec3 sr = vec3(cos(a) * rad, sp.y, sin(a) * rad);
        sr.x -= 1.24 + 0.07 * sin(t * 1.4 + id * 2.1) + ripple * 0.18;
        sr.y -= 0.22 * sin(t * 0.9 + id * 1.7);
        sr.xy *= mFold1;
        sr.y *= 0.52;
        shards = sdOctahedron(sr, 0.145);
      }

      if (outerGem > 0.26) return min(outerGem - 0.08, shards);

      // Clean 3-level KIFS architectural jewel fold (crisp non-Euclidean facets, zero noise!)
      vec3 k = q;
      k.y *= 0.76;
      float scale = 1.0;
      const vec3 icoN = vec3(0.809017, 0.5, 0.309017);

      for (int i = 0; i < 3; i++) {
        k = abs(k);
        if (k.x < k.y) k.xy = k.yx;
        if (k.x < k.z) k.xz = k.zx;
        if (k.y < k.z) k.yz = k.zy;
        k -= 2.0 * min(0.0, dot(k, icoN)) * icoN;
        k.xz *= mFold1;
        k.xy *= mFold2;
        float s = 1.44;
        k = k * s - vec3(0.52, 0.36, 0.24) * (s - 1.0);
        scale *= s;
      }

      float kifs = (sdOctahedron(k, 0.96) - 0.035) / scale;
      float core = smax(kifs, outerGem - 0.08, 0.055);
      core = smin(core, sdOctahedron(eq, 0.68), 0.09);
      return min(core, shards);

    #elif CRYSTAL_MODE == 1
      // === MODE 1: Liquid Prism Singularity & Interlocking Crystal Accretion Core ===
      vec3 ps = p * 1.15;
      float pr = length(ps);
      if (pr > 2.05) return (pr - 1.72) / 1.15;

      vec3 q = ps;
      q.xz *= mSpinY;
      q.yz *= mTiltXY;

      // Smoothly breathing liquid-diamond harmonic singularity core (exact Lipschitz!)
      float wave = sin(q.x * 4.2 + t * 1.3) * sin(q.y * 4.2 - t * 1.1) * sin(q.z * 4.2 + t * 0.9);
      vec3 c1 = q;
      c1.xy *= mFold1;
      float dOct = sdOctahedron(c1, 0.96 + ripple * 0.16);
      float dSph = length(q) - (0.68 + 0.08 * wave + ripple * 0.10);
      float dCore = smin(dOct, dSph, 0.22);

      // Two interlocking beveled crystalline accretion rings (clean exact SDFs)
      vec3 t1 = ps;
      t1.xz *= mSpinY;
      t1.xy *= mSub1;
      vec2 rq1 = vec2(length(t1.xz) - (1.16 + 0.04 * sin(t * 1.5)), t1.y);
      float dRing1 = (abs(rq1.x) + abs(rq1.y)) * 0.7071 - 0.115;

      vec3 t2 = ps;
      t2.xz *= mFold2;
      t2.yz *= mSub2;
      vec2 rq2 = vec2(length(t2.xz) - (1.30 + 0.04 * cos(t * 1.2)), t2.y);
      float dRing2 = (abs(rq2.x) + abs(rq2.y)) * 0.7071 - 0.085;

      // Orbiting mercury-diamond droplets merging smoothly with the accretion flow
      vec3 dp = ps;
      dp.xz *= mFold1;
      dp.xz = abs(dp.xz);
      if (dp.x < dp.z) dp.xz = dp.zx;
      dp.x -= 1.05 + 0.08 * sin(t * 1.6);
      float dDrops = sdOctahedron(dp, 0.22);

      float merged = smin(dCore, dRing1, 0.18);
      merged = smin(merged, dRing2, 0.14);
      merged = smin(merged, dDrops, 0.16);
      return (merged + wave * 0.032) / 1.15;

    #else
      // === MODE 2: Infinity-Mirror Ice Palace Kaleidoscope Monolith ===
      vec3 q = p * 1.28;
      q.xz *= mSpinY;
      q.xy *= mTiltXY;

      vec3 hp = vec3(q.x, q.z, q.y);
      float hexBody = sdHexPrism(hp, vec2(0.76 + ripple * 0.06, 1.18));

      vec3 taperP = q;
      taperP.y *= 0.60;
      float crown = sdOctahedron(taperP, 1.20 + ripple * 0.10);

      vec3 taper2 = q;
      taper2.xz = vec2(taper2.x - taper2.z, taper2.x + taper2.z) * 0.70710678;
      taper2.y *= 0.62;
      float crown2 = sdOctahedron(taper2, 1.22 + ripple * 0.10);

      float monolith = smax(hexBody, max(crown, crown2), 0.045);

      // Symmetrical floating palace crown finials (clean vertical breathing room)
      vec3 sp = q;
      sp.y = abs(sp.y) - (1.42 + 0.06 * sin(t * 1.4) + ripple * 0.16);
      sp.xz *= mFold1;
      sp.y *= 0.48;
      float finial = sdOctahedron(sp, 0.16);

      // 4 cardinal floating diamond prism guardians
      vec3 g = q;
      g.xz *= mSub1;
      g.xz = abs(g.xz);
      if (g.x < g.z) g.xz = g.zx;
      g.x -= 1.22 + 0.05 * cos(t * 1.2) + ripple * 0.15;
      g.y *= 0.42;
      float guards = sdOctahedron(g, 0.15);

      return min(monolith, min(finial, guards)) / 1.28;
    #endif
    }

    // Analytic 3D celestial astrolabe ring intersection (razor-sharp, depth-tested!)
    vec2 intersectAstrolabeRing(vec3 ro, vec3 rd, vec3 planeN, float radius, float width) {
      float denom = dot(rd, planeN);
      if (abs(denom) < 0.001) return vec2(0.0, 999.0);
      float tHit = -dot(ro, planeN) / denom;
      if (tHit < 0.0) return vec2(0.0, 999.0);
      vec3 p = ro + rd * tHit;
      float r = length(p);
      float d = abs(r - radius);
      // Crisp hairline + soft halo
      float coreLine = exp(-pow(d / width, 2.0));
      float softGlow = exp(-d * 10.0) * 0.28;
      // Subtle engraved tick marks along the ring
      float ang = atan(p.z, p.x);
      float ticks = 0.72 + 0.28 * pow(0.5 + 0.5 * cos(ang * 24.0), 4.0);
      return vec2((coreLine + softGlow) * ticks, tHit);
    }

    // Non-unrolled tetrahedral normal + free Laplacian ridge curvature
    vec4 calcNormalAndRidge(vec3 p, float t, float ripple) {
      vec3 n = vec3(0.0);
      float dSum = 0.0;
      int z = int(min(t, 0.0));
      for (int i = 0; i < 4; i++) {
        int idx = i + z;
        vec3 e;
        if (idx == 0) e = vec3( 0.57735, -0.57735, -0.57735);
        else if (idx == 1) e = vec3(-0.57735, -0.57735,  0.57735);
        else if (idx == 2) e = vec3(-0.57735,  0.57735, -0.57735);
        else e = vec3( 0.57735,  0.57735,  0.57735);
        float d = mapCrystal(p + e * 0.0042, t, ripple);
        n += e * d;
        dSum += d;
      }
      float ridge = smoothstep(0.14, 0.85, abs(dSum) / 0.0095);
      return vec4(normalize(n), ridge);
    }

    // High-contrast studio / cathedral HDRI environment for true diamond reflections
    vec3 sampleEnvironment(vec3 dir, float t, float theme) {
      dir = normalize(dir);
      float y = dir.y;
      float az = atan(dir.z, dir.x);

      // --- Deep Sapphire Night Studio HDRI (deep obsidian shadows + razor light bands) ---
      vec3 nightSky = mix(vec3(0.006, 0.014, 0.048), vec3(0.025, 0.075, 0.22), smoothstep(-0.5, 0.7, y));
      // Sculpted aurora silk bands
      float aurWave = sin(dir.x * 4.0 + t * 0.42 + sin(dir.z * 3.0 - t * 0.28));
      float aurBand = exp(-pow(y - 0.16 - aurWave * 0.15, 2.0) * 22.0);
      vec3 aurCol = mix(vec3(0.06, 0.68, 1.0), vec3(0.48, 0.28, 0.98), 0.5 + 0.5 * sin(az * 2.0 - t * 0.4));
      nightSky += aurCol * aurBand * 0.72;
      // Dark architectural shadow ribs give glass facets dramatic jewel contrast
      float ribDark = smoothstep(0.35, 0.92, sin(az * 5.0 + y * 3.0));
      nightSky *= mix(0.45, 1.15, ribDark);

      // Sharp studio softbox catchlights
      float win1 = smoothstep(0.90, 0.985, dot(dir, normalize(vec3(0.56, 0.68, 0.48))));
      float win2 = smoothstep(0.88, 0.98, dot(dir, normalize(vec3(-0.75, 0.32, 0.56))));
      float win3 = smoothstep(0.91, 0.99, dot(dir, normalize(vec3(0.16, -0.76, 0.62))));
      nightSky += vec3(1.10, 1.38, 1.85) * win1;
      nightSky += vec3(0.28, 0.95, 1.65) * win2;
      nightSky += vec3(0.95, 0.78, 0.48) * win3 * 0.70;

      // --- Light Porcelain Gallery HDRI (deep royal cobalt ribs for sapphire-jewel depth!) ---
      vec3 porcSky = mix(vec3(0.12, 0.28, 0.68), vec3(0.88, 0.94, 1.0), smoothstep(-0.35, 0.65, y));
      float ribP = smoothstep(0.30, 0.92, abs(sin(az * 4.0 + y * 2.4)));
      porcSky = mix(vec3(0.04, 0.14, 0.46), porcSky, ribP);
      porcSky += vec3(1.35, 1.50, 1.75) * win1 * 0.95;
      porcSky += vec3(0.22, 0.72, 1.45) * win2 * 0.85;
      porcSky += vec3(1.10, 0.88, 0.52) * win3 * 0.62;

      return mix(nightSky, porcSky, theme);
    }

    // Internal Infinity-Mirror Glowing Crystal Lattice (High-Contrast Dark Void + Neon Filigree!)
    vec3 traceInfinityInterior(vec3 entryP, vec3 refrR, vec3 refrG, vec3 refrB, float t, float ripple, float theme) {
      vec3 acc = vec3(0.0);
      float dist = 0.08;
      #if CRYSTAL_MODE == 2
        float cellScale = 2.45;
        float stepSize = 0.17;
        float depthMul = 3.2;
        float wireSharp = 32.0;
        float decayK = 1.45;
        float palaceBoost = 1.0;
        float singBoost = 0.0;
      #elif CRYSTAL_MODE == 1
        float cellScale = 1.85;
        float stepSize = 0.17;
        float depthMul = 1.8;
        float wireSharp = 26.0;
        float decayK = 2.05;
        float palaceBoost = 0.18;
        float singBoost = 1.0;
      #else
        float cellScale = 1.95;
        float stepSize = 0.17;
        float depthMul = 1.85;
        float wireSharp = 28.0;
        float decayK = 2.00;
        float palaceBoost = 0.35;
        float singBoost = 0.15;
      #endif

      vec3 dispDelta = (refrB - refrR) * 0.85;
      mat2 mStep = rot2(0.12 + ripple * 0.16);
      mat2 mRot = rot2(t * 0.26);

      for (int i = 0; i < 12; i++) {
        float fi = float(i) / 12.0;
        vec3 p = entryP + refrG * dist;

        vec3 q = p * (1.0 + fi * depthMul);
        q.xz *= mRot;
        mRot = mRot * mStep;

        vec3 cell = mod(q * cellScale + 0.5, 1.0) - 0.5;
        vec3 a = abs(cell);

        // True RGB chromatic split across infinity-mirror lattice filigree
        vec3 cellR = mod((q - dispDelta * dist * 1.9) * cellScale + 0.5, 1.0) - 0.5;
        vec3 cellB = mod((q + dispDelta * dist * 1.9) * cellScale + 0.5, 1.0) - 0.5;
        float latG = min(length(a.yz), min(length(a.xz), length(a.xy)));
        float latR = min(length(abs(cellR).yz), min(length(abs(cellR).xz), length(abs(cellR).xy)));
        float latB = min(length(abs(cellB).yz), min(length(abs(cellB).xz), length(abs(cellB).xy)));

        vec3 glowWire = vec3(exp(-latR * wireSharp), exp(-latG * wireSharp), exp(-latB * wireSharp));

        float node = (a.x + a.y + a.z) * 0.57735 - (0.12 + 0.025 * sin(t * 1.8 + fi * 8.0));
        float glowNode = exp(-max(node, 0.0) * 24.0);
        float coreStar = exp(-length(p) * mix(3.4, 4.6, singBoost));

        // Jewel-rich spectral palette: sapphire -> glacial aqua -> amethyst -> champagne gold
        vec3 depthTint = mix(
          vec3(0.08, 0.62, 1.0),
          vec3(0.56, 0.28, 1.0),
          0.5 + 0.5 * sin(fi * 5.2 - t * 1.0)
        );
        vec3 goldFiligree = vec3(1.0, 0.84, 0.48);

        // Controlled gain so deep sapphire shadows remain dark & luminous lines pop like laser filigree!
        vec3 sampleCol = depthTint * glowWire * 0.26
                       + mix(vec3(0.42, 0.88, 1.0), goldFiligree, 0.48 * palaceBoost) * glowNode * 0.24
                       + mix(vec3(0.22, 0.78, 1.0), vec3(1.0, 0.88, 0.62), singBoost) * coreStar * (0.14 + 0.34 * singBoost);

        acc += sampleCol * exp(-fi * decayK);
        dist += stepSize;
      }

      // On Light Porcelain, keep interior deeply saturated royal cobalt + glowing cyan/gold lines
      vec3 porcRich = acc * vec3(0.45, 0.72, 1.25);
      return mix(acc, porcRich, theme);
    }

    // Background Canvas + Volumetric Aurora God-Rays + Stardust
    vec3 renderBackdrop(vec2 uv, vec2 crystalUv, float t, float theme) {
      vec2 rel = uv - crystalUv;
      float r = length(rel);
      float ang = atan(rel.y, rel.x);

      float ray1 = pow(0.5 + 0.5 * sin(ang * 7.0 + t * 0.22 + sin(ang * 3.0 - t * 0.18)), 3.2);
      float ray2 = pow(0.5 + 0.5 * sin(ang * 13.0 - t * 0.30), 4.0);
      float rays = (ray1 * 0.65 + ray2 * 0.35) * exp(-r * 2.15) * smoothstep(0.05, 0.34, r);

      // Deep Sapphire Night Backdrop
      vec3 nightBg = mix(vec3(0.008, 0.018, 0.055), vec3(0.028, 0.072, 0.20), exp(-r * 1.25));
      nightBg += vec3(0.07, 0.30, 0.78) * exp(-r * 2.8) * 0.55;
      nightBg += vec3(0.22, 0.72, 1.00) * rays * 0.36;
      float ribbon = exp(-pow(uv.y - 0.16 - 0.18 * sin(uv.x * 2.3 + t * 0.20), 2.0) * 15.0);
      nightBg += mix(vec3(0.06, 0.38, 0.85), vec3(0.38, 0.20, 0.82), 0.5 + 0.5 * uv.x) * ribbon * 0.15;

      vec2 starGrid = uv * 18.0 + vec2(t * 0.05, -t * 0.08);
      vec2 cellId = floor(starGrid);
      vec2 cellUv = fract(starGrid) - 0.5;
      float rnd = hash21(cellId);
      if (rnd > 0.88) {
        vec2 off = (vec2(hash21(cellId + 7.1), hash21(cellId + 19.3)) - 0.5) * 0.55;
        float dStar = length(cellUv - off);
        float twinkle = 0.5 + 0.5 * sin(t * 2.4 + rnd * 40.0);
        nightBg += vec3(0.68, 0.90, 1.0) * smoothstep(0.08, 0.0, dStar) * twinkle * 0.52;
      }

      // Light Porcelain Gallery Backdrop (《转生千金》 #FAFBFD -> #E8F0FC)
      vec3 porcBg = mix(vec3(0.922, 0.948, 0.990), vec3(0.996, 0.998, 1.0), exp(-r * 1.10));
      // Subtle sapphire prism caustic halo on porcelain air
      porcBg = mix(porcBg, vec3(0.84, 0.92, 1.0), exp(-r * 2.6) * 0.34);
      vec3 prismRayCol = mix(vec3(0.76, 0.89, 1.0), vec3(0.98, 0.93, 0.84), 0.5 + 0.5 * sin(ang * 3.0 + t * 0.3));
      porcBg = mix(porcBg, prismRayCol, rays * 0.32);

      if (rnd > 0.91) {
        vec2 off2 = (vec2(hash21(cellId + 7.1), hash21(cellId + 19.3)) - 0.5) * 0.55;
        float dMote = length(cellUv - off2);
        float tw = 0.45 + 0.55 * sin(t * 2.0 + rnd * 32.0);
        porcBg = mix(porcBg, vec3(0.14, 0.40, 0.86), smoothstep(0.06, 0.0, dMote) * tw * 0.32);
      }

      vec3 bg = mix(nightBg, porcBg, theme);

      if (uPulseAmp > 0.005) {
        float waveR = uPulseAge * 1.15;
        float ring = exp(-pow((length(uv - uPulsePos) - waveR) * 20.0, 2.0)) * uPulseAmp;
        vec3 ringCol = mix(vec3(0.45, 0.90, 1.0), vec3(0.12, 0.38, 0.94), theme);
        bg += ringCol * ring * mix(0.65, 0.32, theme);
      }

      return bg;
    }

    vec3 acesToneMap(vec3 x) {
      const float a = 2.51;
      const float b = 0.03;
      const float c = 2.43;
      const float d = 0.59;
      const float e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }

    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float aspect = uRes.x / uRes.y;

      vec2 crystalAnchor = vec2(uCenterX * aspect, 0.02);
      vec2 pUv = uv - crystalAnchor;

      float ripple = uPulseAmp * sin(uPulseAge * 9.5) * exp(-uPulseAge * 1.6);
      float rippleEnv = uPulseAmp * exp(-uPulseAge * 1.2);

      // Precompute per-frame matrices for active mode
      #if CRYSTAL_MODE == 0
        mSpinY = rot2(uTime * 0.24);
        mTiltXY = rot2(sin(uTime * 0.35) * 0.12);
        mFold1 = rot2(0.42 + 0.16 * sin(uTime * 0.52) + ripple * 0.60);
        mFold2 = rot2(0.28 + 0.12 * cos(uTime * 0.38) - ripple * 0.38);
        mSub1 = rot2(-uTime * 0.30);
        mSub2 = rot2(0.30 + sin(uTime * 0.38) * 0.10);
      #elif CRYSTAL_MODE == 1
        mSpinY = rot2(uTime * 0.36);
        mTiltXY = rot2(uTime * 0.20);
        mFold1 = rot2(uTime * 0.48 + ripple * 1.15);
        mFold2 = rot2(-uTime * 0.34);
        mSub1 = rot2(0.68 + sin(uTime * 0.48) * 0.18);
        mSub2 = rot2(-0.82 + cos(uTime * 0.42) * 0.18);
      #else
        mSpinY = rot2(uTime * 0.20 + ripple * 0.38);
        mTiltXY = rot2(sin(uTime * 0.28) * 0.08);
        mFold1 = rot2(uTime * 0.55);
        mSub1 = rot2(-uTime * 0.26);
      #endif

      vec2 mouseRel = (uMouse * vec2(aspect * 0.5, 0.5)) - crystalAnchor;
      float cursorDist = length(pUv - mouseRel);
      vec2 lensWarp = (pUv - mouseRel) * (0.014 / (cursorDist * cursorDist + 0.28));
      #if CRYSTAL_MODE == 1
        vec2 rayUv = pUv - lensWarp * 0.95;
      #else
        vec2 rayUv = pUv - lensWarp * 0.35;
      #endif

      // Generous gallery framing so crystal & rings NEVER clip or collide with title text
      float camDist = 5.45 / clamp(uZoom, 0.72, 1.45);
      vec3 ro = vec3(0.0, 0.04, camDist);
      vec3 rd = normalize(vec3(rayUv, -1.78));

      float yaw = uOrbit.x + uMouse.x * 0.34;
      float pitch = clamp(uOrbit.y - uMouse.y * 0.24, -0.85, 0.85);
      ro.yz *= rot2(pitch);
      rd.yz *= rot2(pitch);
      ro.xz *= rot2(yaw);
      rd.xz *= rot2(yaw);

      vec3 bgCol = renderBackdrop(uv, crystalAnchor, uTime, uTheme);

      // Analytic 3D Celestial Astrolabe Rings (exact plane intersections, razor crisp!)
      vec3 ringN1 = normalize(vec3(sin(uTime * 0.16) * 0.45, 0.78, cos(uTime * 0.16) * 0.45));
      vec3 ringN2 = normalize(vec3(-cos(uTime * 0.12) * 0.62, 0.52, sin(uTime * 0.12) * 0.62));
      vec2 astro1 = intersectAstrolabeRing(ro, rd, ringN1, 1.48, 0.0080);
      vec2 astro2 = intersectAstrolabeRing(ro, rd, ringN2, 1.68, 0.0062);

      // Primary Raymarch (True smooth sphere-tracing — ZERO step-banding!)
      float tMarch = 0.0;
      float hit = 0.0;
      vec3 hitPos = vec3(0.0);
      float haloGlow = 0.0;

      float b = dot(ro, rd);
      float c = dot(ro, ro) - 2.15 * 2.15;
      float disc = b * b - c;
      float hitDist = 999.0;

      if (disc > 0.0) {
        float tStart = max(0.0, -b - sqrt(disc));
        float tEnd = min(9.5, -b + sqrt(disc));
        tMarch = tStart;
        vec3 p = ro + rd * tMarch;

        for (int i = 0; i < 64; i++) {
          float pr = length(p);

          #if CRYSTAL_MODE == 1
            // True geodesic incremental gravitational ray bending (zero teleport slicing!)
            vec3 pull = -p / max(pr * pr * pr + 0.65, 0.65);
            rd = normalize(rd + pull * 0.0055);
          #endif

          float dCrys = mapCrystal(p, uTime, ripple);
          haloGlow += 0.0028 / (abs(dCrys) + 0.18);

          if (dCrys < 0.0014) {
            p += rd * (dCrys * 0.5);
            tMarch += dCrys * 0.5;
            hit = 1.0;
            hitPos = p;
            hitDist = tMarch;
            break;
          }

          float stepD = dCrys * 0.72;
          p += rd * stepD;
          tMarch += stepD;
          if (tMarch > tEnd) break;
        }
      }

      vec3 col = bgCol;

      // Soft sapphire crystal aura behind gem
      float auraStrength = clamp(haloGlow * 0.12, 0.0, 0.85);
      col = mix(
        col + vec3(0.10, 0.48, 1.0) * auraStrength * 0.34,
        mix(col, vec3(0.80, 0.90, 1.0), auraStrength * 0.24),
        uTheme
      );

      // Draw astrolabe ring segments that lie BEHIND the crystal
      vec3 ringCol1 = mix(vec3(0.42, 0.86, 1.0), vec3(0.12, 0.36, 0.86), uTheme);
      vec3 ringCol2 = mix(vec3(0.95, 0.82, 0.54), vec3(0.68, 0.52, 0.24), uTheme);
      if (astro1.y > hitDist) {
        col = mix(col + ringCol1 * astro1.x * 0.65, mix(col, ringCol1, clamp(astro1.x * 0.62, 0.0, 1.0)), uTheme);
      }
      if (astro2.y > hitDist) {
        col = mix(col + ringCol2 * astro2.x * 0.52, mix(col, ringCol2, clamp(astro2.x * 0.52, 0.0, 1.0)), uTheme);
      }

      // =====================================================================
      // PHYSICAL-FEEL HIGH-CONTRAST OPTICAL CRYSTAL SHADING
      // =====================================================================
      if (hit > 0.5) {
        vec4 nr = calcNormalAndRidge(hitPos, uTime, ripple);
        vec3 n = nr.xyz;
        float ridge = nr.w;
        vec3 v = -rd;
        float ndv = clamp(dot(n, v), 0.0, 1.0);

        // Schlick Fresnel (diamond-sapphire IOR ~ 1.58)
        float fresnel = 0.06 + 0.94 * pow(1.0 - ndv, 3.4);

        // Spectral thin-film iridescence along grazing angles & facet ridges
        vec3 irid = iridescence(ndv, uTime * 0.08 + dot(hitPos, vec3(0.28, 0.42, 0.22)) + rippleEnv * 0.40);

        // Reflection environment sample
        vec3 reflDir = reflect(rd, n);
        vec3 reflCol = sampleEnvironment(reflDir, uTime, uTheme);

        // True 3-Channel RGB Chromatic Dispersion Refraction
        float dispBoost = 0.055 + 0.075 * rippleEnv + 0.035 * clamp(1.0 - cursorDist, 0.0, 1.0);
        vec3 refrR = refract(rd, n, 1.0 / (1.36 - dispBoost));
        vec3 refrG = refract(rd, n, 1.0 / 1.52);
        vec3 refrB = refract(rd, n, 1.0 / (1.70 + dispBoost));
        if (length(refrR) < 0.01) refrR = reflDir;
        if (length(refrG) < 0.01) refrG = reflDir;
        if (length(refrB) < 0.01) refrB = reflDir;

        vec3 bgRefr;
        bgRefr.r = sampleEnvironment(refrR, uTime, uTheme).r;
        bgRefr.g = sampleEnvironment(refrG, uTime, uTheme).g;
        bgRefr.b = sampleEnvironment(refrB, uTime, uTheme).b;

        // Internal Infinity-Mirror Glowing Crystal Lattice
        vec3 innerLattice = traceInfinityInterior(hitPos - n * 0.02, refrR, refrG, refrB, uTime, ripple, uTheme);

        // Deep Royal Sapphire Beer-Lambert Absorption (preserves rich jewel depth!)
        float thickness = clamp(0.85 + (1.0 - ndv) * 0.95 + 0.22 * length(hitPos), 0.35, 2.2);
        vec3 absorbNight = exp(-thickness * vec3(2.40, 1.05, 0.22));
        vec3 absorbPorc  = exp(-thickness * vec3(3.10, 1.55, 0.32));
        vec3 absorption = mix(absorbNight, absorbPorc, uTheme);

        // Deep crystalline interior base (dark sapphire void so glowing lattice pops!)
        vec3 deepCore = mix(vec3(0.015, 0.055, 0.19), vec3(0.035, 0.12, 0.42), uTheme);
        vec3 transmitted = deepCore + bgRefr * absorption * mix(0.68, 0.82, uTheme) + innerLattice;

        // Sharp multi-point studio specular highlights (diamond sparkle!)
        vec3 l1 = normalize(vec3(0.55, 0.76, 0.64));
        vec3 l2 = normalize(vec3(-0.74, 0.26, 0.54));
        vec3 l3 = normalize(vec3(0.20, -0.82, 0.46));
        float spec1 = pow(max(dot(n, normalize(l1 + v)), 0.0), 120.0);
        float spec2 = pow(max(dot(n, normalize(l2 + v)), 0.0), 64.0);
        float spec3 = pow(max(dot(n, normalize(l3 + v)), 0.0), 42.0);

        vec3 specCol = vec3(1.55, 1.75, 2.05) * spec1
                     + vec3(0.32, 0.88, 1.48) * spec2 * 0.82
                     + vec3(1.12, 0.90, 0.54) * spec3 * 0.58;

        // Crisp prismatic fire strictly along sharp cut facet ridges
        vec3 edgeFire = mix(irid, vec3(0.92, 0.98, 1.0), 0.28) * ridge * mix(0.62, 0.54, uTheme);

        // Balanced Fresnel reflection + sapphire-iridescent rim
        vec3 surface = mix(transmitted, reflCol * vec3(0.86, 0.94, 1.12), fresnel * 0.72);
        surface += irid * fresnel * mix(0.46, 0.34, uTheme);
        surface += specCol;
        surface += edgeFire;

        // Subtle deep cobalt silhouette rim on Light Porcelain for Cartier-grade contrast
        float porcelRim = pow(1.0 - ndv, 2.2) * (1.0 - fresnel * 0.45);
        surface = mix(surface, vec3(0.04, 0.15, 0.52), uTheme * porcelRim * 0.38);

        // Dimensional click ripple iridescent wave across crystal facets
        float facetPulse = uPulseAmp * exp(-uPulseAge * 2.2) * (0.5 + 0.5 * sin(length(hitPos) * 9.0 - uPulseAge * 15.0));
        surface += irid * facetPulse * 0.72;

        col = surface;
      }

      // Draw astrolabe ring segments that pass IN FRONT of the crystal (true 3D interweaving!)
      if (astro1.y < hitDist) {
        col = mix(col + ringCol1 * astro1.x * 0.82, mix(col, ringCol1, clamp(astro1.x * 0.72, 0.0, 1.0)), uTheme);
      }
      if (astro2.y < hitDist) {
        col = mix(col + ringCol2 * astro2.x * 0.65, mix(col, ringCol2, clamp(astro2.x * 0.60, 0.0, 1.0)), uTheme);
      }

      // Subtle cinematic vignette
      float vig = 1.0 - dot(uv * vec2(0.52, 0.70), uv * vec2(0.52, 0.70)) * mix(0.40, 0.12, uTheme);
      col *= clamp(vig, 0.60, 1.05);

      vec3 mappedNight = acesToneMap(col * 1.12);
      vec3 mappedPorc  = mix(col, acesToneMap(col * 1.15), 0.45);
      vec3 finalCol = mix(mappedNight, mappedPorc, uTheme);
      finalCol = pow(clamp(finalCol, 0.0, 1.0), vec3(mix(0.95, 0.99, uTheme)));

      gl_FragColor = vec4(finalCol, 1.0);
    }
    `;
  }

  // =========================================================================
  // WEBGL ENGINE (WebGL2 -> WebGL1 -> Canvas2D Fallback, Per-Mode Programs)
  // =========================================================================
  let gl = null;
  let glModeLabel = 'CANVAS2D · FALLBACK';
  let useWebGL = false;
  let isSoftwareGL = false;
  let sharedVert = null;
  const programs = [null, null, null];
  const uniformSets = [null, null, null];

  function compileShader(glCtx, type, src) {
    const sh = glCtx.createShader(type);
    glCtx.shaderSource(sh, src);
    glCtx.compileShader(sh);
    if (!glCtx.getShaderParameter(sh, glCtx.COMPILE_STATUS)) {
      const log = glCtx.getShaderInfoLog(sh);
      glCtx.deleteShader(sh);
      throw new Error('Shader compile failed: ' + log);
    }
    return sh;
  }

  function ensureProgram(modeIdx) {
    if (programs[modeIdx]) return programs[modeIdx];
    const fs = compileShader(gl, gl.FRAGMENT_SHADER, buildFragmentSource(modeIdx));
    const prog = gl.createProgram();
    gl.attachShader(prog, sharedVert);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error('Program link failed: ' + gl.getProgramInfoLog(prog));
    }
    gl.deleteShader(fs);
    programs[modeIdx] = prog;
    uniformSets[modeIdx] = {
      aPos: gl.getAttribLocation(prog, 'aPos'),
      uRes: gl.getUniformLocation(prog, 'uRes'),
      uTime: gl.getUniformLocation(prog, 'uTime'),
      uTheme: gl.getUniformLocation(prog, 'uTheme'),
      uCenterX: gl.getUniformLocation(prog, 'uCenterX'),
      uMouse: gl.getUniformLocation(prog, 'uMouse'),
      uOrbit: gl.getUniformLocation(prog, 'uOrbit'),
      uZoom: gl.getUniformLocation(prog, 'uZoom'),
      uPulseAge: gl.getUniformLocation(prog, 'uPulseAge'),
      uPulseAmp: gl.getUniformLocation(prog, 'uPulseAmp'),
      uPulsePos: gl.getUniformLocation(prog, 'uPulsePos')
    };
    return prog;
  }

  function initWebGL() {
    const opts = {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    };

    gl = glCanvas.getContext('webgl2', opts);
    if (gl) {
      glModeLabel = 'WEBGL2 · RAYMARCHED SDF';
    } else {
      gl = glCanvas.getContext('webgl', opts) || glCanvas.getContext('experimental-webgl', opts);
      if (gl) glModeLabel = 'WEBGL1 · RAYMARCHED SDF';
    }
    if (!gl) return false;

    try {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      if (dbg) {
        const rend = String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) || '');
        if (/swiftshader|llvmpipe|software/i.test(rend)) isSoftwareGL = true;
      }

      sharedVert = compileShader(gl, gl.VERTEX_SHADER, VERT_SRC);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

      ensureProgram(0);
      return true;
    } catch (err) {
      console.error('[Crystal Scheme C] WebGL fallback triggered:', err);
      return false;
    }
  }

  useWebGL = initWebGL();
  badgeEl.textContent = glModeLabel;

  let fbCtx = null;
  if (!useWebGL) {
    glCanvas.style.display = 'none';
    fbCanvas.style.display = 'block';
    fbCtx = fbCanvas.getContext('2d');
  }

  let renderScale = isSoftwareGL ? 0.72 : Math.min(window.devicePixelRatio || 1, 1.5);
  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const rw = Math.max(1, Math.floor(w * renderScale));
    const rh = Math.max(1, Math.floor(h * renderScale));
    if (useWebGL) {
      glCanvas.width = rw;
      glCanvas.height = rh;
      gl.viewport(0, 0, rw, rh);
    } else {
      fbCanvas.width = rw;
      fbCanvas.height = rh;
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // =========================================================================
  // GRACEFUL CANVAS2D FALLBACK
  // =========================================================================
  function drawFallback2D(t) {
    if (!fbCtx) return;
    const w = fbCanvas.width;
    const h = fbCanvas.height;
    const cx = w * (0.5 + state.centerShiftCurrent * 0.55);
    const cy = h * 0.49;
    const r = Math.min(w, h) * 0.24 * state.zoom;
    const isLight = state.themeCurrent > 0.5;

    const bgGrad = fbCtx.createRadialGradient(cx, cy, r * 0.1, cx, cy, Math.max(w, h) * 0.8);
    if (isLight) {
      bgGrad.addColorStop(0, '#ffffff');
      bgGrad.addColorStop(0.55, '#f4f8ff');
      bgGrad.addColorStop(1, '#e4eefc');
    } else {
      bgGrad.addColorStop(0, '#10265c');
      bgGrad.addColorStop(0.45, '#07112b');
      bgGrad.addColorStop(1, '#030612');
    }
    fbCtx.fillStyle = bgGrad;
    fbCtx.fillRect(0, 0, w, h);

    fbCtx.save();
    fbCtx.translate(cx, cy);
    for (let layer = 5; layer >= 0; layer--) {
      const k = 1 - layer * 0.14;
      const rot = t * (0.28 + layer * 0.08) * (layer % 2 === 0 ? 1 : -1) + state.orbitYaw;
      const sides = state.mode === 2 ? 6 : (state.mode === 1 ? 8 : 4);
      fbCtx.save();
      fbCtx.rotate(rot);
      fbCtx.beginPath();
      for (let i = 0; i <= sides; i++) {
        const a = (i / sides) * Math.PI * 2;
        const rad = r * k * (i % 2 === 0 ? 1.18 : 0.78);
        const px = Math.cos(a) * rad;
        const py = Math.sin(a) * rad * 1.24;
        if (i === 0) fbCtx.moveTo(px, py);
        else fbCtx.lineTo(px, py);
      }
      fbCtx.closePath();
      const hue = (205 + layer * 16 + Math.sin(t) * 18) % 360;
      fbCtx.fillStyle = isLight
        ? `hsla(${hue}, 82%, ${30 + layer * 7}%, 0.34)`
        : `hsla(${hue}, 92%, ${48 + layer * 7}%, 0.28)`;
      fbCtx.strokeStyle = isLight
        ? `hsla(${hue}, 88%, 36%, 0.8)`
        : `hsla(${hue + 20}, 95%, 78%, 0.85)`;
      fbCtx.lineWidth = 1.6;
      fbCtx.fill();
      fbCtx.stroke();
      fbCtx.restore();
    }
    fbCtx.restore();
  }

  // =========================================================================
  // INTERACTIONS (Cursor Parallax, Orbit Drag, Click Ripple, Wheel Zoom)
  // =========================================================================
  function spawnClickRing(clientX, clientY) {
    const el = document.createElement('div');
    el.className = 'click-ring';
    el.style.left = clientX + 'px';
    el.style.top = clientY + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 820);
  }

  function triggerRipple(clientX, clientY) {
    const aspect = window.innerWidth / Math.max(window.innerHeight, 1);
    const nx = (clientX / window.innerWidth - 0.5) * aspect;
    const ny = 0.5 - clientY / window.innerHeight;
    state.pulseTime = (performance.now() - state.startTime) * 0.001;
    state.pulseStrength = 1.0;
    state.pulseOriginX = nx;
    state.pulseOriginY = ny;
    spawnClickRing(clientX, clientY);
  }

  stageWrap.addEventListener('pointerdown', (e) => {
    state.dragging = true;
    state.dragMoved = false;
    state.lastPointerX = e.clientX;
    state.lastPointerY = e.clientY;
    stageWrap.setPointerCapture(e.pointerId);
  });

  stageWrap.addEventListener('pointermove', (e) => {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = -((e.clientY / window.innerHeight) * 2 - 1);
    state.mouseTargetX = nx;
    state.mouseTargetY = ny;

    if (state.dragging) {
      const dx = e.clientX - state.lastPointerX;
      const dy = e.clientY - state.lastPointerY;
      if (Math.abs(dx) + Math.abs(dy) > 3) state.dragMoved = true;
      state.velYaw = dx * 0.0065;
      state.velPitch = dy * 0.0055;
      state.orbitYaw += state.velYaw;
      state.orbitPitch = Math.max(-0.8, Math.min(0.8, state.orbitPitch + state.velPitch));
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;
    }
  });

  stageWrap.addEventListener('pointerup', (e) => {
    if (state.dragging && !state.dragMoved) {
      triggerRipple(e.clientX, e.clientY);
    }
    state.dragging = false;
  });

  stageWrap.addEventListener('pointercancel', () => {
    state.dragging = false;
  });

  stageWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    state.zoomTarget = Math.max(0.76, Math.min(1.36, state.zoomTarget - e.deltaY * 0.0007));
  }, { passive: false });

  // =========================================================================
  // CONTROLS WIRING
  // =========================================================================
  const modeButtons = Array.from(document.querySelectorAll('[data-mode]'));
  const themeNightBtn = document.getElementById('btn-theme-night');
  const themePorcBtn = document.getElementById('btn-theme-porcelain');
  const titleToggleBtn = document.getElementById('btn-toggle-title');

  function setMode(idx) {
    state.mode = idx;
    modeButtons.forEach((b) => b.classList.toggle('is-active', Number(b.dataset.mode) === idx));
    headingEl.textContent = MODE_META[idx];
    state.pulseTime = (performance.now() - state.startTime) * 0.001;
    state.pulseStrength = 0.78;
    state.pulseOriginX = state.centerShiftCurrent * (window.innerWidth / Math.max(window.innerHeight, 1));
    state.pulseOriginY = 0.02;
  }

  function setTheme(name) {
    const isPorc = name === 'porcelain';
    state.themeTarget = isPorc ? 1.0 : 0.0;
    document.body.dataset.theme = isPorc ? 'porcelain' : 'night';
    themeNightBtn.classList.toggle('is-active', !isPorc);
    themePorcBtn.classList.toggle('is-active', isPorc);
  }

  function updateCenterShift() {
    const isNarrow = window.innerWidth <= 900;
    state.centerShiftTarget = (state.showTitle && !isNarrow) ? -0.24 : 0.0;
  }

  function setTitleVisible(visible) {
    state.showTitle = visible;
    titleOverlay.classList.toggle('is-hidden', !visible);
    titleToggleBtn.classList.toggle('is-active', visible);
    titleToggleBtn.setAttribute('aria-pressed', String(visible));
    updateCenterShift();
  }

  modeButtons.forEach((btn) => {
    btn.addEventListener('click', () => setMode(Number(btn.dataset.mode)));
  });
  themeNightBtn.addEventListener('click', () => setTheme('night'));
  themePorcBtn.addEventListener('click', () => setTheme('porcelain'));
  titleToggleBtn.addEventListener('click', () => setTitleVisible(!state.showTitle));
  window.addEventListener('resize', updateCenterShift);
  updateCenterShift();

  // =========================================================================
  // MAIN 60FPS ANIMATION LOOP
  // =========================================================================
  let activeProgIdx = -1;
  let frameCount = 0;
  let lastFpsTick = performance.now();
  let paused = false;

  function renderOnce(now) {
    const t = (now - state.startTime) * 0.001;

    state.mouseX += (state.mouseTargetX - state.mouseX) * (isSoftwareGL ? 0.5 : 0.09);
    state.mouseY += (state.mouseTargetY - state.mouseY) * (isSoftwareGL ? 0.5 : 0.09);
    state.themeCurrent += (state.themeTarget - state.themeCurrent) * (isSoftwareGL ? 0.5 : 0.075);
    state.centerShiftCurrent += (state.centerShiftTarget - state.centerShiftCurrent) * (isSoftwareGL ? 0.5 : 0.075);
    state.zoom += (state.zoomTarget - state.zoom) * (isSoftwareGL ? 0.5 : 0.1);

    if (!state.dragging) {
      state.velYaw *= 0.92;
      state.velPitch *= 0.92;
      state.orbitYaw += state.velYaw;
      state.orbitPitch = Math.max(-0.8, Math.min(0.8, state.orbitPitch + state.velPitch));
    }

    const pulseAge = Math.max(0.0, t - state.pulseTime);
    const pulseAmp = pulseAge < 4.5 ? state.pulseStrength * Math.exp(-pulseAge * 1.15) : 0.0;

    if (useWebGL) {
      const prog = ensureProgram(state.mode);
      const u = uniformSets[state.mode];
      if (activeProgIdx !== state.mode) {
        gl.useProgram(prog);
        gl.enableVertexAttribArray(u.aPos);
        gl.vertexAttribPointer(u.aPos, 2, gl.FLOAT, false, 0, 0);
        activeProgIdx = state.mode;
      }
      gl.uniform2f(u.uRes, glCanvas.width, glCanvas.height);
      gl.uniform1f(u.uTime, t);
      gl.uniform1f(u.uTheme, state.themeCurrent);
      gl.uniform1f(u.uCenterX, state.centerShiftCurrent);
      gl.uniform2f(u.uMouse, state.mouseX, state.mouseY);
      gl.uniform2f(u.uOrbit, state.orbitYaw, state.orbitPitch);
      gl.uniform1f(u.uZoom, state.zoom);
      gl.uniform1f(u.uPulseAge, pulseAge);
      gl.uniform1f(u.uPulseAmp, pulseAmp);
      gl.uniform2f(u.uPulsePos, state.pulseOriginX, state.pulseOriginY);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (isSoftwareGL) gl.flush();
    } else {
      drawFallback2D(t);
    }

    frameCount++;
    if (now - lastFpsTick >= 700) {
      const fps = Math.round((frameCount * 1000) / (now - lastFpsTick));
      if (fps >= 12) fpsEl.textContent = fps + ' FPS';
      frameCount = 0;
      lastFpsTick = now;
    }
  }

  function frame(now) {
    if (paused) return;
    renderOnce(now);
    if (isSoftwareGL) {
      setTimeout(() => { if (!paused) requestAnimationFrame(frame); }, 60);
    } else {
      requestAnimationFrame(frame);
    }
  }

  window.__crystalSchemeC = {
    isWebGL: () => useWebGL,
    renderer: () => glModeLabel,
    setMode,
    setTheme,
    setTitleVisible,
    triggerRipple,
    snapTransitions: () => {
      state.themeCurrent = state.themeTarget;
      state.centerShiftCurrent = state.centerShiftTarget;
      renderOnce(performance.now());
    },
    setPaused: (v) => {
      paused = !!v;
      if (!paused) requestAnimationFrame(frame);
    }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
