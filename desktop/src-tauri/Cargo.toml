[package]
name = "vesteria-desktop"
version = "1.0.0"
description = "转生千金～到了异世界就要悠闲地生活 — Tauri v2 独立游戏桌面正式版"
authors = ["House of Vesteria"]
edition = "2021"

[lib]
name = "vesteria_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
