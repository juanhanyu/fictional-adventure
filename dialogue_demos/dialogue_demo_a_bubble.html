<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案 A：雪瓷棱镜气泡式对话 · 自由活动防立绘跳动交互 Demo</title>
  <style>
    /* =========================================================================
       《转生千金》自由活动防立绘跳动 · 方案 A：雪瓷棱镜气泡式对话
       视觉母版：雪瓷冰白 #FAFBFD + 皇家蓝 #1658EB + 冰青 #7DD3FC + 淡金 #C4A46C
       核心纪律：
         1. 零圆框套圆框（全局 border-radius: 0，切角与 1px 分隔线区分层级）
         2. 舞台与角色立绘绝对锚定视口底线（bottom: 0），对话全程 Δy === 0.0px
         3. 气泡固定锚定说话人肩侧偏上，绝不遮脸、绝不拉高底部 56px 矮操作栏
       ========================================================================= */
    :root {
      --pr-alabaster: #FAFBFD;
      --pr-alabaster-glass: rgba(250, 251, 253, 0.94);
      --pr-alabaster-soft: rgba(240, 247, 255, 0.90);
      --pr-ink: #1A2436;
      --pr-ink-mid: #3A4B66;
      --pr-ink-muted: #5F728F;
      --pr-sapphire-hi: #2E77F8;
      --pr-sapphire: #1658EB;
      --pr-sapphire-deep: #0E2B78;
      --pr-sapphire-abyss: #081A54;
      --pr-cyan: #7DD3FC;
      --pr-cyan-gleam: #D9F3FF;
      --pr-gold: #C4A46C;
      --pr-gold-deep: #8C6928;
      --pr-gold-pale: #EFE0BE;
      --pr-emerald: #0E8A64;
      --pr-line-soft: rgba(96, 128, 180, 0.24);
      --pr-line-mid: rgba(22, 88, 235, 0.34);

      --pr-rim: linear-gradient(
        132deg,
        rgba(125, 211, 252, 0.96) 0%,
        rgba(22, 88, 235, 0.64) 28%,
        rgba(255, 255, 255, 0.98) 50%,
        rgba(196, 164, 108, 0.80) 74%,
        rgba(46, 119, 248, 0.88) 100%
      );
      --pr-rim-gold: linear-gradient(
        135deg,
        rgba(239, 224, 190, 0.98) 0%,
        rgba(196, 164, 108, 0.80) 36%,
        rgba(255, 255, 255, 0.98) 56%,
        rgba(125, 211, 252, 0.86) 100%
      );
      --pr-sapphire-prism: linear-gradient(
        180deg,
        #2E77F8 0%,
        #1658EB 49.4%,
        #0E2B78 50.6%,
        #081A54 100%
      );
      --pr-glass-plate: linear-gradient(
        154deg,
        rgba(250, 251, 253, 0.96) 0%,
        rgba(243, 249, 255, 0.92) 56%,
        rgba(231, 242, 255, 0.92) 100%
      );

      --pr-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --pr-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', Georgia, serif;
      --pr-sans: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --pr-mono: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;

      /* 舞台立绘统一锁高：严禁随对话开关改变！ */
      --actor-h: clamp(464px, 64vh, 582px);
      --action-bar-h: 56px;
      --topbar-h: 38px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #E9F1FA;
      color: var(--pr-ink);
      font-family: var(--pr-sans);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: transparent;
      color: inherit;
      padding: 0;
    }

    button:focus-visible {
      outline: 2px solid var(--pr-sapphire);
      outline-offset: -2px;
    }

    /* =========================================================================
       1. 固定全屏舞台 (#stage) — 高度永不改变，立绘基线绝对静止
       ========================================================================= */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .stage-bg {
      position: absolute;
      inset: 0;
      background: url('./assets/garden.jpg') center center / cover no-repeat;
      transform: scale(1.01);
      transition: filter 0.45s var(--pr-ease);
    }

    #stage.in-dialogue .stage-bg {
      filter: brightness(0.95) saturate(0.96);
    }

    /* 柔和日光空气景深层：衬托雪瓷棱镜质感 */
    .stage-atmosphere {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 68% 46% at 50% 34%, rgba(255, 255, 255, 0.20) 0%, transparent 72%),
        linear-gradient(180deg, rgba(235, 245, 255, 0.22) 0%, transparent 18%, transparent 78%, rgba(14, 43, 120, 0.22) 100%);
    }

    /* 微光漂浮日光尘埃（极克制） */
    .stage-motes {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.55;
    }

    .mote {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.88);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(125, 211, 252, 0.75);
      animation: moteDrift 9s ease-in-out infinite;
    }

    @keyframes moteDrift {
      0%, 100% { transform: translateY(0) rotate(45deg); opacity: 0.25; }
      50% { transform: translateY(-18px) rotate(45deg); opacity: 0.85; }
    }

    /* =========================================================================
       2. 顶部极简验证与演示细栏 (#demo-topbar)
       ========================================================================= */
    #demo-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-h);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: linear-gradient(180deg, rgba(250, 251, 253, 0.95) 0%, rgba(239, 246, 255, 0.92) 100%);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-bottom: 1px solid rgba(96, 128, 180, 0.26);
      box-shadow: 0 4px 16px rgba(14, 43, 120, 0.07);
    }

    #demo-topbar::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1.5px;
      background: linear-gradient(90deg, var(--pr-sapphire) 0%, var(--pr-cyan) 32%, var(--pr-gold) 68%, transparent 100%);
      pointer-events: none;
    }

    .tb-left,
    .tb-right {
      display: flex;
      align-items: center;
      gap: 0;
      height: 100%;
    }

    .tb-brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-right: 14px;
      font-family: var(--pr-serif);
      font-size: 13px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .tb-brand-diamond {
      width: 8px;
      height: 8px;
      background: var(--pr-sapphire);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(22, 88, 235, 0.45);
      flex-shrink: 0;
    }

    .tb-divider {
      width: 1px;
      height: 16px;
      background: rgba(96, 128, 180, 0.28);
      flex-shrink: 0;
    }

    /* 实时基准线锁定徽标（外层栏已有边框，此处纯无框色块+底线，严禁圆框套圆框） */
    .tb-telemetry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 100%;
      padding: 0 14px;
      font-size: 12px;
      color: var(--pr-ink-mid);
      white-space: nowrap;
    }

    .tb-status-gem {
      width: 7px;
      height: 7px;
      background: var(--pr-emerald);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(14, 138, 100, 0.55);
      flex-shrink: 0;
    }

    .tb-delta-val {
      font-family: var(--pr-mono);
      font-weight: 700;
      color: var(--pr-emerald);
      letter-spacing: 0.02em;
    }

    .tb-lock-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--pr-sapphire);
      padding-left: 6px;
      border-left: 1px solid rgba(22, 88, 235, 0.22);
    }

    .tb-coords {
      font-family: var(--pr-mono);
      font-size: 11px;
      color: var(--pr-ink-muted);
      padding-left: 10px;
      border-left: 1px solid rgba(96, 128, 180, 0.22);
    }

    .tb-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--pr-ink-mid);
      letter-spacing: 0.04em;
      transition: background 0.18s var(--pr-ease), color 0.18s var(--pr-ease);
      white-space: nowrap;
      position: relative;
    }

    .tb-btn:hover {
      background: rgba(22, 88, 235, 0.08);
      color: var(--pr-sapphire);
    }

    .tb-btn.active {
      background: rgba(22, 88, 235, 0.11);
      color: var(--pr-sapphire-deep);
    }

    .tb-btn.active::after {
      content: '';
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 2px;
      background: var(--pr-sapphire);
    }

    .tb-btn-primary {
      padding: 0 18px;
      color: #FFFFFF;
      background: var(--pr-sapphire-prism);
      font-family: var(--pr-serif);
      letter-spacing: 0.08em;
    }

    .tb-btn-primary:hover {
      background: var(--pr-sapphire-prism);
      color: #FFFFFF;
      filter: brightness(1.12);
    }

    /* =========================================================================
       3. 左上地点名牌 (#loc-bar) 与 右上削角版 #sylvia-hub
       ========================================================================= */
    #loc-bar {
      position: fixed;
      top: 52px;
      left: 20px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px 8px 14px;
      background: var(--pr-glass-plate);
      backdrop-filter: blur(14px) saturate(135%);
      -webkit-backdrop-filter: blur(14px) saturate(135%);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      border-left: 2.5px solid var(--pr-sapphire);
      filter: drop-shadow(0 8px 18px rgba(14, 43, 120, 0.12));
    }

    .loc-crest {
      display: inline-flex;
      color: var(--pr-sapphire);
    }

    .loc-name {
      font-family: var(--pr-serif);
      font-size: 14px;
      font-weight: 700;
      color: var(--pr-ink);
      letter-spacing: 0.08em;
    }

    .loc-sub {
      font-size: 11.5px;
      color: var(--pr-ink-muted);
      padding-left: 10px;
      border-left: 1px solid rgba(96, 128, 180, 0.28);
    }

    /* 右上方削角版 #sylvia-hub（单层切角雪瓷玻璃壳 + 内部零边框纯分隔线） */
    #sylvia-hub {
      position: fixed;
      top: 52px;
      right: 20px;
      z-index: 30;
      filter: drop-shadow(0 8px 20px rgba(14, 43, 120, 0.13));
    }

    .sh-corner-shell {
      padding: 1px;
      background: var(--pr-rim);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }

    .sh-corner-controls {
      display: flex;
      align-items: center;
      height: 36px;
      background:
        linear-gradient(90deg, var(--pr-sapphire) 0%, var(--pr-cyan) 44%, var(--pr-gold) 82%, rgba(22, 88, 235, 0.5) 100%) top / 100% 1.5px no-repeat,
        linear-gradient(180deg, rgba(252, 254, 255, 0.95) 0%, rgba(238, 246, 255, 0.92) 100%);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      clip-path: polygon(9.5px 0, 100% 0, 100% calc(100% - 9.5px), calc(100% - 9.5px) 100%, 0 100%, 0 9.5px);
    }

    .sh-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 100%;
      padding: 0 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--pr-ink);
      transition: background 0.18s var(--pr-ease), color 0.18s var(--pr-ease);
      white-space: nowrap;
    }

    .sh-item:hover {
      background: rgba(22, 88, 235, 0.08);
      color: var(--pr-sapphire);
    }

    .sh-sep {
      width: 1px;
      height: 15px;
      background: rgba(96, 128, 180, 0.28);
      flex-shrink: 0;
    }

    .sh-mood-val {
      font-family: var(--pr-mono);
      font-style: normal;
      font-weight: 700;
      color: var(--pr-sapphire);
      margin-left: 1px;
    }

    .sh-ico {
      display: inline-flex;
      color: var(--pr-sapphire);
      opacity: 0.88;
    }

    /* =========================================================================
       4. 角色立绘层 (#portraits-stage) — 绝对锚定 bottom: 0，严禁 Y 轴变形位移
       ========================================================================= */
    #portraits-stage {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    .actor-slot {
      position: absolute;
      bottom: 0;
      height: var(--actor-h);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      /* 仅过渡光学亮度与投影，绝不改变 top / bottom / height / translateY / scale */
      transition: filter 0.30s var(--pr-ease);
    }

    #actor-sylvia {
      left: 20.4%;
      transform: translateX(-50%);
    }

    #actor-alice {
      left: 79.6%;
      transform: translateX(-50%);
    }

    .actor-img {
      height: 100%;
      width: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 12px 26px rgba(14, 43, 120, 0.20));
      transition: filter 0.28s var(--pr-ease);
    }

    /* 悬停轻盈雪瓷流光（零位移） */
    #stage:not(.in-dialogue) .actor-slot:hover .actor-img {
      filter: brightness(1.04) drop-shadow(0 0 18px rgba(46, 119, 248, 0.36)) drop-shadow(0 12px 26px rgba(14, 43, 120, 0.22));
    }

    /* 对话中：当前发言人晶透提亮，倾听者柔和退居背景（零位移、零缩放） */
    #stage.in-dialogue .actor-slot.is-speaking .actor-img {
      filter: brightness(1.03) drop-shadow(0 6px 24px rgba(22, 88, 235, 0.28));
    }

    #stage.in-dialogue .actor-slot.is-listening .actor-img {
      filter: brightness(0.84) saturate(0.86) drop-shadow(0 10px 20px rgba(14, 43, 120, 0.16));
    }

    /* 悬停「点击交谈」雪瓷交互提示标签（定位在角色外肩侧，绝不遮脸） */
    .actor-hover-cue {
      position: absolute;
      top: 48%;
      padding: 1px;
      background: var(--pr-rim);
      clip-path: polygon(9px 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
      filter: drop-shadow(0 8px 18px rgba(14, 43, 120, 0.18));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s var(--pr-ease);
      z-index: 5;
      white-space: nowrap;
    }

    #actor-sylvia .actor-hover-cue {
      left: 78%;
    }

    #actor-alice .actor-hover-cue {
      right: 78%;
    }

    .actor-hover-cue-inner {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px 6px 13px;
      background: rgba(250, 251, 253, 0.96);
      clip-path: polygon(8.5px 0, 100% 0, calc(100% - 8.5px) 100%, 0 100%);
      font-family: var(--pr-serif);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      letter-spacing: 0.08em;
    }

    .cue-gem {
      width: 6px;
      height: 6px;
      background: var(--pr-sapphire);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    #actor-alice .cue-gem {
      background: var(--pr-gold);
    }

    #stage:not(.in-dialogue) .actor-slot:hover .actor-hover-cue,
    #stage:not(.in-dialogue) .actor-slot:focus-visible .actor-hover-cue {
      opacity: 1;
    }

    /* 空闲状态极轻盈底部人物指引（仅在未开始对话时淡淡提示可点击） */
    .idle-hint {
      position: fixed;
      left: 50%;
      bottom: 72px;
      transform: translateX(-50%);
      z-index: 22;
      padding: 1px;
      background: var(--pr-rim);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      filter: drop-shadow(0 6px 16px rgba(14, 43, 120, 0.13));
      transition: opacity 0.28s var(--pr-ease);
      pointer-events: none;
    }

    .idle-hint-inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 20px;
      background: rgba(250, 251, 253, 0.93);
      backdrop-filter: blur(12px);
      clip-path: polygon(9.5px 0, 100% 0, calc(100% - 9.5px) 100%, 0 100%);
      font-size: 12.5px;
      color: var(--pr-ink-mid);
      letter-spacing: 0.05em;
    }

    .idle-hint-inner strong {
      color: var(--pr-sapphire);
      font-weight: 700;
    }

    #stage.in-dialogue .idle-hint {
      opacity: 0;
    }

    /* =========================================================================
       5. 方案 A 核心：雪瓷棱镜语音气泡层 (#bubble-layer)
       ========================================================================= */
    #bubble-layer {
      position: fixed;
      inset: 0;
      z-index: 35;
      pointer-events: none;
    }

    /* 点击舞台任意空白区域也可轻盈推进对话 */
    #dialogue-click-shield {
      position: fixed;
      inset: var(--topbar-h) 0 var(--action-bar-h) 0;
      z-index: 28;
      display: none;
      cursor: pointer;
    }

    #stage.in-dialogue #dialogue-click-shield {
      display: block;
    }

    .prism-bubble-wrap {
      position: fixed;
      width: clamp(356px, 30.5vw, 436px);
      pointer-events: auto;
      cursor: pointer;
      filter:
        drop-shadow(0 16px 32px rgba(14, 43, 120, 0.16))
        drop-shadow(0 2px 6px rgba(22, 88, 235, 0.10));
      transition:
        bottom 0.32s var(--pr-ease),
        opacity 0.28s var(--pr-ease),
        transform 0.32s var(--pr-ease),
        filter 0.28s var(--pr-ease);
      will-change: transform, opacity, bottom;
    }

    /* 左发言人（希尔维亚）：锚定其右肩侧上方，绝不遮挡面部 */
    .prism-bubble-wrap.side-left {
      left: clamp(404px, 32.5vw, 474px);
      transform-origin: left bottom;
    }

    /* 右发言人（爱丽丝）：锚定其左肩侧上方，绝不遮挡面部 */
    .prism-bubble-wrap.side-right {
      right: clamp(404px, 32.5vw, 474px);
      transform-origin: right bottom;
    }

    /* 进场弹现态 */
    .prism-bubble-wrap.entering {
      opacity: 0;
      transform: translateY(10px) scale(0.96);
    }

    .prism-bubble-wrap.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* 上一句气泡：轻盈上移微淡留作上下文记忆 */
    .prism-bubble-wrap.echo {
      opacity: 0.62;
      pointer-events: none;
      cursor: default;
      transform: scale(0.93);
      filter:
        saturate(0.84)
        drop-shadow(0 8px 18px rgba(14, 43, 120, 0.09));
    }

    .prism-bubble-wrap.echo .bubble-continue {
      display: none;
    }

    .prism-bubble-wrap.exiting {
      opacity: 0;
      transform: translateY(-18px) scale(0.90);
      pointer-events: none;
    }

    /* 外层 1px 冰蓝折光描边切角壳（45° 切角） */
    .prism-bubble-shell {
      position: relative;
      padding: 1px;
      background: var(--pr-rim);
      clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    }

    .prism-bubble-wrap.theme-alice .prism-bubble-shell {
      background: var(--pr-rim-gold);
    }

    /* 内层雪瓷冰白 #FAFBFD 实体（零圆框套圆框） */
    .prism-bubble-body {
      position: relative;
      padding: 13px 18px 14px 20px;
      background:
        linear-gradient(125deg, rgba(255, 255, 255, 0.96) 0%, rgba(250, 251, 253, 0.95) 58%, rgba(235, 244, 255, 0.94) 100%);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      clip-path: polygon(13.5px 0, 100% 0, 100% calc(100% - 13.5px), calc(100% - 13.5px) 100%, 0 100%, 0 13.5px);
    }

    /* 2px 人物主题左语义线（希尔维亚：皇家蓝 / 爱丽丝：香槟淡金） */
    .prism-bubble-body::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15px;
      bottom: 6px;
      width: 2.5px;
      background: linear-gradient(180deg, var(--pr-sapphire-hi) 0%, var(--pr-sapphire) 58%, var(--pr-cyan) 100%);
      pointer-events: none;
    }

    .prism-bubble-wrap.theme-alice .prism-bubble-body::before {
      background: linear-gradient(180deg, var(--pr-gold) 0%, var(--pr-gold-deep) 60%, var(--pr-gold-pale) 100%);
    }

    /* 顶部折射微光掠影 */
    .prism-bubble-body::after {
      content: '';
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 1px;
      background: linear-gradient(90deg, rgba(125, 211, 252, 0.65), rgba(255, 255, 255, 0.95) 50%, rgba(196, 164, 108, 0.45));
      pointer-events: none;
    }

    /* 精准指向说话人肩部的锐利菱形尾尖 */
    .bubble-tail-svg {
      position: absolute;
      bottom: 24px;
      width: 22px;
      height: 20px;
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }

    .prism-bubble-wrap.side-left .bubble-tail-svg {
      left: -17px;
    }

    .prism-bubble-wrap.side-right .bubble-tail-svg {
      right: -17px;
      transform: scaleX(-1);
    }

    /* 气泡内姓名条（无框，底部 1px 冰晶渐变细线分隔） */
    .bubble-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      margin-bottom: 9px;
      border-bottom: 1px solid rgba(96, 128, 180, 0.18);
    }

    .bubble-speaker-group {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .speaker-star {
      width: 7px;
      height: 7px;
      background: var(--pr-sapphire);
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    .prism-bubble-wrap.theme-alice .speaker-star {
      background: var(--pr-gold);
    }

    .bubble-name {
      font-family: var(--pr-serif);
      font-size: 14.5px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      letter-spacing: 0.10em;
    }

    .prism-bubble-wrap.theme-alice .bubble-name {
      color: var(--pr-gold-deep);
    }

    .bubble-title {
      font-size: 11px;
      color: var(--pr-ink-muted);
      letter-spacing: 0.04em;
    }

    .bubble-step {
      font-family: var(--pr-mono);
      font-size: 11px;
      color: var(--pr-ink-muted);
      letter-spacing: 0.06em;
    }

    /* 气泡正文（隐形定高底层 + 顶层逐字打字机，彻底消除换行跳高与记忆气泡错位） */
    .bubble-text-stage {
      position: relative;
      font-family: var(--pr-serif);
      font-size: 15px;
      line-height: 1.76;
      color: var(--pr-ink);
      letter-spacing: 0.02em;
      word-break: break-word;
    }

    .bubble-text-sizer {
      margin: 0;
      visibility: hidden;
      pointer-events: none;
      user-select: none;
      min-height: 2.6em;
    }

    .bubble-text {
      position: absolute;
      inset: 0;
      margin: 0;
    }

    .type-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      margin-left: 2px;
      vertical-align: -2px;
      background: var(--pr-sapphire);
      animation: cursorBlink 0.72s step-end infinite;
    }

    .prism-bubble-wrap.theme-alice .type-cursor {
      background: var(--pr-gold-deep);
    }

    @keyframes cursorBlink {
      0%, 55% { opacity: 1; }
      56%, 100% { opacity: 0; }
    }

    /* 底部「点击继续 ▸」晶点 */
    .bubble-foot {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 8px;
      min-height: 18px;
    }

    .bubble-continue {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--pr-sapphire);
      letter-spacing: 0.08em;
      opacity: 0;
      transition: opacity 0.22s var(--pr-ease);
    }

    .prism-bubble-wrap.theme-alice .bubble-continue {
      color: var(--pr-gold-deep);
    }

    .bubble-continue.ready {
      opacity: 1;
    }

    .continue-crystal {
      display: inline-block;
      animation: crystalPulse 1.3s ease-in-out infinite;
    }

    @keyframes crystalPulse {
      0%, 100% { transform: translateX(0); opacity: 0.72; }
      50% { transform: translateX(3px); opacity: 1; }
    }

    /* =========================================================================
       6. 气泡底挂切角互动选项 (#bubble-choices) — 零圆框套圆框
       ========================================================================= */
    #bubble-choices {
      position: fixed;
      width: clamp(356px, 30.5vw, 436px);
      z-index: 38;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.28s var(--pr-ease), transform 0.28s var(--pr-ease);
    }

    #bubble-choices.visible {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
    }

    .choices-stem {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      padding: 3px 16px 3px 11px;
      margin-bottom: 2px;
      background: rgba(250, 251, 253, 0.90);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      border-left: 2px solid var(--pr-sapphire);
      font-size: 11px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      letter-spacing: 0.10em;
      filter: drop-shadow(0 4px 10px rgba(14, 43, 120, 0.12));
    }

    .choices-stem::before {
      content: '';
      width: 5px;
      height: 5px;
      background: var(--pr-sapphire);
      transform: rotate(45deg);
    }

    .choice-blade-wrap {
      padding: 1px;
      background: var(--pr-rim);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      filter: drop-shadow(0 8px 16px rgba(14, 43, 120, 0.14));
      transition: transform 0.20s var(--pr-ease), filter 0.20s var(--pr-ease);
    }

    .choice-blade-wrap:hover {
      transform: translateX(6px);
      filter: drop-shadow(0 10px 20px rgba(22, 88, 235, 0.24));
    }

    .choice-blade {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px 10px 16px;
      background: rgba(250, 251, 253, 0.96);
      clip-path: polygon(9.5px 0, 100% 0, calc(100% - 9.5px) 100%, 0 100%);
      color: var(--pr-ink);
      text-align: left;
      transition: background 0.18s var(--pr-ease), color 0.18s var(--pr-ease);
    }

    .choice-blade-left {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .choice-idx {
      font-family: var(--pr-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--pr-sapphire);
      padding-right: 9px;
      border-right: 1px solid rgba(22, 88, 235, 0.24);
    }

    .choice-label {
      font-family: var(--pr-serif);
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .choice-arrow {
      font-size: 12px;
      color: var(--pr-sapphire);
      opacity: 0.72;
      transition: transform 0.18s var(--pr-ease), color 0.18s var(--pr-ease);
    }

    .choice-blade-wrap:hover .choice-blade {
      background: var(--pr-sapphire-prism);
      color: #FFFFFF;
    }

    .choice-blade-wrap:hover .choice-idx {
      color: var(--pr-cyan-gleam);
      border-right-color: rgba(255, 255, 255, 0.34);
    }

    .choice-blade-wrap:hover .choice-arrow {
      color: var(--pr-gold-pale);
      opacity: 1;
      transform: translateX(3px);
    }

    /* =========================================================================
       7. 底部削角版紧凑矮底栏 (#action-bar) — 固定高 56px，绝不拉高
       ========================================================================= */
    #action-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--action-bar-h);
      z-index: 45;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px 0 14px;
      background: linear-gradient(180deg, rgba(250, 253, 255, 0.94) 0%, rgba(235, 244, 254, 0.96) 100%);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-top: 1px solid rgba(96, 128, 180, 0.26);
      box-shadow: 0 -6px 20px rgba(14, 43, 120, 0.08);
      /* 仅柔和淡隐，绝不改变高度或挤压舞台 */
      transition: opacity 0.34s var(--pr-ease), filter 0.34s var(--pr-ease);
    }

    #action-bar::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -1px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent 0%, rgba(125, 211, 252, 0.88) 24%, rgba(196, 164, 108, 0.72) 54%, rgba(22, 88, 235, 0.86) 84%, transparent 100%);
      pointer-events: none;
    }

    #stage.in-dialogue #action-bar {
      opacity: 0.22;
      filter: saturate(0.65);
      pointer-events: none;
    }

    .ab-scroll {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .ab-scroll::-webkit-scrollbar {
      display: none;
    }

    .ab-sep {
      width: 1px;
      height: 18px;
      background: rgba(96, 128, 180, 0.20);
      flex-shrink: 0;
    }

    .abtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 38px;
      padding: 0 13px;
      color: var(--pr-ink);
      font-family: var(--pr-serif);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      transition: background 0.18s var(--pr-ease), color 0.18s var(--pr-ease);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .abtn svg {
      color: var(--pr-sapphire);
      opacity: 0.84;
      flex-shrink: 0;
    }

    .abtn:hover {
      background: rgba(22, 88, 235, 0.09);
      color: var(--pr-sapphire);
    }

    .abtn.active-talk {
      background: rgba(22, 88, 235, 0.11);
      color: var(--pr-sapphire-deep);
    }

    .ab-cost {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-family: var(--pr-sans);
      font-size: 11px;
      font-weight: 600;
      color: var(--pr-ink-muted);
      margin-left: 1px;
    }

    .ab-cost .ab-bolt {
      color: var(--pr-gold-deep);
    }

    .ab-next-pinned {
      height: 38px;
      padding: 0 26px;
      background: var(--pr-sapphire-prism);
      color: #FFFFFF;
      font-family: var(--pr-serif);
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      clip-path: polygon(13px 0%, calc(100% - 13px) 0%, 100% 50%, calc(100% - 13px) 100%, 13px 100%, 0% 50%);
      filter: drop-shadow(0 5px 14px rgba(14, 43, 120, 0.28));
      transition: filter 0.18s var(--pr-ease);
      flex-shrink: 0;
    }

    .ab-next-pinned svg {
      color: var(--pr-cyan-gleam);
      opacity: 1;
    }

    .ab-next-pinned:hover {
      background: var(--pr-sapphire-prism);
      color: #FFFFFF;
      filter: brightness(1.12) drop-shadow(0 7px 18px rgba(22, 88, 235, 0.36));
    }

    /* =========================================================================
       8. 实时可视化参考虚线层 (#ruler-overlay) — 肉眼直观验证 Δy === 0.0px
       ========================================================================= */
    #ruler-overlay {
      position: fixed;
      inset: 0;
      z-index: 52;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.24s var(--pr-ease);
    }

    #ruler-overlay.visible {
      opacity: 1;
    }

    .ruler-line {
      position: fixed;
      left: 0;
      right: 0;
      height: 0;
      border-top: 1.5px dashed rgba(22, 88, 235, 0.78);
    }

    .ruler-line.bottom-line {
      border-top: 2px dashed rgba(14, 138, 100, 0.85);
    }

    .ruler-tag {
      position: absolute;
      left: 16px;
      transform: translateY(-100%);
      margin-top: -4px;
      padding: 3px 10px;
      background: rgba(14, 43, 120, 0.88);
      color: #FFFFFF;
      font-family: var(--pr-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    }

    .ruler-line.bottom-line .ruler-tag {
      left: 50%;
      transform: translate(-50%, -100%);
      background: rgba(14, 138, 100, 0.92);
    }

    .ruler-anchor-dot {
      position: fixed;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      margin-top: -5px;
      border: 1.5px solid var(--pr-sapphire);
      background: rgba(125, 211, 252, 0.65);
      transform: rotate(45deg);
    }

    /* =========================================================================
       9. 轻盈结束/操作回执浮条 (#demo-toast)
       ========================================================================= */
    #demo-toast {
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 58;
      padding: 1px;
      background: var(--pr-rim);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
      filter: drop-shadow(0 10px 22px rgba(14, 43, 120, 0.16));
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s var(--pr-ease), transform 0.28s var(--pr-ease);
    }

    #demo-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-inner {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 20px;
      background: rgba(250, 251, 253, 0.96);
      clip-path: polygon(9.5px 0, 100% 0, calc(100% - 9.5px) 100%, 0 100%);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--pr-sapphire-deep);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* 1280×720 紧凑桌面适配（保持零遮脸、零溢出） */
    @media (max-width: 1340px), (max-height: 760px) {
      :root {
        --actor-h: clamp(456px, 63.5vh, 520px);
      }

      .prism-bubble-wrap,
      #bubble-choices {
        width: clamp(340px, 31vw, 396px);
      }

      .prism-bubble-wrap.side-left {
        left: clamp(392px, 31.8vw, 430px);
      }

      .prism-bubble-wrap.side-right {
        right: clamp(392px, 31.8vw, 430px);
      }

      .prism-bubble-body {
        padding: 11px 16px 12px 18px;
      }

      .bubble-text-stage {
        font-size: 14.2px;
        line-height: 1.70;
      }

      .choice-blade {
        padding: 8.5px 15px 8.5px 14px;
      }

      .abtn {
        padding: 0 10px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部极简验证与演示细栏 -->
  <header id="demo-topbar" role="banner">
    <div class="tb-left">
      <span class="tb-brand">
        <span class="tb-brand-diamond" aria-hidden="true"></span>
        <span>方案 A · 雪瓷棱镜气泡式对话</span>
      </span>
      <span class="tb-divider" aria-hidden="true"></span>
      <div class="tb-telemetry" id="baseline-badge" aria-live="polite">
        <span class="tb-status-gem" id="telemetry-gem" aria-hidden="true"></span>
        <span>立绘基准线检测：</span>
        <span class="tb-delta-val" id="telemetry-delta">Δy = 0.0px</span>
        <span class="tb-lock-tag" id="telemetry-lock">锁定</span>
        <span class="tb-coords" id="telemetry-coords">top -- / bot --</span>
      </div>
    </div>
    <div class="tb-right">
      <button type="button" class="tb-btn" id="btn-toggle-ruler" aria-pressed="false">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <line x1="2" y1="4.5" x2="14" y2="4.5" stroke-dasharray="2.5 2"/>
          <line x1="2" y1="11.5" x2="14" y2="11.5" stroke-dasharray="2.5 2"/>
          <line x1="8" y1="2" x2="8" y2="14"/>
        </svg>
        <span>展示参考虚线</span>
      </button>
      <span class="tb-divider" aria-hidden="true"></span>
      <button type="button" class="tb-btn" id="btn-replay-dialogue">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
          <path d="M13 8a5 5 0 1 1-1.4-3.5"/>
          <polyline points="13 2.5 13 5.5 10 5.5"/>
        </svg>
        <span>重播对话</span>
      </button>
      <span class="tb-divider" aria-hidden="true"></span>
      <button type="button" class="tb-btn tb-btn-primary" id="btn-toggle-dialogue">打开对话</button>
    </div>
  </header>

  <!-- 全屏固定舞台（高度永不改变，保证立绘 Δy === 0px） -->
  <main id="stage" aria-label="庭院玫瑰园自由活动舞台">
    <div class="stage-bg" aria-hidden="true"></div>
    <div class="stage-atmosphere" aria-hidden="true"></div>
    <div class="stage-motes" aria-hidden="true">
      <span class="mote" style="left:16%;top:26%;animation-delay:0s;"></span>
      <span class="mote" style="left:46%;top:22%;animation-delay:2.1s;"></span>
      <span class="mote" style="left:58%;top:31%;animation-delay:4.2s;"></span>
      <span class="mote" style="left:84%;top:24%;animation-delay:1.4s;"></span>
      <span class="mote" style="left:36%;top:42%;animation-delay:3.3s;"></span>
    </div>

    <!-- 左上地点名牌 -->
    <div id="loc-bar">
      <span class="loc-crest" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.45">
          <polygon points="8,1.5 14.5,8 8,14.5 1.5,8"/>
          <circle cx="8" cy="8" r="1.6" fill="currentColor"/>
        </svg>
      </span>
      <span class="loc-name">庭院玫瑰园</span>
      <span class="loc-sub">公爵府 · 仲夏午后</span>
    </div>

    <!-- 右上方削角版 #sylvia-hub -->
    <aside id="sylvia-hub" aria-label="希尔维亚养成中枢">
      <div class="sh-corner-shell">
        <div class="sh-corner-controls">
          <button type="button" class="sh-item" data-hub-action="mood" title="希尔维亚当前心境">
            <span class="sh-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.45">
                <polygon points="8,1.5 9.8,6.2 14.5,8 9.8,9.8 8,14.5 6.2,9.8 1.5,8 6.2,6.2"/>
              </svg>
            </span>
            <span>惬意</span>
            <em class="sh-mood-val" id="hub-mood-val">100</em>
          </button>
          <span class="sh-sep" aria-hidden="true"></span>
          <button type="button" class="sh-item" data-hub-action="schedule">
            <span class="sh-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4">
                <rect x="2.2" y="3.2" width="11.6" height="10.6"/>
                <line x1="2.2" y1="6.4" x2="13.8" y2="6.4"/>
                <line x1="5.4" y1="1.8" x2="5.4" y2="4.4"/>
                <line x1="10.6" y1="1.8" x2="10.6" y2="4.4"/>
              </svg>
            </span>
            <span>日程排班</span>
          </button>
          <span class="sh-sep" aria-hidden="true"></span>
          <button type="button" class="sh-item" data-hub-action="shop">
            <span class="sh-ico" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4">
                <path d="M3 6.2h10l-.9 7.2H3.9L3 6.2z"/>
                <path d="M5.6 6.2V4.5a2.4 2.4 0 0 1 4.8 0v1.7"/>
              </svg>
            </span>
            <span>集市小铺</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 角色立绘层：严格固定于 bottom: 0，对话开关零跳动 -->
    <section id="portraits-stage" aria-label="场景可交谈人物">
      <div class="actor-slot" id="actor-sylvia" role="button" tabindex="0" aria-label="点击与希尔维亚交谈">
        <img id="img-sylvia" class="actor-img" src="./assets/sylvia_teenage_normal.png" alt="希尔维亚" />
        <div class="actor-hover-cue" aria-hidden="true">
          <div class="actor-hover-cue-inner">
            <span class="cue-gem"></span>
            <span>点击交谈 · 希尔维亚</span>
          </div>
        </div>

  <script>
    (function () {
      'use strict';

      /* ================= 1. 人物设定与真实素材映射 ================= */
      const CHARACTERS = {
        sylvia: {
          id: 'sylvia',

        },

          id: 'alice',
          name: '爱丽丝',
          title: '银发双子妹妹',
          side: 'right',
          theme: 'theme-alice',
          strokeColor: '#C4A46C',
          gemColor: '#EFE0BE',
          portraits: {
            normal: './assets/alice_teenage_normal.png',

          }
        }
      };

      /* ================= 2. 庭院日常对话脚本（原著轻小说质感） ================= */
      const BASE_SCRIPT = [
        {
          speaker: 'alice',
          sylviaExpr: 'normal',
          aliceExpr: 'happy',
          text: '希尔维亚，可算找着你了！厨房刚烤好一盘风之花饼，我趁热端了一碟来，你快尝尝看。'
        },
        {
          speaker: 'sylvia',
          sylviaExpr: 'smile',
          aliceExpr: 'happy',
          text: '我就猜喷泉边怎么突然飘来一股风铃草蜜的甜气。你一路从厨房端过来，裙摆上还沾着两片玫瑰花瓣呢。'
        },
        {
          speaker: 'alice',
          sylviaExpr: 'smile',
          aliceExpr: 'shy',
          text: '唔、穿过拱廊的时候风有点大嘛……我特意多刷了一层蜂蜜，烤得金黄松脆的，姐姐方才路过都夸香。'
        },
        {
          speaker: 'sylvia',
          sylviaExpr: 'normal',
          aliceExpr: 'shy',
          text: '贝蒂姐姐只要闻见点心味，隔着练武场半个院子都能夸出声。不过这饼边亮晶晶的，你是不是又多撒了一勺糖霜？'
        },
        {
          speaker: 'alice',
          sylviaExpr: 'normal',
          aliceExpr: 'happy',
          text: '才、才没有很多！就比方子上多了一点点而已嘛。快挑一块趁热吃呀，凉了风味可就不一样了。',
          choices: [
            { id: 'taste', key: '01', label: '接过花饼尝一口' },
            { id: 'sugar', key: '02', label: '先检查有没有放多糖' },
            { id: 'uncle', key: '03', label: '顺口问问叔叔去向' }
          ]
        }
      ];

      const SYLVIA_OPENER = {
        speaker: 'sylvia',
        sylviaExpr: 'smile',
        aliceExpr: 'normal',
        text: '午后风里飘着股甜丝丝的蜜香……爱丽丝，你藏在身后的瓷碟，香气已经先一步飘过来了。'
      };

      const BRANCH_SCRIPTS = {
        taste: [
          {
            speaker: 'sylvia',
            sylviaExpr: 'happy',
            aliceExpr: 'happy',
            text: '嗯……酥皮带着风铃草的清气，甜度刚好压过午后的倦意。你的火候比上个月稳了不少。'
          },
          {
            speaker: 'alice',
            sylviaExpr: 'happy',
            aliceExpr: 'happy',
            text: '真的吗！那明早我再烤一炉，配着你泡的冷萃茶，咱们就在喷泉边悠闲地晒太阳吧。'
          }
        ],
        sugar: [
          {
            speaker: 'sylvia',
            sylviaExpr: 'smile',
            aliceExpr: 'shy',
            text: '边缘凝着半圈糖晶，底下还细心垫了防潮油纸……嘴上说着只多一点点，其实分寸拿捏得挺仔细。'
          },
          {
            speaker: 'alice',
            sylviaExpr: 'smile',
            aliceExpr: 'shy',
            text: '嘿嘿，被你看穿啦。我知道你怕甜腻，特意把糖霜只撒在边角上，好让你能挑着咬呢。'
          }
        ],
        uncle: [
          {
            speaker: 'sylvia',
            sylviaExpr: 'normal',
            aliceExpr: 'normal',
            text: '尝饼前先问一句——雷纳德叔叔今天没赖在东侧躺椅上翻闲书吗？刚经过花廊竟没见着人。'
          },
          {
            speaker: 'alice',
            sylviaExpr: 'smile',
            aliceExpr: 'happy',
            text: '叔叔一早就拎着茶壶去北边树荫下乘凉啦，临走还托我捎话，说晚些时候带新淘的北境游记来找你呢。'
          }
        ]
      };

      /* ================= 3. DOM 引用 ================= */
      const stageEl = document.getElementById('stage');
      const actorSylvia = document.getElementById('actor-sylvia');
      const actorAlice = document.getElementById('actor-alice');
      const imgSylvia = document.getElementById('img-sylvia');
      const imgAlice = document.getElementById('img-alice');
      const bubbleLayer = document.getElementById('bubble-layer');
      const choicesEl = document.getElementById('bubble-choices');
      const clickShield = document.getElementById('dialogue-click-shield');

      const btnToggleDialogue = document.getElementById('btn-toggle-dialogue');
      const btnReplayDialogue = document.getElementById('btn-replay-dialogue');
      const btnToggleRuler = document.getElementById('btn-toggle-ruler');
      const btnBarTalk = document.getElementById('btn-bar-talk');

      const telemetryDelta = document.getElementById('telemetry-delta');
      const telemetryLock = document.getElementById('telemetry-lock');
      const telemetryCoords = document.getElementById('telemetry-coords');
      const telemetryGem = document.getElementById('telemetry-gem');

      const rulerOverlay = document.getElementById('ruler-overlay');
      const rulerTopLine = document.getElementById('ruler-top-line');
      const rulerBottomLine = document.getElementById('ruler-bottom-line');
      const rulerTopTag = document.getElementById('ruler-top-tag');
      const rulerBottomTag = document.getElementById('ruler-bottom-tag');
      const rulerDotSylvia = document.getElementById('ruler-dot-sylvia');
      const rulerDotAlice = document.getElementById('ruler-dot-alice');

      const toastEl = document.getElementById('demo-toast');
      const toastText = document.getElementById('demo-toast-text');

      /* ================= 4. 运行状态与实时基准线校验器 ================= */
      const state = {
        active: false,
        queue: [],
        index: -1,
        typing: false,
        typingTimer: null,
        fullText: '',
        activeBubbleEl: null,
        echoBubbleEl: null,
        awaitingChoice: false,
        rulerVisible: false,
        toastTimer: null,
        lastInitiator: 'alice'
      };

      const baseline = {
        sylviaTop: null,
        sylviaBottom: null,
        aliceTop: null,
        aliceBottom: null,
        maxDeltaY: 0
      };

      function snapshotRects() {
        const sr = actorSylvia.getBoundingClientRect();
        const ar = actorAlice.getBoundingClientRect();
        const sir = imgSylvia.getBoundingClientRect();
        const air = imgAlice.getBoundingClientRect();
        return {
          sylvia: { top: sr.top, bottom: sr.bottom, left: sr.left, right: sr.right, width: sr.width, height: sr.height },
          alice: { top: ar.top, bottom: ar.bottom, left: ar.left, right: ar.right, width: ar.width, height: ar.height },
          sylviaImg: { top: sir.top, bottom: sir.bottom },
          aliceImg: { top: air.top, bottom: air.bottom }
        };
      }

      function calibrateBaseline() {
        const snap = snapshotRects();
        baseline.sylviaTop = snap.sylvia.top;
        baseline.sylviaBottom = snap.sylvia.bottom;
        baseline.aliceTop = snap.alice.top;
        baseline.aliceBottom = snap.alice.bottom;
        baseline.maxDeltaY = 0;
        verifyBaseline();
      }

      function verifyBaseline() {
        const snap = snapshotRects();
        if (baseline.sylviaTop === null) {
          calibrateBaseline();
          return;
        }
        const diffs = [
          Math.abs(snap.sylvia.top - baseline.sylviaTop),
          Math.abs(snap.sylvia.bottom - baseline.sylviaBottom),
          Math.abs(snap.alice.top - baseline.aliceTop),
          Math.abs(snap.alice.bottom - baseline.aliceBottom),
          Math.abs(snap.sylviaImg.top - baseline.sylviaTop),
          Math.abs(snap.sylviaImg.bottom - baseline.sylviaBottom),
          Math.abs(snap.aliceImg.top - baseline.aliceTop),
          Math.abs(snap.aliceImg.bottom - baseline.aliceBottom)
        ];
        const currentDelta = Math.max.apply(null, diffs);
        if (currentDelta > baseline.maxDeltaY) {
          baseline.maxDeltaY = currentDelta;
        }

        const isLocked = currentDelta < 0.05;
        telemetryDelta.textContent = 'Δy = ' + currentDelta.toFixed(1) + 'px';
        telemetryLock.textContent = isLocked ? '锁定' : '偏移';
        telemetryDelta.style.color = isLocked ? 'var(--pr-emerald)' : '#D13456';
        telemetryGem.style.background = isLocked ? 'var(--pr-emerald)' : '#D13456';
        telemetryCoords.textContent =
          'top ' + snap.sylvia.top.toFixed(0) + 'px · bot ' + snap.sylvia.bottom.toFixed(0) + 'px';

        /* 更新参考虚线位置 */
        rulerTopLine.style.top = snap.sylvia.top + 'px';
        rulerBottomLine.style.top = (snap.sylvia.bottom - 2) + 'px';
        rulerTopTag.textContent =
          '立绘顶基准线 top = ' + snap.sylvia.top.toFixed(1) + 'px · Δy = ' + currentDelta.toFixed(1) + 'px（锁定）';
        rulerBottomTag.textContent =
          '立绘底基准线 bottom = ' + snap.sylvia.bottom.toFixed(1) + 'px · 矮底栏 56px 绝不挤压舞台';

        /* 肩部指向参考晶点 */
        rulerDotSylvia.style.left = (snap.sylvia.left + snap.sylvia.width * 0.72) + 'px';
        rulerDotSylvia.style.top = (snap.sylvia.top + snap.sylvia.height * 0.56) + 'px';
        rulerDotAlice.style.left = (snap.alice.left + snap.alice.width * 0.28) + 'px';
        rulerDotAlice.style.top = (snap.alice.top + snap.alice.height * 0.56) + 'px';

        /* 暴露给自动化测试断言 */
        window.__DEMO_METRICS__ = {
          active: state.active,
          stepIndex: state.index,
          awaitingChoice: state.awaitingChoice,
          currentDeltaY: currentDelta,
          maxObservedDeltaY: baseline.maxDeltaY,
          baseline: Object.assign({}, baseline),
          current: snap
        };
      }

      function showToast(msg) {
        if (state.toastTimer) clearTimeout(state.toastTimer);
        toastText.textContent = msg;
        toastEl.classList.add('visible');
        state.toastTimer = setTimeout(function () {
          toastEl.classList.remove('visible');
        }, 2800);
      }

      /* ================= 5. 气泡构建、定位与流转引擎 ================= */
      function getActiveBubbleBottomPx() {
        const vh = window.innerHeight;
        /* 为底部 3 项底挂选项与 56px 矮操作栏预留充足呼吸空间 */
        return Math.round(Math.max(248, Math.min(vh * 0.355, 326)));
      }

      function createBubbleElement(line, stepNum, totalSteps) {
        const ch = CHARACTERS[line.speaker];
        const wrap = document.createElement('article');
        wrap.className = 'prism-bubble-wrap entering ' + (ch.side === 'left' ? 'side-left' : 'side-right') + ' ' + ch.theme;
        wrap.setAttribute('data-speaker', ch.id);

        const bottomPx = getActiveBubbleBottomPx();
        wrap.style.bottom = bottomPx + 'px';

        /* 锐利菱形尾尖 SVG：无缝衔接内壁与 1px 外描边 + 远端折射小菱晶 */
        const tailSvg =
          '<svg class="bubble-tail-svg" viewBox="0 0 22 20" aria-hidden="true">' +
            '<polygon points="25,2.5 4,11 25,17.5" fill="#FAFBFD"/>' +
            '<polyline points="21,2.5 4,11 21,17.5" fill="none" stroke="' + ch.strokeColor + '" stroke-width="1.35" stroke-linejoin="miter"/>' +
            '<polygon points="-3,11 0,8.5 3,11 0,13.5" fill="' + ch.gemColor + '" stroke="' + ch.strokeColor + '" stroke-width="0.9"/>' +
          '</svg>';

        const stepStr = String(stepNum).padStart(2, '0') + ' / ' + String(totalSteps).padStart(2, '0');

        wrap.innerHTML =
          tailSvg +
          '<div class="prism-bubble-shell">' +
            '<div class="prism-bubble-body">' +
              '<header class="bubble-head">' +
                '<span class="bubble-speaker-group">' +
                  '<span class="speaker-star" aria-hidden="true"></span>' +
                  '<span class="bubble-name">' + ch.name + '</span>' +
                  '<span class="bubble-title">· ' + ch.title + '</span>' +
                '</span>' +
                '<span class="bubble-step">' + stepStr + '</span>' +
              '</header>' +
              '<div class="bubble-text-stage">' +
                '<p class="bubble-text-sizer" aria-hidden="true"></p>' +
                '<p class="bubble-text"></p>' +
              '</div>' +
              '<footer class="bubble-foot">' +
                '<span class="bubble-continue">' +
                  '<span>点击继续</span>' +
                  '<span class="continue-crystal" aria-hidden="true">▸</span>' +
                '</span>' +
              '</footer>' +
            '</div>' +
          '</div>';

        wrap.querySelector('.bubble-text-sizer').textContent = line.text;

        wrap.addEventListener('click', function (e) {
          e.stopPropagation();
          if (wrap.classList.contains('active')) {
            handleAdvance();
          }
        });

        return wrap;
      }

      function repositionEchoAndChoices() {
        if (!state.activeBubbleEl) return;
        const activeBottom = getActiveBubbleBottomPx();
        state.activeBubbleEl.style.bottom = activeBottom + 'px';

        /* 使用未缩放布局高度 offsetHeight，进场瞬间即可精准算定上移记忆气泡与底挂选项位置 */
        const activeHeight = state.activeBubbleEl.offsetHeight;

        if (state.echoBubbleEl) {
          const echoBottom = Math.round(activeBottom + activeHeight + 20);
          state.echoBubbleEl.style.bottom = echoBottom + 'px';
        }

        if (state.awaitingChoice) {
          const choicesTop = Math.round(window.innerHeight - activeBottom + 10);
          choicesEl.style.top = choicesTop + 'px';
          if (state.activeBubbleEl.classList.contains('side-right')) {
            choicesEl.style.left = '';
            choicesEl.style.right = getComputedStyle(state.activeBubbleEl).right;
          } else {
            choicesEl.style.right = '';
            choicesEl.style.left = getComputedStyle(state.activeBubbleEl).left;
          }
        }
      }

      function applyPortraitsForLine(line) {
        imgSylvia.src = CHARACTERS.sylvia.portraits[line.sylviaExpr || 'normal'];
        imgAlice.src = CHARACTERS.alice.portraits[line.aliceExpr || 'normal'];

        const sylviaSpeaking = line.speaker === 'sylvia';
        actorSylvia.classList.toggle('is-speaking', sylviaSpeaking);
        actorSylvia.classList.toggle('is-listening', !sylviaSpeaking);
        actorAlice.classList.toggle('is-speaking', !sylviaSpeaking);
        actorAlice.classList.toggle('is-listening', sylviaSpeaking);
      }

      function clearTyping() {
        if (state.typingTimer) {
          clearInterval(state.typingTimer);
          state.typingTimer = null;
        }
        state.typing = false;
      }

      function finishTypingInstant() {
        clearTyping();
        if (!state.activeBubbleEl) return;
        const textEl = state.activeBubbleEl.querySelector('.bubble-text');
        const contEl = state.activeBubbleEl.querySelector('.bubble-continue');
        textEl.textContent = state.fullText;

        const currentLine = state.queue[state.index];
        if (currentLine && currentLine.choices && currentLine.choices.length) {
          contEl.classList.remove('ready');
          renderChoices(currentLine.choices);
        } else {
          contEl.classList.add('ready');
        }
        requestAnimationFrame(function () {
          repositionEchoAndChoices();
          verifyBaseline();
        });
      }

      function renderChoices(choices) {
        state.awaitingChoice = true;
        choicesEl.innerHTML =
          '<div class="choices-stem"><span>回应爱丽丝</span></div>' +
          choices.map(function (c) {
            return (
              '<div class="choice-blade-wrap">' +
                '<button type="button" class="choice-blade" data-choice-id="' + c.id + '">' +
                  '<span class="choice-blade-left">' +
                    '<span class="choice-idx">' + c.key + '</span>' +
                    '<span class="choice-label">' + c.label + '</span>' +
                  '</span>' +
                  '<span class="choice-arrow" aria-hidden="true">▸</span>' +
                '</button>' +
              '</div>'
            );
          }).join('');

        choicesEl.querySelectorAll('.choice-blade').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            selectChoice(btn.getAttribute('data-choice-id'));
          });
        });

        repositionEchoAndChoices();
        requestAnimationFrame(function () {
          choicesEl.classList.add('visible');
          verifyBaseline();
        });
      }

      function hideChoices() {
        state.awaitingChoice = false;
        choicesEl.classList.remove('visible');
        choicesEl.innerHTML = '';
      }

      function selectChoice(choiceId) {
        if (!state.awaitingChoice) return;
        const branch = BRANCH_SCRIPTS[choiceId];
        if (!branch) return;

        hideChoices();
        /* 把分支后续追加进对话队列 */
        state.queue = state.queue.slice(0, state.index + 1).concat(branch);
        showNextLine();
      }

      function showNextLine() {
        clearTyping();
        hideChoices();

        const nextIdx = state.index + 1;
        if (nextIdx >= state.queue.length) {
          closeDialogue(true);
          return;
        }
        state.index = nextIdx;
        const line = state.queue[state.index];
        const totalExpected = state.queue.length + (line.choices || state.queue.some(function (x) { return x.choices && state.index <= state.queue.indexOf(x); }) ? 2 : 0);
        const displayTotal = Math.max(state.queue.length, totalExpected);

        applyPortraitsForLine(line);

        /* 处理上一句气泡：旧记忆气泡优雅退出，原主气泡轻盈上移微淡作上下文记忆 */
        if (state.echoBubbleEl) {
          const doomed = state.echoBubbleEl;
          doomed.classList.remove('echo');
          doomed.classList.add('exiting');
          setTimeout(function () {
            if (doomed.parentNode) doomed.parentNode.removeChild(doomed);
          }, 360);
          state.echoBubbleEl = null;
        }

        if (state.activeBubbleEl) {
          state.echoBubbleEl = state.activeBubbleEl;
          state.echoBubbleEl.classList.remove('active');
          state.echoBubbleEl.classList.add('echo');
        }

        const newBubble = createBubbleElement(line, state.index + 1, displayTotal);
        bubbleLayer.appendChild(newBubble);
        state.activeBubbleEl = newBubble;

        const textEl = newBubble.querySelector('.bubble-text');
        const contEl = newBubble.querySelector('.bubble-continue');
        state.fullText = line.text;
        state.typing = true;

        /* 先撑开并定位，再流畅逐字打字机 */
        textEl.innerHTML = '<span class="type-cursor" aria-hidden="true"></span>';

        /* 下一帧触发弹现动画 + 同步上移记忆气泡 */
        requestAnimationFrame(function () {
          newBubble.classList.remove('entering');
          newBubble.classList.add('active');
          repositionEchoAndChoices();
          verifyBaseline();
        });

        let cursor = 0;
        const chars = Array.from(state.fullText);
        state.typingTimer = setInterval(function () {
          cursor += 1;
          if (cursor >= chars.length) {
            finishTypingInstant();
            return;
          }
          textEl.innerHTML = chars.slice(0, cursor).join('') + '<span class="type-cursor" aria-hidden="true"></span>';
          repositionEchoAndChoices();
        }, 26);

        if (line.choices && line.choices.length) {
          contEl.classList.remove('ready');
        }
      }

      function startDialogue(initiator) {
        if (state.active) return;
        state.lastInitiator = initiator || 'alice';
        state.active = true;
        state.index = -1;
        state.queue = initiator === 'sylvia'
          ? [SYLVIA_OPENER].concat(BASE_SCRIPT)
          : BASE_SCRIPT.slice();

        stageEl.classList.add('in-dialogue');
        btnToggleDialogue.textContent = '结束对话';
        bubbleLayer.innerHTML = '';
        state.activeBubbleEl = null;
        state.echoBubbleEl = null;

        verifyBaseline();
        showNextLine();
      }

      function closeDialogue(completed) {
        clearTyping();
        hideChoices();

        const bubbles = Array.from(bubbleLayer.querySelectorAll('.prism-bubble-wrap'));
        bubbles.forEach(function (el) {
          el.classList.remove('active', 'echo');
          el.classList.add('exiting');
        });
        setTimeout(function () {
          if (!state.active) bubbleLayer.innerHTML = '';
        }, 340);

        state.active = false;
        state.activeBubbleEl = null;
        state.echoBubbleEl = null;
        state.index = -1;

        stageEl.classList.remove('in-dialogue');
        actorSylvia.classList.remove('is-speaking', 'is-listening');
        actorAlice.classList.remove('is-speaking', 'is-listening');
        imgSylvia.src = CHARACTERS.sylvia.portraits.normal;
        imgAlice.src = CHARACTERS.alice.portraits.normal;
        btnToggleDialogue.textContent = '打开对话';

        requestAnimationFrame(function () {
          verifyBaseline();
        });

        if (completed) {
          showToast('庭院闲谈结束 · 爱丽丝好感 +1 · 全程立绘 Δy = 0.0px（绝对锁定）');
        }
      }

      function handleAdvance() {
        if (!state.active) return;
        if (state.typing) {
          finishTypingInstant();
          return;
        }
        if (state.awaitingChoice) {
          return;
        }
        showNextLine();
      }

      /* ================= 6. 事件绑定 ================= */
      actorSylvia.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!state.active) {
          startDialogue('sylvia');
        } else {
          handleAdvance();
        }
      });

      actorAlice.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!state.active) {
          startDialogue('alice');
        } else {
          handleAdvance();
        }
      });

      [actorSylvia, actorAlice].forEach(function (el) {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            el.click();
          }
        });
      });

      clickShield.addEventListener('click', function () {
        handleAdvance();
      });

      btnToggleDialogue.addEventListener('click', function () {
        if (state.active) {
          closeDialogue(false);
          showToast('已收起雪瓷气泡，底部矮操作栏恢复 · 立绘 Δy = 0.0px');
        } else {
          startDialogue('alice');
        }
      });

      btnReplayDialogue.addEventListener('click', function () {
        if (state.active) {
          closeDialogue(false);
        }
        setTimeout(function () {
          startDialogue(state.lastInitiator || 'alice');
        }, 60);
      });

      btnToggleRuler.addEventListener('click', function () {
        state.rulerVisible = !state.rulerVisible;
        rulerOverlay.classList.toggle('visible', state.rulerVisible);
        btnToggleRuler.classList.toggle('active', state.rulerVisible);
        btnToggleRuler.setAttribute('aria-pressed', String(state.rulerVisible));
        verifyBaseline();
      });

      /* 底部矮操作栏与右上养成中枢轻交互 */
      btnBarTalk.addEventListener('click', function () {
        if (!state.active) {
          startDialogue('alice');
        }
      });

      document.querySelectorAll('#action-bar .abtn:not(#btn-bar-talk)').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const label = btn.querySelector('span') ? btn.querySelector('span').textContent : '操作';
          showToast('演示态底栏固定 56px · 已点击「' + label + '」');
        });
      });

      document.querySelectorAll('#sylvia-hub .sh-item').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const act = btn.getAttribute('data-hub-action');
          const map = {
            mood: '希尔维亚当前心境：惬意 100（从容舒展）',
            schedule: '削角版养成中枢 · 日程排班入口',
            shop: '削角版养成中枢 · 集市小铺入口'
          };
          showToast(map[act] || '养成中枢');
        });
      });

      /* 键盘快捷键 */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'g' || e.key === 'G') {
          btnToggleRuler.click();
          return;
        }
        if (!state.active) return;
        if (e.key === 'Escape') {
          closeDialogue(false);
          return;
        }
        if (state.awaitingChoice && ['1', '2', '3'].indexOf(e.key) !== -1) {
          const idx = Number(e.key) - 1;
          const btns = choicesEl.querySelectorAll('.choice-blade');
          if (btns[idx]) btns[idx].click();
          return;
        }
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          handleAdvance();
        }
      });

      /* 窗口尺寸变化时重校基准与气泡位置 */
      window.addEventListener('resize', function () {
        calibrateBaseline();
        repositionEchoAndChoices();
      });

      /* 预加载表情立绘，避免切换瞬间闪烁 */
      Object.values(CHARACTERS).forEach(function (ch) {
        Object.values(ch.portraits).forEach(function (src) {
          const pre = new Image();
          pre.src = src;
        });
      });

      /* 首次图片加载后锁定基准线 */
      Promise.all([imgSylvia, imgAlice].map(function (img) {
        return img.complete
          ? Promise.resolve()
          : new Promise(function (resolve) {
              img.addEventListener('load', resolve, { once: true });
              img.addEventListener('error', resolve, { once: true });
            });
      })).then(function () {
        calibrateBaseline();
      });
    })();
  </script>
</body>
</html>
