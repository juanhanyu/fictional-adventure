const DATA = Object.assign({}, P1, P2);

const CHAR_MAP = Object.create(null);
for (let i = 0; i < BANK_CHARS.length; i++) CHAR_MAP[BANK_CHARS[i]] = i;

function hexToRgba(hex) {
  if (!hex) return [0, 0, 0, 0];
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
}

function decodeIndices(rows, w, h) {
  const out = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    const row = rows[y] || '';
    let x = 0;
    for (let i = 0; i < row.length && x < w; ) {
      const ci = CHAR_MAP[row[i++]] || 0;
      let count = 1;
      if (row[i] === '*') {
        i++;
        let n = 0;
        while (i < row.length) {
          const c = row.charCodeAt(i);
          if (c >= 48 && c <= 57) { n = n * 10 + (c - 48); i++; }
          else break;
        }
        count = n || 1;
      }
      const end = Math.min(w, x + count);
      for (let k = x; k < end; k++) out[y * w + k] = ci;
      x = end;
    }
  }
  return out;
}

function makeBreathIndices(src, w, h) {
  let yTop = h, yBot = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (src[y * w + x]) {
        if (y < yTop) yTop = y;
        if (y > yBot) yBot = y;
      }
    }
  }
  const split = Math.floor(yTop + (yBot - yTop) * 0.72);
  const dst = new Uint8Array(w * h);
  for (let y = split + 1; y < h; y++) {
    for (let x = 0; x < w; x++) dst[y * w + x] = src[y * w + x];
  }
  for (let y = 0; y <= split; y++) {
    const ty = Math.min(h - 1, y + 1);
    for (let x = 0; x < w; x++) {
      const v = src[y * w + x];
      if (v) dst[ty * w + x] = v;
    }
  }
  return dst;
}

function buildOffscreen(indices, rgbaPal, w, h) {
  const off = document.createElement('canvas');
  off.width = w; off.height = h;
  const ctx = off.getContext('2d');
  const img = ctx.createImageData(w, h);
  const d = img.data;
  for (let i = 0; i < indices.length; i++) {
    const c = rgbaPal[indices[i]] || [0, 0, 0, 0];
    const o = i * 4;
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = c[3];
  }
  ctx.putImageData(img, 0, 0);
  return off;
}

const CACHE = Object.create(null);
function getSprite(sid) {
  if (CACHE[sid]) return CACHE[sid];
  const s = DATA[sid];
  const rgba = s.p.map(hexToRgba);
  const i1 = decodeIndices(s.f[0], s.w, s.h);
  const i2 = makeBreathIndices(i1, s.w, s.h);
  const st = decodeIndices(s.f[1], s.w, s.h);
  CACHE[sid] = {
    meta: s,
    colors: s.p.length - 1,
    idle1: buildOffscreen(i1, rgba, s.w, s.h),
    idle2: buildOffscreen(i2, rgba, s.w, s.h),
    strike: buildOffscreen(st, rgba, s.w, s.h)
  };
  return CACHE[sid];
}

let leftId = 'a_hd_bighead';
let rightId = 'd_octopath_64';
let activeMode = 'auto';
let bgMode = 'dark';
let clickStrikeUntil = 0;

function drawChecker(ctx, W, H, tile) {
  const dark = bgMode === 'dark';
  const c1 = dark ? '#181e30' : '#f1f5fb';
  const c2 = dark ? '#202840' : '#e2eaf7';
  for (let y = 0; y < H; y += tile) {
    for (let x = 0; x < W; x += tile) {
      ctx.fillStyle = (((x / tile) + (y / tile)) & 1) ? c2 : c1;
      ctx.fillRect(x, y, tile, tile);
    }
  }
}

function renderOne(canvasId, sid, frameName, lungeNorm) {
  const sp = getSprite(sid);
  const s = sp.meta;
  const sc = s.scale;
  const cv = document.getElementById(canvasId);
  const W = s.w * sc, H = s.h * sc;
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  drawChecker(ctx, W, H, Math.max(8, sc * 4));
  const lungeLogical = Math.round(lungeNorm * (s.w * 0.04));
  ctx.drawImage(sp[frameName], lungeLogical * sc, 0, W, H);
}

function updateUI() {
  document.querySelectorAll('#left-tabs button').forEach(btn => {
    const on = btn.dataset.id === leftId;
    btn.className = on
      ? 'px-2 py-0.5 rounded font-medium cursor-pointer bg-[var(--primary)] text-[var(--primary-foreground)]'
      : 'px-2 py-0.5 rounded font-medium cursor-pointer text-[var(--muted-foreground)] hover:text-[var(--foreground)] hover:bg-[var(--card)]';
  });
  document.querySelectorAll('#mode-tabs button').forEach(btn => {
    const on = btn.dataset.mode === activeMode;
    btn.className = on
      ? 'px-2 py-0.5 rounded font-medium cursor-pointer bg-[var(--secondary)] text-[var(--secondary-foreground)] border border-[var(--card-border)]'
      : 'px-2 py-0.5 rounded cursor-pointer text-[var(--muted-foreground)] hover:text-[var(--foreground)]';
  });
  document.getElementById('bg-toggle').textContent = bgMode === 'dark' ? '棋盘: 深' : '棋盘: 浅';
  document.getElementById('right-select').value = rightId;

  const L = getSprite(leftId), R = getSprite(rightId);
  document.getElementById('l-title').textContent = L.meta.title;
  document.getElementById('l-spec').textContent = L.meta.spec;
  document.getElementById('l-meta').textContent = `${L.colors}色 · ${L.meta.kb} KB`;
  document.getElementById('r-title').textContent = R.meta.title;
  document.getElementById('r-spec').textContent = R.meta.spec;
  document.getElementById('r-meta').textContent = `${R.colors}色 · ${R.meta.kb} KB`;
}

function drawFrame(now) {
  let frameName = 'idle1';
  let lungeNorm = 0;
  let label = 'IDLE';

  if (now < clickStrikeUntil) {
    frameName = 'strike';
    const rem = (clickStrikeUntil - now) / 720;
    lungeNorm = Math.sin(Math.min(1, (1 - rem) * 2.2) * Math.PI * 0.5);
    label = 'CAST!';
  } else if (activeMode === 'strike') {
    frameName = 'strike';
    label = 'CAST';
  } else if (activeMode === 'idle') {
    frameName = ((Math.floor(now / 520)) & 1) ? 'idle2' : 'idle1';
    label = frameName === 'idle2' ? 'BREATH' : 'IDLE';
  } else {
    const cyc = now % 3200;
    if (cyc < 1900) {
      frameName = ((Math.floor(cyc / 480)) & 1) ? 'idle2' : 'idle1';
      label = frameName === 'idle2' ? 'BREATH' : 'IDLE';
    } else if (cyc < 2850) {
      frameName = 'strike';
      const t = (cyc - 1900) / 950;
      lungeNorm = t < 0.25 ? t / 0.25 : (t > 0.78 ? (1 - t) / 0.22 : 1);
      label = 'CAST!';
    } else {
      frameName = 'idle1';
      label = 'IDLE';
    }
  }

  renderOne('cv-l', leftId, frameName, lungeNorm);
  renderOne('cv-r', rightId, frameName, lungeNorm);
  document.getElementById('l-state').textContent = label;
  document.getElementById('r-state').textContent = label;
}

document.getElementById('left-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]');
  if (!b) return;
  leftId = b.dataset.id;
  clickStrikeUntil = 0;
  updateUI();
  drawFrame(performance.now());
});
document.getElementById('right-select').addEventListener('change', e => {
  rightId = e.target.value;
  clickStrikeUntil = 0;
  updateUI();
  drawFrame(performance.now());
});
document.getElementById('mode-tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  activeMode = b.dataset.mode;
  clickStrikeUntil = 0;
  updateUI();
  drawFrame(performance.now());
});
document.getElementById('bg-toggle').addEventListener('click', () => {
  bgMode = bgMode === 'dark' ? 'light' : 'dark';
  updateUI();
  drawFrame(performance.now());
});
['stage-l', 'stage-r'].forEach(id => {
  document.getElementById(id).addEventListener('click', () => {
    clickStrikeUntil = performance.now() + 720;
  });
});
window.addEventListener('themechange', () => drawFrame(performance.now()));

updateUI();
function loop(ts) {
  drawFrame(ts);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
