    /* =========================================================================
       自定义雪瓷 Tooltip（全页零原生 title 属性）
       ========================================================================= */
    function initPorcelainTooltip() {
      let activeTarget = null;

      function positionTip(e, target) {
        const tipEl = els.tip;
        const rect = target.getBoundingClientRect();
        const tw = tipEl.offsetWidth || 180;
        const th = tipEl.offsetHeight || 28;
        let x = e && Number.isFinite(e.clientX) ? e.clientX + 12 : rect.left + rect.width * 0.5 - tw * 0.5;
        let y = e && Number.isFinite(e.clientY) ? e.clientY + 18 : rect.bottom + 8;
        if (x + tw > window.innerWidth - 10) x = window.innerWidth - tw - 10;
        if (x < 10) x = 10;
        if (y + th > window.innerHeight - 10) y = rect.top - th - 8;
        if (y < 10) y = 44;
        tipEl.style.left = `${Math.round(x)}px`;
        tipEl.style.top = `${Math.round(y)}px`;
      }

      document.addEventListener('pointerover', (e) => {
        const target = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
        if (!target) return;
        const text = target.getAttribute('data-tip');
        if (!text) return;
        activeTarget = target;
        els.tip.textContent = text;
        els.tip.classList.add('is-show');
        positionTip(e, target);
      });

      document.addEventListener('pointermove', (e) => {
        if (!activeTarget) return;
        if (!activeTarget.isConnected) {
          activeTarget = null;
          els.tip.classList.remove('is-show');
          return;
        }
        positionTip(e, activeTarget);
      });

      document.addEventListener('pointerout', (e) => {
        if (!activeTarget) return;
        const related = e.relatedTarget && e.relatedTarget.closest ? e.relatedTarget.closest('[data-tip]') : null;
        if (related !== activeTarget) {
          activeTarget = null;
          els.tip.classList.remove('is-show');
        }
      });

      document.addEventListener('pointerdown', () => {
        activeTarget = null;
        els.tip.classList.remove('is-show');
      });
    }

    /* =========================================================================
       顶部操控条：阵容 & 3D 场景按钮构建
       ========================================================================= */
    function buildTopControls() {
      els.formationBar.innerHTML = '';
      FORMATION_ORDER.forEach(({ key, short }) => {
        const meta = FORMATIONS && FORMATIONS[key];
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tb-tab' + (key === state.formationKey ? ' is-active' : '');
        btn.dataset.formation = key;
        btn.dataset.tip = meta ? `${meta.label}：${meta.desc}` : `切换 ${short} 阵容`;
        btn.textContent = short;
        btn.addEventListener('click', () => {
          if (!state.engine || state.formationKey === key) return;
          state.formationKey = key;
          state.round = 1;
          state.anchorInited = false;
          state.menuMode = 'root';
          syncTopBarActive();
          state.engine.setFormation(key);
          syncTopBarActive();
          setToast(`已切换阵容【${meta ? meta.label : short}】 · 16% 黄金交锋带动态重排`);
        });
        els.formationBar.appendChild(btn);
      });

      els.biomeBar.innerHTML = '';
      const biomes = Array.isArray(BIOME_LIST) && BIOME_LIST.length
        ? BIOME_LIST
        : [
            { id: 'academy', name: '雪庭演武场', subtitle: '学院霜白演武庭院' },
            { id: 'forest',  name: '极北冰晶古林', subtitle: '晶柱寒雾密林' },
            { id: 'altar',   name: '云巅风神祭坛', subtitle: '高空云海风神石台' },
          ];

      biomes.forEach((b) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tb-tab' + (b.id === state.biomeId ? ' is-active' : '');
        btn.dataset.biome = b.id;
        btn.dataset.tip = `${b.name}${b.subtitle ? ' — ' + b.subtitle : ''}`;
        btn.textContent = b.shortName || b.name;
        btn.addEventListener('click', () => {
          if (!state.engine || state.biomeId === b.id) return;
          state.biomeId = b.id;
          syncTopBarActive();
          state.engine.setBiome(b.id);
          syncTopBarActive();
          setToast(`已切换 3D 场景【${b.name}】`);
        });
        els.biomeBar.appendChild(btn);
      });
    }

    function syncTopBarActive() {
      els.formationBar.querySelectorAll('.tb-tab').forEach((btn) => {
        const isActive = btn.dataset.formation === state.formationKey;
        btn.classList.toggle('is-active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });
      els.biomeBar.querySelectorAll('.tb-tab').forEach((btn) => {
        const isActive = btn.dataset.biome === state.biomeId;
        btn.classList.toggle('is-active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });
      els.btnFocus.classList.toggle('is-on', state.spotlightOn);
      els.btnOverview.classList.toggle('is-on', state.cameraMode === 'overview');
      els.tlBtnOverview.classList.toggle('is-overview', state.cameraMode === 'overview');
      els.btnDof.classList.toggle('is-on', state.tiltShiftOn);
      els.btnRuler.classList.toggle('is-on', state.rulerOn);
      els.rulerOverlay.classList.toggle('is-visible', state.rulerOn);
      document.body.classList.toggle('focus-spotlight-active', state.spotlightOn && state.cameraMode !== 'overview');

      if (state.cameraMode === 'overview' || !state.spotlightOn) {
        els.tlCamMode.textContent = '全景俯瞰';
      } else if (state.cameraMode === 'clash') {
        els.tlCamMode.textContent = '推镜·交锋中心';
      } else {
        els.tlCamMode.textContent = '推镜·行动焦点';
      }

      els.edcCamClash.classList.toggle('is-active', state.spotlightOn && state.cameraMode === 'clash');
      els.edcCamOverview.classList.toggle('is-active', state.cameraMode === 'overview');
    }

    /* =========================================================================
       核心特色：剧场电影推镜聚焦控制
       ========================================================================= */
    function applyTheatricalCamera(mode, actorId, customFocusIds) {
      if (!state.engine) return;
      if (!state.spotlightOn || mode === 'overview') {
        state.cameraMode = 'overview';
        state.engine.focusCameraOn('default');
        state.engine.setDimNonFocus(false, []);
        syncTopBarActive();
        return;
      }

      if (mode === 'clash') {
        const targetId = actorId || state.selectedEnemyId;
        state.cameraMode = 'clash';
        state.engine.focusCameraOn('clash', targetId);
        const focusIds = customFocusIds || [state.activeAllyId, targetId].filter(Boolean);
        state.engine.setDimNonFocus(true, focusIds);
      } else {
        const allyId = actorId || state.activeAllyId;
        state.cameraMode = 'actor';
        state.engine.focusCameraOn('actor', allyId);
        const focusIds = customFocusIds || [allyId, state.selectedEnemyId].filter(Boolean);
        state.engine.setDimNonFocus(true, focusIds);
      }
      syncTopBarActive();
    }

    function selectAlly(allyId, pushFocus = true, fromEngineClick = false) {
      if (!allyId || !state.actorMap.has(allyId)) return;
      const actor = state.actorMap.get(allyId);
      if (actor.side !== 'ally') return;
      state.activeAllyId = allyId;
      if (!fromEngineClick && state.engine) {
        state.engine.setActiveActor(allyId);
      }
      if (pushFocus) {
        applyTheatricalCamera('actor', allyId);
      }
      refreshDiscreteUI();
      setToast(`行动焦点切换至【${actor.name}】 · 剧场 3D 镜头已跟随`);
    }

    function selectEnemy(enemyId, pushClash = true, fromEngineClick = false) {
      if (!enemyId || !state.actorMap.has(enemyId)) return;
      const actor = state.actorMap.get(enemyId);
      if (actor.side !== 'enemy') return;
      state.selectedEnemyId = enemyId;
      if (!fromEngineClick && state.engine) {
        state.engine.setSelectedEnemy(enemyId);
      }
      if (pushClash) {
        applyTheatricalCamera('clash', enemyId);
      }
      refreshDiscreteUI();
      setToast(`交锋锁定【${actor.name}】 · 下回合意图：${actor.intent || '待机'}`);
    }

    function cycleEnemy(step) {
      const enemies = getEnemies();
      if (!enemies.length) return;
      const idx = Math.max(0, enemies.findIndex((e) => e.id === state.selectedEnemyId));
      const next = enemies[(idx + step + enemies.length) % enemies.length];
      selectEnemy(next.id, true);
    }

    function cycleAlly(step) {
      const allies = getAllies();
      if (!allies.length) return;
      const idx = Math.max(0, allies.findIndex((a) => a.id === state.activeAllyId));
      const next = allies[(idx + step + allies.length) % allies.length];
      selectAlly(next.id, true);
    }

    /* =========================================================================
       顶中极细雪瓷行动序轨（交错排布敌我，点击即推镜切换）
       ========================================================================= */
    function buildTurnOrder() {
      const allies = getAllies();
      const enemies = getEnemies();
      const order = [];
      const maxLen = Math.max(allies.length, enemies.length);
      for (let i = 0; i < maxLen; i++) {
        if (allies[i]) order.push(allies[i].id);
        if (enemies[i]) order.push(enemies[i].id);
      }
      state.turnOrder = order;
      state.turnCursor = 0;
    }

    function renderTimeline() {
      els.tlRoundText.textContent = `ROUND ${String(state.round).padStart(2, '0')}`;
      els.tlRail.innerHTML = '';

      state.turnOrder.forEach((id) => {
        const actor = state.actorMap.get(id);
        if (!actor) return;
        const isActive = id === state.activeAllyId;
        const isTarget = id === state.selectedEnemyId;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = [
          'tl-node',
          actor.side === 'enemy' ? 'is-enemy' : 'is-ally',
          actor.isBoss ? 'is-boss' : '',
          isActive ? 'is-active' : '',
          isTarget ? 'is-target' : '',
        ].filter(Boolean).join(' ');
        btn.dataset.tip = `${actor.name}（${actor.side === 'ally' ? '我方 · 点击推镜切换行动者' : '敌方 · 点击推镜锁定交锋'}） HP ${actor.hp}/${actor.maxHp}`;

        const tagText = isActive ? '行动' : isTarget ? '锁定' : actor.name.slice(0, 3);
        btn.innerHTML = `
          <span class="tl-diamond"><span class="tl-glyph">${escapeHtml(shortGlyph(actor.name))}</span></span>
          <span class="tl-tag">${escapeHtml(tagText)}</span>
        `;

        btn.addEventListener('click', () => {
          if (actor.side === 'ally') {
            selectAlly(actor.id, true);
          } else {
            selectEnemy(actor.id, true);
          }
        });
        els.tlRail.appendChild(btn);
      });
    }

    /* =========================================================================
       左下角极简小队状态窄条
       ========================================================================= */
    function renderSquadDock() {
      const allies = getAllies();
      els.squadTitle.textContent = allies.length >= 4 ? `六人剧场阵线 (${allies.length})` : `我方阵线 (${allies.length})`;
      els.squadGrid.classList.toggle('is-single', allies.length <= 1);
      els.squadGrid.innerHTML = '';

      allies.forEach((a) => {
        const hpPct = a.maxHp > 0 ? clamp((a.hp / a.maxHp) * 100, 0, 100) : 100;
        const mpPct = a.maxMp > 0 ? clamp((a.mp / a.maxMp) * 100, 0, 100) : 100;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'squad-row' + (a.id === state.activeAllyId ? ' is-active' : '');
        btn.dataset.actorId = a.id;
        btn.dataset.tip = `${a.name} · ${a.role || '伙伴'} · 点击切换行动者并推镜聚焦`;
        btn.innerHTML = `
          <div class="sq-top">
            <span class="sq-name">${escapeHtml(a.name)}</span>
            <span class="sq-role">${escapeHtml(a.role || '')}</span>
          </div>
          <div class="sq-bars">
            <div class="sq-bar-line">
              <div class="sq-track"><div class="sq-fill-hp" style="width:${hpPct.toFixed(1)}%"></div></div>
              <span class="sq-val">${Math.round(a.hp)}</span>
            </div>
            <div class="sq-bar-line">
              <div class="sq-track"><div class="sq-fill-mp" style="width:${mpPct.toFixed(1)}%"></div></div>
              <span class="sq-val">${Math.round(a.mp)}</span>
            </div>
          </div>
        `;
        btn.addEventListener('click', () => selectAlly(a.id, true));
        els.squadGrid.appendChild(btn);
      });
    }

    /* =========================================================================
       右下角完整雪瓷锁定敌方详卡
       ========================================================================= */
    function renderEnemyDetailCard() {
      const enemy = state.actorMap.get(state.selectedEnemyId) || getEnemies()[0];
      const ally = state.actorMap.get(state.activeAllyId) || getAllies()[0];
      if (!enemy) {
        els.edcCard.style.display = 'none';
        return;
      }
      els.edcCard.style.display = '';
      els.edcCard.classList.toggle('is-boss', Boolean(enemy.isBoss));
      els.edcBadge.textContent = enemy.isBoss ? '强敌首领' : '锁定目标';
      els.edcRoleTier.textContent = [enemy.role, enemy.tier].filter(Boolean).join(' · ');
      els.edcName.textContent = enemy.name;

      const hpPct = enemy.maxHp > 0 ? clamp((enemy.hp / enemy.maxHp) * 100, 0, 100) : 100;
      els.edcHpNum.textContent = `${Math.round(enemy.hp)} / ${Math.round(enemy.maxHp)}`;
      els.edcHpFill.style.width = `${hpPct.toFixed(1)}%`;

      const maxSh = Math.max(0, Math.round(Number(enemy.maxShield) || 0));
      const curSh = clamp(Math.round(Number(enemy.shield) || 0), 0, Math.max(maxSh, Math.round(Number(enemy.shield) || 0)));
      els.edcShieldNum.textContent = `${curSh} / ${maxSh}`;
      els.edcShieldPips.innerHTML = '';
      const pipCount = maxSh <= 10 ? Math.max(1, maxSh) : 10;
      const filledCount = maxSh > 0 ? Math.ceil((curSh / maxSh) * pipCount) : 0;
      for (let i = 0; i < pipCount; i++) {
        const pip = document.createElement('span');
        pip.className = 'edc-pip' + (i < filledCount ? ' is-filled' : '');
        els.edcShieldPips.appendChild(pip);
      }

      const iType = enemy.intentType || 'atk';
      els.edcIntentStrip.className = `edc-intent-strip type-${iType}`;
      els.edcIntentText.textContent = enemy.intent || '蓄势戒备';
      els.edcIntentTag.className = `efp-intent type-${iType}`;
      els.edcIntentTag.textContent = intentBadgeText(iType);

      els.edcClashPair.textContent = ally
        ? `交锋：${ally.name} ⇄ ${enemy.name}`
        : `锁定：${enemy.name}`;
    }

    /* =========================================================================
       舞台分层克制脚底血条（非焦点 6px 极细血线+盾数字；焦点展开单行名牌+意图）
       ========================================================================= */
    function rebuildFootPlatePool() {
      els.stageHud.innerHTML = '';
      footPlatePool.clear();

      state.actors.forEach((actor) => {
        const el = document.createElement('div');
        el.className = 'actor-foot-plate';
        el.dataset.actorId = actor.id;
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          if (actor.side === 'ally') selectAlly(actor.id, true);
          else selectEnemy(actor.id, true);
        });
        els.stageHud.appendChild(el);
        footPlatePool.set(actor.id, { el, lastSig: '' });
      });
      refreshFootPlateContent();
    }

    function refreshFootPlateContent() {
      state.actors.forEach((actor) => {
        const rec = footPlatePool.get(actor.id);
        if (!rec) return;
        const isFocusedEnemy = actor.side === 'enemy' && actor.id === state.selectedEnemyId;
        const isActiveAlly = actor.side === 'ally' && actor.id === state.activeAllyId;
        const hpPct = actor.maxHp > 0 ? clamp((actor.hp / actor.maxHp) * 100, 0, 100) : 100;
        const sig = `${actor.side}|${isFocusedEnemy ? 1 : 0}|${isActiveAlly ? 1 : 0}|${Math.round(actor.hp)}|${Math.round(actor.maxHp)}|${actor.shield}|${actor.intent}`;
        if (rec.lastSig === sig) return;
        rec.lastSig = sig;

        if (actor.side === 'enemy' && isFocusedEnemy) {
          const iType = actor.intentType || 'atk';
          rec.el.style.zIndex = '18';
          rec.el.innerHTML = `
            <div class="enemy-focus-plate" data-tip="已锁定目标 ${escapeHtml(actor.name)} · 下回合：${escapeHtml(actor.intent || '待机')}">
              <div class="efp-row">
                <span class="efp-name">
                  ${escapeHtml(actor.name)}
                  ${actor.tier ? `<span class="efp-tier">${escapeHtml(actor.tier)}</span>` : ''}
                </span>
                <span class="efp-intent type-${escapeHtml(iType)}">${escapeHtml(actor.intent || intentBadgeText(iType))}</span>
              </div>
              <div class="efp-bars">
                <div class="efp-hp-track"><div class="efp-hp-fill" style="width:${hpPct.toFixed(1)}%"></div></div>
                <span class="efp-nums">${Math.round(actor.hp)}/${Math.round(actor.maxHp)}</span>
                ${actor.shield > 0 ? `<span class="efp-shield-chip">◈${actor.shield}</span>` : ''}
              </div>
            </div>
          `;
        } else if (actor.side === 'enemy') {
          rec.el.style.zIndex = '12';
          rec.el.innerHTML = `
            <div class="enemy-slim-bar" data-tip="点击锁定 ${escapeHtml(actor.name)}（HP ${Math.round(actor.hp)}/${Math.round(actor.maxHp)}）并推镜聚焦">
              <div class="enemy-slim-track"><div class="enemy-slim-fill" style="width:${hpPct.toFixed(1)}%"></div></div>
              ${actor.shield > 0 ? `<span class="enemy-slim-shield">◈${actor.shield}</span>` : ''}
            </div>
          `;
        } else {
          rec.el.style.zIndex = isActiveAlly ? '16' : '10';
          rec.el.innerHTML = `
            <div class="ally-slim-bar${isActiveAlly ? ' is-active' : ''}" data-tip="点击切换行动者：${escapeHtml(actor.name)}">
              ${isActiveAlly ? `<span class="ally-slim-name">${escapeHtml(actor.name)}</span>` : ''}
              <div class="ally-slim-track"><div class="ally-slim-fill" style="width:${hpPct.toFixed(1)}%"></div></div>
            </div>
          `;
        }
      });
    }

    /* =========================================================================
       棱镜主菜单（4 行固定 + 翡翠绿守御技能叶 + 蓝金双菱形一键收起）
       ========================================================================= */
    function updateAmpUI() {
      const tier = AMP_TIERS[state.ampLevel] || AMP_TIERS[0];
      els.pwAmpSub.textContent = `${tier.label} (${tier.mult})`;
      els.subAmpMini.textContent = tier.short;
      els.pwAmp.classList.toggle('is-amp-charged', state.ampLevel > 0);
      els.pwAmp.classList.toggle('is-amp-t3', state.ampLevel === 3);
      if (state.menuMode === 'skills') renderCascadeBlades();
    }

    function stepAmp(delta) {
      const total = AMP_TIERS.length;
      state.ampLevel = (state.ampLevel + delta + total) % total;
      const tier = AMP_TIERS[state.ampLevel];
      updateAmpUI();
      setToast(`魔力增幅切换至【${tier.label}】 · ${tier.bonus}`);
    }

    function setPrismMode(mode) {
      state.menuMode = mode;
      if (state.prismCollapsed && mode !== 'root') {
        state.prismCollapsed = false;
      }
      els.prismRig.classList.remove('mode-root', 'mode-skills', 'mode-items');
      els.prismRig.classList.add(`mode-${mode}`);
      els.prismRig.classList.toggle('is-collapsed', state.prismCollapsed);
      els.hubToggle.setAttribute('aria-expanded', String(!state.prismCollapsed));

      if (mode === 'skills') {
        els.subTitle.textContent = '攻守术式 · 1–4 直施';
        els.subAmpMini.style.display = '';
        renderCascadeBlades();
        // 准备施法时丝滑推向交锋中心
        if (state.spotlightOn && state.selectedEnemyId) {
          applyTheatricalCamera('clash', state.selectedEnemyId);
        }
      } else if (mode === 'items') {
        els.subTitle.textContent = '战斗行囊 · 预留接口';
        els.subAmpMini.style.display = 'none';
        renderCascadeBlades();
      }
    }

    function togglePrismCollapse() {
      state.prismCollapsed = !state.prismCollapsed;
      els.prismRig.classList.toggle('is-collapsed', state.prismCollapsed);
      els.hubToggle.setAttribute('aria-expanded', String(!state.prismCollapsed));
      setToast(state.prismCollapsed
        ? '棱镜主菜单已收起 · 前排视野完全释放（点击双菱形枢纽或按 H 恢复）'
        : '棱镜主菜单已展开');
    }

    function renderCascadeBlades() {
      els.bladeList.innerHTML = '';

      if (state.menuMode === 'items') {
        DEMO_ITEMS.forEach((item, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cb-blade is-placeholder';
          btn.disabled = true;
          btn.innerHTML = `
            <span class="cb-bl-key">${idx + 1}</span>
            <span class="cb-bl-main">
              <div class="cb-bl-top">
                <span class="cb-bl-name">${escapeHtml(item.name)}</span>
                <span class="cb-bl-cost">预留</span>
              </div>
              <div class="cb-bl-sub">
                <span class="cb-bl-tag">${escapeHtml(item.tag)}</span>
                <span class="cb-bl-meta">${escapeHtml(item.desc)}</span>
              </div>
            </span>
          `;
          els.bladeList.appendChild(btn);
        });
        return;
      }

      const skills = Array.isArray(DEMO_SKILLS) ? DEMO_SKILLS : [];
      // 攻伐在先、守御紧随
      const sorted = skills.slice().sort((a, b) => Number(Boolean(a.isGuard)) - Number(Boolean(b.isGuard)));
      const tier = AMP_TIERS[state.ampLevel] || AMP_TIERS[0];

      sorted.forEach((sk, idx) => {
        const isGuard = Boolean(sk.isGuard || sk.type === 'shield');
        const effectivePct = isGuard ? Math.min(tier.pct, 0.40) : tier.pct;
        const mpCost = Math.round((Number(sk.mp) || 0) * (1 + effectivePct));

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cb-blade' + (isGuard ? ' is-guard' : '');
        btn.dataset.skillId = sk.id;
        btn.dataset.tip = `${sk.name}（${sk.tag || (isGuard ? '守御' : '攻伐')} · MP ${mpCost}）— ${sk.desc || '施放 3D 粒子术式'}`;
        btn.innerHTML = `
          <span class="cb-bl-key">${idx + 1}</span>
          <span class="cb-bl-main">
            <div class="cb-bl-top">
              <span class="cb-bl-name">${escapeHtml(sk.name)}</span>
              <span class="cb-bl-cost">MP ${mpCost}</span>
            </div>
            <div class="cb-bl-sub">
              <span class="cb-bl-tag">${escapeHtml(sk.tag || (sk.aoe ? '全体' : isGuard ? '守御' : '单体'))}</span>
              <span class="cb-bl-meta">${escapeHtml(sk.desc || '')}</span>
            </div>
          </span>
        `;

        btn.addEventListener('pointerenter', () => {
          if (!state.spotlightOn) return;
          if (isGuard) {
            applyTheatricalCamera('actor', state.activeAllyId, [state.activeAllyId].filter(Boolean));
          } else {
            const focusIds = sk.aoe
              ? [state.activeAllyId, ...getEnemies().map((e) => e.id)].filter(Boolean)
              : [state.activeAllyId, state.selectedEnemyId].filter(Boolean);
            applyTheatricalCamera('clash', state.selectedEnemyId, focusIds);
          }
        });

        btn.addEventListener('click', () => triggerCastSkill(sk));
        els.bladeList.appendChild(btn);
      });
    }

    function triggerCastSkill(skill) {
      if (!state.engine || !skill) return;
      const isGuard = Boolean(skill.isGuard || skill.type === 'shield');
      const ally = state.actorMap.get(state.activeAllyId);
      const enemy = state.actorMap.get(state.selectedEnemyId);
      const tier = AMP_TIERS[state.ampLevel] || AMP_TIERS[0];

      if (state.spotlightOn) {
        if (isGuard) {
          applyTheatricalCamera('actor', state.activeAllyId, [state.activeAllyId].filter(Boolean));
        } else {
          const focusIds = skill.aoe
            ? [state.activeAllyId, ...getEnemies().map((e) => e.id)].filter(Boolean)
            : [state.activeAllyId, state.selectedEnemyId].filter(Boolean);
          applyTheatricalCamera('clash', state.selectedEnemyId, focusIds);
        }
      }

      state.engine.castSkill(skill.id, state.ampLevel);
      setPrismMode('root');

      const ampTxt = state.ampLevel > 0 ? ` · ${tier.short}` : '';
      const targetTxt = isGuard
        ? '展开冰晶护盾'
        : skill.aoe
          ? '覆盖敌方全阵'
          : enemy ? `直击 ${enemy.name}` : '';
      setToast(`${ally ? ally.name : '我方'} 施放【${skill.name}】${ampTxt} · ${targetTxt}`);
    }

    function handleEndTurn() {
      const allies = getAllies();
      if (!allies.length) return;
      const curIdx = Math.max(0, allies.findIndex((a) => a.id === state.activeAllyId));
      const nextIdx = (curIdx + 1) % allies.length;
      if (nextIdx === 0) state.round += 1;
      const nextAlly = allies[nextIdx];
      state.menuMode = 'root';
      setPrismMode('root');
      selectAlly(nextAlly.id, true);
      setToast(`回合推进至 Round ${String(state.round).padStart(2, '0')} · 轮到【${nextAlly.name}】行动`);
    }

    /* =========================================================================
       3D 命中飘字反馈 (onImpact)
       ========================================================================= */
    function spawnImpactPopup({ targetId, screenX, screenY, damage, isShield, isCrit }) {
      let x = Number(screenX);
      let y = Number(screenY);
      const proj = targetId ? state.projections[targetId] : null;
      if (!Number.isFinite(x) || !Number.isFinite(y)) {
        x = proj ? proj.centerX : window.innerWidth * 0.62;
        y = proj ? proj.headY + (proj.feetY - proj.headY) * 0.35 : window.innerHeight * 0.48;
      }

      if (targetId) {
        state.hitFlashUntil.set(targetId, performance.now() + 260);
      }

      const pop = document.createElement('div');
      pop.className = 'impact-pop' + (isShield ? ' is-shield' : isCrit ? ' is-crit' : '');
      const jitterX = (Math.random() - 0.5) * 28;
      pop.style.left = `${Math.round(clamp(x + jitterX, 60, window.innerWidth - 60))}px`;
      pop.style.top = `${Math.round(clamp(y - 16, 70, window.innerHeight - 70))}px`;

      const num = Math.max(0, Math.round(Number(damage) || 0)).toLocaleString('en-US');
      const kicker = isShield ? 'GUARD' : isCrit ? 'CRITICAL' : '';
      const valText = isShield ? `+${num}` : `-${num}`;

      pop.innerHTML = `
        ${kicker ? `<span class="impact-kicker">${kicker}</span>` : ''}
        <span class="impact-val">${valText}</span>
      `;
      els.impactLayer.appendChild(pop);
      window.setTimeout(() => pop.remove(), 980);
    }

    /* =========================================================================
       身高标尺叠加层实时绘制（px / %H）
       ========================================================================= */
    function renderRulerOverlay(projections) {
      if (!state.rulerOn) return;
      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = els.rulerSvg;
      const frag = document.createDocumentFragment();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let count = 0;
      let sumPct = 0;
      let sumPx = 0;

      state.actors.forEach((actor) => {
        const p = projections[actor.id];
        if (!p || !p.onScreen) return;
        count += 1;
        sumPct += p.visibleHeightPct;
        sumPx += p.visibleHeightPx;

        const isAlly = actor.side === 'ally';
        const isHighlight = actor.id === state.activeAllyId || actor.id === state.selectedEnemyId || actor.isBoss;
        const stroke = actor.isBoss
          ? '#8C6928'
          : isAlly
            ? (isHighlight ? '#1658EB' : 'rgba(22,88,235,0.68)')
            : (isHighlight ? '#D13456' : 'rgba(209,52,86,0.68)');

        const rawTick = isAlly
          ? p.feetX - Math.max(26, p.screenWidthPx * 0.56)
          : p.feetX + Math.max(26, p.screenWidthPx * 0.56);
        const xTick = clamp(rawTick, 8, vw - 8);
        const yTop = clamp(p.headY, 42, vh - 12);
        const yBot = clamp(p.feetY, 46, vh - 4);
        const yMid = (yTop + yBot) * 0.5;

        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', xTick.toFixed(1));
        line.setAttribute('y1', yTop.toFixed(1));
        line.setAttribute('x2', xTick.toFixed(1));
        line.setAttribute('y2', yBot.toFixed(1));
        line.setAttribute('stroke', stroke);
        line.setAttribute('stroke-width', isHighlight ? '1.8' : '1.2');
        frag.appendChild(line);

        [yTop, yBot].forEach((yy) => {
          const cap = document.createElementNS(svgNS, 'line');
          cap.setAttribute('x1', (xTick - 5).toFixed(1));
          cap.setAttribute('y1', yy.toFixed(1));
          cap.setAttribute('x2', (xTick + 5).toFixed(1));
          cap.setAttribute('y2', yy.toFixed(1));
          cap.setAttribute('stroke', stroke);
          cap.setAttribute('stroke-width', '1.5');
          frag.appendChild(cap);
        });

        const labelText = `${Math.round(p.visibleHeightPx)}px · ${p.visibleHeightPct.toFixed(1)}%H`;
        const boxW = 92;
        const boxH = 16;
        const rawBx = isAlly ? xTick - boxW - 5 : xTick + 5;
        const bx = clamp(rawBx, 8, Math.max(8, vw - 130));
        const by = clamp(yMid - boxH * 0.5, 44, vh - boxH - 8);

        const bg = document.createElementNS(svgNS, 'rect');
        bg.setAttribute('x', bx.toFixed(1));
        bg.setAttribute('y', by.toFixed(1));
        bg.setAttribute('width', String(boxW));
        bg.setAttribute('height', String(boxH));
        bg.setAttribute('fill', 'rgba(255,255,255,0.92)');
        bg.setAttribute('stroke', stroke);
        bg.setAttribute('stroke-width', '1');
        frag.appendChild(bg);

        const txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', (bx + boxW * 0.5).toFixed(1));
        txt.setAttribute('y', (by + 11.5).toFixed(1));
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('font-family', 'ui-monospace, Consolas, monospace');
        txt.setAttribute('font-size', '9.5');
        txt.setAttribute('font-weight', '700');
        txt.setAttribute('fill', '#1A2436');
        txt.textContent = labelText;
        frag.appendChild(txt);
      });

      svg.replaceChildren(frag);
      const avgPx = count > 0 ? Math.round(sumPx / count) : 0;
      const avgPct = count > 0 ? (sumPct / count).toFixed(1) : '0.0';
      els.rulerSummary.textContent = `在屏 ${count} 人 · 均高 ${avgPx}px (${avgPct}%H) · 视口 ${vw}×${vh}`;
    }

    /* =========================================================================
       离散 UI 刷新 + 每帧 3D->2D 投影同步 (onFrame)
       ========================================================================= */
    function refreshDiscreteUI() {
      syncTopBarActive();
      renderTimeline();
      renderSquadDock();
      renderEnemyDetailCard();
      refreshFootPlateContent();
    }

    let lastRosterSig = '';

    function handleActorsUpdated(actorsList, arg2, arg3) {
      const nextList = Array.isArray(actorsList) ? actorsList : [];
      const nextRosterSig = nextList.map((a) => a.id).join('|');
      const rosterChanged = nextRosterSig !== lastRosterSig;
      lastRosterSig = nextRosterSig;

      const metaObj = arg2 && typeof arg2 === 'object' ? arg2 : null;
      const incomingActive = metaObj ? metaObj.activeAllyId : arg2;
      const incomingEnemy = metaObj ? metaObj.selectedEnemyId : arg3;

      state.actors = nextList;
      state.actorMap = new Map(state.actors.map((a) => [a.id, a]));

      const allies = getAllies();
      const enemies = getEnemies();
      state.activeAllyId = (incomingActive && state.actorMap.has(incomingActive))
        ? incomingActive
        : (state.activeAllyId && state.actorMap.has(state.activeAllyId))
          ? state.activeAllyId
          : (allies[0] ? allies[0].id : null);
      state.selectedEnemyId = (incomingEnemy && state.actorMap.has(incomingEnemy))
        ? incomingEnemy
        : (state.selectedEnemyId && state.actorMap.has(state.selectedEnemyId))
          ? state.selectedEnemyId
          : (enemies[0] ? enemies[0].id : null);

      if (rosterChanged) {
        buildTurnOrder();
        rebuildFootPlatePool();
      }
      refreshDiscreteUI();

      // 仅在切换阵容或初始化时自动推镜到首位行动者，避免选敌/施法中覆盖交锋镜头
      if (rosterChanged && state.engine && state.spotlightOn && state.cameraMode !== 'overview') {
        applyTheatricalCamera('actor', state.activeAllyId);
      }
    }

    function handleFrame({ projections, actors, activeAllyId, selectedEnemyId, fps }) {
      if (Array.isArray(actors) && actors.length) {
        state.actors = actors;
        state.actorMap = new Map(actors.map((a) => [a.id, a]));
      }
      if (activeAllyId && state.actorMap.has(activeAllyId)) state.activeAllyId = activeAllyId;
      if (selectedEnemyId && state.actorMap.has(selectedEnemyId)) state.selectedEnemyId = selectedEnemyId;
      state.projections = projections || {};

      const now = performance.now();
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      // 实时刷新数值变化（带签名去重，无变化时零 DOM 开销），确保聚焦名牌尺寸测量即时准确
      refreshFootPlateContent();

      // 1. 同步脚底分层血条投影位置（聚焦敌方名牌防撞右下 #enemy-detail-card 钳位）
      const edcVisible = els.edcCard && els.edcCard.style.display !== 'none';
      const edcRect = edcVisible ? els.edcCard.getBoundingClientRect() : null;
      let visCount = 0;
      let visPctSum = 0;
      for (let i = 0; i < state.actors.length; i++) {
        const actor = state.actors[i];
        const p = state.projections[actor.id];
        const rec = footPlatePool.get(actor.id);
        if (p && p.onScreen) {
          visCount += 1;
          visPctSum += p.visibleHeightPct;
        }
        if (!rec) continue;
        if (!p || !p.onScreen) {
          rec.el.style.transform = 'translate3d(-9999px, -9999px, 0)';
          continue;
        }
        const isFocusedEnemy = actor.side === 'enemy' && actor.id === state.selectedEnemyId;
        let fx;
        let fy;
        if (isFocusedEnemy) {
          const plateEl = rec.el.firstElementChild;
          const plateW = (plateEl && plateEl.offsetWidth) || 224;
          const plateH = (plateEl && plateEl.offsetHeight) || 52;
          const halfW = Math.ceil(plateW * 0.5);
          fx = clamp(p.feetX, halfW + 12, vw - halfW - 12);
          fy = clamp(p.feetY + 8, 96, Math.min(vh - plateH - 16, vh - 58));

          if (edcRect && edcRect.width > 0 && edcRect.height > 0) {
            const pad = 12;
            const overlapsX = (fx + halfW) > (edcRect.left - pad);
            const overlapsY = (fy + plateH) > (edcRect.top - pad);
            if (overlapsX && overlapsY) {
              const safeMaxFx = edcRect.left - pad - halfW;
              if (safeMaxFx >= halfW + 12) {
                fx = Math.min(fx, safeMaxFx);
              } else {
                fy = Math.max(96, edcRect.top - pad - plateH);
              }
            }
          }
        } else {
          fx = clamp(p.feetX, 76, vw - 76);
          fy = clamp(p.feetY + 8, 96, vh - 58);
        }
        rec.el.style.transform = `translate3d(${Math.round(fx)}px, ${Math.round(fy)}px, 0)`;
        const flashUntil = state.hitFlashUntil.get(actor.id) || 0;
        rec.el.classList.toggle('is-hit-flash', now < flashUntil);
      }

      // 2. 棱镜主菜单平滑锚定在当前行动者右肩（6v6 紧密交锋带下右边界智能钳位，绝不遮挡敌方前排人脸）
      const activeProj = state.activeAllyId ? state.projections[state.activeAllyId] : null;
      if (activeProj && activeProj.onScreen) {
        const isCompact = vw <= 1360;
        const rootReach = isCompact ? 200 : 214;
        const subReach = isCompact ? 252 : 272;
        const menuRightReach = (state.prismCollapsed || state.menuMode === 'root') ? rootReach : subReach;

        // 动态计算在屏敌方最前排左轮廓（兼顾人脸 headX / 躯干 centerX / 脚底 feetX）
        let frontEnemyLeftX = Infinity;
        for (let i = 0; i < state.actors.length; i++) {
          const a = state.actors[i];
          if (a.side !== 'enemy') continue;
          const ep = state.projections[a.id];
          if (!ep || !ep.onScreen) continue;
          const enemyHalfW = Math.min(ep.screenWidthPx * 0.44, 92);
          const candidateLeft = Math.min(ep.centerX, ep.headX, ep.feetX) - enemyHalfW;
          if (candidateLeft < frontEnemyLeftX) {
            frontEnemyLeftX = candidateLeft;
          }
        }

        const edcSafeRight = isCompact ? 276 : 296;
        let maxAnchorX = vw - menuRightReach - edcSafeRight;
        if (Number.isFinite(frontEnemyLeftX)) {
          maxAnchorX = Math.min(maxAnchorX, frontEnemyLeftX - 16 - menuRightReach);
        }
        const desiredX = activeProj.feetX + Math.max(20, activeProj.screenWidthPx * 0.22);
        const minAnchorX = Math.max(72, activeProj.feetX - 30);
        const targetX = maxAnchorX >= minAnchorX
          ? clamp(desiredX, minAnchorX, maxAnchorX)
          : Math.max(72, maxAnchorX);

        const minAnchorY = state.menuMode === 'root' ? 212 : 226;
        const targetY = clamp(
          activeProj.centerY - 6,
          minAnchorY,
          vh - 188
        );
        if (!state.anchorInited) {
          state.anchorX = targetX;
          state.anchorY = targetY;
          state.anchorInited = true;
        } else {
          state.anchorX += (targetX - state.anchorX) * 0.16;
          state.anchorY += (targetY - state.anchorY) * 0.16;
        }
        els.prismRig.style.transform = `translate3d(${Math.round(state.anchorX)}px, ${Math.round(state.anchorY)}px, 0)`;
      }

      // 3. 身高标尺叠加层
      if (state.rulerOn) {
        renderRulerOverlay(state.projections);
      }

      // 4. 节流刷新 FPS 与平均占屏高读数 & 详卡数值同步
      if (now - state.lastMetricsTs >= 180) {
        state.lastMetricsTs = now;
        els.metricFps.textContent = Number.isFinite(fps) ? String(Math.round(fps)) : '--';
        const avgPct = visCount > 0 ? (visPctSum / visCount).toFixed(1) : '--';
        els.metricAvgH.textContent = `${avgPct}%H`;
        renderEnemyDetailCard();
        // 同步左下小队条数值
        els.squadGrid.querySelectorAll('.squad-row').forEach((row) => {
          const a = state.actorMap.get(row.dataset.actorId);
          if (!a) return;
          const hpBar = row.querySelector('.sq-fill-hp');
          const mpBar = row.querySelector('.sq-fill-mp');
          const vals = row.querySelectorAll('.sq-val');
          if (hpBar && a.maxHp > 0) hpBar.style.width = `${clamp((a.hp / a.maxHp) * 100, 0, 100).toFixed(1)}%`;
          if (mpBar && a.maxMp > 0) mpBar.style.width = `${clamp((a.mp / a.maxMp) * 100, 0, 100).toFixed(1)}%`;
          if (vals[0]) vals[0].textContent = String(Math.round(a.hp));
          if (vals[1]) vals[1].textContent = String(Math.round(a.mp));
        });
      }
    }

    /* =========================================================================
       事件绑定与键盘快捷键（W/E/A/D/1–4/Tab/Q/V/H/Esc）
       ========================================================================= */
    function bindInteractions() {
      // 顶部特色开关
      els.btnFocus.addEventListener('click', () => {
        state.spotlightOn = !state.spotlightOn;
        if (state.spotlightOn) {
          applyTheatricalCamera('actor', state.activeAllyId);
          setToast('已开启【电影推镜聚焦】 · 切角/锁敌自动丝滑 3D 推镜并柔和压暗非焦点');
        } else {
          applyTheatricalCamera('overview');
          setToast('已关闭【电影推镜聚焦】 · 维持固定全景视角');
        }
      });

      const triggerOverview = () => {
        if (state.cameraMode === 'overview' && state.spotlightOn) {
          applyTheatricalCamera('actor', state.activeAllyId);
          setToast('已恢复剧场行动焦点推镜');
        } else {
          applyTheatricalCamera('overview');
          setToast('已复位【全景视角】 · 全员亮度恢复 100%');
        }
      };

      els.btnOverview.addEventListener('click', triggerOverview);
      els.tlBtnOverview.addEventListener('click', triggerOverview);
      els.edcCamOverview.addEventListener('click', () => {
        applyTheatricalCamera('overview');
        setToast('已复位【全景视角】');
      });

      els.edcCamClash.addEventListener('click', () => {
        state.spotlightOn = true;
        applyTheatricalCamera('clash', state.selectedEnemyId);
        setToast('3D 摄影机已推向交锋中心');
      });

      els.btnDof.addEventListener('click', () => {
        state.tiltShiftOn = !state.tiltShiftOn;
        state.engine && state.engine.setTiltShift(state.tiltShiftOn);
        syncTopBarActive();
        setToast(state.tiltShiftOn ? '已开启 HD-2D 移轴景深散景' : '已关闭移轴景深（全幅锐利）');
      });

      els.btnRuler.addEventListener('click', () => {
        state.rulerOn = !state.rulerOn;
        syncTopBarActive();
        if (state.rulerOn) {
          renderRulerOverlay(state.projections);
          setToast('已开启【身高标尺】 · 实时标注可见像素高与 16% 黄金交锋带');
        } else {
          setToast('已隐藏身高标尺叠加层');
        }
      });

      // 右下角敌方详卡切目标
      els.edcPrev.addEventListener('click', () => cycleEnemy(-1));
      els.edcNext.addEventListener('click', () => cycleEnemy(1));

      // 棱镜枢纽与 4 行主指令
      els.hubToggle.addEventListener('click', togglePrismCollapse);
      els.pwMagic.addEventListener('click', () => setPrismMode('skills'));
      els.pwAmp.addEventListener('click', () => stepAmp(1));
      els.pwAmp.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        stepAmp(-1);
      });
      els.subAmpMini.addEventListener('click', () => stepAmp(1));
      els.subAmpMini.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        stepAmp(-1);
      });
      els.pwItems.addEventListener('click', () => setPrismMode('items'));
      els.pwEndTurn.addEventListener('click', handleEndTurn);
      els.subBack.addEventListener('click', () => setPrismMode('root'));

      // 键盘快捷键
      window.addEventListener('keydown', (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
        if (tag === 'input' || tag === 'textarea' || tag === 'select') return;

        const key = e.key.toLowerCase();
        if (key === 'w') {
          e.preventDefault();
          setPrismMode(state.menuMode === 'skills' ? 'root' : 'skills');
        } else if (key === 'e') {
          e.preventDefault();
          stepAmp(e.shiftKey ? -1 : 1);
        } else if (key === 'a') {
          e.preventDefault();
          setPrismMode(state.menuMode === 'items' ? 'root' : 'items');
        } else if (key === 'd' || key === 'x') {
          e.preventDefault();
          handleEndTurn();
        } else if (key === 'h') {
          e.preventDefault();
          togglePrismCollapse();
        } else if (key === 'v') {
          e.preventDefault();
          triggerOverview();
        } else if (key === 'q') {
          e.preventDefault();
          cycleAlly(1);
        } else if (key === 'tab') {
          e.preventDefault();
          cycleEnemy(e.shiftKey ? -1 : 1);
        } else if (key === 'escape') {
          e.preventDefault();
          if (state.menuMode !== 'root') {
            setPrismMode('root');
          } else {
            applyTheatricalCamera('overview');
          }
        } else if (key >= '1' && key <= '4') {
          const idx = Number(key) - 1;
          const skills = (Array.isArray(DEMO_SKILLS) ? DEMO_SKILLS : [])
            .slice()
            .sort((a, b) => Number(Boolean(a.isGuard)) - Number(Boolean(b.isGuard)));
          if (skills[idx]) {
            e.preventDefault();
            triggerCastSkill(skills[idx]);
          }
        }
      });
    }

    /* =========================================================================
       启动入口
       ========================================================================= */
    function boot() {
      initPorcelainTooltip();
      buildTopControls();
      bindInteractions();
      updateAmpUI();
      setPrismMode('root');

      state.engine = mountHD2DDemoEngine({
        canvas: els.canvas,
        initialBiome: 'academy',
        initialFormation: '6v6',
        cameraConfig: CAMERA_CONFIG,
        formationLayoutFn,
        onActorsUpdated: handleActorsUpdated,
        onFrame: handleFrame,
        onActorClick(arg1, arg2) {
          const isObj = arg1 && typeof arg1 === 'object';
          const actor = isObj ? (arg1.actor || arg1) : arg2;
          const actorId = isObj ? (arg1.actorId || arg1.id) : arg1;
          if (!actor || !actorId) return;
          if (actor.side === 'ally') {
            selectAlly(actorId, true, true);
          } else {
            selectEnemy(actorId, true, true);
          }
        },
        onImpact: spawnImpactPopup,
      });

      // 确保初始状态与引擎同步（默认 6v6 + 移轴景深开 + 剧场聚焦开）
      if (state.engine) {
        state.engine.setTiltShift(state.tiltShiftOn);
        const snap = typeof state.engine.getState === 'function' ? state.engine.getState() : null;
        if (snap && Array.isArray(snap.actors) && snap.actors.length && !state.actors.length) {
          handleActorsUpdated(snap.actors, snap.activeAllyId, snap.selectedEnemyId);
        }
        applyTheatricalCamera('actor', state.activeAllyId);
      }

      window.addEventListener('beforeunload', () => {
        if (state.engine && typeof state.engine.dispose === 'function') {
          state.engine.dispose();
        }
      });
    }

    boot();
  </script>
