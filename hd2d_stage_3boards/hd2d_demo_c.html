<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>方案 C · 百英雄传 2.5D 剧场聚焦派 — 转生千金 HD-2D 战斗竞标</title>
  <link rel="icon" href="data:,">
  <style>
    /* =====================================================================
       方案 C · 百英雄传 2.5D 剧场聚焦派 (Eiyuden 2.5D Theatrical Focus)
       视觉基准：雪瓷冰白 × 皇家蓝 #1658EB × 冰青 #7DD3FC × 香槟金 #C4A46C
       硬红线：零 border-radius · 零圆框套圆框 · 零原生 title · 45° 切角棱镜
       ===================================================================== */
    :root {
      --pr-alabaster: rgba(246, 249, 254, 0.93);
      --pr-alabaster-hi: rgba(252, 254, 255, 0.96);
      --pr-alabaster-soft: rgba(242, 247, 254, 0.93);
      --pr-ink: #1A2436;
      --pr-ink-mid: #3A4B66;
      --pr-ink-muted: #5F728F;
      --pr-sapphire-hi: #2E77F8;
      --pr-sapphire: #1658EB;
      --pr-sapphire-deep: #0E2B78;
      --pr-sapphire-abyss: #081A54;
      --pr-cyan: #7DD3FC;
      --pr-cyan-gleam: #D9F3FF;
      --pr-gold: #C4A46C;
      --pr-gold-deep: #8C6928;
      --pr-gold-pale: #EFE0BE;
      --pr-crimson: #D13456;
      --pr-crimson-deep: #9E1B3A;
      --pr-crimson-soft: #FFE4EA;
      --pr-emerald: #0E7C5B;
      --pr-emerald-hi: #10966F;
      --pr-emerald-mint: #5EEAD4;
      --pr-line-soft: rgba(96, 128, 180, 0.24);
      --pr-line-mid: rgba(22, 88, 235, 0.36);
      --pr-sapphire-prism: linear-gradient(180deg, #2E77F8 0%, #1658EB 49.4%, #0E2B78 50.6%, #081A54 100%);
      --pr-gold-prism: linear-gradient(180deg, #F6E9C8 0%, #C4A46C 52%, #8C6928 100%);
      --pr-crimson-prism: linear-gradient(180deg, #EC4C6E 0%, #D13456 50%, #9E1B3A 100%);
      --pr-emerald-prism: linear-gradient(180deg, #5EEAD4 0%, #0E7C5B 54%, #065F46 100%);
      --pr-glass-plate: linear-gradient(154deg, rgba(255, 255, 255, 0.95) 0%, rgba(246, 249, 254, 0.93) 56%, rgba(235, 244, 254, 0.93) 100%);
      --pr-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --pr-serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', Georgia, serif;
      --pr-sans: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
      --pr-mono: ui-monospace, 'Cascadia Mono', 'SFMono-Regular', Consolas, monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      border-radius: 0 !important;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #DFECFA;
      color: var(--pr-ink);
      font-family: var(--pr-sans);
      font-size: 13px;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }

    button, a {
      font-family: inherit;
      color: inherit;
      text-decoration: none;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--pr-sapphire);
      outline-offset: -2px;
    }

    /* ==================== 1. 全屏 3D HD-2D 舞台 ==================== */
    #stage-root {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #CEE4FA 0%, #E8F2FC 55%, #DCEAF8 100%);
    }

    #hd2d-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: default;
    }

    /* 剧场聚焦柔和取景角线（纯透雪瓷蓝金细线，非黑遮罩） */
    .theater-frame-ticks {
      position: fixed;
      inset: 44px 12px 12px 12px;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.32s var(--pr-ease);
    }

    body.focus-spotlight-active .theater-frame-ticks {
      opacity: 1;
    }

    .theater-tick {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(22, 88, 235, 0.36);
      border-style: solid;
      border-width: 0;
    }

    .theater-tick.tl { top: 0; left: 0; border-top-width: 1.5px; border-left-width: 1.5px; }
    .theater-tick.tr { top: 0; right: 0; border-top-width: 1.5px; border-right-width: 1.5px; border-color: rgba(196, 164, 108, 0.56); }
    .theater-tick.bl { bottom: 0; left: 0; border-bottom-width: 1.5px; border-left-width: 1.5px; border-color: rgba(196, 164, 108, 0.52); }
    .theater-tick.br { bottom: 0; right: 0; border-bottom-width: 1.5px; border-right-width: 1.5px; }

    /* ==================== 2. 顶部极薄操控条 (<= 40px) ==================== */
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 38px;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px;
      background: linear-gradient(180deg, rgba(252, 254, 255, 0.95) 0%, rgba(246, 249, 254, 0.93) 100%);
      border-bottom: 1px solid rgba(22, 88, 235, 0.24);
      box-shadow: 0 2px 14px rgba(14, 43, 120, 0.09);
      white-space: nowrap;
    }

    #top-bar::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, rgba(125, 211, 252, 0.8), rgba(22, 88, 235, 0.65) 35%, rgba(196, 164, 108, 0.78) 68%, rgba(125, 211, 252, 0.7));
      pointer-events: none;
    }

    .tb-group {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }

    .tb-sep {
      width: 1px;
      height: 18px;
      background: linear-gradient(180deg, transparent, rgba(22, 88, 235, 0.28), transparent);
      margin: 0 3px;
      flex-shrink: 0;
    }

    .tb-hub-link {
      height: 26px;
      padding: 0 10px 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      background: rgba(22, 88, 235, 0.08);
      clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
      transition: none;
    }

    .tb-hub-link:hover {
      background: var(--pr-sapphire);
      color: #FFFFFF;
    }

    /* 方案直切 A / B / C（无嵌套外框，纯斜切色块与 1px 竖隔） */
    .tb-plans {
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }

    .tb-plan-btn {
      height: 26px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--pr-ink-mid);
      background: rgba(255, 255, 255, 0.56);
      clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
      transition: none;
    }

    .tb-plan-btn:hover {
      background: rgba(22, 88, 235, 0.12);
      color: var(--pr-sapphire);
    }

    .tb-plan-btn.is-active {
      background: var(--pr-sapphire-prism);
      color: #FFFFFF;
      padding: 0 11px;
      text-shadow: 0 1px 2px rgba(8, 26, 84, 0.45);
    }

    .tb-plan-btn.is-active .tb-plan-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--pr-gold-pale);
      transform: rotate(45deg);
    }

    /* 阵容 & 场景 & 开关轻量斜切页签（零过渡瞬间响应，杜绝切换残影） */
    .tb-label {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--pr-ink-muted);
      letter-spacing: 0.04em;
      margin-right: 1px;
    }

    .tb-tab {
      height: 25px;
      padding: 0 7px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--pr-ink-mid);
      background: transparent;
      border-bottom: 2px solid transparent;
      clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
      transition: none;
    }

    .tb-tab:hover:not(.is-active) {
      color: var(--pr-sapphire);
      background: rgba(22, 88, 235, 0.09);
    }

    .tb-tab.is-active,
    .tb-tab.is-active:hover {
      color: #FFFFFF;
      font-weight: 700;
      background: var(--pr-sapphire);
      border-bottom-color: var(--pr-sapphire-deep);
    }

    .tb-toggle {
      height: 25px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--pr-ink-mid);
      background: rgba(26, 36, 54, 0.05);
      clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
      transition: none;
    }

    .tb-toggle:hover {
      background: rgba(22, 88, 235, 0.13);
      color: var(--pr-sapphire-deep);
    }

    .tb-toggle .tb-led {
      width: 6px;
      height: 6px;
      transform: rotate(45deg);
      background: rgba(95, 114, 143, 0.42);
      transition: none;
    }

    .tb-toggle.is-on {
      background: rgba(22, 88, 235, 0.14);
      color: var(--pr-sapphire-deep);
      font-weight: 700;
    }

    .tb-toggle.is-on .tb-led {
      background: var(--pr-sapphire);
      box-shadow: 0 0 6px rgba(46, 119, 248, 0.65);
    }

    .tb-toggle.is-gold.is-on {
      background: rgba(196, 164, 108, 0.22);
      color: var(--pr-gold-deep);
    }

    .tb-toggle.is-gold.is-on .tb-led {
      background: var(--pr-gold);
      box-shadow: 0 0 6px rgba(196, 164, 108, 0.72);
    }

    /* 实时性能与占屏高读数（纯无框等宽数字） */
    .tb-metrics {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-left: 4px;
      font-family: var(--pr-mono);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--pr-ink-mid);
    }

    .tb-metric-item b {
      color: var(--pr-sapphire-deep);
      font-weight: 700;
    }

    /* ==================== 3. 顶中极细雪瓷行动序轨 (Timeline Strip) ==================== */
    #timeline-dock {
      position: fixed;
      top: 46px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 18px 6px 16px;
      background: linear-gradient(90deg,
        rgba(248, 251, 255, 0) 0%,
        rgba(248, 251, 255, 0.86) 10%,
        rgba(255, 255, 255, 0.90) 50%,
        rgba(248, 251, 255, 0.86) 90%,
        rgba(248, 251, 255, 0) 100%);
      pointer-events: auto;
    }

    .tl-head-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding-right: 6px;
      border-right: 1px solid var(--pr-line-soft);
    }

    .tl-round-badge {
      font-family: var(--pr-serif);
      font-size: 11px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      letter-spacing: 0.06em;
    }

    .tl-cam-chip {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--pr-gold-deep);
      background: rgba(239, 224, 190, 0.42);
      padding: 1px 7px;
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
    }

    .tl-rail-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 2px 6px;
    }

    /* 1px 蓝金细轨主轴线 */
    .tl-rail-wrap::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 14px;
      height: 1px;
      background: linear-gradient(90deg,
        rgba(125, 211, 252, 0.25) 0%,
        rgba(22, 88, 235, 0.72) 22%,
        rgba(196, 164, 108, 0.88) 54%,
        rgba(209, 52, 86, 0.62) 82%,
        rgba(196, 164, 108, 0.22) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .tl-node {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 30px;
      padding: 0 2px;
      transition: transform 0.18s var(--pr-ease);
    }

    .tl-node:hover {
      transform: translateY(-2px);
      z-index: 4;
    }

    .tl-diamond {
      position: relative;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(45deg);
      background: var(--pr-alabaster-hi);
      border: 1.5px solid var(--pr-sapphire);
      box-shadow: 0 2px 8px rgba(14, 43, 120, 0.16);
      transition: transform 0.2s var(--pr-ease), background 0.18s ease, border-color 0.18s ease, box-shadow 0.2s ease;
    }

    .tl-node.is-enemy .tl-diamond {
      border-color: var(--pr-crimson);
      background: #FFF7F9;
      box-shadow: 0 2px 8px rgba(158, 27, 58, 0.16);
    }

    .tl-node.is-boss .tl-diamond {
      width: 24px;
      height: 24px;
      border-color: var(--pr-gold-deep);
      background: linear-gradient(135deg, #FFF7E6, #FFE4EA);
    }

    .tl-glyph {
      transform: rotate(-45deg);
      font-size: 10.5px;
      font-weight: 800;
      color: var(--pr-sapphire-deep);
      line-height: 1;
    }

    .tl-node.is-enemy .tl-glyph {
      color: var(--pr-crimson-deep);
    }

    .tl-node.is-active .tl-diamond {
      transform: rotate(45deg) scale(1.22);
      background: var(--pr-sapphire-prism);
      border-color: var(--pr-gold-pale);
      box-shadow: 0 0 0 2px rgba(22, 88, 235, 0.34), 0 0 14px rgba(125, 211, 252, 0.85);
    }

    .tl-node.is-active .tl-glyph {
      color: #FFFFFF;
    }

    .tl-node.is-target .tl-diamond {
      transform: rotate(45deg) scale(1.18);
      background: var(--pr-crimson-prism);
      border-color: var(--pr-gold-pale);
      box-shadow: 0 0 0 2px rgba(209, 52, 86, 0.34), 0 0 12px rgba(236, 76, 110, 0.72);
    }

    .tl-node.is-target .tl-glyph {
      color: #FFFFFF;
    }

    .tl-tag {
      margin-top: 5px;
      font-size: 9.5px;
      font-weight: 700;
      color: var(--pr-ink-muted);
      letter-spacing: 0.02em;
      max-width: 56px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.78;
    }

    .tl-node.is-active .tl-tag {
      color: var(--pr-sapphire-deep);
      opacity: 1;
    }

    .tl-node.is-target .tl-tag {
      color: var(--pr-crimson-deep);
      opacity: 1;
    }

    .tl-overview-mini {
      height: 23px;
      padding: 0 10px;
      font-size: 10.5px;
      font-weight: 800;
      color: var(--pr-sapphire);
      background: rgba(250, 252, 255, 0.96);
      border-bottom: 1.5px solid var(--pr-sapphire);
      clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
      filter: drop-shadow(0 1px 4px rgba(14, 43, 120, 0.24));
      flex-shrink: 0;
      transition: none;
    }

    .tl-overview-mini:hover,
    .tl-overview-mini.is-overview {
      background: var(--pr-sapphire);
      border-bottom-color: var(--pr-sapphire-deep);
      color: #FFFFFF;
    }

    /* ==================== 4. 舞台层：分层克制脚底血条 + 3D 飘字 + 身高标尺 ==================== */
    #stage-hud-layer {
      position: fixed;
      inset: 0;
      z-index: 25;
      pointer-events: none;
      overflow: hidden;
    }

    /* 脚底状态容器（按帧 transform: translate3d 零抖动锚定） */
    .actor-foot-plate {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate3d(-9999px, -9999px, 0);
      will-change: transform;
      pointer-events: auto;
      cursor: pointer;
    }

    /* 4A. 非焦点敌怪：极细 6px 血线 + 护盾数字 */
    .enemy-slim-bar {
      display: flex;
      align-items: center;
      gap: 4px;
      transform: translate(-50%, 0);
      padding: 2px 3px;
      opacity: 0.90;
      transition: opacity 0.18s ease, transform 0.18s var(--pr-ease);
    }

    .enemy-slim-bar:hover {
      opacity: 1;
      transform: translate(-50%, -1px) scale(1.06);
    }

    .enemy-slim-track {
      width: 68px;
      height: 6px;
      background: rgba(26, 36, 54, 0.44);
      border-bottom: 1px solid rgba(255, 255, 255, 0.55);
      overflow: hidden;
      position: relative;
    }

    .enemy-slim-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #E11D48 0%, #FB7185 100%);
      transition: width 0.25s var(--pr-ease);
    }

    .enemy-slim-shield {
      font-family: var(--pr-mono);
      font-size: 10px;
      font-weight: 800;
      color: #0E2B78;
      background: rgba(248, 251, 255, 0.92);
      padding: 0 4px;
      line-height: 14px;
      border-left: 2px solid var(--pr-cyan);
      box-shadow: 0 1px 4px rgba(14, 43, 120, 0.18);
    }

    /* 4B. 焦点锁定敌怪：平滑展开单行雪瓷名牌 + 意图徽标 */
    .enemy-focus-plate {
      transform: translate(-50%, 0);
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 186px;
      padding: 5px 10px 5px 11px;
      background: var(--pr-glass-plate);
      border-left: 3px solid var(--pr-crimson);
      border-bottom: 1px solid rgba(196, 164, 108, 0.65);
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      box-shadow: 0 6px 20px rgba(14, 43, 120, 0.20);
      animation: focusPlateIn 0.22s var(--pr-ease) both;
    }

    @keyframes focusPlateIn {
      from { opacity: 0.4; transform: translate(-50%, 5px) scale(0.94); }
      to   { opacity: 1;   transform: translate(-50%, 0) scale(1); }
    }

    .efp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      white-space: nowrap;
    }

    .efp-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--pr-ink);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .efp-tier {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--pr-gold-deep);
      background: rgba(239, 224, 190, 0.56);
      padding: 0 4px;
    }

    .efp-intent {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      color: #FFFFFF;
      background: var(--pr-crimson);
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
    }

    .efp-intent.type-heavy {
      background: linear-gradient(90deg, #9E1B3A, #D97706);
    }

    .efp-intent.type-buff {
      background: var(--pr-sapphire);
    }

    .efp-bars {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .efp-hp-track {
      flex: 1;
      height: 6px;
      background: rgba(26, 36, 54, 0.14);
      overflow: hidden;
    }

    .efp-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #D13456 0%, #FB7185 100%);
      transition: width 0.25s var(--pr-ease);
    }

    .efp-nums {
      font-family: var(--pr-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--pr-ink-mid);
      font-variant-numeric: tabular-nums;
    }

    .efp-shield-chip {
      font-family: var(--pr-mono);
      font-size: 10px;
      font-weight: 800;
      color: var(--pr-sapphire-deep);
      background: rgba(125, 211, 252, 0.32);
      padding: 0 4px;
    }

    /* 4C. 友方脚底极简细线（重信息放左下小队条，舞台保持极净） */
    .ally-slim-bar {
      transform: translate(-50%, 0);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.85;
      transition: opacity 0.18s ease;
    }

    .ally-slim-bar.is-active {
      opacity: 1;
    }

    .ally-slim-name {
      font-size: 10px;
      font-weight: 800;
      color: var(--pr-sapphire-deep);
      background: rgba(255, 255, 255, 0.88);
      padding: 0 6px;
      border-left: 2px solid var(--pr-gold);
      box-shadow: 0 1px 6px rgba(14, 43, 120, 0.14);
      white-space: nowrap;
    }

    .ally-slim-track {
      width: 54px;
      height: 4px;
      background: rgba(14, 43, 120, 0.28);
      overflow: hidden;
    }

    .ally-slim-fill {
      height: 100%;
      background: linear-gradient(90deg, #1658EB 0%, #7DD3FC 100%);
      transition: width 0.25s var(--pr-ease);
    }

    .actor-foot-plate.is-hit-flash {
      filter: brightness(1.32);
    }

    /* ==================== 5. 左下角极简小队状态窄条 ==================== */
    #squad-dock {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 48;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 316px;
      pointer-events: auto;
    }

    .squad-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 0;
    }

    .squad-title {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--pr-sapphire-deep);
      background: rgba(246, 249, 254, 0.92);
      padding: 2px 8px 2px 7px;
      border-left: 2.5px solid var(--pr-sapphire);
      border-bottom: 1px solid rgba(22, 88, 235, 0.24);
      box-shadow: 0 2px 8px rgba(14, 43, 120, 0.14);
    }

    .squad-hint {
      font-size: 10px;
      font-weight: 600;
      color: var(--pr-ink-mid);
      background: rgba(246, 249, 254, 0.90);
      padding: 2px 6px;
      border-bottom: 1px solid rgba(96, 128, 180, 0.22);
    }

    .squad-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(136px, 152px));
      gap: 4px;
    }

    .squad-grid.is-single {
      grid-template-columns: minmax(196px, 224px);
    }

    .squad-row {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 5px 8px 5px 10px;
      text-align: left;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(246, 249, 254, 0.93) 100%);
      border-left: 3px solid rgba(22, 88, 235, 0.36);
      border-bottom: 1px solid var(--pr-line-soft);
      clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%);
      box-shadow: 0 3px 12px rgba(14, 43, 120, 0.11);
      transition: transform 0.16s var(--pr-ease), background 0.16s ease, border-color 0.16s ease;
    }

    .squad-row:hover {
      transform: translateX(2px);
      background: rgba(255, 255, 255, 0.96);
      border-left-color: var(--pr-sapphire);
    }

    .squad-row.is-active {
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.97) 0%, rgba(222, 238, 255, 0.95) 100%);
      border-left: 4px solid var(--pr-gold);
      box-shadow: 0 5px 16px rgba(22, 88, 235, 0.22);
    }

    .sq-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .sq-name {
      font-size: 11.5px;
      font-weight: 800;
      color: var(--pr-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .squad-row.is-active .sq-name {
      color: var(--pr-sapphire-deep);
    }

    .sq-role {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--pr-ink-muted);
      flex-shrink: 0;
    }

    .sq-bars {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sq-bar-line {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sq-track {
      flex: 1;
      height: 4px;
      background: rgba(26, 36, 54, 0.11);
      overflow: hidden;
    }

    .sq-fill-hp {
      height: 100%;
      background: linear-gradient(90deg, #1658EB, #38BDF8);
      transition: width 0.22s var(--pr-ease);
    }

    .sq-fill-mp {
      height: 100%;
      background: linear-gradient(90deg, #C4A46C, #7DD3FC);
      transition: width 0.22s var(--pr-ease);
    }

    .sq-val {
      font-family: var(--pr-mono);
      font-size: 9.5px;
      font-variant-numeric: tabular-nums;
      color: var(--pr-ink-mid);
      min-width: 30px;
      text-align: right;
    }

    /* ==================== 6. 右下角完整雪瓷锁定敌方详卡 ==================== */
    #enemy-detail-card {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 48;
      width: 288px;
      padding: 10px 13px 10px 14px;
      background: var(--pr-glass-plate);
      border-top: 2px solid var(--pr-crimson);
      border-left: 1px solid rgba(196, 164, 108, 0.52);
      clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
      box-shadow: 0 10px 28px rgba(14, 43, 120, 0.18);
      pointer-events: auto;
      transition: transform 0.2s var(--pr-ease);
    }

    #enemy-detail-card.is-boss {
      border-top-color: var(--pr-gold);
    }

    .edc-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--pr-line-soft);
    }

    .edc-id-block {
      min-width: 0;
    }

    .edc-kicker {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--pr-crimson);
      margin-bottom: 2px;
    }

    #enemy-detail-card.is-boss .edc-kicker {
      color: var(--pr-gold-deep);
    }

    .edc-tier-inline {
      color: var(--pr-ink-muted);
      font-weight: 600;
    }

    .edc-name {
      font-family: var(--pr-serif);
      font-size: 16px;
      font-weight: 800;
      color: var(--pr-ink);
      line-height: 1.2;
    }

    .edc-nav {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .edc-nav-btn {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--pr-sapphire-deep);
      background: rgba(22, 88, 235, 0.09);
      transition: background 0.14s ease, color 0.14s ease;
    }

    .edc-nav-btn:hover {
      background: var(--pr-sapphire);
      color: #FFFFFF;
    }

    .edc-stats {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edc-bar-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 10.5px;
      margin-bottom: 2px;
    }

    .edc-bar-label {
      font-weight: 700;
      color: var(--pr-ink-mid);
    }

    .edc-bar-num {
      font-family: var(--pr-mono);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--pr-ink);
    }

    .edc-track {
      height: 7px;
      background: rgba(26, 36, 54, 0.10);
      overflow: hidden;
    }

    .edc-hp-fill {
      height: 100%;
      background: linear-gradient(90deg, #9E1B3A 0%, #D13456 58%, #FB7185 100%);
      transition: width 0.25s var(--pr-ease);
    }

    .edc-shield-pips {
      display: flex;
      align-items: center;
      gap: 3px;
      min-height: 10px;
    }

    .edc-pip {
      flex: 1;
      max-width: 24px;
      height: 6px;
      background: rgba(26, 36, 54, 0.12);
      clip-path: polygon(3px 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
    }

    .edc-pip.is-filled {
      background: linear-gradient(90deg, #1658EB, #7DD3FC);
    }

    .edc-intent-strip {
      margin-top: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(209, 52, 86, 0.07);
      border-left: 2.5px solid var(--pr-crimson);
    }

    .edc-intent-strip.type-heavy {
      background: rgba(196, 164, 108, 0.16);
      border-left-color: var(--pr-gold-deep);
    }

    .edc-intent-strip.type-buff {
      background: rgba(22, 88, 235, 0.08);
      border-left-color: var(--pr-sapphire);
    }

    .edc-intent-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--pr-ink-muted);
    }

    .edc-intent-text {
      font-size: 12px;
      font-weight: 800;
      color: var(--pr-ink);
    }

    .edc-clash-footer {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--pr-line-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 10.5px;
      color: var(--pr-ink-muted);
    }

    .edc-cam-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .edc-cam-btn {
      height: 20px;
      padding: 0 7px;
      font-size: 10px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      background: rgba(22, 88, 235, 0.09);
      transition: none;
    }

    .edc-cam-btn:hover,
    .edc-cam-btn.is-active {
      background: var(--pr-sapphire);
      color: #FFFFFF;
    }

    /* ==================== 7. 行动者身旁 4 行棱镜主菜单 + 双菱形枢纽 ==================== */
    #cb-prism-rig {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 65;
      pointer-events: none;
      will-change: transform;
      transform: translate3d(380px, 420px, 0);
    }

    /* 蓝金双菱形枢纽节点 + 放射折射连线 */
    .cb-prism-svg {
      position: absolute;
      left: -46px;
      top: -138px;
      width: 118px;
      height: 276px;
      overflow: visible;
      pointer-events: none;
    }

    .rig-hub-group {
      transform-origin: 46px 138px;
      transition: transform 0.18s var(--pr-ease), filter 0.18s ease;
    }

    #cb-prism-rig:has(#cb-pw-hub-toggle:hover, #cb-pw-hub-toggle:focus-visible) .rig-hub-group {
      transform: scale(1.18);
      filter: drop-shadow(0 0 8px rgba(125, 211, 252, 0.85)) drop-shadow(0 0 14px rgba(22, 88, 235, 0.50));
    }

    @keyframes prHubCollapsedPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 5px rgba(125, 211, 252, 0.60));
      }
      50% {
        transform: scale(1.14);
        filter: drop-shadow(0 0 11px rgba(239, 224, 190, 0.95)) drop-shadow(0 0 16px rgba(46, 119, 248, 0.65));
      }
    }

    #cb-prism-rig.is-collapsed .rig-hub-group {
      animation: prHubCollapsedPulse 2.1s ease-in-out infinite;
    }

    #cb-prism-rig.is-collapsed .rig-spokes {
      opacity: 0;
    }

    .rig-spokes {
      transition: opacity 0.18s ease;
    }

    /* 一键收起/展开热区按钮（规范 ID：#cb-pw-hub-toggle） */
    #cb-pw-hub-toggle {
      position: absolute;
      left: 0;
      top: 0;
      width: 38px;
      height: 38px;
      transform: translate(-50%, -50%);
      background: transparent;
      border: none;
      pointer-events: auto;
      z-index: 15;
      cursor: pointer;
    }

    #cb-pw-hub-toggle:focus-visible {
      outline: none;
    }

    #cb-pw-hub-toggle:focus-visible::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%) rotate(45deg);
      border: 1.5px solid #7DD3FC;
      box-shadow: 0 0 10px rgba(22, 88, 235, 0.72);
    }

    /* 四行主翼 */
    .cb-prism-root {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;
      transition: opacity 0.18s var(--pr-ease), transform 0.2s var(--pr-ease);
    }

    #cb-prism-rig.is-collapsed .cb-prism-root,
    #cb-prism-rig.is-collapsed .cb-prism-cascade {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-14px) scale(0.92);
      pointer-events: none;
    }

    #cb-prism-rig.is-collapsed .cb-prism-root *,
    #cb-prism-rig.is-collapsed .cb-prism-cascade * {
      pointer-events: none !important;
    }

    #cb-prism-rig:not(.mode-root) .cb-prism-root {
      display: none;
    }

    .cb-pwing-wrap {
      position: absolute;
      pointer-events: none;
      filter: drop-shadow(0 8px 18px rgba(8, 22, 68, 0.30));
      transition: transform 0.16s var(--pr-ease), filter 0.16s ease;
    }

    .cb-pwing-wrap[data-wing="0"] { left: 18px; top: -94px; --rot: -2.8deg; transform: rotate(var(--rot)); }
    .cb-pwing-wrap[data-wing="1"] { left: 26px; top: -42px; --rot: -1.0deg; transform: rotate(var(--rot)); }
    .cb-pwing-wrap[data-wing="2"] { left: 24px; top: 10px;  --rot: 1.0deg;  transform: rotate(var(--rot)); }
    .cb-pwing-wrap[data-wing="3"] { left: 16px; top: 62px;  --rot: 2.8deg;  transform: rotate(var(--rot)); }

    .cb-pwing-wrap:hover {
      transform: rotate(var(--rot)) scale(1.02);
      filter: drop-shadow(0 12px 24px rgba(22, 88, 235, 0.44)) brightness(1.02);
      z-index: 6;
    }

    .cb-pwing {
      position: relative;
      isolation: isolate;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      width: 186px;
      height: 42px;
      padding: 0 13px 0 12px;
      color: var(--pr-ink);
      text-align: left;
    }

    .cb-pwing::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: var(--pr-glass-plate);
      clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 5px 50%);
    }

    .cb-pwing::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 9px;
      z-index: -1;
      background: var(--pr-sapphire-prism);
      clip-path: polygon(6px 0, 100% 0, 3px 50%, 100% 100%, 0 100%, 5px 50%);
    }

    .cb-pwing.is-amp-charged::after {
      background: var(--pr-gold-prism);
    }

    .cb-pwing:hover {
      color: #FFFFFF;
    }

    .cb-pwing:hover::before {
      background: var(--pr-sapphire-prism);
    }

    .cb-pwing:hover::after {
      background: var(--pr-gold-prism);
    }

    .cb-pw-key {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--pr-mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--pr-sapphire-deep);
      background: rgba(22, 88, 235, 0.12);
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
    }

    .cb-pwing:hover .cb-pw-key {
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    .cb-pw-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .cb-pw-name {
      font-family: var(--pr-serif);
      font-size: 13.5px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .cb-pw-sub {
      font-size: 10px;
      color: var(--pr-ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .cb-pwing:hover .cb-pw-sub {
      color: var(--pr-cyan-gleam);
    }

    .cb-pwing.is-amp-t3 .cb-pw-sub {
      color: var(--pr-gold-deep);
      font-weight: 700;
    }

    .cb-pwing.is-amp-t3:hover .cb-pw-sub {
      color: var(--pr-gold-pale);
    }

    .cb-pw-arrow {
      font-size: 11px;
      font-weight: 800;
      color: var(--pr-sapphire);
      opacity: 0.78;
    }

    .cb-pwing:hover .cb-pw-arrow {
      color: var(--pr-gold-pale);
      opacity: 1;
    }

    /* 技能 / 道具级联子翼 */
    .cb-prism-cascade {
      position: absolute;
      left: 22px;
      top: -118px;
      width: 248px;
      display: none;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    #cb-prism-rig.mode-skills .cb-prism-cascade,
    #cb-prism-rig.mode-items .cb-prism-cascade {
      display: flex;
      animation: cascadeIn 0.16s var(--pr-ease) both;
    }

    @keyframes cascadeIn {
      from { opacity: 0.4; transform: translateX(-8px); }
      to   { opacity: 1;   transform: translateX(0); }
    }

    .cb-sub-header {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 10px;
      background: linear-gradient(90deg, rgba(14, 43, 120, 0.92) 0%, rgba(22, 88, 235, 0.88) 100%);
      color: #FFFFFF;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      box-shadow: 0 4px 14px rgba(8, 26, 84, 0.28);
    }

    .cb-sub-title {
      font-family: var(--pr-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .cb-sub-actions {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .cb-sub-amp-btn {
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
      color: var(--pr-gold-pale);
      background: rgba(255, 255, 255, 0.14);
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
      transition: background 0.14s ease;
    }

    .cb-sub-amp-btn:hover {
      background: rgba(239, 224, 190, 0.30);
    }

    .cb-sub-back {
      padding: 1px 7px;
      font-size: 10px;
      font-weight: 700;
      color: #D9F3FF;
      background: rgba(255, 255, 255, 0.12);
    }

    .cb-sub-back:hover {
      background: rgba(255, 255, 255, 0.28);
      color: #FFFFFF;
    }

    .cb-blade-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* 技能单叶（攻伐皇家蓝 / 守御翡翠绿左侧晶条） */
    .cb-blade {
      position: relative;
      isolation: isolate;
      pointer-events: auto;
      width: 244px;
      min-height: 44px;
      padding: 5px 15px 5px 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--pr-ink);
      text-align: left;
      filter: drop-shadow(0 6px 14px rgba(8, 22, 68, 0.24));
      transition: transform 0.14s var(--pr-ease), filter 0.14s ease;
    }

    .cb-blade::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -2;
      background: var(--pr-glass-plate);
      clip-path: polygon(11px 0, calc(100% - 11px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 5px 50%);
    }

    .cb-blade::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 9px;
      z-index: -1;
      background: var(--pr-sapphire-prism);
      clip-path: polygon(6px 0, 100% 0, 3px 50%, 100% 100%, 0 100%, 5px 50%);
    }

    .cb-blade:hover:not(:disabled) {
      transform: translateX(3px);
      color: #FFFFFF;
      filter: drop-shadow(0 10px 22px rgba(22, 88, 235, 0.42));
    }

    .cb-blade:hover:not(:disabled)::before {
      background: var(--pr-sapphire-prism);
    }

    .cb-blade:hover:not(:disabled)::after {
      background: var(--pr-gold-prism);
    }

    /* 翡翠绿守御条（is-guard） */
    .cb-blade.is-guard::before {
      background: linear-gradient(112deg, rgba(249, 254, 252, 0.96) 0%, rgba(232, 249, 243, 0.94) 100%);
    }

    .cb-blade.is-guard::after {
      background: var(--pr-emerald-prism);
    }

    .cb-blade.is-guard .cb-bl-key {
      background: rgba(14, 124, 91, 0.14);
      color: var(--pr-emerald);
    }

    .cb-blade.is-guard .cb-bl-tag {
      color: var(--pr-emerald);
    }

    .cb-blade.is-guard:hover:not(:disabled)::before {
      background: linear-gradient(108deg, #064E3B 0%, #0E7C5B 54%, #10966F 100%);
    }

    .cb-blade.is-guard:hover:not(:disabled)::after {
      background: linear-gradient(180deg, #CCFBF1 0%, #5EEAD4 56%, #EFE0BE 100%);
    }

    .cb-blade.is-guard:hover:not(:disabled) .cb-bl-key {
      background: rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    .cb-blade.is-guard:hover:not(:disabled) .cb-bl-tag,
    .cb-blade.is-guard:hover:not(:disabled) .cb-bl-meta,
    .cb-blade.is-guard:hover:not(:disabled) .cb-bl-cost {
      color: #D1FAE5;
    }

    .cb-blade.is-placeholder {
      cursor: default;
      opacity: 0.88;
    }

    .cb-bl-key {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-weight: 800;
      color: var(--pr-sapphire-deep);
      background: rgba(22, 88, 235, 0.12);
    }

      background: rgba(255, 255, 255, 0.24);
      color: #FFFFFF;
    }

    .cb-bl-main {
      flex: 1;
      min-width: 0;
    }

      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
    }

    .cb-bl-name {
      font-size: 12.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cb-bl-cost {

      font-size: 10.5px;
      font-weight: 700;
      color: var(--pr-sapphire);
      flex-shrink: 0;
    }

    .cb-blade:hover:not(:disabled) .cb-bl-cost {
      color: var(--pr-gold-pale);
    }

    .cb-bl-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 1px;
      font-size: 10px;
    }

    .cb-bl-tag {
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      flex-shrink: 0;
    }

    .cb-blade:hover:not(:disabled) .cb-bl-tag {
      color: var(--pr-cyan-gleam);
    }

    .cb-bl-meta {
      color: var(--pr-ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cb-blade:hover:not(:disabled) .cb-bl-meta {
      color: rgba(255, 255, 255, 0.88);
    }

    /* ==================== 8. 3D 命中伤害/护盾飘字 ==================== */
    #impact-layer {
      position: fixed;
      inset: 0;
      z-index: 75;
      pointer-events: none;
      overflow: hidden;
    }

    .impact-pop {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      animation: impactFloat 0.95s var(--pr-ease) forwards;
    }

    @keyframes impactFloat {
      0%   { opacity: 0; transform: translate(-50%, -25%) scale(0.76); }
      16%  { opacity: 1; transform: translate(-50%, -55%) scale(1.12); }
      34%  { opacity: 1; transform: translate(-50%, -68%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -132%) scale(0.96); }
    }

    .impact-kicker {
      font-family: var(--pr-mono);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.14em;
      padding: 0 6px;
      background: var(--pr-gold-prism);
      color: #FFFFFF;
      clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
      margin-bottom: 1px;
    }

    .impact-val {
      font-family: var(--pr-serif);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      text-shadow:
        -1.5px -1.5px 0 #0E2B78,
         1.5px -1.5px 0 #0E2B78,
        -1.5px  1.5px 0 #0E2B78,
         1.5px  1.5px 0 #0E2B78,
         0 4px 14px rgba(22, 88, 235, 0.56);
    }

    .impact-pop.is-crit .impact-val {
      font-size: 34px;
      color: #FFF4CE;
      text-shadow:
        -1.5px -1.5px 0 #8C6928,
         1.5px -1.5px 0 #8C6928,
        -1.5px  1.5px 0 #8C6928,
         1.5px  1.5px 0 #8C6928,
         0 5px 18px rgba(196, 164, 108, 0.72);
    }

    .impact-pop.is-shield .impact-val {
      font-size: 24px;
      color: #CCFBF1;
      text-shadow:
        -1.5px -1.5px 0 #065F46,
         1.5px -1.5px 0 #065F46,
        -1.5px  1.5px 0 #065F46,
         1.5px  1.5px 0 #065F46,
         0 4px 14px rgba(14, 124, 91, 0.62);
    }

    /* ==================== 9. 底部极简剧场战报单行条 ==================== */
    #theater-toast {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 46;
      max-width: min(500px, calc(100vw - 640px));
      min-width: 240px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, rgba(252, 254, 255, 0.95), rgba(246, 249, 254, 0.93));
      border-top: 1px solid rgba(22, 88, 235, 0.32);
      border-bottom: 1px solid rgba(196, 164, 108, 0.56);
      clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0 50%);
      box-shadow: 0 4px 16px rgba(14, 43, 120, 0.12);
      pointer-events: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-gem {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      transform: rotate(45deg);
      background: var(--pr-sapphire);
    }

    .toast-text {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--pr-ink);
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==================== 10. 身高标尺叠加层 (实测可见像素高 & 16% 交锋带) ==================== */
    #ruler-overlay {
      position: fixed;
      inset: 0;
      z-index: 55;
      pointer-events: none;
      display: none;
    }

    #ruler-overlay.is-visible {
      display: block;
    }

    /* 16% 黄金交锋带参考区（42% ~ 58% 屏宽） */
    .ruler-corridor-band {
      position: absolute;
      top: 38px;
      bottom: 0;
      left: 42%;
      width: 16%;
      background: linear-gradient(180deg, rgba(22, 88, 235, 0.05) 0%, rgba(196, 164, 108, 0.09) 55%, rgba(22, 88, 235, 0.04) 100%);
      border-left: 1px dashed rgba(22, 88, 235, 0.45);
      border-right: 1px dashed rgba(209, 52, 86, 0.45);
    }

    .ruler-corridor-tag {
      position: fixed;
      top: 112px;
      left: 50%;
      transform: translateX(-50%);
      padding: 2px 8px;
      font-family: var(--pr-mono);
      font-size: 10px;
      font-weight: 700;
      color: var(--pr-sapphire-deep);
      background: rgba(246, 249, 254, 0.93);
      border-bottom: 1.5px solid var(--pr-gold);
      white-space: nowrap;
    }

    .ruler-summary-bar {
      position: fixed;
      right: 14px;
      top: 46px;
      padding: 5px 10px;
      font-family: var(--pr-mono);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--pr-ink);
      background: rgba(255, 255, 255, 0.93);
      border-left: 3px solid var(--pr-sapphire);
      box-shadow: 0 4px 14px rgba(14, 43, 120, 0.14);
    }

    #ruler-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ==================== 11. 全站自定义雪瓷 Tooltip (禁原生 title) ==================== */
    #porcelain-tip {
      position: fixed;
      left: -9999px;
      top: -9999px;
      z-index: 200;
      max-width: 280px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--pr-ink);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.97), rgba(236, 245, 255, 0.95));
      border-left: 2.5px solid var(--pr-sapphire);
      border-bottom: 1px solid rgba(196, 164, 108, 0.65);
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
      box-shadow: 0 8px 22px rgba(14, 43, 120, 0.22);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    #porcelain-tip.is-show {
      opacity: 1;
    }

    /* 1280px 桌面紧凑微调 */
    @media (max-width: 1360px) {
      #top-bar { padding: 0 8px; gap: 5px; }
      .tb-tab { padding: 0 5px; font-size: 11px; }

      .squad-grid { grid-template-columns: repeat(2, minmax(126px, 140px)); }
      .cb-pwing-wrap[data-wing="0"] { left: 16px; top: -90px; }
      .cb-pwing-wrap[data-wing="1"] { left: 22px; top: -40px; }
      .cb-pwing-wrap[data-wing="2"] { left: 20px; top: 10px; }
      .cb-pwing-wrap[data-wing="3"] { left: 14px; top: 60px; }
      .cb-pwing { width: 176px; height: 40px; padding: 0 12px 0 11px; }
      .cb-prism-cascade { left: 18px; width: 232px; }
      .cb-blade { width: 228px; }
    }
  </style>
