<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>核心 4 角色定向重抽（爱丽丝少女轻提裙 / 伪装同人变装 / 爱丽丝幼年 / 夏洛特三人组）</title>
<style>
/* ==========================================================================
   《转生千金》立绘 5 选 1 交互审图工坊 · 棱镜冰晶雪瓷视觉体系
   - 基底：雪瓷冰白 #f6f9fe / #ffffff + 皇家蓝 #1658eb + 冰青 #7dd3fc + 香槟金 #c4a46c
   - 铁律：严禁暗黑控制台、严禁圆框套圆框（全局直角/斜切棱镜 + 1px 分隔线 + 无边框淡色块）
   - 零外链 CDN，100% 离线/GitHub Pages 自包含
   ========================================================================== */
:root {
  --bg-canvas: #f6f9fe;
  --bg-surface: #ffffff;
  --bg-frost: rgba(255, 255, 255, 0.94);
  --bg-tint: #f2f7fd;
  --bg-tint-strong: #e8f1fc;
  --bg-gold-tint: #fbf7ee;
  --bg-gold-soft: #f6efe0;
  --bg-crimson-tint: #fdf1f4;
  --bg-emerald-tint: #ecf9f4;

  --ink: #1a2436;
  --ink-mid: #3a4b66;
  --ink-muted: #5f728f;
  --ink-faint: #8a9bb5;

  --sapphire-hi: #2e77f8;
  --sapphire: #1658eb;
  --sapphire-mid: #103fa8;
  --sapphire-deep: #0e2b78;
  --sapphire-prism: linear-gradient(135deg, #2e77f8 0%, #1658eb 49.5%, #0e2b78 50.5%, #081a54 100%);

  --cyan: #7dd3fc;
  --cyan-deep: #0284c7;
  --cyan-tint: #eaf7ff;

  --gold: #c4a46c;
  --gold-deep: #8c6928;
  --gold-pale: #efe0be;

  --crimson: #d13456;
  --crimson-deep: #9e1b3a;
  --amber: #b4690e;
  --emerald: #0e8a64;

  --line-soft: rgba(96, 128, 180, 0.22);
  --line-mid: rgba(22, 88, 235, 0.34);
  --line-gold: rgba(196, 164, 108, 0.42);
  --prism-hairline: linear-gradient(90deg, #7dd3fc 0%, #1658eb 28%, #ffffff 50%, #c4a46c 74%, #2e77f8 100%);

  --font-serif: "Songti SC", "Source Han Serif SC", "Noto Serif SC", "STSong", "SimSun", Georgia, serif;
  --font-sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;

  --topbar-h: 92px;
  --dock-h: 58px;
}

*, *::before, *::after {
  box-sizing: border-box;
  border-radius: 0;
}

html {
  scroll-behavior: smooth;
  background: var(--bg-canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse 85% 42% at 50% -8%, #ffffff 0%, #f6f9fe 55%, #edf3fc 100%);
  color: var(--ink);
  user-select: none;
  padding-bottom: calc(var(--dock-h) + 34px);
}

input, textarea {
  user-select: text;
  font-family: inherit;
}

img {
  -webkit-user-drag: none;
  user-select: none;
}

button {
  font-family: inherit;
  cursor: pointer;
  color: inherit;
  background: transparent;
  border: none;
  padding: 0;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible {
  outline: 2px solid var(--sapphire);
  outline-offset: -2px;
}

/* 极细桌面风滚动条 */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #edf3fc;
}
::-webkit-scrollbar-thumb {
  background: rgba(22, 88, 235, 0.28);
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(22, 88, 235, 0.52);
}

/* ==================== 顶部悬浮指挥条 ==================== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg-frost);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
  box-shadow: 0 4px 18px rgba(16, 45, 110, 0.055);
}

.topbar::before {
  content: "";
  display: block;
  height: 2px;
  width: 100%;
  background: var(--prism-hairline);
}

.topbar-inner {
  max-width: 1580px;
  margin: 0 auto;
  padding: 0 20px;
}

.topbar-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 52px;
  padding: 6px 0;
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}

.brand-crest {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.brand-titles {
  min-width: 0;
}

.batch-title {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.batch-sub {
  font-size: 11.5px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

/* 选品进度块（无内嵌框，仅排版与底边线） */
.progress-box {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  padding-right: 12px;
  border-right: 1px solid var(--line-soft);
}

.progress-text {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mid);
  white-space: nowrap;
}

.progress-text strong {
  color: var(--sapphire);
  font-size: 13px;
}

.progress-box.is-done .progress-text strong {
  color: var(--emerald);
}

.progress-track {
  width: 84px;
  height: 3px;
  background: #e1eaf7;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--sapphire-hi), var(--sapphire), var(--gold));
  transition: width 0.25s ease;
}

.progress-box.is-done .progress-fill {
  background: var(--emerald);
}

/* 分段工具组：外层 1px 细边，内部纯 1px 竖分隔线，严禁内嵌圆框 */
.seg-group {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--line-soft);
  background: var(--bg-surface);
}

.seg-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 11px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-mid);
  white-space: nowrap;
  border-right: 1px solid var(--line-soft);
  transition: background-color 0.15s ease, color 0.15s ease;
}

.seg-btn:last-child {
  border-right: none;
}

.seg-btn:hover {
  background: var(--bg-tint);
  color: var(--sapphire);
}

.seg-btn.active {
  background: var(--sapphire);
  color: #ffffff;
}

.seg-btn .kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  opacity: 0.65;
  padding-left: 1px;
}

.seg-btn.active .kbd {
  opacity: 0.85;
}

.seg-indicator {
  width: 6px;
  height: 6px;
  background: #c2d1e6;
  flex-shrink: 0;
}

.seg-btn.active .seg-indicator {
  background: var(--cyan);
}

/* 角色切换栏 + 轻量化轮次筛选条 */
.char-nav-bar {
  border-top: 1px solid var(--line-soft);
  background: #f8fbff;
}

.char-nav-row {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 12px;
}

.char-nav {
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  scrollbar-width: none;
  min-width: 0;
  flex: 1;
}

.char-nav::-webkit-scrollbar {
  display: none;
}

.round-filter {
  display: none;
  align-items: stretch;
  flex-shrink: 0;
  border-left: 1px solid var(--line-soft);
  background: var(--bg-surface);
}

.round-filter.has-rounds {
  display: inline-flex;
}

.round-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 38px;
  padding: 0 11px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-mid);
  border-right: 1px solid var(--line-soft);
  white-space: nowrap;
  transition: background-color 0.14s ease, color 0.14s ease;
}

.round-btn:last-child {
  border-right: none;
}

.round-btn:hover {
  background: var(--bg-tint);
  color: var(--sapphire);
}

.round-btn.active {
  background: var(--sapphire);
  color: #ffffff;
  font-weight: 700;
}

.round-dot {
  width: 6px;
  height: 6px;
  flex-shrink: 0;
  background: var(--sapphire);
}
.round-dot.r-v4 { background: var(--sapphire); }
.round-dot.r-v1 { background: var(--emerald); }
.round-dot.r-v2 { background: var(--gold); }
.round-dot.r-v3 { background: var(--cyan-deep); }
.round-btn.active .round-dot { background: #ffffff; }

.char-tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 16px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-mid);
  border-right: 1px solid var(--line-soft);
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.char-tab:hover {
  background: #eef5fe;
  color: var(--sapphire);
}

.char-tab.active {
  background: var(--bg-surface);
  color: var(--sapphire);
  font-weight: 700;
}

.char-tab.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--sapphire);
}

.tab-status {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  padding: 1px 6px;
  background: transparent;
  color: var(--ink-faint);
}

.tab-status.picked {
  background: var(--bg-tint-strong);
  color: var(--sapphire);
}

.tab-status.redraw {
  background: var(--bg-crimson-tint);
  color: var(--crimson);
}

/* ==================== 主体工作区 ==================== */
.main-wrap {
  max-width: 1580px;
  margin: 0 auto;
  padding: 16px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* 角色大区块 */
.char-section {
  background: var(--bg-surface);
  border: 1px solid var(--line-soft);
  border-top: 2px solid var(--sapphire);
  box-shadow: 0 6px 24px rgba(18, 52, 120, 0.045);
  animation: fadeSlideIn 0.2s ease;
}

.char-section.is-hidden {
  display: none;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.char-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 11px 16px;
  background: linear-gradient(90deg, #fafdff 0%, #ffffff 55%, #fcfaf4 100%);
  border-bottom: 1px solid var(--line-soft);
}

.char-meta {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 10px;
  min-width: 0;
}

.char-seq {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--sapphire);
  background: var(--bg-tint-strong);
  padding: 2px 7px;
  letter-spacing: 0.06em;
}

.char-name {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
  letter-spacing: 0.04em;
}

.char-id {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-muted);
}

.char-role-tag {
  font-size: 12px;
  color: var(--gold-deep);
  font-weight: 500;
}

.char-controls {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

/* 当前结论轻标签（无边框，左侧 3px 色条） */
.decision-readout {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
  font-weight: 600;
  background: var(--bg-tint);
  color: var(--ink-muted);
  border-left: 3px solid #b5c6df;
  white-space: nowrap;
}

.decision-readout.state-picked {
  background: var(--bg-tint-strong);
  color: var(--sapphire);
  border-left-color: var(--sapphire);
}

.decision-readout.state-redraw {
  background: var(--bg-crimson-tint);
  color: var(--crimson);
  border-left-color: var(--crimson);
}

.btn-redraw {
  height: 30px;
  padding: 0 11px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mid);
  background: #f8fafd;
  border-bottom: 2px solid transparent;
  transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  white-space: nowrap;
}

.btn-redraw:hover {
  background: var(--bg-crimson-tint);
  color: var(--crimson);
}

.btn-redraw.active {
  background: var(--crimson);
  color: #ffffff;
  border-bottom-color: var(--crimson-deep);
}

.note-input {
  width: 248px;
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
  color: var(--ink);
  background: #f5f9fe;
  border: none;
  border-bottom: 1px solid rgba(96, 128, 180, 0.36);
  transition: border-color 0.15s ease, background-color 0.15s ease, width 0.2s ease;
}

.note-input::placeholder {
  color: var(--ink-faint);
}

.note-input:focus {
  background: #ffffff;
  border-bottom-color: var(--sapphire);
  outline: none;
  width: 290px;
}

.focus-nav-btns {
  display: none;
  align-items: center;
  border-left: 1px solid var(--line-soft);
  padding-left: 10px;
  gap: 4px;
}

body.single-char-mode .focus-nav-btns {
  display: inline-flex;
}

.btn-mini-nav {
  height: 28px;
  padding: 0 8px;
  font-size: 11.5px;
  color: var(--ink-mid);
  background: var(--bg-tint);
}

.btn-mini-nav:hover:not(:disabled) {
  background: var(--bg-tint-strong);
  color: var(--sapphire);
}

.btn-mini-nav:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}

/* ==================== 立绘对照网格：6列同屏 / 5列多轮网格 vs 大卡片精审 ==================== */
.char-body {
  display: grid;
  grid-template-columns: repeat(var(--total-cols, 6), minmax(0, 1fr));
  gap: 1px;
  background: var(--line-soft);
}

.orig-slot,
.cands-wrap {
  display: contents;
}

/* 多轮（>5 候选，如 20 张/角）：左侧固定原图 + 右侧 5 列自动换行网格（每行 1 轮） */
.char-section.is-multi-grid .char-body {
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--bg-surface);
}

.char-section.is-multi-grid .orig-slot {
  display: block;
  flex: 0 0 236px;
  border-right: 1px solid var(--line-soft);
  background: #fcfaf5;
}

.char-section.is-multi-grid .orig-slot .portrait-card {
  position: sticky;
  top: calc(var(--topbar-h) + 8px);
}

.char-section.is-multi-grid .cands-wrap {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 1px;
  background: var(--line-soft);
}

/* 大卡片精审模式：左侧固定原图对照，右侧 2 列超大候选卡 */
body.view-large .char-body,
body.view-large .char-section.is-multi-grid .char-body {
  display: flex;
  align-items: stretch;
  gap: 0;
  background: var(--bg-surface);
}

body.view-large .orig-slot,
body.view-large .char-section.is-multi-grid .orig-slot {
  display: block;
  flex: 0 0 296px;
  border-right: 1px solid var(--line-soft);
  background: #fcfaf5;
}

body.view-large .orig-slot .portrait-card {
  position: sticky;
  top: calc(var(--topbar-h) + 8px);
}

body.view-large .cands-wrap,
body.view-large .char-section.is-multi-grid .cands-wrap {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--line-soft);
}

@media (max-width: 1200px) {
  body.view-large .orig-slot,
  body.view-large .char-section.is-multi-grid .orig-slot {
    flex: 0 0 250px;
  }
}

/* ==================== 单张立绘卡片 ==================== */
.portrait-card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  min-width: 0;
  transition: background-color 0.15s ease;
}

.portrait-card.is-filtered-out {
  display: none;
}

.portrait-card.is-original {
  background: #fdfbf7;
}

.portrait-card.is-selected {
  box-shadow: inset 0 0 0 2px var(--sapphire);
  z-index: 2;
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  height: 34px;
  padding: 0 10px;
  background: #f8fbff;
  border-bottom: 1px solid var(--line-soft);
}

.portrait-card[data-round="v4"] .card-head { border-left: 3px solid var(--sapphire); padding-left: 8px; }
.portrait-card[data-round="v1"] .card-head { border-left: 3px solid var(--emerald); padding-left: 8px; }
.portrait-card[data-round="v2"] .card-head { border-left: 3px solid var(--gold); padding-left: 8px; }
.portrait-card[data-round="v3"] .card-head { border-left: 3px solid var(--cyan-deep); padding-left: 8px; }

.portrait-card.is-original .card-head {
  background: var(--bg-gold-tint);
  border-bottom-color: var(--line-gold);
}

.portrait-card.is-selected .card-head {
  background: var(--sapphire-prism);
  color: #ffffff;
  border-bottom-color: var(--sapphire-deep);
}

.card-head-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.card-code {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.03em;
  color: var(--ink);
}

.portrait-card.is-original .card-code {
  font-family: var(--font-serif);
  font-size: 12.5px;
  color: var(--gold-deep);
}

.portrait-card.is-selected .card-code {
  color: #ffffff;
}

.card-tag {
  font-size: 11px;
  color: var(--ink-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.portrait-card.is-selected .card-tag {
  color: rgba(255, 255, 255, 0.86);
}

.card-head-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.selected-crown {
  display: none;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--gold-pale);
}

.portrait-card.is-selected .selected-crown {
  display: inline;
}

.orig-en-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--gold);
  font-weight: 700;
}

/* ==================== 立绘舞台与双专业叠层 ==================== */
.stage-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #edf3fa;
  overflow: hidden;
  cursor: zoom-in;
  container-type: inline-size;
}

.stage-wrap.is-transparent {
  background-image:
    linear-gradient(45deg, #e3ebf6 25%, transparent 25%),
    linear-gradient(-45deg, #e3ebf6 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e3ebf6 75%),
    linear-gradient(-45deg, transparent 75%, #e3ebf6 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-color: #f7faff;
}

.stage-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.stage-missing {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 16px;
  text-align: center;
  color: var(--ink-muted);
  background: repeating-linear-gradient(
    -45deg,
    #f6f9fe,
    #f6f9fe 8px,
    #eef4fc 8px,
    #eef4fc 16px
  );
}

.stage-hover-hint {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 6;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  color: #ffffff;
  background: rgba(14, 43, 120, 0.82);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.14s ease;
}

.stage-wrap:hover .stage-hover-hint {
  opacity: 1;
}

/* 叠层 1：安全区标尺（顶 5%、左右 8%、中轴 x=50%、上 72% 五官/手势核心区） */
.overlay-ruler {
  position: absolute;
  inset: 0;
  z-index: 4;
  pointer-events: none;
  display: none;
}

body.show-ruler .portrait-card .overlay-ruler,
.lightbox.lb-show-ruler .overlay-ruler {
  display: block;
}

.r-top5 {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 5%;
  background: rgba(2, 132, 199, 0.08);
  border-bottom: 1px dashed rgba(2, 132, 199, 0.92);
}

.r-left8 {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 8%;
  background: rgba(22, 88, 235, 0.06);
  border-right: 1px dashed rgba(2, 132, 199, 0.88);
}

.r-right8 {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 8%;
  background: rgba(22, 88, 235, 0.06);
  border-left: 1px dashed rgba(2, 132, 199, 0.88);
}

.r-center {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 0;
  border-left: 1px dotted rgba(196, 164, 108, 0.95);
}

.r-core72 {
  position: absolute;
  top: 72%;
  left: 0;
  right: 0;
  height: 0;
  border-top: 1px dashed rgba(180, 118, 24, 0.94);
}

.r-lbl {
  position: absolute;
  font-family: var(--font-mono);
  font-size: clamp(8px, 3.6cqw, 11px);
  line-height: 1.2;
  font-weight: 700;
  padding: 1px 4px;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.84);
  color: #0e3a8a;
  letter-spacing: 0.02em;
}

.r-lbl-top {
  left: 9%;
  top: calc(5% + 2px);
}

.r-lbl-left {
  left: 2px;
  top: 34%;
  writing-mode: vertical-rl;
  padding: 3px 1px;
}

.r-lbl-right {
  right: 2px;
  top: 34%;
  writing-mode: vertical-rl;
  padding: 3px 1px;
}

.r-lbl-center {
  left: 50%;
  top: 1%;
  transform: translateX(-50%);
  color: var(--gold-deep);
}

.r-lbl-core {
  right: 9%;
  top: calc(72% - 16px);
  color: #8c5a12;
  background: rgba(255, 251, 242, 0.88);
}

/* 叠层 2：模拟游戏对话框遮挡预览（最底 23%，雪瓷冰白 + 皇家蓝细棱 + 斜切蓝宝石名牌） */
.overlay-dialog {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 23%;
  z-index: 5;
  pointer-events: none;
  display: none;
  background: linear-gradient(180deg, rgba(248, 251, 255, 0.92) 0%, rgba(232, 242, 255, 0.95) 100%);
  border-top: 1.5px solid var(--sapphire);
  box-shadow: 0 -4px 16px rgba(14, 43, 120, 0.16);
}

.overlay-dialog::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--prism-hairline);
}

body.show-dialog .portrait-card .overlay-dialog,
.lightbox.lb-show-dialog .overlay-dialog {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: clamp(8px, 4.2cqw, 16px) clamp(8px, 4.5cqw, 18px) clamp(5px, 2.5cqw, 12px);
}

.dlg-speaker {
  position: absolute;
  top: clamp(-13px, -5.2cqw, -9px);
  left: 6%;
  background: var(--sapphire-prism);
  color: #ffffff;
  font-family: var(--font-serif);
  font-weight: 700;
  font-size: clamp(9px, 4.2cqw, 13.5px);
  letter-spacing: 0.1em;
  line-height: 1.25;
  padding: clamp(2px, 1cqw, 4px) clamp(10px, 5cqw, 20px) clamp(2px, 1cqw, 4px) clamp(8px, 4cqw, 15px);
  clip-path: polygon(7px 0%, 100% 0%, calc(100% - 7px) 100%, 0% 100%);
  box-shadow: 0 3px 10px rgba(13, 43, 132, 0.28);
  white-space: nowrap;
  max-width: 72%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dlg-line {
  font-family: var(--font-serif);
  font-size: clamp(9.5px, 4.1cqw, 14px);
  line-height: 1.48;
  color: var(--ink);
  letter-spacing: 0.02em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.dlg-meta-tag {
  position: absolute;
  top: 3px;
  right: 6px;
  font-family: var(--font-mono);
  font-size: clamp(8px, 3cqw, 10px);
  color: var(--sapphire);
  opacity: 0.65;
}

.dlg-caret {
  position: absolute;
  right: 7px;
  bottom: 4px;
  font-size: clamp(8px, 3.2cqw, 11px);
  color: var(--sapphire);
  opacity: 0.85;
}

/* ==================== 原图缺陷说明带 & 体检信息带 ==================== */
.defect-strip {
  padding: 7px 10px;
  background: #fdf6ec;
  border-top: 1px solid var(--line-gold);
  border-left: 3px solid var(--gold);
  font-size: 11.5px;
  line-height: 1.4;
  color: #6b4b18;
}

.defect-strip strong {
  color: var(--crimson-deep);
  font-weight: 700;
}

.metrics-strip {
  padding: 7px 10px;
  background: #f7fafe;
  border-top: 1px solid var(--line-soft);
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.5;
  color: var(--ink-mid);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

body.hide-metrics .portrait-card .metrics-strip {
  display: none;
}

.m-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 8px;
}

.m-dim {
  font-weight: 600;
  color: var(--ink);
}

.m-bg {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--ink-muted);
}

.bg-swatch {
  display: inline-block;
  width: 10px;
  height: 10px;
  border: 1px solid rgba(26, 36, 54, 0.24);
  flex-shrink: 0;
}

.bg-swatch.is-alpha {
  background-image:
    linear-gradient(45deg, #b8c7dc 25%, transparent 25%),
    linear-gradient(-45deg, #b8c7dc 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #b8c7dc 75%),
    linear-gradient(-45deg, transparent 75%, #b8c7dc 75%);
  background-size: 6px 6px;
  background-position: 0 0, 0 3px, 3px -3px, -3px 0;
  background-color: #ffffff;
}

.m-margins {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 2px;
  font-size: 10px;
  color: var(--ink-muted);
}

.m-cell {
  white-space: nowrap;
}

.m-warn {
  color: var(--amber);
  font-weight: 700;
}

.m-danger {
  color: var(--crimson);
  font-weight: 700;
}

.m-good {
  color: var(--emerald);
  font-weight: 600;
}

.cand-note-strip {
  padding: 5px 10px;
  background: #ffffff;
  border-top: 1px solid rgba(96, 128, 180, 0.14);
  font-size: 11px;
  color: var(--ink-muted);
}

/* ==================== 卡片底部操作行 ==================== */
.card-actions {
  margin-top: auto;
  display: flex;
  align-items: stretch;
  height: 36px;
  border-top: 1px solid var(--line-soft);
  background: var(--bg-surface);
}

.btn-pick {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--sapphire);
  background: #ffffff;
  transition: background-color 0.14s ease, color 0.14s ease;
}

.btn-pick:hover {
  background: var(--bg-tint-strong);
}

.portrait-card.is-selected .btn-pick {
  background: var(--sapphire);
  color: #ffffff;
}

.portrait-card.is-selected .btn-pick:hover {
  background: var(--sapphire-mid);
}

.btn-zoom {
  width: 38px;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-left: 1px solid var(--line-soft);
  color: var(--ink-mid);
  background: #fafcff;
  font-size: 11.5px;
  transition: background-color 0.14s ease, color 0.14s ease;
}

body.view-large .btn-zoom {
  width: 96px;
}

.btn-zoom .zoom-txt {
  display: none;
}

body.view-large .btn-zoom .zoom-txt {
  display: inline;
}

.btn-zoom:hover {
  background: var(--bg-tint-strong);
  color: var(--sapphire);
}

.orig-footer {
  margin-top: auto;
  display: flex;
  align-items: stretch;
  height: 36px;
  border-top: 1px solid var(--line-gold);
  background: var(--bg-gold-tint);
}

.btn-orig-inspect {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--gold-deep);
}

.btn-orig-inspect:hover {
  background: var(--bg-gold-soft);
}

/* ==================== 全屏高清单图灯箱 + 原图并排对比 ==================== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  flex-direction: column;
  background: rgba(238, 244, 252, 0.965);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.lightbox.open {
  display: flex;
  animation: lbFade 0.16s ease;
}

@keyframes lbFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.lb-topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 18px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--line-soft);
}

.lb-topbar::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--prism-hairline);
}

.lb-title-area {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
}

.lb-char-name {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  flex-shrink: 0;
}

.lb-current-badge {
  flex-shrink: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--sapphire);
  background: var(--bg-tint-strong);
  border-left: 3px solid var(--sapphire);
  padding: 4px 9px;
  white-space: nowrap;
}

.lb-tabs {
  display: inline-flex;
  overflow-x: auto;
  max-width: 100%;
  min-width: 0;
  border: 1px solid var(--line-soft);
  background: #f8fbff;
  scrollbar-width: thin;
}

.lb-tab {
  position: relative;
  height: 30px;
  padding: 0 9px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-mid);
  border-right: 1px solid var(--line-soft);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  white-space: nowrap;
}

.lb-tab:last-child {
  border-right: none;
}

.lb-tab:hover {
  background: var(--bg-tint-strong);
  color: var(--sapphire);
}

.lb-tab.active {
  background: var(--sapphire);
  color: #ffffff;
}

.lb-tab .picked-dot {
  width: 6px;
  height: 6px;
  background: var(--gold);
  display: none;
}

.lb-tab.is-picked .picked-dot {
  display: inline-block;
}

.lb-tab.active.is-picked .picked-dot {
  background: var(--gold-pale);
}

.lb-tools {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.lb-pick-btn {
  height: 32px;
  padding: 0 16px;
  font-size: 12.5px;
  font-weight: 700;
  color: #ffffff;
  background: var(--sapphire-prism);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.lb-pick-btn:hover {
  filter: brightness(1.08);
}

.lb-pick-btn.is-chosen {
  background: var(--emerald);
}

.lb-pick-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.lb-close-btn {
  height: 32px;
  width: 34px;
  border: 1px solid var(--line-soft);
  background: var(--bg-surface);
  color: var(--ink-mid);
  font-size: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.lb-close-btn:hover {
  background: var(--bg-crimson-tint);
  color: var(--crimson);
  border-color: rgba(209, 52, 86, 0.35);
}

/* 灯箱中央舞台 */
.lb-body {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 66px;
  gap: 18px;
}

.lb-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 76px;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid var(--line-soft);
  color: var(--sapphire);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: background-color 0.14s ease, color 0.14s ease;
}

.lb-arrow:hover {
  background: var(--sapphire);
  color: #ffffff;
  border-color: var(--sapphire);
}

.lb-arrow.prev { left: 12px; }
.lb-arrow.next { right: 12px; }

.lb-pane {
  display: flex;
  flex-direction: column;
  width: min(calc((100vh - 234px) * 0.75), calc(50vw - 88px));
  max-height: calc(100vh - 134px);
  background: var(--bg-surface);
  border: 1px solid var(--line-soft);
  box-shadow: 0 12px 34px rgba(14, 43, 120, 0.09);
  overflow: hidden;
}

.lightbox:not(.lb-is-compare) .lb-pane {
  width: min(calc((100vh - 234px) * 0.75), calc(100vw - 160px));
}

.lb-pane.is-orig {
  border-top: 2px solid var(--gold);
}

.lb-pane.is-cand {
  border-top: 2px solid var(--sapphire);
}

.lb-pane.is-cand.is-chosen {
  box-shadow: 0 0 0 2px var(--sapphire), 0 14px 36px rgba(22, 88, 235, 0.18);
}

.lb-pane.hidden {
  display: none;
}

.lb-pane-head {
  flex: 0 0 auto;
  height: 34px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid var(--line-soft);
  background: #f8fbff;
  font-size: 12px;
}

.lb-pane.is-orig .lb-pane-head {
  background: var(--bg-gold-tint);
  border-bottom-color: var(--line-gold);
}

.lb-pane.is-cand.is-chosen .lb-pane-head {
  background: var(--sapphire-prism);
  color: #ffffff;
}

.lb-stage-holder {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #edf3fa;
  overflow: hidden;
}

.lb-stage-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-height: 100%;
  background: #edf3fa;
  overflow: hidden;
  container-type: inline-size;
}

.lb-stage-wrap.is-transparent {
  background-image:
    linear-gradient(45deg, #e3ebf6 25%, transparent 25%),
    linear-gradient(-45deg, #e3ebf6 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e3ebf6 75%),
    linear-gradient(-45deg, transparent 75%, #e3ebf6 75%);
  background-size: 18px 18px;
  background-position: 0 0, 0 9px, 9px -9px, -9px 0;
  background-color: #f7faff;
}

.lb-stage-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.lb-pane-foot {
  flex: 0 0 auto;
  padding: 7px 12px;
  background: #f7fafe;
  border-top: 1px solid var(--line-soft);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-mid);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px 14px;
}

.lb-pane-subbar {
  flex: 0 0 auto;
  height: 29px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  font-size: 11.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lb-pane-defect {
  background: #fdf6ec;
  border-top: 1px solid var(--line-gold);
  color: #6b4b18;
}

.lb-pane-candsub {
  background: #ffffff;
  border-top: 1px solid rgba(96, 128, 180, 0.16);
  color: var(--ink-muted);
}

/* 灯箱底栏 */
.lb-bottom {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 18px;
  background: var(--bg-surface);
  border-top: 1px solid var(--line-soft);
}

.lb-note-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  max-width: 520px;
}

.lb-note-label {
  font-size: 12px;
  color: var(--ink-muted);
  white-space: nowrap;
}

.lb-note-input {
  flex: 1;
  height: 28px;
  padding: 0 10px;
  font-size: 12px;
  color: var(--ink);
  background: #f5f9fe;
  border: none;
  border-bottom: 1px solid rgba(96, 128, 180, 0.36);
}

.lb-note-input:focus {
  background: #ffffff;
  border-bottom-color: var(--sapphire);
  outline: none;
}

.lb-shortcuts {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 11.5px;
  color: var(--ink-muted);
}

.lb-shortcuts code {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  color: var(--sapphire);
  background: var(--bg-tint-strong);
  padding: 1px 5px;
  margin-right: 3px;
}

/* ==================== 底部固定提交栏 + 可展开文本兜底抽屉 ==================== */
.submit-dock-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: var(--bg-frost);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-mid);
  box-shadow: 0 -6px 24px rgba(16, 45, 110, 0.08);
}

.preview-drawer {
  display: none;
  border-bottom: 1px solid var(--line-soft);
  background: #fafdff;
}

.preview-drawer.open {
  display: block;
}

.preview-drawer-inner {
  max-width: 1580px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.preview-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-mid);
}

.preview-textarea {
  width: 100%;
  min-height: 104px;
  max-height: 220px;
  padding: 10px 12px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.55;
  color: var(--ink);
  background: #ffffff;
  border: 1px solid var(--line-soft);
  resize: vertical;
}

.submit-dock {
  max-width: 1580px;
  margin: 0 auto;
  padding: 0 20px;
  height: var(--dock-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.dock-summary {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  min-width: 0;
  flex: 1;
  scrollbar-width: none;
}

.dock-summary::-webkit-scrollbar {
  display: none;
}

.dock-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  background: var(--bg-tint);
  border-left: 2px solid #b5c6df;
  font-size: 11.5px;
  color: var(--ink-mid);
  white-space: nowrap;
  flex-shrink: 0;
  transition: background-color 0.14s ease;
}

.dock-item:hover {
  background: var(--bg-tint-strong);
}

.dock-item.picked {
  background: #ebf3ff;
  border-left-color: var(--sapphire);
  color: var(--ink);
}

.dock-item.picked strong {
  font-family: var(--font-mono);
  color: var(--sapphire);
}

.dock-item.redraw {
  background: var(--bg-crimson-tint);
  border-left-color: var(--crimson);
  color: var(--crimson-deep);
}

.dock-item.redraw strong {
  color: var(--crimson);
}

.dock-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.btn-dock-ghost {
  height: 36px;
  padding: 0 13px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-mid);
  background: var(--bg-surface);
  border: 1px solid var(--line-soft);
  white-space: nowrap;
}

.btn-dock-ghost:hover {
  background: var(--bg-tint);
  color: var(--sapphire);
  border-color: var(--line-mid);
}

.btn-dock-ghost.confirming {
  background: var(--bg-crimson-tint);
  color: var(--crimson);
  border-color: rgba(209, 52, 86, 0.45);
}

.btn-copy-primary {
  height: 36px;
  padding: 0 22px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: #ffffff;
  background: var(--sapphire-prism);
  clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  transition: filter 0.14s ease, transform 0.12s ease;
}

.btn-copy-primary:hover {
  filter: brightness(1.09);
}

.btn-copy-primary:active {
  transform: translateY(1px);
}

/* ==================== Toast 提示 ==================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--dock-h) + 18px);
  transform: translate(-50%, 10px);
  z-index: 200;
  padding: 9px 18px;
  font-size: 12.5px;
  font-weight: 600;
  color: #ffffff;
  background: var(--sapphire-deep);
  border-left: 3px solid var(--cyan);
  box-shadow: 0 10px 28px rgba(10, 30, 86, 0.24);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
  white-space: nowrap;
}

.toast.is-success {
  background: var(--emerald);
  border-left-color: #a7f3d0;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ==================== 桌面 1280px 适配微调 ==================== */
@media (max-width: 1320px) {
  .topbar-inner,
  .main-wrap,
  .submit-dock,
  .preview-drawer-inner {
    padding-left: 14px;
    padding-right: 14px;
  }
  .batch-title {
    font-size: 15.5px;
  }
  .seg-btn {
    padding: 0 8px;
    font-size: 11.5px;
  }
  .metrics-strip {
    padding: 6px 7px;
    font-size: 10px;
  }
  .m-margins {
    font-size: 9.5px;
  }
  .note-input {
    width: 200px;
  }
  .note-input:focus {
    width: 240px;
  }
  .char-section.is-multi-grid .orig-slot {
    flex: 0 0 206px;
  }
  .round-btn {
    padding: 0 8px;
    font-size: 11.5px;
  }
}

@media (max-width: 1040px) {
  .char-body {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .char-section.is-multi-grid .char-body,
  body.view-large .char-body {
    flex-direction: column;
  }
  .char-section.is-multi-grid .orig-slot,
  body.view-large .orig-slot {
    flex: none;
    border-right: none;
    border-bottom: 1px solid var(--line-soft);
  }
  .char-section.is-multi-grid .orig-slot .portrait-card,
  body.view-large .orig-slot .portrait-card {
    position: static;
  }
  .char-section.is-multi-grid .cands-wrap {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "ojousama_portrait_picker_v2";
  const rawEl = document.getElementById("showcase-data");
  const DATA = JSON.parse(rawEl ? rawEl.textContent : "{}");
  const BATCH_ID = DATA.batch_id || "default_batch";
  const BATCH_LABEL = DATA.batch_label || BATCH_ID;
  const CHARACTERS = Array.isArray(DATA.characters) ? DATA.characters : [];
  const ROUNDS = (function () {
    if (Array.isArray(DATA.rounds) && DATA.rounds.length > 0) return DATA.rounds;
    const seen = {};
    const out = [];
    CHARACTERS.forEach(function (c) {
      (Array.isArray(c.candidates) ? c.candidates : []).forEach(function (cand) {
        if (cand.round && !seen[cand.round]) {
          seen[cand.round] = true;
          out.push({ id: cand.round, label: "仅 " + cand.round, title: cand.round_label || cand.tag || cand.round });
        }
      });
    });
    return out;
  })();
  const MAX_CANDS_PER_CHAR = CHARACTERS.reduce(function (mx, c) {
    return Math.max(mx, Array.isArray(c.candidates) ? c.candidates.length : 0);
  }, 0);

  const state = {
    activeCharId: "__ALL__",
    activeRound: "__ALL__",
    picks: {},
    prefs: {
      ruler: false,
      dialog: false,
      metrics: true,
      density: "6col"
    },
    lb: {
      open: false,
      charId: null,
      candIdx: 0, // -1 表示单独看原图，0..N-1 表示候选 #01..#0N
      compare: false,
      ruler: false,
      dialog: false
    },
    resetArmed: false,
    resetTimer: null
  };

  function loadStorage() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const all = JSON.parse(raw);
      const saved = all && all[BATCH_ID];
      if (!saved) return;
      if (saved.picks && typeof saved.picks === "object") {
        state.picks = saved.picks;
      }
      if (saved.prefs && typeof saved.prefs === "object") {
        state.prefs = Object.assign({}, state.prefs, saved.prefs);
      }
    } catch (_) {
      // 忽略私密模式或解析异常
    }
  }

  function saveStorage() {
    try {
      let all = {};
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try { all = JSON.parse(raw) || {}; } catch (_) { all = {}; }
      }
      all[BATCH_ID] = {
        picks: state.picks,
        prefs: state.prefs,
        updatedAt: new Date().toISOString()
      };
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    } catch (_) {
      // 忽略存储配额限制
    }
  }

  function getPick(charId) {
    if (!state.picks[charId]) {
      state.picks[charId] = { choice: null, note: "" };
    }
    return state.picks[charId];
  }

  function getChar(charId) {
    return CHARACTERS.find(function (c) { return c.id === charId; }) || null;
  }

  function escHtml(str) {
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function shortSpeakerName(charObj) {
    const raw = (charObj && charObj.name) ? String(charObj.name) : "";
    const parts = raw.split(/[·・|（(]/);
    return (parts[0] || raw || "角色").trim();
  }

  function fmtPct(v) {
    if (typeof v !== "number" || !isFinite(v)) return "--";
    return v.toFixed(1) + "%";
  }

  function marginClass(kind, val) {
    if (typeof val !== "number" || !isFinite(val)) return "";
    if (kind === "L" || kind === "R") {
      if (val < 3.0) return "m-danger";
      if (val < 8.0) return "m-warn";
      return "m-good";
    }
    if (kind === "T") {
      if (val < 1.5) return "m-danger";
      if (val < 4.0) return "m-warn";
      return "";
    }
    return "";
  }

  function stdClass(val) {
    if (typeof val !== "number" || !isFinite(val)) return "";
    if (val > 18) return "m-danger";
    if (val > 10) return "m-warn";
    return "m-good";
  }

  function buildMetricsHTML(m) {
    if (!m) {
      return '<div class="metrics-strip"><div class="m-row"><span class="m-dim">暂无体检数据</span></div></div>';
    }
    const dimTxt = (m.width && m.height)
      ? (m.width + "×" + m.height + (m.aspect ? " · " + m.aspect : ""))
      : "--";
    const isTrans = !!m.is_transparent || m.bg_hex === "transparent";
    const bgHex = isTrans ? "透明底" : (m.bg_hex || "--");
    const stdVal = (typeof m.bg_std === "number" && isFinite(m.bg_std)) ? m.bg_std.toFixed(1) : "--";
    const swatchCls = isTrans ? "bg-swatch is-alpha" : "bg-swatch";
    const swatchStyle = isTrans ? "" : (' style="background:' + escHtml(bgHex) + ';"');

    return (
      '<div class="metrics-strip">' +
        '<div class="m-row">' +
          '<span class="m-dim">' + escHtml(dimTxt) + '</span>' +
          '<span class="m-bg" title="四角/顶部背景均匀度标准差与估算底色">' +
            '<span class="' + stdClass(m.bg_std) + '">std ' + escHtml(stdVal) + '</span>' +
            '<span class="' + swatchCls + '"' + swatchStyle + '></span>' +
            '<span>' + escHtml(bgHex) + '</span>' +
          '</span>' +
        '</div>' +
        '<div class="m-margins" title="左/右/上/下 角色主体距画布边缘留空百分比">' +
          '<span class="m-cell ' + marginClass("L", m.margin_l) + '">L ' + escHtml(fmtPct(m.margin_l)) + '</span>' +
          '<span class="m-cell ' + marginClass("R", m.margin_r) + '">R ' + escHtml(fmtPct(m.margin_r)) + '</span>' +
          '<span class="m-cell ' + marginClass("T", m.margin_t) + '">T ' + escHtml(fmtPct(m.margin_t)) + '</span>' +
          '<span class="m-cell">B ' + escHtml(fmtPct(m.margin_b)) + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  function buildLightboxFootHTML(m) {
    if (!m) return "<span>无像素体检数据</span>";
    const dimTxt = (m.width && m.height) ? (m.width + "×" + m.height + (m.aspect ? " (" + m.aspect + ")" : "")) : "--";
    const isTrans = !!m.is_transparent || m.bg_hex === "transparent";
    const bgHex = isTrans ? "透明底" : (m.bg_hex || "--");
    const stdVal = (typeof m.bg_std === "number" && isFinite(m.bg_std)) ? m.bg_std.toFixed(1) : "--";
    const swatchCls = isTrans ? "bg-swatch is-alpha" : "bg-swatch";
    const swatchStyle = isTrans ? "" : (' style="background:' + escHtml(bgHex) + ';"');
    return (
      '<span class="m-dim">' + escHtml(dimTxt) + '</span>' +
      '<span>' +
        '<span class="' + marginClass("L", m.margin_l) + '">L ' + escHtml(fmtPct(m.margin_l)) + '</span> · ' +
        '<span class="' + marginClass("R", m.margin_r) + '">R ' + escHtml(fmtPct(m.margin_r)) + '</span> · ' +
        '<span class="' + marginClass("T", m.margin_t) + '">T ' + escHtml(fmtPct(m.margin_t)) + '</span> · ' +
        '<span>B ' + escHtml(fmtPct(m.margin_b)) + '</span>' +
      '</span>' +
      '<span class="m-bg">' +
        '<span class="' + stdClass(m.bg_std) + '">std ' + escHtml(stdVal) + '</span>' +
        '<span class="' + swatchCls + '"' + swatchStyle + '></span>' +
        '<span>' + escHtml(bgHex) + '</span>' +
      '</span>'
    );
  }

  function buildOverlaysHTML(speakerName, sampleLine) {
    return (
      '<div class="overlay-ruler" aria-hidden="true">' +
        '<div class="r-top5"></div>' +
        '<div class="r-left8"></div>' +
        '<div class="r-right8"></div>' +
        '<div class="r-center"></div>' +
        '<div class="r-core72"></div>' +
        '<span class="r-lbl r-lbl-top">TOP 5%</span>' +
        '<span class="r-lbl r-lbl-left">L 8%</span>' +
        '<span class="r-lbl r-lbl-right">R 8%</span>' +
        '<span class="r-lbl r-lbl-center">50%</span>' +
        '<span class="r-lbl r-lbl-core">72% 核心区</span>' +
      '</div>' +
      '<div class="overlay-dialog" aria-hidden="true">' +
        '<div class="dlg-speaker">' + escHtml(speakerName) + '</div>' +
        '<div class="dlg-meta-tag">23%</div>' +
        '<div class="dlg-line">' + escHtml(sampleLine) + '</div>' +
        '<div class="dlg-caret">▾</div>' +
      '</div>'
    );
  }

  let toastTimer = null;
  function showToast(msg, isSuccess) {
    const el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.className = "toast show" + (isSuccess ? " is-success" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove("show");
    }, 2400);
  }

  function applyGlobalPrefs() {
    document.body.classList.toggle("show-ruler", !!state.prefs.ruler);
    document.body.classList.toggle("show-dialog", !!state.prefs.dialog);
    document.body.classList.toggle("hide-metrics", !state.prefs.metrics);
    document.body.classList.toggle("view-6col", state.prefs.density !== "large");
    document.body.classList.toggle("view-large", state.prefs.density === "large");

    document.getElementById("btn-toggle-ruler").classList.toggle("active", !!state.prefs.ruler);
    document.getElementById("btn-toggle-dialog").classList.toggle("active", !!state.prefs.dialog);
    document.getElementById("btn-toggle-metrics").classList.toggle("active", !!state.prefs.metrics);
    document.getElementById("btn-view-6col").classList.toggle("active", state.prefs.density !== "large");
    document.getElementById("btn-view-large").classList.toggle("active", state.prefs.density === "large");

    if (topbar) {
      document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");

  function renderHeader() {
    document.getElementById("batch-title").textContent = DATA.title || ("立绘选品 · " + BATCH_LABEL);
    document.getElementById("batch-sub").textContent = DATA.subtitle || ("共 " + CHARACTERS.length + " 组角色 · 点击立绘高清放大对比 · 支持方向键极速盲挑");

        btn6.textContent = "5 列网格";

  function renderRoundFilter() {
    const el = document.getElementById("round-filter");
    if (!el) return;
    if (ROUNDS.length <= 1) {
      el.classList.remove("has-rounds");
      el.innerHTML = "";
      return;
    }
    el.classList.add("has-rounds");
    const totalLabel = "全部 " + MAX_CANDS_PER_CHAR + " 张";
    let h =
      '<button type="button" class="round-btn' + (state.activeRound === "__ALL__" ? " active" : "") + '" data-round-filter="__ALL__" title="显示全部轮次候选">' +
        escHtml(totalLabel) +
      '</button>';
    ROUNDS.forEach(function (r) {
      const act = state.activeRound === r.id ? " active" : "";
      const dotCls = "round-dot r-" + escHtml(r.id);
      h +=
        '<button type="button" class="round-btn' + act + '" data-round-filter="' + escHtml(r.id) + '" title="' + escHtml(r.title || r.label || r.id) + '">' +
          '<span class="' + dotCls + '"></span>' + escHtml(r.label || ("仅 " + r.id)) +
        '</button>';
    });
    el.innerHTML = h;
  }

  function renderNavAndSummary() {
    const nav = document.getElementById("char-nav");
    const dock = document.getElementById("dock-summary");
    let doneCount = 0;

    let navHTML =
      '<button type="button" class="char-tab' + (state.activeCharId === "__ALL__" ? " active" : "") + '" data-nav="__ALL__">' +
        '全部角色 <span class="tab-status">' + CHARACTERS.length + '</span>' +
      '</button>';

    let dockHTML = "";

    CHARACTERS.forEach(function (c) {
      const p = getPick(c.id);
      const isPicked = p.choice && p.choice !== "redraw";
      const isRedraw = p.choice === "redraw";
      if (isPicked || isRedraw) doneCount += 1;

      const statusText = isPicked ? p.choice : (isRedraw ? "重抽" : "待选");
      const statusCls = isPicked ? "picked" : (isRedraw ? "redraw" : "");
      const activeCls = state.activeCharId === c.id ? " active" : "";

      navHTML +=
        '<button type="button" class="char-tab' + activeCls + '" data-nav="' + escHtml(c.id) + '">' +
          '<span>' + escHtml(c.name) + '</span>' +
          '<span class="tab-status ' + statusCls + '">' + escHtml(statusText) + '</span>' +
        '</button>';

      const dockCls = isPicked ? "picked" : (isRedraw ? "redraw" : "");
      dockHTML +=
        '<button type="button" class="dock-item ' + dockCls + '" data-jump="' + escHtml(c.id) + '" title="点击跳转至 ' + escHtml(c.name) + '">' +
          '<span>' + escHtml(shortSpeakerName(c)) + '</span>' +
          '<strong>' + escHtml(statusText) + '</strong>' +
        '</button>';
    });

    nav.innerHTML = navHTML;
    dock.innerHTML = dockHTML;

    const total = CHARACTERS.length;
    document.getElementById("progress-count").textContent = String(doneCount);
    document.getElementById("progress-total").textContent = String(total);
    const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("progress-box").classList.toggle("is-done", total > 0 && doneCount === total);

    const previewArea = document.getElementById("preview-textarea");
    if (previewArea) {
      previewArea.value = formatExportText();
    }
  }

  function buildSections() {
    const wrap = document.getElementById("main-wrap");

    CHARACTERS.forEach(function (c, cIdx) {

      const sampleLine = c.sample_line || (speaker + "：今天的风很清朗，就在这里稍作停留吧。");
      const cands = Array.isArray(c.candidates) ? c.candidates : [];
      const isMultiGrid = cands.length > 5;
      const totalCols = isMultiGrid ? 6 : Math.max(2, cands.length + 1);
      const seqStr = String(cIdx + 1).padStart(2, "0");

      // 原图卡片
      const orig = c.original || null;
      const origTrans = orig && orig.metrics && orig.metrics.is_transparent;
      const origDefect = orig && orig.defect ? orig.defect : "原版旧立绘参考（对比脸部一致性、画幅与留空改善）";
      let origStageInner = "";
      if (orig && orig.src) {
        origStageInner =
          '<img src="' + escHtml(orig.src) + '" alt="' + escHtml(c.name) + ' 原图参考" loading="' + (cIdx === 0 ? "eager" : "lazy") + '">' +
          buildOverlaysHTML(speaker, sampleLine) +
          '<span class="stage-hover-hint">放大原图</span>';
      } else {
        origStageInner =
          '<div class="stage-missing"><strong>无原图参考</strong><span>本角色为全新绘制立绘</span></div>';
      }

      const origCardHTML =
        '<div class="orig-slot">' +
          '<article class="portrait-card is-original">' +
            '<div class="card-head">' +
              '<div class="card-head-left"><span class="card-code">原图参考</span></div>' +
              '<div class="card-head-right"><span class="orig-en-label">ORIGINAL</span></div>' +
            '</div>' +
            '<div class="stage-wrap' + (origTrans ? " is-transparent" : "") + '" data-open-lb="' + escHtml(c.id) + '" data-cand-idx="-1">' +
              origStageInner +
            '</div>' +
            '<div class="defect-strip"><strong>原图说明：</strong>' + escHtml(origDefect) + '</div>' +
            buildMetricsHTML(orig ? orig.metrics : null) +
            '<div class="orig-footer">' +
              '<button type="button" class="btn-orig-inspect" data-open-lb="' + escHtml(c.id) + '" data-cand-idx="0" data-compare="1">' +
                '并排原图审图' +
              '</button>' +
            '</div>' +
          '</article>' +
        '</div>';

      // 候选卡
      let candsHTML = '<div class="cands-wrap">';
      cands.forEach(function (cand, idx) {
        const label = cand.label || ("#" + String(idx + 1).padStart(2, "0"));
        const isTrans = cand.metrics && cand.metrics.is_transparent;
        const roundAttr = cand.round ? (' data-round="' + escHtml(cand.round) + '"') : "";
        const tagHTML = cand.tag ? ('<span class="card-tag" title="' + escHtml(cand.tag) + '">' + escHtml(cand.tag) + '</span>') : "";
        const noteHTML = cand.note ? ('<div class="cand-note-strip">' + escHtml(cand.note) + '</div>') : "";

        candsHTML +=
          '<article class="portrait-card" data-char-card="' + escHtml(c.id) + '" data-choice="' + escHtml(label) + '"' + roundAttr + '>' +
            '<div class="card-head">' +
              '<div class="card-head-left">' +
                '<span class="card-code">' + escHtml(label) + '</span>' +
                tagHTML +
              '</div>' +
              '<div class="card-head-right">' +
                '<span class="selected-crown">★ 已选定</span>' +
              '</div>' +
            '</div>' +
            '<div class="stage-wrap' + (isTrans ? " is-transparent" : "") + '" data-open-lb="' + escHtml(c.id) + '" data-cand-idx="' + idx + '">' +
              '<img src="' + escHtml(cand.src) + '" alt="' + escHtml(c.name + " " + label) + '" loading="' + (cIdx === 0 && idx < 10 ? "eager" : "lazy") + '">' +
              buildOverlaysHTML(speaker, sampleLine) +
              '<span class="stage-hover-hint">高清审图</span>' +
            '</div>' +
            buildMetricsHTML(cand.metrics) +
            noteHTML +
            '<div class="card-actions">' +
              '<button type="button" class="btn-pick" data-pick-char="' + escHtml(c.id) + '" data-pick-val="' + escHtml(label) + '">' +
                '选定 ' + escHtml(label) +
              '</button>' +
              '<button type="button" class="btn-zoom" data-open-lb="' + escHtml(c.id) + '" data-cand-idx="' + idx + '" data-compare="1" title="与原图并排高清对比">' +
                '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
                  '<rect x="3" y="4" width="7" height="16"></rect>' +
                  '<rect x="14" y="4" width="7" height="16"></rect>' +

            '</div>' +
          '</article>';
      });
      candsHTML += "</div>";

      html +=
        '<section class="char-section' + (isMultiGrid ? " is-multi-grid" : "") + '" id="sec-' + escHtml(c.id) + '" data-char-sec="' + escHtml(c.id) + '">' +
          '<div class="char-header">' +
            '<div class="char-meta">' +
              '<span class="char-seq">' + seqStr + '</span>' +
              '<h2 class="char-name">' + escHtml(c.name) + '</h2>' +
              '<span class="char-id">' + escHtml(c.id) + '</span>' +
              (c.role_tag ? '<span class="char-role-tag">· ' + escHtml(c.role_tag) + '</span>' : "") +
            '</div>' +
            '<div class="char-controls">' +
              '<span class="decision-readout" data-readout="' + escHtml(c.id) + '">未选</span>' +
              '<button type="button" class="btn-redraw" data-redraw="' + escHtml(c.id) + '">全都不满意 · 重抽</button>' +

                '<button type="button" class="btn-mini-nav" data-step="-1"' + (cIdx === 0 ? " disabled" : "") + '>← 上一角</button>' +
                '<button type="button" class="btn-mini-nav" data-step="1"' + (cIdx === CHARACTERS.length - 1 ? " disabled" : "") + '>下一角 →</button>' +
              '</div>' +

            origCardHTML +
            candsHTML +
