    wrap.innerHTML = html;
  }

  function syncSectionVisuals() {
    document.body.classList.toggle("single-char-mode", state.activeCharId !== "__ALL__");

    CHARACTERS.forEach(function (c) {
      const sec = document.querySelector('[data-char-sec="' + c.id + '"]');
      if (!sec) return;
      const visible = state.activeCharId === "__ALL__" || state.activeCharId === c.id;
      sec.classList.toggle("is-hidden", !visible);

      const pick = getPick(c.id);
      const readout = sec.querySelector('[data-readout="' + c.id + '"]');
      if (readout) {
        if (pick.choice === "redraw") {
          readout.textContent = "已标记：重抽";
          readout.className = "decision-readout state-redraw";
        } else if (pick.choice) {
          readout.textContent = "已选定：" + pick.choice;
          readout.className = "decision-readout state-picked";
        } else {
          readout.textContent = "尚未选定";
          readout.className = "decision-readout";
        }
      }

      const redrawBtn = sec.querySelector('[data-redraw="' + c.id + '"]');
      if (redrawBtn) {
        redrawBtn.classList.toggle("active", pick.choice === "redraw");
      }

      const noteInput = sec.querySelector('[data-note="' + c.id + '"]');
      if (noteInput && noteInput.value !== (pick.note || "")) {
        noteInput.value = pick.note || "";
      }

      const cards = sec.querySelectorAll('[data-char-card="' + c.id + '"]');
      cards.forEach(function (card) {
        const val = card.getAttribute("data-choice");
        const selected = pick.choice === val;
        card.classList.toggle("is-selected", selected);
        const cardRound = card.getAttribute("data-round") || "";
        const filteredOut = state.activeRound !== "__ALL__" && cardRound !== state.activeRound;
        card.classList.toggle("is-filtered-out", filteredOut);
        const btn = card.querySelector(".btn-pick");
        if (btn) {
          btn.textContent = selected ? ("✓ 已选 " + val) : ("选定 " + val);
        }
      });
    });

    renderRoundFilter();
    renderNavAndSummary();
  }

  function setChoice(charId, choiceVal) {
    const pick = getPick(charId);
    if (pick.choice === choiceVal) {
      pick.choice = null;
    } else {
      pick.choice = choiceVal;
    }
    saveStorage();
    syncSectionVisuals();
    if (state.lb.open && state.lb.charId === charId) {
      renderLightbox();
    }
  }

  function setNote(charId, noteText) {
    const pick = getPick(charId);
    pick.note = noteText;
    saveStorage();
    const previewArea = document.getElementById("preview-textarea");
    if (previewArea) {
      previewArea.value = formatExportText();
    }
  }

  function formatExportText() {
    const lines = ["【立绘选品结果 · " + BATCH_LABEL + "】"];
    CHARACTERS.forEach(function (c) {
      const pick = getPick(c.id);
      const note = (pick.note || "").trim();
      const noteSuffix = note ? ("（备注：" + note + "）") : "";
      if (pick.choice === "redraw") {
        lines.push("- " + c.id + ": 重抽" + noteSuffix);
      } else if (pick.choice) {
        lines.push("- " + c.id + ": " + pick.choice + noteSuffix);
      } else {
        lines.push("- " + c.id + ": 未选" + noteSuffix);
      }
    });
    return lines.join("\n");
  }

  async function copyResultText() {
    const text = formatExportText();
    const previewArea = document.getElementById("preview-textarea");
    if (previewArea) previewArea.value = text;

    let ok = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(text);
        ok = true;
      } catch (_) {
        ok = false;
      }
    }
    if (!ok) {
      try {
        const tmp = document.createElement("textarea");
        tmp.value = text;
        tmp.style.position = "fixed";
        tmp.style.left = "-9999px";
        document.body.appendChild(tmp);
        tmp.select();
        ok = document.execCommand("copy");
        document.body.removeChild(tmp);
      } catch (_) {
        ok = false;
      }
    }

    if (ok) {
      showToast("已复制选品结果，直接粘贴回对话框即可！", true);
    } else {
      document.getElementById("preview-drawer").classList.add("open");
      document.getElementById("btn-toggle-preview").textContent = "收起文本预览";
      if (previewArea) {
        previewArea.focus();
        previewArea.select();
      }
      showToast("浏览器限制自动剪贴板，已展开文本预览请按 Ctrl+C 复制", false);
    }
  }

  /* ==================== 高清灯箱逻辑 ==================== */
  function openLightbox(charId, candIdx, compareMode) {
    const c = getChar(charId);
    if (!c) return;
    const cands = Array.isArray(c.candidates) ? c.candidates : [];
    state.lb.open = true;
    state.lb.charId = charId;
    state.lb.candIdx = (candIdx >= -1 && candIdx < cands.length) ? candIdx : 0;
    state.lb.compare = !!compareMode && !!(c.original && c.original.src);
    if (state.lb.compare && state.lb.candIdx < 0) {
      state.lb.candIdx = 0;
    }
    state.lb.ruler = !!state.prefs.ruler;
    state.lb.dialog = !!state.prefs.dialog;

    document.body.style.overflow = "hidden";
    document.getElementById("lightbox").classList.add("open");
    renderLightbox();
  }

  function closeLightbox() {
    state.lb.open = false;
    document.body.style.overflow = "";
    document.getElementById("lightbox").classList.remove("open");
  }

  function stepLightbox(delta) {
    const c = getChar(state.lb.charId);
    if (!c) return;
    const cands = Array.isArray(c.candidates) ? c.candidates : [];
    if (cands.length === 0) return;
    if (state.lb.candIdx < 0) {
      state.lb.candIdx = delta > 0 ? 0 : (cands.length - 1);
    } else {
      state.lb.candIdx = (state.lb.candIdx + delta + cands.length) % cands.length;
    }
    renderLightbox();
  }

  function renderLightbox() {
    const lbEl = document.getElementById("lightbox");
    const c = getChar(state.lb.charId);
    if (!c) return;
    const cands = Array.isArray(c.candidates) ? c.candidates : [];
    const pick = getPick(c.id);
    const speaker = shortSpeakerName(c);
    const sampleLine = c.sample_line || (speaker + "：今天的风很清朗，就在这里稍作停留吧。");
    const hasOrig = !!(c.original && c.original.src);

    lbEl.classList.toggle("lb-is-compare", !!state.lb.compare);
    lbEl.classList.toggle("lb-show-ruler", !!state.lb.ruler);
    lbEl.classList.toggle("lb-show-dialog", !!state.lb.dialog);

    document.getElementById("lb-char-name").textContent = c.name;
    document.getElementById("lb-toggle-ruler").classList.toggle("active", !!state.lb.ruler);
    document.getElementById("lb-toggle-dialog").classList.toggle("active", !!state.lb.dialog);
    document.getElementById("lb-mode-single").classList.toggle("active", !state.lb.compare);
    document.getElementById("lb-mode-compare").classList.toggle("active", !!state.lb.compare);
    document.getElementById("lb-mode-compare").disabled = !hasOrig;

    // 候选标签条
    let tabsHTML = "";
    if (hasOrig) {
      const origAct = (!state.lb.compare && state.lb.candIdx === -1) ? " active" : "";
      tabsHTML += '<button type="button" class="lb-tab' + origAct + '" data-lb-idx="-1">原图</button>';
    }
    cands.forEach(function (cand, idx) {
      const label = cand.label || ("#" + String(idx + 1).padStart(2, "0"));
      const isAct = (state.lb.candIdx === idx) ? " active" : "";
      const isPicked = (pick.choice === label) ? " is-picked" : "";
      tabsHTML +=
        '<button type="button" class="lb-tab' + isAct + isPicked + '" data-lb-idx="' + idx + '">' +
          '<span class="picked-dot"></span>' + escHtml(label) +
        '</button>';
    });
    const lbTabsEl = document.getElementById("lb-tabs");
    lbTabsEl.innerHTML = tabsHTML;
    const activeTabEl = lbTabsEl.querySelector(".lb-tab.active");
    if (activeTabEl && activeTabEl.scrollIntoView) {
      activeTabEl.scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    const badgeEl = document.getElementById("lb-current-badge");
    if (badgeEl) {
      if (state.lb.candIdx >= 0 && cands[state.lb.candIdx]) {
        const curCand = cands[state.lb.candIdx];
        const curLbl = curCand.label || ("#" + String(state.lb.candIdx + 1).padStart(2, "0"));
        badgeEl.textContent = curLbl + " · " + (state.lb.candIdx + 1) + "/" + cands.length;
      } else {
        badgeEl.textContent = "原图参考";
      }
    }

    const origPane = document.getElementById("lb-orig-pane");
    const candPane = document.getElementById("lb-cand-pane");
    const showOrigPane = hasOrig && (state.lb.compare || state.lb.candIdx === -1);
    const showCandPane = cands.length > 0 && (state.lb.compare || state.lb.candIdx >= 0);

    origPane.classList.toggle("hidden", !showOrigPane);
    candPane.classList.toggle("hidden", !showCandPane);

    if (showOrigPane) {
      const om = c.original.metrics || null;
      document.getElementById("lb-orig-img").src = c.original.src;
      document.getElementById("lb-orig-stage").classList.toggle("is-transparent", !!(om && om.is_transparent));
      document.getElementById("lb-orig-speaker").textContent = speaker;
      document.getElementById("lb-orig-line").textContent = sampleLine;
      document.getElementById("lb-orig-dim").textContent = om && om.width ? (om.width + "×" + om.height + (om.aspect ? " · " + om.aspect : "")) : "";
      document.getElementById("lb-orig-defect").innerHTML = "<strong>原图说明：</strong>" + escHtml(c.original.defect || "原版立绘参考");
      document.getElementById("lb-orig-foot").innerHTML = buildLightboxFootHTML(om);
    }

    const pickBtn = document.getElementById("lb-pick-btn");
    if (showCandPane) {
      const idx = Math.max(0, Math.min(cands.length - 1, state.lb.candIdx));
      const cand = cands[idx];
      const label = cand.label || ("#" + String(idx + 1).padStart(2, "0"));
      const cm = cand.metrics || null;
      const isChosen = pick.choice === label;

      candPane.classList.toggle("is-chosen", isChosen);
      document.getElementById("lb-cand-title").innerHTML =
        '<strong style="font-family:var(--font-mono);font-size:13.5px;">' + escHtml(label) + '</strong>' +
        (cand.tag ? (' <span style="opacity:0.8;margin-left:6px;">' + escHtml(cand.tag) + '</span>') : "");
      document.getElementById("lb-cand-status").textContent = isChosen ? "★ 当前已选定" : (idx + 1) + " / " + cands.length;

      document.getElementById("lb-cand-img").src = cand.src;
      document.getElementById("lb-cand-stage").classList.toggle("is-transparent", !!(cm && cm.is_transparent));
      document.getElementById("lb-cand-speaker").textContent = speaker;
      document.getElementById("lb-cand-line").textContent = sampleLine;

      let subTxt = cand.note || "";
      if (!subTxt && cm) {
        const flags = [];
        if (typeof cm.margin_l === "number" && cm.margin_l < 8) flags.push("左侧偏紧");
        if (typeof cm.margin_r === "number" && cm.margin_r < 8) flags.push("右侧偏紧");
        if (typeof cm.margin_t === "number" && cm.margin_t < 3) flags.push("顶部偏近");
        if (typeof cm.bg_std === "number" && cm.bg_std > 12) flags.push("背景略不均");
        subTxt = flags.length ? ("构图提示：" + flags.join(" / ")) : "体检通过 · 左右留空与底色均匀度达标";
      }
      document.getElementById("lb-cand-sub").textContent = subTxt || "候选方案高清预览";
      document.getElementById("lb-cand-foot").innerHTML = buildLightboxFootHTML(cm);

      pickBtn.disabled = false;
      pickBtn.classList.toggle("is-chosen", isChosen);
      pickBtn.textContent = isChosen ? ("✓ 已选定 " + label + "（点击取消）") : ("选定候选 " + label);
    } else {
      pickBtn.disabled = true;
      pickBtn.classList.remove("is-chosen");
      pickBtn.textContent = "原图参考（不可选定）";
    }

    const lbNote = document.getElementById("lb-note-input");
    if (lbNote && lbNote.value !== (pick.note || "")) {
      lbNote.value = pick.note || "";
    }
  }

  /* ==================== 事件绑定 ==================== */
  function bindEvents() {
    document.getElementById("btn-toggle-ruler").addEventListener("click", function () {
      state.prefs.ruler = !state.prefs.ruler;
      saveStorage();
      applyGlobalPrefs();
    });

    document.getElementById("btn-toggle-dialog").addEventListener("click", function () {
      state.prefs.dialog = !state.prefs.dialog;
      saveStorage();
      applyGlobalPrefs();
    });

    document.getElementById("btn-toggle-metrics").addEventListener("click", function () {
      state.prefs.metrics = !state.prefs.metrics;
      saveStorage();
      applyGlobalPrefs();
    });

    document.getElementById("btn-view-6col").addEventListener("click", function () {
      state.prefs.density = "6col";
      saveStorage();
      applyGlobalPrefs();
    });

    document.getElementById("btn-view-large").addEventListener("click", function () {
      state.prefs.density = "large";
      saveStorage();
      applyGlobalPrefs();
    });

    // 顶部角色切换栏
    document.getElementById("char-nav").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-nav]");
      if (!btn) return;
      state.activeCharId = btn.getAttribute("data-nav");
      syncSectionVisuals();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // 轮次筛选条（全部 20 张 / 仅 v4 / 仅 v1 / 仅 v2 / 仅 v3）
    const roundFilterEl = document.getElementById("round-filter");
    if (roundFilterEl) {
      roundFilterEl.addEventListener("click", function (e) {
        const btn = e.target.closest("[data-round-filter]");
        if (!btn) return;
        state.activeRound = btn.getAttribute("data-round-filter") || "__ALL__";
        syncSectionVisuals();
      });
    }

    // 底部汇总快速跳转
    document.getElementById("dock-summary").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-jump]");
      if (!btn) return;
      const cid = btn.getAttribute("data-jump");
      if (state.activeCharId !== "__ALL__" && state.activeCharId !== cid) {
        state.activeCharId = cid;
        syncSectionVisuals();
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        const sec = document.getElementById("sec-" + cid);
        if (sec) {
          const topbar = document.getElementById("topbar");
          const offset = (topbar ? topbar.offsetHeight : 90) + 12;
          const y = sec.getBoundingClientRect().top + window.scrollY - offset;
          window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
        }
      }
    });

    // 主区域委托事件
    const mainWrap = document.getElementById("main-wrap");
    mainWrap.addEventListener("click", function (e) {
      const pickBtn = e.target.closest("[data-pick-char]");
      if (pickBtn) {
        setChoice(pickBtn.getAttribute("data-pick-char"), pickBtn.getAttribute("data-pick-val"));
        return;
      }

      const redrawBtn = e.target.closest("[data-redraw]");
      if (redrawBtn) {
        setChoice(redrawBtn.getAttribute("data-redraw"), "redraw");
        return;
      }

      const stepBtn = e.target.closest("[data-step]");
      if (stepBtn && state.activeCharId !== "__ALL__") {
        const idx = CHARACTERS.findIndex(function (c) { return c.id === state.activeCharId; });
        const nextIdx = idx + Number(stepBtn.getAttribute("data-step"));
        if (nextIdx >= 0 && nextIdx < CHARACTERS.length) {
          state.activeCharId = CHARACTERS[nextIdx].id;
          syncSectionVisuals();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        return;
      }

      const lbTrigger = e.target.closest("[data-open-lb]");
      if (lbTrigger) {
        const cid = lbTrigger.getAttribute("data-open-lb");
        const cIdx = Number(lbTrigger.getAttribute("data-cand-idx"));
        const cmp = lbTrigger.getAttribute("data-compare") === "1";
        openLightbox(cid, cIdx, cmp);
      }
    });

    mainWrap.addEventListener("input", function (e) {
      const input = e.target.closest("[data-note]");
      if (!input) return;
      setNote(input.getAttribute("data-note"), input.value);
    });

    // 灯箱交互
    document.getElementById("lb-close-btn").addEventListener("click", closeLightbox);
    document.getElementById("lb-prev").addEventListener("click", function () { stepLightbox(-1); });
    document.getElementById("lb-next").addEventListener("click", function () { stepLightbox(1); });

    document.getElementById("lb-tabs").addEventListener("click", function (e) {
      const tab = e.target.closest("[data-lb-idx]");
      if (!tab) return;
      const idx = Number(tab.getAttribute("data-lb-idx"));
      if (idx === -1) {
        state.lb.compare = false;
        state.lb.candIdx = -1;
      } else {
        state.lb.candIdx = idx;
      }
      renderLightbox();
    });

    document.getElementById("lb-mode-single").addEventListener("click", function () {
      state.lb.compare = false;
      renderLightbox();
    });

    document.getElementById("lb-mode-compare").addEventListener("click", function () {
      const c = getChar(state.lb.charId);
      if (!c || !c.original || !c.original.src) return;
      state.lb.compare = true;
      if (state.lb.candIdx < 0) state.lb.candIdx = 0;
      renderLightbox();
    });

    document.getElementById("lb-toggle-ruler").addEventListener("click", function () {
      state.lb.ruler = !state.lb.ruler;
      renderLightbox();
    });

    document.getElementById("lb-toggle-dialog").addEventListener("click", function () {
      state.lb.dialog = !state.lb.dialog;
      renderLightbox();
    });

    document.getElementById("lb-pick-btn").addEventListener("click", function () {
      const c = getChar(state.lb.charId);
      if (!c || state.lb.candIdx < 0) return;
      const cand = c.candidates[state.lb.candIdx];
      if (!cand) return;
      const label = cand.label || ("#" + String(state.lb.candIdx + 1).padStart(2, "0"));
      setChoice(c.id, label);
      const nowPicked = getPick(c.id).choice === label;
      showToast(nowPicked ? ("已选定 " + shortSpeakerName(c) + " " + label) : ("已取消 " + shortSpeakerName(c) + " 的选定"), nowPicked);
    });

    document.getElementById("lb-note-input").addEventListener("input", function (e) {
      if (!state.lb.charId) return;
      setNote(state.lb.charId, e.target.value);
      const secInput = document.querySelector('[data-note="' + state.lb.charId + '"]');
      if (secInput) secInput.value = e.target.value;
    });

    document.getElementById("lightbox").addEventListener("click", function (e) {
      if (e.target === e.currentTarget || e.target.classList.contains("lb-body")) {
        closeLightbox();
      }
    });

    // 底部提交栏按钮
    document.getElementById("btn-copy-result").addEventListener("click", copyResultText);

    document.getElementById("btn-toggle-preview").addEventListener("click", function () {
      const drawer = document.getElementById("preview-drawer");
      const open = drawer.classList.toggle("open");
      this.textContent = open ? "收起文本预览" : "展开文本预览";
      if (open) {
        document.getElementById("preview-textarea").value = formatExportText();
      }
    });

    document.getElementById("btn-select-all").addEventListener("click", function () {
      const ta = document.getElementById("preview-textarea");
      ta.focus();
      ta.select();
    });

    document.getElementById("btn-reset-batch").addEventListener("click", function () {
      if (!state.resetArmed) {
        state.resetArmed = true;
        this.textContent = "确认清空？";
        this.classList.add("confirming");
        clearTimeout(state.resetTimer);
        state.resetTimer = setTimeout(() => {
          state.resetArmed = false;
          this.textContent = "清空暂存";
          this.classList.remove("confirming");
        }, 3000);
        return;
      }
      clearTimeout(state.resetTimer);
      state.resetArmed = false;
      this.textContent = "清空暂存";
      this.classList.remove("confirming");
      state.picks = {};
      saveStorage();
      syncSectionVisuals();
      showToast("已清空本批次全部选品暂存", false);
    });

    // 全局 & 灯箱键盘快捷键（输入备注时屏蔽）
    document.addEventListener("keydown", function (e) {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA") {
        if (e.key === "Escape") {
          e.target.blur();
        }
        return;
      }

      if (state.lb.open) {
        if (e.key === "Escape") {
          e.preventDefault();
          closeLightbox();
          return;
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          stepLightbox(-1);
          return;
        }
        if (e.key === "ArrowRight") {
          e.preventDefault();
          stepLightbox(1);
          return;
        }
        if (e.key === "c" || e.key === "C") {
          const c = getChar(state.lb.charId);
          if (c && c.original && c.original.src) {
            e.preventDefault();
            state.lb.compare = !state.lb.compare;
            if (state.lb.compare && state.lb.candIdx < 0) state.lb.candIdx = 0;
            renderLightbox();
          }
          return;
        }
        if (e.key === "r" || e.key === "R") {
          e.preventDefault();
          state.lb.ruler = !state.lb.ruler;
          renderLightbox();
          return;
        }
        if (e.key === "d" || e.key === "D") {
          e.preventDefault();
          state.lb.dialog = !state.lb.dialog;
          renderLightbox();
          return;
        }
        if (e.key === "Enter" || e.key === " ") {
          const c = getChar(state.lb.charId);
          if (c && state.lb.candIdx >= 0 && c.candidates && c.candidates[state.lb.candIdx]) {
            e.preventDefault();
            const cand = c.candidates[state.lb.candIdx];
            const label = cand.label || ("#" + String(state.lb.candIdx + 1).padStart(2, "0"));
            setChoice(c.id, label);
            const nowPicked = getPick(c.id).choice === label;
            showToast(nowPicked ? ("已选定 " + shortSpeakerName(c) + " " + label) : ("已取消 " + shortSpeakerName(c) + " 的选定"), nowPicked);
          }
          return;
        }
        if (/^[1-9]$/.test(e.key)) {
          const c = getChar(state.lb.charId);
          const idx = Number(e.key) - 1;
          if (c && c.candidates && idx < c.candidates.length) {
            e.preventDefault();
            state.lb.candIdx = idx;
            const cand = c.candidates[idx];
            const label = cand.label || ("#" + String(idx + 1).padStart(2, "0"));
            const pick = getPick(c.id);
            pick.choice = label;
            saveStorage();
            syncSectionVisuals();
            renderLightbox();
            showToast("已选定 " + shortSpeakerName(c) + " " + label, true);
          }
          return;
        }
        return;
      }

      // 主页面快捷键
      if (e.key === "r" || e.key === "R") {
        state.prefs.ruler = !state.prefs.ruler;
        saveStorage();
        applyGlobalPrefs();
      } else if (e.key === "d" || e.key === "D") {
        state.prefs.dialog = !state.prefs.dialog;
        saveStorage();
        applyGlobalPrefs();
      } else if (e.key === "m" || e.key === "M") {
        state.prefs.metrics = !state.prefs.metrics;
        saveStorage();
        applyGlobalPrefs();
      }
    });

    window.addEventListener("resize", function () {
      const topbar = document.getElementById("topbar");
      if (topbar) {
        document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
      }
    });
  }

  function init() {
    loadStorage();
    renderHeader();
    buildSections();
    applyGlobalPrefs();
    syncSectionVisuals();
    bindEvents();
  }

  init();
})();
</script>
</body>
</html>
