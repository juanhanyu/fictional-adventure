<title>《转生千金》全员 15 角色 × 5 帧《星之海》真像素互动检阅台</title>
<style>
  :root {
    --bg: #0d1424; --panel: #151f36; --card: #1b2846; --border: #314875;
    --accent: #66d9ff; --accent2: #a5b4fc; --text: #eef5ff; --muted: #93aed4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background: radial-gradient(circle at 20% 0%, #19294a 0%, var(--bg) 55%);
    color: var(--text); padding: 18px 22px 40px;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 18px; border-radius: 14px;
    background: rgba(21,31,54,.92); border: 1px solid var(--border); margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .4px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    background: #22345a; color: var(--text); border: 1px solid #3c5991;
    border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer;
    transition: .15s;
  }
  button:hover { background: #2d4678; border-color: var(--accent); }
  button.active { background: #0e7490; border-color: var(--accent); color: #fff; font-weight: 600; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; display: flex; flex-direction: column; gap: 10px;
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cname { font-weight: 700; font-size: 15px; }
  .ctag { font-size: 11.5px; color: var(--accent); background: rgba(102,217,255,.12); padding: 2px 7px; border-radius: 99px; }
  .stage-wrap {
    position: relative; height: 220px; border-radius: 10px; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px;
    background-image:
      linear-gradient(45deg, #1b253d 25%, transparent 25%),
      linear-gradient(-45deg, #1b253d 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1b253d 75%),
      linear-gradient(-45deg, transparent 75%, #1b253d 75%);
    background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: #131b2e; border: 1px solid #2b3f68;
  }
  .stage-wrap.light {
    background-image:
      linear-gradient(45deg, #dce6f5 25%, transparent 25%),
      linear-gradient(-45deg, #dce6f5 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #dce6f5 75%),
      linear-gradient(-45deg, transparent 75%, #dce6f5 75%);
    background-color: #eef4fc;
  }
  canvas.sprite { image-rendering: pixelated; image-rendering: crisp-edges; }
  .pose-badge {
    position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 2px 8px;
    border-radius: 6px; background: rgba(9,14,26,.78); color: #9be7ff; border: 1px solid rgba(102,217,255,.35);
  }
  .meta-line { font-size: 11.5px; color: var(--muted); display: flex; justify-content: space-between; }
  .pose-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .pose-row button { padding: 4px 8px; font-size: 11.5px; flex: 1 1 auto; }
</style>

const META = [{"id": "sylvia_silver", "name": "希尔维亚（14岁本尊）", "tag": "冰水大魔导·空手施法", "group": "protag", "w": 142, "h": 124, "colors": 46, "frames": 7, "kb": 37.7}, {"id": "sylvia_young", "name": "童年希尔维亚（8–11岁）", "tag": "大头萌系·空手冰法", "group": "child", "w": 126, "h": 118, "colors": 44, "frames": 7, "kb": 33.0}, {"id": "sylvia_disguise", "name": "眷寒渔（黑发伪装）", "tag": "旅途伪装·空手冰法", "group": "protag", "w": 138, "h": 124, "colors": 44, "frames": 7, "kb": 34.5}, {"id": "beatrice", "name": "贝阿特丽丝（11岁）", "tag": "大头萌系·绯红烈焰剑", "group": "child", "w": 130, "h": 120, "colors": 44, "frames": 7, "kb": 40.0}, {"id": "alice", "name": "爱丽丝（9岁）", "tag": "最萌白发·空手风法", "group": "child", "w": 126, "h": 116, "colors": 42, "frames": 7, "kb": 32.2}, {"id": "aino", "name": "艾诺·塔尔维（15岁）", "tag": "学院优等生·空手冰法", "group": "rival", "w": 138, "h": 124, "colors": 44, "frames": 7, "kb": 36.6}, {"id": "noelle", "name": "诺艾儿（14岁）", "tag": "水流法师·空手水环", "group": "rival", "w": 138, "h": 124, "colors": 44, "frames": 7, "kb": 33.8}, {"id": "rowan", "name": "罗文（成年）", "tag": "日蚀血案·晦轮杖", "group": "boss", "w": 146, "h": 134, "colors": 46, "frames": 7, "kb": 39.7}, {"id": "wind_god_avatar", "name": "风神·岚", "tag": "悬空神灵·苍翠暴风", "group": "boss", "w": 146, "h": 134, "colors": 46, "frames": 7, "kb": 48.0}, {"id": "eastwing_commander", "name": "东翼封锁官·红莲铁幕", "tag": "黑金角铠·烈焰戟", "group": "boss", "w": 150, "h": 136, "colors": 46, "frames": 7, "kb": 47.4}, {"id": "corridor_vanguard", "name": "宫廷突击队长", "tag": "重甲禁卫·烈焰长戟", "group": "boss", "w": 146, "h": 134, "colors": 44, "frames": 7, "kb": 43.4}, {"id": "wolf_alpha", "name": "灰棘头狼", "tag": "北境群狼首领", "group": "beast", "w": 166, "h": 118, "colors": 46, "frames": 7, "kb": 54.3}, {"id": "pack_wolf", "name": "灰棘狼", "tag": "北林巡猎群狼", "group": "beast", "w": 158, "h": 114, "colors": 44, "frames": 7, "kb": 55.3}, {"id": "shadow_jackal", "name": "霜脊影豺", "tag": "银级暗影魔兽", "group": "beast", "w": 158, "h": 118, "colors": 44, "frames": 7, "kb": 45.3}, {"id": "abyss_behemoth", "name": "霜渊裂地兽", "tag": "冰原领主级巨兽 Boss", "group": "boss", "w": 178, "h": 130, "colors": 48, "frames": 7, "kb": 60.6}];
const CHARS = ".abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&()_+-=<>?[]{}|~";
const CMAP = Object.create(null);
for (let i = 0; i < CHARS.length; i++) CMAP[CHARS[i]] = i;

function decodeBank(bank) {
  const { w, h, palette, frames } = bank;
  const rgba = palette.map((hx, idx) => {
    if (idx === 0 || !hx) return [0,0,0,0];
    const n = parseInt(hx.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255, 255];
  });
  return frames.map(rows => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(w, h);
    const d = img.data;
    for (let y = 0; y < h; y++) {
      const row = rows[y];
      let x = 0, i = 0, ln = row.length;
      while (i < ln && x < w) {
        const ci = CMAP[row[i++]] || 0;
        let cnt = 1;
        if (i < ln && row[i] === '*') {
          i++; let num = 0;
          while (i < ln && row[i] >= '0' && row[i] <= '9') num = num * 10 + (row.charCodeAt(i++) - 48);
          cnt = num || 1;
        }
        const col = rgba[ci];
        const end = Math.min(w, x + cnt);
        if (col[3]) {
          for (let k = x; k < end; k++) {
            const o = (y * w + k) * 4;
            d[o] = col[0]; d[o+1] = col[1]; d[o+2] = col[2]; d[o+3] = 255;
          }
        }
        x = end;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c;
  });
}

const POSE_SEQ = [
  { idx: 0, label: 'IDLE 1', ms: 420 },
  { idx: 1, label: 'IDLE 2', ms: 380 },
  { idx: 2, label: 'BLINK',  ms: 140 },
  { idx: 3, label: 'WINDUP 蓄力', ms: 260 },
  { idx: 4, label: 'CAST_STEP 起爆', ms: 120 },
  { idx: 5, label: 'STRIKE 爆发', ms: 460 },
  { idx: 4, label: 'CAST_STEP 收招', ms: 120 },
  { idx: 6, label: 'HURT 受击', ms: 340 },
];

let globalMode = 'combo'; // combo | idle | strike
let lightBg = false;
let scaleMode = 'fit'; // fit | 1 | 2
const cards = [];

const grid = document.getElementById('grid');
META.forEach((m, idx) => {
  const bank = window.PIXEL_SPRITE_BANK[m.id];
  const decoded = decodeBank(bank);
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `
    <div class="card-head">
      <div class="cname">${idx+1}. ${m.name}</div>
      <div class="ctag">${m.tag}</div>
    </div>
    <div class="stage-wrap">
      <div class="pose-badge">COMBO</div>
      <canvas class="sprite" width="${m.w}" height="${m.h}"></canvas>
    </div>
    <div class="meta-line">
      <span>ID: ${m.id} · ${m.w}×${m.h}</span>
      <span>${m.colors}色 · ${m.frames}帧 · ${m.kb} KB</span>
    </div>
    <div class="pose-row">
      <button data-p="combo" class="active">连招</button>
      <button data-p="0">待机</button>
      <button data-p="3">蓄力</button>
      <button data-p="4">起爆</button>
      <button data-p="5">爆发</button>
      <button data-p="6">受击</button>
    </div>
  `;
  grid.appendChild(el);
  const canvas = el.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const badge = el.querySelector('.pose-badge');
  const wrap = el.querySelector('.stage-wrap');
  const state = { m, decoded, canvas, ctx, badge, wrap, mode: 'combo', step: idx % POSE_SEQ.length, timer: 0, el };

  function applyScale() {
    const sc = scaleMode === '1' ? 1 : scaleMode === '2' ? 2 : Math.min(2, Math.floor(195 / m.h) || 1.5);
    const eff = scaleMode === 'fit' ? Math.min(2, 192 / m.h) : sc;
    canvas.style.width = Math.round(m.w * eff) + 'px';
    canvas.style.height = Math.round(m.h * eff) + 'px';
  }
  state.applyScale = applyScale;
  applyScale();

  el.querySelectorAll('.pose-row button').forEach(btn => {
    btn.onclick = () => {
      el.querySelectorAll('.pose-row button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.mode = btn.dataset.p;
      state.timer = 0;
    };
  });
  cards.push(state);
});

function setAllMode(mode) {
  globalMode = mode;
  document.querySelectorAll('#btnComboAll,#btnIdleAll,#btnStrikeAll').forEach(b => b.classList.remove('active'));
  if (mode === 'combo') document.getElementById('btnComboAll').classList.add('active');
  if (mode === 'idle') document.getElementById('btnIdleAll').classList.add('active');
  if (mode === 'strike') document.getElementById('btnStrikeAll').classList.add('active');
  cards.forEach(c => {
    c.mode = mode === 'combo' ? 'combo' : (mode === 'idle' ? 'idle_loop' : '5');
    c.el.querySelectorAll('.pose-row button').forEach(b => b.classList.toggle('active', b.dataset.p === c.mode || (mode==='idle' && b.dataset.p==='0')));
  });
}
document.getElementById('btnComboAll').onclick = () => setAllMode('combo');
document.getElementById('btnIdleAll').onclick = () => setAllMode('idle');
document.getElementById('btnStrikeAll').onclick = () => setAllMode('strike');
document.getElementById('btnBgToggle').onclick = () => {
  lightBg = !lightBg;
  cards.forEach(c => c.wrap.classList.toggle('light', lightBg));
};
document.getElementById('btnScale').onclick = (e) => {
  scaleMode = scaleMode === 'fit' ? '2' : (scaleMode === '2' ? '1' : 'fit');
  e.target.textContent = '缩放：' + (scaleMode === 'fit' ? '自适应' : scaleMode + '× 整数像素');
  cards.forEach(c => c.applyScale());
};

let last = performance.now();
function tick(now) {
  const dt = Math.min(80, now - last);
  last = now;
  for (const c of cards) {
    let fidx = 0, lbl = 'IDLE';
    if (c.mode === 'combo') {
      c.timer += dt;
      const cur = POSE_SEQ[c.step];
      if (c.timer >= cur.ms) { c.timer = 0; c.step = (c.step + 1) % POSE_SEQ.length; }
      fidx = POSE_SEQ[c.step].idx; lbl = POSE_SEQ[c.step].label;
    } else if (c.mode === 'idle_loop') {
      const t = (now % 1600);
      fidx = t > 1460 ? 2 : (t > 750 ? 1 : 0);
      lbl = fidx === 2 ? 'BLINK' : 'IDLE';
    } else {
      fidx = parseInt(c.mode, 10) || 0;
      lbl = ['IDLE','IDLE2','BLINK','WINDUP 蓄力','CAST_STEP 起爆','STRIKE 爆发','HURT 受击'][fidx] || 'POSE';
    }
    c.ctx.clearRect(0, 0, c.m.w, c.m.h);
    c.ctx.drawImage(c.decoded[fidx], 0, 0);
    c.badge.textContent = lbl;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
